      startTown = r.a === top ? 'lo' : 'hi';
    }
    const at = (u, v) => (horiz ? [x0 + u, y0 + v] : [x0 + v, y0 + u]);
    const rnd = U.rng(ri * 7919 + 17);
    const reg = 8 + ri;

    // ragged open band
    const lo = [], hi = [];
    for (let u = 0; u < len; u++) {
      lo[u] = 2 + Math.floor(rnd() * 3);
      hi[u] = span - 3 - Math.floor(rnd() * 3);
      for (let v = 0; v < span; v++) {
        const [x, y] = at(u, v);
        m.region[m.idx(x, y)] = reg;
        if (v >= lo[u] && v <= hi[u]) m.set(x, y, T.GROUND);
      }
    }
    // meandering two-wide path
    const pathV = [];
    let v = entry, target = entry, nextTurn = 4 + Math.floor(rnd() * 4);
    const mark = (u, vv) => { for (const dv of [0, 1]) { const [x, y] = at(u, vv + dv); m.set(x, y, T.PATH); } };
    for (let u = 0; u < len; u++) {
      if (u === nextTurn && u < len - 7) {
        target = U.clamp(entry + U.ri(rnd, -6, 6), 5, span - 7);
        nextTurn = u + 4 + Math.floor(rnd() * 5);
      }
      if (u >= len - 6) target = entry;
      while (v !== target) { mark(u, v); v += v < target ? 1 : -1; }
      mark(u, v);
      pathV[u] = v;
    }
    // tall grass blobs (some cross the path so you can't always avoid them)
    for (let k = 0; k < 8; k++) {
      const cu = U.ri(rnd, 4, len - 5), cv = U.ri(rnd, 4, span - 5);
      const ru = U.ri(rnd, 2, 5), rv = U.ri(rnd, 2, 4);
      for (let u = cu - ru; u <= cu + ru; u++) for (let vv = cv - rv; vv <= cv + rv; vv++) {
        if (u < 3 || u > len - 4) continue;
        const du = (u - cu) / ru, dv = (vv - cv) / rv;
        if (du * du + dv * dv > 1.05) continue;
        const [x, y] = at(u, vv);
        const t = m.get(x, y);
        if (t === T.GROUND || (t === T.PATH && k % 3 === 0)) m.set(x, y, T.GRASS);
      }
    }
    // obstacles and decoration away from the path
    const nearPath = (u, vv) => {
      for (let du = -1; du <= 1; du++) for (let dv = -1; dv <= 1; dv++) {
        const [x, y] = at(u + du, vv + dv);
        const t = m.get(x, y);
        if (t === T.PATH) return true;
      }
      return false;
    };
    for (let u = 1; u < len - 1; u++) for (let vv = 1; vv < span - 1; vv++) {
      const [x, y] = at(u, vv);
      if (m.get(x, y) !== T.GROUND || nearPath(u, vv)) continue;
      const p = rnd();
      if (p < 0.07) m.set(x, y, T.TREE);
      else if (p < 0.09) m.set(x, y, T.ROCK);
      else if (p < 0.16) m.set(x, y, T.FLOWER);
    }
    // route sign by the start
    const su = startTown === 'lo' ? 2 : len - 3;
    const [sx, sy] = at(su, pathV[su] - 1);
    if (m.get(sx, sy) === T.GROUND || m.get(sx, sy) === T.GRASS || m.get(sx, sy) === T.FLOWER) {
      m.set(sx, sy, T.SIGN);
      m.signs.set(m.idx(sx, sy), `ROUTE ${ri + 1}\n${TOWNS[r.a].name}  <->  ${TOWNS[r.b].name}`);
    }
    this.routeInfo[ri] = { at, len, span, pathV, startTown, horiz };
  },

  // ------------------------------------------------------------ towns
  carveTown(m, ti) {
    const town = TOWNS[ti];
    const [ox, oy] = this.townOrigin(ti);
    const biome = town.biome;
    const ex = this.exits[ti];
    const L = (x, y) => [ox + x, oy + y];
    const set = (x, y, t) => m.set(ox + x, oy + y, t);
    const get = (x, y) => m.get(ox + x, oy + y);
    const rnd = U.rng(ti * 104729 + 3);
    this.townRect[ti] = { x: ox, y: oy, w: TW, h: TH };

    for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
      const [X, Y] = L(x, y);
      m.region[m.idx(X, Y)] = ti;
      m.bio[m.idx(X, Y)] = BIOME_IDS.indexOf(biome);
      const border = x === 0 || y === 0 || x === TW - 1 || y === TH - 1;
      m.set(X, Y, border ? T.TREE : T.GROUND);
    }
    // roads
    for (let x = 1; x < TW - 1; x++) { set(x, 10, T.PATH); set(x, 11, T.PATH); }
    const vEnd = biome === 'beach' ? 21 : TH - 2;
    for (let y = 6; y <= vEnd; y++) { set(14, y, T.PATH); set(15, y, T.PATH); }
    for (let x = 2; x <= 27; x++) { set(x, 20, T.PATH); set(x, 21, T.PATH); }
    if (ex.W !== undefined) { set(0, 10, T.PATH); set(0, 11, T.PATH); }
    if (ex.E !== undefined) { set(TW - 1, 10, T.PATH); set(TW - 1, 11, T.PATH); }
    if (ex.N !== undefined) { for (let y = 0; y < 6; y++) { set(14, y, T.PATH); set(15, y, T.PATH); } }
    if (ex.S !== undefined) { set(14, TH - 1, T.PATH); set(15, TH - 1, T.PATH); }
    // a north exit runs straight through where the hall would be: shift the hall
    const hallX = ex.N !== undefined ? 17 : 11;
    if (ex.N !== undefined) { for (let y = 1; y < 6; y++) { set(14, y, T.PATH); set(15, y, T.PATH); } }

    const leaderKey = town.leader, leader = LEADERS[leaderKey];
    const B = [
      { kind: 'hall', x: hallX, y: 1, w: 7, h: 5, doorX: 3, color: leader.color, locked: !!leader.locked, leader: leaderKey },
      { kind: 'hospital', x: 2, y: 3, w: 5, h: 4, doorX: 2 },
      { kind: 'store', x: 21, y: 3, w: 4, h: 4, doorX: 1 },
      { kind: 'chapel', x: 2, y: 15, w: 5, h: 5, doorX: 2 },
      { kind: 'house', x: 9, y: 16, w: 4, h: 4, doorX: 2, slot: 0, roof: BIO[biome].roofs[0] },
      { kind: 'house', x: 17, y: 16, w: 4, h: 4, doorX: 1, slot: 1, roof: BIO[biome].roofs[1] },
    ];
    if (ti === 0) B.push({ kind: 'lab', x: 21, y: 14, w: 6, h: 4, doorX: 2 });
    else B.push({ kind: 'house', x: 23, y: 15, w: 4, h: 4, doorX: 1, slot: 2, roof: BIO[biome].roofs[2] });
    // with a north exit the hall sits right of the road, so the store moves over
    if (ex.N !== undefined) B[2].x = 24;

    for (const b of B) {
      const doorLX = b.x + b.doorX, doorLY = b.y + b.h - 1;
      for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) set(x, y, T.BUILD);
      set(doorLX, doorLY, T.DOOR);
      // walkway from the door to the nearest road
      for (let y = doorLY + 1; y < TH - 1; y++) {
        const t = get(doorLX, y);
        if (t === T.PATH) break;
        set(doorLX, y, T.PATH);
      }
      const [wx, wy] = L(b.x, b.y);
      const [dx, dy] = L(doorLX, doorLY);
      const bd = { ...b, x: wx, y: wy, town: ti, theme: biome };
      m.buildings.push(bd);
      if (b.kind === 'hall' && b.locked) {
        m.doors.set(m.idx(dx, dy), { locked: leader.closed });
      } else {
        const iid = Interiors.create(b, ti, dx, dy);
        m.doors.set(m.idx(dx, dy), { to: iid });
      }
    }
    // the hall door path goes up into a north exit road: make sure it reaches the main road
    if (ex.N !== undefined) {
      const dX = hallX + 3;
      for (let y = 6; y < 10; y++) set(dX, y, T.PATH);
    }

    // biome specials
    if (biome === 'beach') {
      for (let x = 0; x < TW; x++) { set(x, 22, T.WATER); set(x, 23, T.WATER); }
      for (let x = 1; x < TW - 1; x++) if (get(x, 21) !== T.PATH) set(x, 21, T.SAND);
    }
    if (biome === 'farm') {
      for (const [x0, y0, x1, y1] of [[7, 2, 10, 7], [26, 3, 28, 8]]) {
        for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (get(x, y) === T.GROUND) set(x, y, T.CROP);
      }
    }
    if (biome === 'swamp') {
      for (const [cx, cy] of [[8, 4], [25, 13], [9, 13]]) {
        for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 2; x <= cx + 2; x++) {
          if (get(x, y) === T.GROUND && !(Math.abs(x - cx) === 2 && Math.abs(y - cy) === 1)) set(x, y, T.WATER);
        }
      }
    }
    if (biome === 'city') {
      for (const [x, y] of [[8, 9], [20, 9], [8, 12], [21, 12], [5, 12], [26, 9]]) if (get(x, y) === T.GROUND) set(x, y, T.LAMP);
    }
    // scattered decoration, never next to a road or path
    const dens = {
      suburb: [0.03, 0.03, 0.14], desert: [0.05, 0.03, 0.08], beach: [0.05, 0.03, 0.1], snow: [0.06, 0.03, 0.1],
      forest: [0.12, 0.03, 0.08], swamp: [0.06, 0.03, 0.07], farm: [0.03, 0.04, 0.1], city: [0, 0.03, 0.05],
    }[biome];
    for (let y = 1; y < TH - 1; y++) for (let x = 1; x < TW - 1; x++) {
      if (get(x, y) !== T.GROUND) continue;
      let near = false;
      for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1; dx++) {
        const t = get(x + dx, y + dy);
        if (t === T.PATH || t === T.DOOR || t === T.SIGN) { near = true; break; }
      }
      if (near) continue;
      const p = rnd();
      if (p < dens[0]) set(x, y, T.TREE);
      else if (p < dens[0] + dens[1]) set(x, y, T.DECO);
      else if (p < dens[0] + dens[1] + dens[2]) set(x, y, T.FLOWER);
    }
    // town sign near the main road
    set(2, 9, T.SIGN);
    m.signs.set(m.idx(ox + 2, oy + 9), town.sign);

    // outdoor wanderers
    const folk = TOWNFOLK[ti].out;
    const spots = [[8, 12], [20, 8], [24, 12]];
    folk.forEach((f, i) => {
      let [sx, sy] = spots[i];
      for (let tries = 0; tries < 20 && SOLID.has(get(sx, sy)); tries++) { sx++; }
      const npc = makeNPC({ x: ox + sx, y: oy + sy, pal: f.pal, wander: f.busk ? 0 : 2, say: f.say });
      if (f.busk) npc.talk = () => Scripts.busker(npc, f);
      m.npcs.push(npc);
    });
  },

  // ------------------------------------------------------------ gates
  placeGates(m) {
    ROUTES.forEach((r, ri) => {
      if (!r.need && !r.gateFlag) return;
      const info = this.routeInfo[ri];
      let u = info.startTown === 'lo' ? 0 : info.len - 1;
      if (r.need >= 7) u = Math.floor(info.len / 2);
      const v = info.pathV[u];
      const [gx, gy] = info.at(u, v);
      const [cx, cy] = info.at(u, v + 1);
      const [ax, ay] = info.at(u, v - 1);
      const guard = makeNPC({ x: gx, y: gy, pal: r.gateFlag ? 'aide' : 'guard', dir: info.horiz ? (info.startTown === 'lo' ? 'left' : 'right') : 'up' });
      const cone = makeNPC({ x: cx, y: cy, kind: 'cone' });
      const gate = { ri, guard, cone, aside: [ax, ay], home: [gx, gy] };
      guard.talk = () => Scripts.gate(gate);
      cone.talk = guard.talk;
      m.npcs.push(guard, cone);
      this.gates.push(gate);
    });
  },

  refreshGates() {
    for (const g of this.gates) {
      const open = Game.gateOpen(g.ri);
      g.cone.hidden = open;
      if (open) { g.guard.x = g.aside[0]; g.guard.y = g.aside[1]; }
      else { g.guard.x = g.home[0]; g.guard.y = g.home[1]; }
      g.guard.moving = false;
    }
  },

  // ------------------------------------------------------------ money in the grass
  seedBills(m) {
    for (let ri = 0; ri < ROUTES.length; ri++) for (let k = 0; k < 5; k++) this.spawnBill(m, ri, null);
  },
  spawnBill(m, ri, avoid) {
    const info = this.routeInfo[ri];
    for (let tries = 0; tries < 60; tries++) {
      const u = U.rand(2, info.len - 3), v = U.rand(2, info.span - 3);
      const [x, y] = info.at(u, v);
      if (m.get(x, y) !== T.GRASS) continue;
      const i = m.idx(x, y);
      if (m.items.has(i)) continue;
      if (avoid && Math.abs(avoid.x - x) < 9 && Math.abs(avoid.y - y) < 7) continue;
      m.items.set(i, { amt: Math.random() < 0.22 ? 5 : 1 });
      return true;
    }
    return false;
  },
  billsInRoute(m, ri) {
    let n = 0;
    for (const i of m.items.keys()) if (m.region[i] === 8 + ri) n++;
    return n;
  },
};

// ------------------------------------------------------------ NPCs
let npcSeq = 0;
function makeNPC(o) {
  return {
    id: ++npcSeq, x: o.x, y: o.y, dir: o.dir || 'down', pal: o.pal || 'dude', look: o.look || null,
    kind: o.kind || 'person', name: o.name || null, wander: o.wander || 0,
    home: { x: o.x, y: o.y }, moving: false, mt: 0, tx: o.x, ty: o.y, fx: o.x, fy: o.y,
    timer: 1 + Math.random() * 3, step: 0, hidden: false,
    talk: o.talk || (o.say ? (npc) => Scripts.chat(npc, o.say) : null),
  };
}

// ------------------------------------------------------------ interiors
// Rooms are House Keeper sized: a 17x11 floor inside walls, filling the
// 19x14 screen. `face` is the papered wall row (w window, N banner); the exit
// mat sits in the middle of the bottom wall.
const TEMPLATES = {
  house: { face: 'WwWWWwWWWWWwWWWwW', inner: [
    'BKK..........PP.V', 'b................', '.................', '.....TT....c.....', '.....TT..........', '.................',
    '.P.............P.', '.................', '......RRRRR......', '......RRRRR......', '.................'] },
  store: { face: 'WwWWWWwWWWWwWWWWw', inner: [
    'P...............P', '.................', 'CCC..SSS.SSS.SSS.', '.................', '.....SSS.SSS.SSS.', '.................',
    '.....SSS.SSS.SSS.', '.................', '.P.............P.', '.................', '.................'] },
  hospital: { face: 'WwWWWwWWWWWwWWWwW', inner: [
    'H.H.H.......M.M.P', '.................', '.....CCCCCCC.....', '.................', '.................', 'cc.cc.......cc.cc',
    '.................', '.................', '.P.............P.', '.................', '.................'] },
  chapel: { face: 'WwWWwWWWNWWWwWWwW', inner: [
    'P......AAA......P', '.................', '.................', '.UUUUUU...UUUUUU.', '.................', '.UUUUUU...UUUUUU.',
    '.................', '.UUUUUU...UUUUUU.', '.................', '.................', 'P...............P'] },
  hall: { face: 'WwWWNWWWNWWWNWWwW', inner: [
    'X......GGG......X', '.......GGG.......', 'X......GGG......X', '.......GGG.......', 'X......GGG......X', '.......GGG.......',
    'X......GGG......X', '.......GGG.......', '.......GGG.......', '.......GGG.......', '.......GGG.......'] },
  lab: { face: 'WwWWWwWWWWWwWWWwW', inner: [
    'MM.KKK.....KKK.MM', '.................', '.................', '......TTT........', '.................', '.................',
    'P...............P', '..MM.........MM..', '.................', '.................', '.................'] },
};
const IN = (x, y) => ({ x: x + 1, y: y + 2 });   // inner coords -> room coords
function roomRows(tpl) {
  const rows = ['W'.repeat(19), 'W' + tpl.face + 'W'];
  for (const r of tpl.inner) rows.push('W' + r + 'W');
  rows.push('W'.repeat(9) + 'E' + 'W'.repeat(9));
  return rows;
}
const TCHAR = {
  W: T.WALL, w: T.WWALL, '.': T.FLOOR, K: T.BOOKS, B: T.BED, b: T.BEDB, T: T.TABLE, P: T.PLANT, V: T.TV,
  R: T.RUG, E: T.EXIT, C: T.COUNTER, S: T.SHELF, H: T.HBED, U: T.PEW, A: T.ALTAR, M: T.MACHINE, X: T.STATUE,
  G: T.MAT, c: T.CHAIR, N: T.BANNER,
};

const Interiors = {
  create(b, ti, doorX, doorY) {
    const tplName = b.kind === 'house' ? 'house' : b.kind;
    const tpl = roomRows(TEMPLATES[tplName]);
    const theme = b.kind === 'hall' ? 'hall:' + b.color : tplName;
    const id = `${b.kind}-${ti}-${b.slot ?? 0}`;
    const m = new GMap(id, tpl[0].length, tpl.length, theme);
    m.kind = b.kind; m.town = ti; m.slot = b.slot;
    tpl.forEach((row, y) => { for (let x = 0; x < row.length; x++) m.set(x, y, TCHAR[row[x]] ?? T.FLOOR); });
    // find exit mat
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) if (m.get(x, y) === T.EXIT) m.entry = { x, y: y - 1 };
    m.exit = { map: 'world', x: doorX, y: doorY + 1 };
    Interiors.populate(m, b, ti);
    World.maps[id] = m;
    return id;
  },

  populate(m, b, ti) {
    const add = (o) => { const p = IN(o.x, o.y); const n = makeNPC({ ...o, ...p }); m.npcs.push(n); return n; };
    switch (b.kind) {
      case 'store': {
        const n = add({ x: 1, y: 1, pal: 'clerk' });
        n.talk = () => Scripts.shop(ti);
        add({ x: 8, y: 3, pal: ['dude', 'lady', 'old', 'kid'][ti % 4], wander: 1, say: [
          ['They raised the price of coffee again. I\'m buying three.'],
          ['Self-help books are basically cheat codes. Read one, learn a skill!'],
          ['A Scratch-Off Ticket is a "tax on hope." I buy one every day.'],
          ['Headphones keep weak issues away. Introverts\' secret weapon.'],
        ][ti % 4] });
        break;
      }
      case 'hospital': {
        const n = add({ x: 8, y: 1, pal: 'nurse' });
        n.talk = () => Scripts.hospital(ti);
        add({ x: 2, y: 4, pal: 'old', dir: 'right', say: ['I\'ve been in this waiting room since Tuesday. Which Tuesday? Don\'t ask.'] });
        break;
      }
      case 'chapel': {
        const n = add({ x: 8, y: 1, pal: 'pastor', look: 'collar' });
        n.talk = () => Scripts.chapel(ti);
        add({ x: 8, y: 6, pal: 'lady', dir: 'up', say: ['A little kindness goes a long way. So does a little donation.'] });
        break;
      }
      case 'hall': {
        const L = LEADERS[b.leader];
        const n = add({ x: 8, y: 1, pal: 'leader', look: L.look });
        n.palObj = L.pal; n.leader = b.leader;
        n.talk = () => Scripts.leader(b.leader, n);
        const g = add({ x: 5, y: 9, pal: 'guide', dir: 'right' });
        g.talk = () => Scripts.guide(b.leader);
        break;
      }
      case 'lab': {
        const st = add({ x: 12, y: 2, pal: 'street', look: 'glasses' });
        st.talk = () => Scripts.street(st);
        add({ x: 5, y: 9, pal: 'aide', wander: 1, say: ['Dr. Street once beat a parking ticket in court using only a PowerPoint.'] });
        ['diploma', 'wrench', 'badge'].forEach((k, i) => {
          const t = IN(6 + i, 3), idx = m.idx(t.x, t.y);
          m.props.set(idx, k);
          m.acts.set(idx, () => Scripts.pathTable(k));
        });
        break;
      }
      case 'house': {
        if (ti === 0 && b.slot === 0) {
          m.isHome = true;
          const mom = add({ x: 10, y: 4, pal: 'mom', dir: 'left' });
          mom.talk = () => Scripts.mom(mom);
          break;
        }
        const def = TOWNFOLK[ti].houses[b.slot];
        if (def) {
          const n = add({ x: 10, y: 4, pal: def.pal, wander: 1 });
          n.talk = () => Scripts.house(n, def, ti, b.slot);
        }
        break;
      }
    }
  },
};

// ---- src/game.js
'use strict';
// Core game state: the player, overworld movement, rendering, field menus,
// money, saving. Battles live in battle.js, NPC scripts in scripts.js.

const VIEW_W = 304, VIEW_H = 224;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
const SAVE_KEY = 'adulting-quest-save-v1';

// Stat formulas (Pokemon-style). Sanity = HP, Confidence = attack,
// Composure = defence, Hustle = speed.
const Stats = {
  of(p) {
    const b = (PATHS[p.path] || PATHS.college).base, L = p.level;
    return {
      maxSanity: Math.floor(4 * b.san * L / 100) + 3 * L + 20,
      conf: Math.floor(2 * b.conf * L / 100) + 5,
      comp: Math.floor(2 * b.comp * L / 100) + 5,
      hus: Math.floor(2 * b.hus * L / 100) + 5,
      maxEnergy: 18 + 2 * L + b.energy,
    };
  },
  xpFor(L) { return Math.floor(0.8 * L * L * L); },
  foe(id, L) {
    const d = ISSUES[id], [h, a, df, s] = d.base;
    return {
      id, def: d, name: d.name, type: d.type, lvl: L,
      maxHp: Math.floor(2 * h * L / 100) + L + 10,
      atk: Math.floor(2 * a * L / 100) + 5,
      dfn: Math.floor(2 * df * L / 100) + 5,
      spd: Math.floor(2 * s * L / 100) + 5,
    };
  },
};

const Game = {
  mode: 'boot',
  p: null,
  map: null,
  pos: { x: 0, y: 0, dir: 'down', moving: false, mt: 0, tx: 0, ty: 0, parity: 0, turnT: 0, justArrived: false, bumpT: 0 },
  busy: 0,
  fade: 0,
  flash: 0,
  time: 0,
  waterT: 0, waterF: 0,
  lastRegion: -1,
  titleCam: 0,
  ctx: null,

  // ------------------------------------------------------------ player
  newPlayer(name, hero = 'boy') {
    return {
      name, hero, path: null, level: 5, xp: Stats.xpFor(5), sanity: 30, energy: 20, status: null,
      known: ['wing_it'], equipped: ['wing_it'], items: {}, money: 0, debt: 0, karma: 50,
      badges: [], flags: {}, outfit: HEROES[hero].pal.c, crew: [], lead: 'me', momCall: -1e9, stats: { issues: 0, meltdowns: 0 }, repel: 0, steps: 0, playTime: 0,
      respawn: { map: 'house-0-0', x: 10, y: 6, dir: 'right' },
      map: 'house-0-0', x: 2, y: 3, dir: 'down',
    };
  },
  stats() { return Stats.of(this.p); },
  // 18 out of high school, 32 when all eight leaders are done
  age() { return 18 + Math.floor(this.p.badges.length * 1.75); },
  heroPal() { const H = HEROES[this.p.hero] || HEROES.boy; return { ...H.pal, c: this.p.outfit }; },
  heroLook() { return (HEROES[this.p.hero] || HEROES.boy).look; },
  playableDone() { return LEADER_ORDER.every((k) => LEADERS[k].locked || this.p.badges.includes(k)); },
  fullHeal() { Crew.healAll(); },
  fmt(t) { return String(t).replace(/\{NAME\}/g, this.p ? this.p.name : 'YOU'); },
  karmaLabel(k = this.p.karma) {
    return k < 20 ? 'Menace' : k < 40 ? 'Sketchy' : k < 65 ? 'Decent' : k < 85 ? 'Good Egg' : 'Saint';
  },
  addKarma(n) { this.p.karma = U.clamp(this.p.karma + n, 0, 100); },
  priceOf(id) {
    let pr = ITEMS[id].price;
    if (this.p.karma < 30) pr = Math.ceil(pr * 1.25);
    else if (this.p.karma >= 80) pr = Math.floor(pr * 0.9);
    return pr;
  },
  give(id, n = 1) { this.p.items[id] = (this.p.items[id] || 0) + n; },
  take(id, n = 1) { this.p.items[id] = Math.max(0, (this.p.items[id] || 0) - n); if (!this.p.items[id]) delete this.p.items[id]; },
  // Earnings: 10% goes to any outstanding debt.
  earn(amt) {
    const p = this.p;
    amt = Math.floor(amt);
    let g = 0;
    if (p.debt > 0) { g = Math.min(p.debt, Math.ceil(amt * 0.1)); p.debt -= g; }
    p.money += amt - g;
    return { net: amt - g, garnished: g };
  },
  learn(id) {
    const p = this.p;
    if (p.known.includes(id)) return false;
    p.known.push(id);
    if (p.equipped.length < 4) p.equipped.push(id);
    return true;
  },
  gateOpen(ri) {
    const r = ROUTES[ri];
    if (r.gateFlag === 'path') return !!this.p.path;
    return this.p.badges.length >= r.need;
  },

  // ------------------------------------------------------------ maps & warps
  enter(mapId, x, y, dir) {
    this.map = World.maps[mapId];
    const P = this.pos;
    Object.assign(P, { x, y, tx: x, ty: y, dir: dir || P.dir, moving: false, mt: 0 });
    this.p.map = mapId; this.p.x = x; this.p.y = y; this.p.dir = P.dir;
    this.lastRegion = -2;
    this.updateMusic();
    this.checkRegion();
  },
  updateMusic() {
    if (this.mode !== 'world') return;
    if (this.map.id !== 'world') { Audio2.music('inside'); return; }
    const r = World.regions[this.map.regionAt(this.pos.x, this.pos.y)];
    Audio2.music(r && r.kind === 'route' ? 'route' : 'town');
  },
  checkRegion() {
    if (this.map.id !== 'world') { this.lastRegion = -1; return; }
    const r = this.map.regionAt(this.pos.x, this.pos.y);
    if (r !== this.lastRegion && r >= 0) {
      const prev = this.lastRegion;
      this.lastRegion = r;
      void prev;
      UI.banner(World.regions[r].name);
      this.updateMusic();
    }
  },
  async fadeTo(v, ms = 220) {
    const from = this.fade, t0 = performance.now();
    while (true) {
      const k = Math.min(1, (performance.now() - t0) / ms);
      this.fade = from + (v - from) * k;
      if (k >= 1) break;
      await new Promise((r) => requestAnimationFrame(r));
    }
  },
  async warp(mapId, x, y, dir) {
    this.busy++;
    const from = this.map && this.map.id;
    Audio2.sfx('door');
    await this.fadeTo(1);
    this.enter(mapId, x, y, dir);
    if (mapId !== 'world') this.autosave();
    await this.fadeTo(0);
    try {
      // Dr. Street's first-visit cutscene
      if (mapId === 'lab-0-0' && !this.p.flags.labIntro) await Scripts.labIntro();
      // walking out of a leader hall: someone may be waiting, and maybe the end
      if (from && from.startsWith('hall-') && mapId === 'world') {
        for (const [id, A] of Object.entries(ALLIES)) {
          if (this.p.badges.includes(A.after) && !Crew.has(id) && Scripts.meetsYou(id)) await Scripts.meet(id);
        }
        if (this.playableDone() && !this.p.flags.ending) await Ending.play();
      }
    } finally { UI.closeDialog(); }
    this.busy--;
  },

  // ------------------------------------------------------------ scripts
  async run(fn) {
    this.busy++;
    try { await fn(); }
    catch (e) { console.error(e); }
    finally { this.busy--; UI.closeDialog(); }
  },

  // ------------------------------------------------------------ update
  tick(dt) {
    UI.updateHUD();
    this.time += dt;
    this.waterT += dt;
    if (this.waterT > 0.35) { this.waterT = 0; this.waterF = (this.waterF + 1) % 4; }
    if (this.mode === 'title') { this.titleCam += dt * 14; return; }
    if (this.mode === 'battle') { Battle.update(dt); return; }
    if (this.mode !== 'world' || !this.map) return;
    if (this.p) this.p.playTime += dt;
    this.updateNPCs(dt);
    this.updatePlayer(dt);
  },

  updateNPCs(dt) {
    const m = this.map, P = this.pos;
    for (const n of m.npcs) {
      if (n.hidden) continue;
      if (n.moving) {
        n.mt += dt * 3.6;
        if (n.mt >= 1) { n.x = n.tx; n.y = n.ty; n.moving = false; n.mt = 0; n.step ^= 1; }
        continue;
      }
      if (!n.wander || this.busy || UI.busy) continue;
      n.timer -= dt;
      if (n.timer > 0) continue;
      n.timer = 1.2 + Math.random() * 3;
      const d = ['up', 'down', 'left', 'right'][U.rand(0, 3)];
      n.dir = d;
      const [dx, dy] = DIRS[d], nx = n.x + dx, ny = n.y + dy;
      if (Math.abs(nx - n.home.x) > n.wander || Math.abs(ny - n.home.y) > n.wander) continue;
      if (m.solid(nx, ny) || m.get(nx, ny) === T.DOOR || m.get(nx, ny) === T.EXIT || m.npcAt(nx, ny)) continue;
      if ((nx === P.x && ny === P.y) || (nx === P.tx && ny === P.ty)) continue;
      n.tx = nx; n.ty = ny; n.moving = true; n.mt = 0;
    }
  },

  updatePlayer(dt) {
    const P = this.pos, m = this.map;
    P.bumpT = Math.max(0, P.bumpT - dt);
    const running = Input.held.B;
    // presses made mid-step are kept until the step ends
    if (Input.hit('START') || Input.hit('ESC')) this.want = 'menu';
    else if (Input.hit('A')) this.want = 'A';
    if (P.moving) {
      P.mt += dt * (running ? 7.8 : 4.4);
      if (P.mt >= 1) {
        P.x = P.tx; P.y = P.ty; P.moving = false; P.mt = 0; P.parity ^= 1;
        this.onArrive();
      }
      return;
    }
    if (this.busy || UI.busy) { P.justArrived = false; this.want = null; return; }
    const want = this.want; this.want = null;
    if (want === 'menu') { this.run(() => Menu.open()); return; }
    if (want === 'A') { this.interact(); return; }
    const d = Input.dir();
    if (!d) { P.justArrived = false; P.turnT = 0; return; }
    if (d !== P.dir) {
      P.dir = d;
      P.turnT = P.justArrived ? 0 : 0.09;
      if (P.turnT > 0) return;
    }
    if (P.turnT > 0) { P.turnT -= dt; return; }
    P.justArrived = false;
    const [dx, dy] = DIRS[d], nx = P.x + dx, ny = P.y + dy;
    const t = m.get(nx, ny);
    if (t === T.DOOR) {
      const door = m.doors.get(m.idx(nx, ny));
      if (door && door.locked) { this.run(() => UI.say(door.locked)); return; }
    }
    if (m.solid(nx, ny) || m.npcAt(nx, ny)) {
      if (P.bumpT <= 0) { Audio2.sfx('bump'); P.bumpT = 0.3; }
      return;
    }
    P.tx = nx; P.ty = ny; P.moving = true; P.mt = 0;
  },

  onArrive() {
    const P = this.pos, m = this.map, p = this.p;
    P.justArrived = true;
    p.x = P.x; p.y = P.y; p.dir = P.dir;
    p.steps++;
    if (p.repel > 0) { p.repel--; if (p.repel === 0) this.run(() => UI.say('Your headphones died. The world is loud again.')); }
    const t = m.get(P.x, P.y), i = m.idx(P.x, P.y);
    if (t === T.DOOR) {
      const door = m.doors.get(i);
      const im = World.maps[door.to];
      this.warp(door.to, im.entry.x, im.entry.y, 'up');
      return;
    }
    if (t === T.EXIT && m.exit) { this.warp(m.exit.map, m.exit.x, m.exit.y, 'down'); return; }
    if (m.items.has(i)) {
      const it = m.items.get(i);
      m.items.delete(i);
      const amt = it.amt;
      this.run(async () => {
        Audio2.sfx('coin');
        const r = this.earn(amt);
        await UI.say(amt >= 5 ? `You found a crumpled $5 bill in the grass!` : `You found a $1 bill in the grass!`);
        if (r.garnished) await UI.say(`(Your loan servicer somehow took $${r.garnished} of it.)`);
      });
      return;
    }
    // respawn bills over time
    if (m.id === 'world' && p.steps % 30 === 0) {
      for (let ri = 0; ri < ROUTES.length; ri++) if (World.billsInRoute(m, ri) < 5) World.spawnBill(m, ri, P);
    }
    this.checkRegion();
    if (t === T.GRASS) this.rollEncounter();
  },

  rollEncounter() {
    const m = this.map, P = this.pos;
    const reg = World.regions[m.regionAt(P.x, P.y)];
    if (!reg || reg.kind !== 'route') return;
    if (Math.random() > 0.11) return;
    const r = ROUTES[reg.route];
    const id = r.enc[U.rand(0, r.enc.length - 1)];
    const lvl = U.rand(r.lv[0], r.lv[1]);
    if (this.p.repel > 0 && lvl <= this.p.level) return;
    this.run(() => Battle.start({ foes: [[id, lvl]], wild: true, route: reg.route, biome: BIOME_IDS[m.bio[m.idx(P.x, P.y)]] }));
  },

  interact() {
    const P = this.pos, m = this.map;
    const [dx, dy] = DIRS[P.dir];
    let fx = P.x + dx, fy = P.y + dy;
    let n = m.npcAt(fx, fy);
    if (!n && m.get(fx, fy) === T.COUNTER) n = m.npcAt(fx + dx, fy + dy);
    if (n && n.talk) {
      if (n.kind === 'person') n.dir = OPP[P.dir];
      this.run(() => n.talk(n));
      return;
    }
    const i = m.idx(fx, fy);
    if (m.signs.has(i)) { this.run(() => UI.say(m.signs.get(i))); return; }
    if (m.acts.has(i)) { this.run(() => m.acts.get(i)()); return; }
    const t = m.get(fx, fy);
    const flavour = {
      [T.TV]: 'It\'s a cooking show. Someone is making a $90 sandwich.',
      [T.BOOKS]: 'Self-help books. "Atomic Habits," "Atomic Habits 2," "Why You Didn\'t Finish Atomic Habits."',
      [T.SHELF]: 'Shelves of snacks. Talk to the clerk at the counter to buy things.',
      [T.MACHINE]: 'It beeps reassuringly. Nobody knows what it does.',
      [T.BED]: 'A bed. It is calling your name. You must resist.',
      [T.HBED]: 'A hospital bed. The sheets are suspiciously crisp.',
      [T.STATUE]: 'A trophy engraved: "I SURVIVED."',
      [T.ALTAR]: 'A quiet, peaceful place.',
    }[t];
    if (flavour) this.run(() => UI.say(flavour));
  },

  async blackout() {
    const p = this.p;
    const lost = Math.floor(p.money / 2);
    p.stats.meltdowns++;
    p.money -= lost;
    await UI.say(`{NAME} had a full-on meltdown!`);
    if (lost) await UI.say(`In the panic, {NAME} dropped ${U.money(lost)}...`);
    await this.fadeTo(1, 500);
    this.mode = 'world';
    const r = p.respawn;
    this.enter(r.map, r.x, r.y, r.dir);
    this.fullHeal();
    await this.fadeTo(0, 500);
    await UI.say(this.map.isHome ? 'Mom: "Oh, honey. Sit down. I made soup."' : 'Nurse: "We patched you up. Try to pace yourself out there, okay?"');
  },

  // ------------------------------------------------------------ save
  save() {
    const p = this.p;
    p.map = this.map.id; p.x = this.pos.x; p.y = this.pos.y; p.dir = this.pos.dir;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, p })); return true; }
    catch (e) { return false; }
  },
  autosave() { if (this.p && this.p.path) this.save(); },
  loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && d.p ? d.p : null;
    } catch (e) { return null; }
  },

  // ------------------------------------------------------------ render
  render() {
    const x = this.ctx;
    x.imageSmoothingEnabled = false;
    if (this.mode === 'battle') { Battle.render(x); this.drawFade(x); return; }
    x.fillStyle = '#000';
    x.fillRect(0, 0, VIEW_W, VIEW_H);
    if (this.mode === 'title') { this.renderTitle(x); return; }
    if (this.mode === 'intro') { Intro.render(x); this.drawFade(x); return; }
    if (this.mode === 'ending') { Ending.render(x); this.drawFade(x); return; }
    if (this.scene && this.scene.kind === 'select') { this.renderSelect(x); this.drawFade(x); return; }
    if (this.scene && this.scene.kind === 'hero') { this.renderHeroes(x); this.drawFade(x); return; }
    if (!this.map) return;
    this.renderMap(x);
    this.drawFade(x);
  },
  drawFade(x) {
    if (this.fade > 0) { x.fillStyle = `rgba(0,0,0,${this.fade})`; x.fillRect(0, 0, VIEW_W, VIEW_H); }
    if (this.flash > 0) { x.fillStyle = `rgba(255,255,255,${this.flash})`; x.fillRect(0, 0, VIEW_W, VIEW_H); }
  },
  // Night over the suburbs, the city glowing behind: the twenties.
  renderTitle(x) {
    const t = this.time;
    const gr = x.createLinearGradient(0, 0, 0, VIEW_H);
    gr.addColorStop(0, '#0a0820'); gr.addColorStop(1, '#3a2050');
    x.fillStyle = gr; x.fillRect(0, 0, VIEW_W, VIEW_H);
    for (let i = 0; i < 60; i++) {
      const sx = U.hash(i, 1) % VIEW_W, sy = U.hash(i, 2) % 120;
      if (Math.sin(t * 2 + i) > -0.6) px(x, i % 7 ? '#c8c0e8' : '#fff8c0', sx, sy, 1, 1);
    }
    disc(x, 252, 30, 9, 9, '#f4ecc8'); px(x, '#ddd2ac', 249, 27, 3, 3); px(x, '#ddd2ac', 255, 33, 2, 2);
    // far skyline
    const towers = [[150, 70, 16], [168, 54, 14], [184, 80, 20], [206, 62, 12], [220, 90, 18], [240, 72, 14], [256, 96, 22], [280, 78, 16]];
    for (const [tx, h, w] of towers) {
      px(x, '#1e1838', tx, 196 - h, w, h);
      for (let wy = 196 - h + 4; wy < 190; wy += 6) for (let wx = tx + 2; wx < tx + w - 2; wx += 4) {
        if (U.hash(wx, wy, Math.floor(t / 2)) % 10 < 4) px(x, '#f0c060', wx, wy, 2, 3);
      }
    }
    // near houses
    const houses = [[8, 46], [62, 52], [118, 44]];
    for (const [hx, w] of houses) {
      px(x, '#120c1e', hx, 150, w, 46);
      for (let i = 0; i < w / 2 + 2; i++) px(x, '#120c1e', hx - 2 + i, 150 - i * 0.6, w + 4 - i * 2, 1);
      for (let i = 0; i < 2; i++) px(x, U.hash(hx, i, Math.floor(t / 3)) % 10 < 6 ? '#f0c060' : '#2a2038', hx + 8 + i * (w - 24), 162, 8, 10);
      px(x, '#2a1a10', hx + w / 2 - 4, 178, 8, 18);
    }
    px(x, '#1a1428', 0, 196, VIEW_W, 28);
    px(x, '#2a2240', 0, 196, VIEW_W, 2);
  },
  // Dr. Street's path choice: three spotlights (the House Keeper select screen).
  renderSelect(x) {
    const t = this.time, sel = this.scene.i;
    const gr = x.createLinearGradient(0, 0, 0, VIEW_H);
    gr.addColorStop(0, '#1a1230'); gr.addColorStop(1, '#2e2048');
    x.fillStyle = gr; x.fillRect(0, 0, VIEW_W, VIEW_H);
    for (let y = 120; y < VIEW_H; y += 8) for (let X = 0; X < VIEW_W; X += 8) px(x, ((X + y) / 8) % 2 ? '#3a2a5a' : '#32244e', X, y, 8, 8);
    ['diploma', 'wrench', 'badge'].forEach((k, i) => {
      const cx = 52 + i * 100, on = i === sel;
      x.fillStyle = on ? 'rgba(255,230,160,.18)' : 'rgba(255,255,255,.04)';
      x.beginPath(); x.moveTo(cx - 8, 0); x.lineTo(cx + 8, 0); x.lineTo(cx + 38, 128); x.lineTo(cx - 38, 128); x.fill();
      x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.ellipse(cx, 124, 26, 5, 0, 0, Math.PI * 2); x.fill();
      const bob = on ? Math.round(Math.sin(t * 4) * 2) : 0;
      x.globalAlpha = on ? 1 : 0.5;
      x.drawImage(Art.icon(k, 3), cx - 24, 70 + bob);
      x.globalAlpha = 1;
      if (on && Math.floor(t * 3) % 2) { x.fillStyle = '#f0c040'; x.beginPath(); x.moveTo(cx - 5, 50); x.lineTo(cx + 5, 50); x.lineTo(cx, 56); x.fill(); }
    });
  },

  // boy / girl select: two spotlights with the walking sprites
  renderHeroes(x) {
    const t = this.time, sel = this.scene.i;
    const gr = x.createLinearGradient(0, 0, 0, VIEW_H);
    gr.addColorStop(0, '#1a1230'); gr.addColorStop(1, '#2e2048');
    x.fillStyle = gr; x.fillRect(0, 0, VIEW_W, VIEW_H);
    for (let y = 120; y < VIEW_H; y += 8) for (let X = 0; X < VIEW_W; X += 8) px(x, ((X + y) / 8) % 2 ? '#3a2a5a' : '#32244e', X, y, 8, 8);
    ['boy', 'girl'].forEach((k, i) => {
      const cx = 76 + i * 152, on = i === sel, H = HEROES[k];
      x.fillStyle = on ? 'rgba(255,230,160,.18)' : 'rgba(255,255,255,.04)';
      x.beginPath(); x.moveTo(cx - 10, 0); x.lineTo(cx + 10, 0); x.lineTo(cx + 46, 150); x.lineTo(cx - 46, 150); x.fill();
      x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.ellipse(cx, 146, 30, 6, 0, 0, Math.PI * 2); x.fill();
      const fr = on ? WALKCYCLE[Math.floor(t * 6) % 4] : 0;
      x.globalAlpha = on ? 1 : 0.55;
      x.drawImage(Art.character(H.pal, H.look).down[fr], cx - 30, 74, 60, 72);
      x.globalAlpha = 1;
      if (on && Math.floor(t * 3) % 2) { x.fillStyle = '#f0c040'; x.beginPath(); x.moveTo(cx - 5, 50); x.lineTo(cx + 5, 50); x.lineTo(cx, 56); x.fill(); }
    });
  },

  camera(m) {
    const P = this.pos;
    const px_ = (P.moving ? P.x + (P.tx - P.x) * P.mt : P.x) * 16;
    const py_ = (P.moving ? P.y + (P.ty - P.y) * P.mt : P.y) * 16;
    let cx = px_ + 8 - VIEW_W / 2, cy = py_ + 8 - VIEW_H / 2;
    const mw = m.w * 16, mh = m.h * 16;
    cx = mw <= VIEW_W ? (mw - VIEW_W) / 2 : U.clamp(cx, 0, mw - VIEW_W);
    cy = mh <= VIEW_H ? (mh - VIEW_H) / 2 : U.clamp(cy, 0, mh - VIEW_H);
    return [Math.round(cx), Math.round(cy), px_, py_];
  },

  renderMap(x, o = {}) {
    const m = o.map || this.map;
    let cx, cy, ppx, ppy;
    if (o.cam) [cx, cy] = o.cam; else [cx, cy, ppx, ppy] = this.camera(m);
    const x0 = Math.floor(cx / 16), y0 = Math.floor(cy / 16);
    for (let ty = y0; ty <= y0 + VIEW_H / 16; ty++) for (let tx = x0; tx <= x0 + Math.ceil(VIEW_W / 16); tx++) {
      if (!m.in(tx, ty)) continue;
      let id = m.get(tx, ty);
      if (id === T.BUILD || id === T.DOOR) id = T.GROUND;
      const theme = m.themeAt(tx, ty);
      let v;
      if (m.theme) v = (id === T.WALL || id === T.WWALL || id === T.BANNER) ? (ty === 0 || tx === 0 || tx === m.w - 1 || ty === m.h - 1 ? 0 : 1) : (id === T.FLOOR || id === T.MAT ? (tx + ty) % 2 + 2 * (U.hash(tx, ty) % 4) : (tx + ty) % 2);
      else v = U.hash(tx, ty) % 8;
      x.drawImage(Art.tile(id, theme, v, this.waterF), tx * 16 - cx, ty * 16 - cy);
      const pr = m.props.get(m.idx(tx, ty));
      if (pr) x.drawImage(Art.prop(pr), tx * 16 - cx, ty * 16 - cy - 2);
    }
    for (const b of m.buildings) {
      const bx = b.x * 16 - cx, by = b.y * 16 - cy;
      if (bx > VIEW_W || by > VIEW_H || bx + b.w * 16 < 0 || by + b.h * 16 < 0) continue;
      x.drawImage(Art.building(b, b.theme), bx, by);
    }
    const blink = Math.floor(this.time * 3);
    for (const [i, it] of m.items) {
      const ix = (i % m.w) * 16 - cx, iy = Math.floor(i / m.w) * 16 - cy;
      if (ix < -16 || iy < -16 || ix > VIEW_W || iy > VIEW_H) continue;
      x.drawImage(Art.bill(it.amt, blink), ix, iy - 2);
    }
    // y-sorted entities
    const ents = [];
    for (const n of m.npcs) {
      if (n.hidden) continue;
      const nx = (n.moving ? n.x + (n.tx - n.x) * n.mt : n.x) * 16, ny = (n.moving ? n.y + (n.ty - n.y) * n.mt : n.y) * 16;
      if (nx - cx < -16 || ny - cy < -16 || nx - cx > VIEW_W || ny - cy > VIEW_H) continue;
      ents.push({ y: ny, draw: () => this.drawEntity(x, n, nx - cx, ny - cy, m) });
    }
    if (!o.noPlayer && this.p) {
      const P = this.pos;
      ents.push({ y: ppy, draw: () => this.drawPlayer(x, ppx - cx, ppy - cy, m) });
    }
    ents.sort((a, b) => a.y - b.y).forEach((e) => e.draw());
  },

  drawEntity(x, n, sx, sy, m) {
    if (n.kind === 'cone') { x.drawImage(Art.cone(), sx, sy - 2); return; }
    const pal = n.palObj || PALS[n.pal] || PALS.dude;
    const fr = n.moving ? WALKCYCLE[(n.step * 2 + Math.floor(n.mt * 2)) % 4] : 0;
    shadow(x, sx, sy);
    x.drawImage(Art.character(pal, n.look)[n.dir][fr], sx - 2, sy - 8);
    this.grassOver(x, m, n.moving ? n.tx : n.x, n.moving ? n.ty : n.y, sx, sy, n.moving);
  },
  drawPlayer(x, sx, sy, m) {
    const P = this.pos;
    const pal = this.heroPal();
    const fr = P.moving ? WALKCYCLE[(P.parity * 2 + Math.floor(P.mt * 2)) % 4] : 0;
    sx = Math.round(sx); sy = Math.round(sy);
    shadow(x, sx, sy);
    x.drawImage(Art.character(pal, this.heroLook())[P.dir][fr], sx - 2, sy - 8);
    this.grassOver(x, m, P.moving ? P.tx : P.x, P.moving ? P.ty : P.y, sx, sy, P.moving && P.mt < 0.5);
  },
  grassOver(x, m, tx, ty, sx, sy, skip) {
    if (skip || m.get(tx, ty) !== T.GRASS) return;
    const tile = Art.tile(T.GRASS, m.themeAt(tx, ty), U.hash(tx, ty) % 8, 0);
    x.drawImage(tile, 0, 9, 16, 7, sx, sy + 9, 16, 7);
  },
};

// ---------------------------------------------------------------- field menu
const Menu = {
  async open() {
    Audio2.sfx('select');
    let start = 0;
    while (true) {
      const opts = ['SKILLS', 'CREW', 'BAG', 'PROFILE', 'MAP', 'WHAT BEATS WHAT', 'SAVE', 'SOUND: ' + (Audio2.muted ? 'OFF' : 'ON'), 'CLOSE'];
      const i = await UI.choose(opts, { cls: 'side', start });
      if (i < 0 || i === 8) return;
      start = i;
      if (i === 0) await this.skills();
      if (i === 1) await this.crew();
      if (i === 2) await this.bag(false);
      if (i === 3) await this.profile();
      if (i === 4) await this.map();
      if (i === 5) await this.chart();
      if (i === 6) {
        if (await UI.confirm('Save your progress?')) {
          const ok = Game.save();
          if (ok) Audio2.sfx('save');
          await UI.say(ok ? 'Progress saved!' : 'Couldn\'t save here (your browser is blocking storage).');
        }
        UI.closeDialog();
      }
      if (i === 7) Audio2.setMuted(!Audio2.muted);
    }
  },

  skillRow(id) {
    const s = SKILLS[id], t = SKILL_TYPES[s.type];
    return `<b style="color:${t.color}">${t.label}</b> · ${s.power ? 'Power ' + s.power : 'Support'} · ${s.cost} Energy<br>${U.esc(s.desc)}`;
  },

  async skills() {
    const p = Game.p;
    const rows = () => p.known.map((id) => ({
      label: SKILLS[id].name,
      right: p.equipped.includes(id) ? '<span class="eq">EQUIPPED</span>' : '',
      desc: this.skillRow(id),
      icon: `<i class="dot" style="background:${SKILL_TYPES[SKILLS[id].type].color}"></i>`,
    }));
    await UI.list(rows, {
      title: 'SKILLS', hint: 'Up to 4 skills can be equipped for battle.',
      footer: () => `A: equip / unequip · B: back · ${p.equipped.length}/4 equipped`,
      onAct: async (k) => {
        const id = p.known[k];
        if (p.equipped.includes(id)) {
          if (p.equipped.length === 1) { UI.toast('You need at least one skill!'); return 'keep'; }
          p.equipped = p.equipped.filter((e) => e !== id);
        } else if (p.equipped.length < 4) {
          p.equipped.push(id);
        } else {
          const j = await UI.choose(p.equipped.map((e) => 'Swap out ' + SKILLS[e].name), { cls: 'side' });
          if (j >= 0) p.equipped[j] = id;
        }
        return 'keep';
      },
    });
  },

  async crew() {
    const p = Game.p;
    const list = () => Crew.members();
    const rows = () => list().map((r) => {
      const st = Crew.stats(r);
      return {
        label: Crew.name(r) + (Crew.isMe(r) ? '' : ' · ' + ALLIES[r.id].title), right: (Crew.key(r) === p.lead ? 'LEAD ' : '') + (r.sanity > 0 ? `${r.sanity}/${st.maxSanity}` : 'OUT'),
        desc: `Best with <b style="color:${(SKILL_TYPES[Crew.boost(r)] || SKILL_TYPES.BASIC).color}">${Crew.boost(r) || '-'}</b> · EN ${r.energy}/${st.maxEnergy}<br>` +
          Crew.skills(r).map((id) => `<span style="color:${SKILL_TYPES[SKILLS[id].type].color}">${SKILLS[id].name}</span>`).join(' · '),
      };
    });
    await UI.list(rows, {
      title: 'CREW', hint: '', empty: '',
      footer: () => p.crew.length ? 'A: make leader (fights first) · B: back' : 'Friends join you as you beat Life Leaders.',
      onAct: async (k) => {
        const r = list()[k];
        p.lead = Crew.key(r);
        UI.toast(`${Crew.name(r)} will lead`);
        return 'keep';
      },
    });
  },

  // inBattle: returns the item id used (or null). Field use happens here.
  async bag(inBattle) {
    const p = Game.p;
    let used = null;
    const ids = () => Object.keys(p.items).filter((id) => p.items[id] > 0).sort((a, b) => (ITEMS[b].key ? 1 : 0) - (ITEMS[a].key ? 1 : 0));
    const rows = () => ids().map((id) => ({
      label: ITEMS[id].name, right: ITEMS[id].key ? '' : '×' + p.items[id], desc: ITEMS[id].desc,
      disabled: inBattle && !ITEMS[id].battle,
    }));
    await UI.list(rows, {
      title: 'BAG', empty: 'Your bag is empty. Even the gum is gone.',
      headRight: () => U.money(p.money),
      onAct: async (k) => {
        const id = ids()[k];
        const r = await Items.use(id, inBattle);
        if (r === 'used' && inBattle) { used = id; return 'close'; }
        return inBattle ? 'keep' : 'keep';
      },
    });
    return used;
  },

  async profile() {
    const p = Game.p, s = Game.stats();
    const next = Stats.xpFor(p.level + 1), cur = Stats.xpFor(p.level);
    const xpPct = U.clamp((p.xp - cur) / (next - cur), 0, 1) * 100;
    const badges = LEADER_ORDER.map((k) => {
      const L = LEADERS[k], got = p.badges.includes(k);
      return `<div class="bdg${got ? ' got' : ''}" title="${L.title}"><img src="${Art.iconURL(L.badgeIcon, 2)}"><span>${got ? L.title : '???'}</span></div>`;
    }).join('');
    const hrs = Math.floor(p.playTime / 3600), mins = Math.floor(p.playTime / 60) % 60;
    const path = PATHS[p.path];
    await UI.panel(`<div class="p-title">LIFE ID CARD</div>
      <div class="card">
        <div class="card-top">
          <img class="card-face" src="${Art.portrait(Game.heroPal(), Game.heroLook()).toDataURL()}">
          <div class="card-info">
            <div class="big">${U.esc(p.name)}</div>
            <div>Age ${Game.age()} · ${path ? path.name : 'No path yet'}</div>
            <div>Level ${p.level} <span class="xpbar"><i style="width:${xpPct}%"></i></span></div>
            <div>Cash <b>${U.money(p.money)}</b>${p.debt ? ` · Debt <b class="neg">${U.money(p.debt)}</b>` : ''}</div>
            <div>Karma <b>${p.karma}</b> (${Game.karmaLabel()})</div>
          </div>
        </div>
        <div class="statgrid">
          <span>Sanity</span><b>${p.sanity}/${s.maxSanity}</b><span>Energy</span><b>${p.energy}/${s.maxEnergy}</b>
          <span>Confidence</span><b>${s.conf}</b><span>Composure</span><b>${s.comp}</b>
          <span>Hustle</span><b>${s.hus}</b><span>Played</span><b>${hrs}h ${mins}m</b>
        </div>
        <div class="p-sub">LIFE MILESTONES ${p.badges.length}/8</div>
        <div class="badges">${badges}</div>
      </div>`, { cls: 'profile' });
  },

  async map() {
    const m = World.maps.world;
    const [c, x] = U.canvas(m.w, m.h);
    for (let y = 0; y < m.h; y++) for (let X = 0; X < m.w; X++) {
      const t = m.get(X, y), b = BIO[m.themeAt(X, y)];
      let col = b.ground[0];
      if (t === T.TREE) col = U.shade(b.canopy[0], -0.1);
      else if (t === T.WATER) col = b.water[0];
      else if (t === T.PATH) col = b.path[0];
      else if (t === T.GRASS) col = b.grass[1];
      else if (t === T.BUILD || t === T.DOOR) col = '#e8e0d0';
      x.fillStyle = col; x.fillRect(X, y, 1, 1);
    }
    const P = Game.pos;
    let me = null;
    if (Game.map.id === 'world') me = [P.x, P.y];
    else if (Game.map.exit) me = [Game.map.exit.x, Game.map.exit.y];
    const labels = TOWNS.map((t, i) => {
      const [ox, oy] = World.townOrigin(i);
      return `<span class="mlabel" style="left:${(ox + TW / 2) / m.w * 100}%;top:${(oy + (TOWNS[i].row ? TH + 1 : -1)) / m.h * 100}%">${t.name}</span>`;
    }).join('');
    const dot = me ? `<span class="mdot" style="left:${(me[0] + 0.5) / m.w * 100}%;top:${(me[1] + 0.5) / m.h * 100}%"></span>` : '';
    await UI.panel(`<div class="p-title">MAP</div><div class="mapwrap"><img src="${c.toDataURL()}">${labels}${dot}</div>`, { cls: 'mappanel' });
  },

  // Read as "what beats what": one row per issue type.
  async chart() {
    const chip = (k, src) => `<em style="background:${src[k].color}">${k}</em>`;
    const rows = Object.keys(ISSUE_TYPES).map((it) => {
      const strong = Object.keys(EFF).filter((k) => EFF[k][it] > 1), weak = Object.keys(EFF).filter((k) => EFF[k][it] < 1);
      return `<tr><td>${chip(it, ISSUE_TYPES)}</td><td>${strong.map((k) => chip(k, SKILL_TYPES)).join('')}</td><td>${weak.map((k) => chip(k, SKILL_TYPES)).join('')}</td></tr>`;
    }).join('');
    await UI.panel(`<div class="p-title">WHAT BEATS WHAT</div>
      <table class="chart2"><tr><th>ISSUE TYPE</th><th>2× DAMAGE</th><th>½ DAMAGE</th></tr>${rows}</table>
      <div class="p-desc">Use a skill whose type is in the 2× column. Each skill's colored dot is its type. SHADY is strong but costs Karma.</div>`, { cls: 'chartpanel' });
  },
};

// ---------------------------------------------------------------- items
const Items = {
  // returns 'used' | 'no'
  async use(id, inBattle) {
    const p = Game.p, it = ITEMS[id];
    // who gets it: the fighter in battle, or anyone in the field
    const target = async (msg, filter) => {
      if (inBattle && it.use !== 'revive') return filter(Battle.s.cur) ? Battle.s.cur : null;
      return Crew.pick(msg, filter);
    };
    switch (it.use) {
      case 'sanity': case 'full': {
        const r = await target('Who gets it?', (m) => m.sanity > 0 && (m.sanity < Crew.stats(m).maxSanity || (it.use === 'full' && m.status)));
        if (!r) { await UI.say(inBattle ? 'Sanity is already full.' : 'Nobody needs that right now.'); UI.closeDialog(); return 'no'; }
        const st = Crew.stats(r), before = r.sanity;
        r.sanity = it.use === 'full' ? st.maxSanity : Math.min(st.maxSanity, r.sanity + it.amt);
        if (it.use === 'full') r.status = null;
        Game.take(id); Audio2.sfx('heal');
        await UI.say(`${Crew.name(r)} had some ${it.name}. Recovered ${r.sanity - before} Sanity!`);
        break;
      }
      case 'energy': {
        const r = await target('Who gets it?', (m) => m.sanity > 0 && m.energy < Crew.stats(m).maxEnergy);
        if (!r) { await UI.say(inBattle ? 'Energy is already full.' : 'Nobody needs that right now.'); UI.closeDialog(); return 'no'; }
        const st = Crew.stats(r), before = r.energy;
        r.energy = Math.min(st.maxEnergy, r.energy + it.amt);
        Game.take(id); Audio2.sfx('heal');
        await UI.say(`${Crew.name(r)} downed a ${it.name}. Recovered ${r.energy - before} Energy!`);
        break;
      }
      case 'revive': {
        const r = await Crew.pick('Who needs a pep talk?', (m) => m.sanity <= 0);
        if (!r) { await UI.say('Nobody needs a pep talk right now. Everyone\'s hanging in there.'); UI.closeDialog(); return 'no'; }
        r.sanity = Math.floor(Crew.stats(r).maxSanity / 2);
        Game.take(id); Audio2.sfx('heal');
        await UI.say(`"You've got this!" ${Crew.name(r)} is back up with ${r.sanity} Sanity.`);
        if (inBattle) Battle.refresh();
        break;
      }
      case 'repel':
        if (inBattle) return 'no';
        p.repel = it.amt; Game.take(id);
        await UI.say('{NAME} put on the headphones. Weak issues will leave you alone for a while.');
        break;
      case 'escape':
        if (inBattle) {
          if (!Battle.s.wild) { await UI.say('You can\'t ride away from this one.'); return 'no'; }
          Game.take(id);
          Battle.s.escaped = 'uber';
          return 'used';
        }
        if (!(await UI.confirm('Ride back to the last place you recovered?'))) { UI.closeDialog(); return 'no'; }
        Game.take(id);
        UI.closeDialog();
        await Game.warp(p.respawn.map, p.respawn.x, p.respawn.y, p.respawn.dir);
        await UI.say('Your driver had a lot of opinions about traffic. You made it, though.');
        break;
      case 'book': {
        if (inBattle) return 'no';
        const sk = SKILLS[it.skill];
        if (p.known.includes(it.skill)) { await UI.say(`You already know ${sk.name}. You skim it anyway. Still good.`); UI.closeDialog(); return 'no'; }
        Game.take(id); Game.learn(it.skill); Audio2.sfx('levelup');
        await UI.say(`{NAME} read the whole thing. In one sitting! {NAME} learned ${sk.name}!`);
        if (!p.equipped.includes(it.skill)) await UI.say('Equip it from the SKILLS menu.');
        break;
      }
      case 'phone': return Scripts.callMom();
      case 'outfit': {
        if (inBattle) return 'no';
        const k = await UI.choose(OUTFIT_COLORS.map((o) => o[0]), { cls: 'side' });
        if (k < 0) return 'no';
        p.outfit = OUTFIT_COLORS[k][1]; Game.take(id);
        await UI.say(`Looking sharp in ${OUTFIT_COLORS[k][0]}!`);
        break;
      }
      case 'scratch': {
        if (inBattle) return 'no';
        Game.take(id);
        const r = Math.random();
        const win = r < 0.02 ? 50 : r < 0.1 ? 10 : r < 0.3 ? 2 : 0;
        await UI.say('{NAME} scratches furiously with a coin...');
        if (win) { Audio2.sfx('coin'); Game.earn(win); await UI.say(`WINNER! {NAME} won $${win}!`); }
        else await UI.say(['Nothing. Classic.', 'So close. (It was not close.)', 'You won... the experience.'][U.rand(0, 2)]);
        break;
      }
      default: return 'no';
    }
    UI.closeDialog();
    return 'used';
  },
};

// ---- src/crew.js
'use strict';
// The crew: you plus the allies you've recruited. Every member is a plain
// object with sanity / energy / status; the player object is the first one.

const Crew = {
  isMe(r) { return r === Game.p; },
  def(r) { return ALLIES[r.id]; },
  // everyone, lead first
  members() {
    const p = Game.p, all = [p, ...(p.crew || [])];
    const i = all.findIndex((r) => this.key(r) === p.lead);
    if (i > 0) all.unshift(...all.splice(i, 1));
    return all;
  },
  key(r) { return this.isMe(r) ? 'me' : r.id; },
  alive() { return this.members().filter((r) => r.sanity > 0); },
  has(id) { return (Game.p.crew || []).some((r) => r.id === id); },

  name(r) { return this.isMe(r) ? Game.p.name : this.def(r).name; },
  boost(r) { return this.isMe(r) ? (PATHS[Game.p.path] || {}).boost : this.def(r).boost; },
  pal(r) { return this.isMe(r) ? Game.heroPal() : this.def(r).pal; },
  look(r) { return this.isMe(r) ? Game.heroLook() : this.def(r).look || null; },
  stats(r) {
    if (this.isMe(r)) return Game.stats();
    const b = this.def(r).base, L = Game.p.level;
    return {
      maxSanity: Math.floor(4 * b.san * L / 100) + 3 * L + 20,
      conf: Math.floor(2 * b.conf * L / 100) + 5,
      comp: Math.floor(2 * b.comp * L / 100) + 5,
      hus: Math.floor(2 * b.hus * L / 100) + 5,
      maxEnergy: 18 + 2 * L + b.energy,
    };
  },
  skills(r) {
    if (this.isMe(r)) return Game.p.equipped;
    // Wing It is always there, so nobody is stuck at 0 Energy
    return ['wing_it', ...this.def(r).learn.filter(([lv]) => lv <= Game.p.level).map(([, id]) => id).slice(-3)];
  },

  add(id) {
    const r = { id, sanity: 0, energy: 0, status: null };
    const s = this.stats(r);
    r.sanity = s.maxSanity; r.energy = s.maxEnergy;
    Game.p.crew.push(r);
    return r;
  },
  healAll() {
    for (const r of this.members()) {
      const s = this.stats(r);
      r.sanity = s.maxSanity; r.energy = s.maxEnergy; r.status = null;
    }
  },
  // pick a crew member (for items); filter decides who can be chosen
  async pick(prompt, filter) {
    const list = this.members().filter(filter);
    if (!list.length) return null;
    if (this.members().length === 1) return list[0];
    await UI.say(prompt, { noWait: true });
    const i = await UI.choose(list.map((r) => { const s = this.stats(r); return `${this.name(r)} ${r.sanity}/${s.maxSanity}`; }), { cls: 'side' });
    return i < 0 ? null : list[i];
  },
};

// ---- src/ending.js
'use strict';
// "Congratulations, you have survived young adult life." A sunset walk down
// the road with your crew, then your stats. Plays once, after the last
// playable leader; afterwards you can keep exploring.

const Ending = {
  t: 0,
  async play() {
    const p = Game.p;
    p.flags.ending = true;
    await Game.fadeTo(1, 600);
    Game.mode = 'ending';
    this.t = 0;
    Audio2.music('victory');
    await Game.fadeTo(0, 600);
    await U.wait(2600);
    const hrs = Math.floor(p.playTime / 3600), mins = Math.floor(p.playTime / 60) % 60;
    const box = UI.el('div', 'endcard', `
      <div class="e-big">CONGRATULATIONS!</div>
      <div class="e-sub">You have survived young adult life.</div>
      <div class="e-stats">
        <span>AGE</span><b>${Game.age()}</b><span>LEVEL</span><b>${p.level}</b>
        <span>PLAY TIME</span><b>${hrs}h ${String(mins).padStart(2, '0')}m</b><span>ISSUES HANDLED</span><b>${p.stats.issues}</b>
        <span>MELTDOWNS</span><b>${p.stats.meltdowns}</b><span>CASH</span><b>${U.money(p.money)}</b>
        <span>KARMA</span><b>${Game.karmaLabel()}</b><span>CREW</span><b>${Crew.members().map((r) => Crew.name(r)).join(', ')}</b>
      </div>
      <div class="e-foot">PRESS A TO KEEP EXPLORING</div>`);
    UI.root.appendChild(box);
    await new Promise((resolve) => {
      const w = { onInput: (b) => { if (b === 'A' || b === 'START') { UI.pop(w); resolve(); } return 'stop'; } };
      UI.push(w);
    });
    await Game.fadeTo(1, 500);
    box.remove();
    Game.mode = 'world';
    Game.updateMusic();
    Game.autosave();
    await Game.fadeTo(0, 500);
    await UI.say(['The other Life Leaders are still out there: DATING, STUDENT LOANS, MASTERS DEGREE, CAREER... and PARENTS.',
      'They\'ll open their doors in a future update. Until then, the world is yours to explore.']);
  },

  render(x) {
    this.t += 1 / 60;
    const t = this.t;
    const g = x.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, '#f49a5a'); g.addColorStop(1, '#ffe6a8');
    x.fillStyle = g; x.fillRect(0, 0, VIEW_W, VIEW_H);
    const sunY = 104 - Math.min(26, t * 5);
    x.fillStyle = '#fff4c8'; x.beginPath(); x.arc(214, sunY, 20, 0, Math.PI * 2); x.fill();
    x.globalAlpha = 0.35; x.fillStyle = '#ffe9a0'; x.beginPath(); x.arc(214, sunY, 26, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;
    x.fillStyle = '#8ab86a'; x.beginPath(); x.ellipse(70, 124, 110, 24, 0, Math.PI, 0); x.fill();
    x.fillStyle = '#76a85a'; x.beginPath(); x.ellipse(240, 128, 120, 22, 0, Math.PI, 0); x.fill();
    x.fillStyle = '#68b04c'; x.fillRect(0, 124, VIEW_W, VIEW_H - 124);
    for (let i = 0; i < 50; i++) { x.fillStyle = '#4a8a36'; x.fillRect(U.hash(i, 5) % VIEW_W, 128 + U.hash(i, 6) % 90, 2, 1); }
    x.fillStyle = '#cbb48a'; x.beginPath(); x.moveTo(140, 124); x.lineTo(164, 124); x.lineTo(196, VIEW_H); x.lineTo(108, VIEW_H); x.fill();
    // the crew walks down the road toward you
    const walking = t < 3.2, k = Math.min(1, t / 3.2);
    Crew.members().forEach((r, i) => {
      // walk down the road and stop above the stats box, side by side
      const py = 100 + k * 30, px = 152 - 10 * (Crew.members().length - 1) + i * 20 - 8;
      shadow(x, px, py);
      const fr = walking ? WALKCYCLE[Math.floor(t * 6 + i) % 4] : 0;
      x.drawImage(Art.character(Crew.pal(r), Crew.look(r)).down[fr], Math.round(px) - 2, Math.round(py) - 8);
    });
    if (!walking && Math.floor(t * 3) % 2) { x.fillStyle = '#ffffff'; x.fillRect(134, 118, 1, 3); x.fillRect(170, 120, 1, 3); }
  },
};

// ---- src/scripts.js
'use strict';
// Everything people say and do when you talk to them.

const say = (t, o) => UI.say(t, o);

const Scripts = {
  async chat(npc, lines) { await say(lines); },

  async house(npc, def, ti, slot) {
    await say(def.say.slice(0, def.gift ? def.say.length : undefined));
    if (def.gift) {
      const flag = `gift-${ti}-${slot}`;
      if (!Game.p.flags[flag]) {
        Game.p.flags[flag] = true;
        const [id, n] = def.gift;
        Game.give(id, n);
        Audio2.sfx('coin');
        await say(`{NAME} received ${n > 1 ? n + '× ' : ''}${ITEMS[id].name}!`);
      }
    }
  },

  async busker(npc, f) {
    await say(f.say);
    const p = Game.p;
    if (p.money < 5) { await say('(You check your wallet. Moths fly out.)'); return; }
    if (await UI.confirm('Tip the musician $5?')) {
      p.money -= 5; Game.addKarma(4); Audio2.sfx('coin');
      await say('"Thanks, friend! Good karma comes back around!" (Karma went up.)');
    } else {
      await say('"No worries! ♪ The best things in life are free... ♪"');
    }
  },

  // ---------------------------------------------------------- home
  async mom(npc) {
    const p = Game.p;
    if (!p.path) {
      await say(['Morning, sweetie! Dr. Street called. He wants to see you at his LAB.',
        'It\'s the building with the green roof, east side of town.',
        'And you have your phone? Good. Call me if you need anything. ANYTHING. (Within reason.)'], { name: 'MOM' });
      return;
    }
    if (!p.flags.momCash) {
      p.flags.momCash = true;
      await say(['A PATH! Oh, I\'m so proud. Your father pretends he isn\'t, but he is.',
        'Here, take this. For gas. Don\'t tell your father.'], { name: 'MOM' });
      Game.earn(20); Audio2.sfx('coin');
      await say('{NAME} received $20!');
    }
    await say('You look exhausted. Sit down, I\'ll make you a sandwich.', { name: 'MOM' });
    Game.fullHeal(); Audio2.sfx('heal');
    p.respawn = { map: Game.map.id, x: 10, y: 6, dir: 'right' };
    await say(['Everyone ate a sandwich and took a nap. Sanity and Energy fully restored!',
      'MOM: "Go get \'em. And call me. You won\'t, but call me."']);
  },

  // Call Mom from the bag: money 90% of the time, once per 5 minutes of play.
  async callMom() {
    const p = Game.p, nm = { name: 'MOM' };
    await say('*ring ring* ... *ring ring* ...');
    const wait = 300 - (p.playTime - (p.momCall ?? -1e9));
    if (wait > 0) {
      await say(U.pick(Math.random, ['Honey, didn\'t I JUST talk to you?', 'Again? Is everything okay? Are you eating?', 'I\'m in the middle of my show. Call me back.']), nm);
      await say(`(Mom needs a break. Try again in about ${Math.max(1, Math.ceil(wait / 60))} min.)`);
      UI.closeDialog();
      return 'no';
    }
    p.momCall = p.playTime;
    if (Math.random() < 0.9) {
      const amt = U.rand(15, 40) + 15 * p.badges.length;
      await say(U.pick(Math.random, [
        'Of course, sweetie. I\'ll send it now. What\'s "Venmo" again?',
        'Fine. But this is a LOAN. (It is not a loan.)',
        'Your father says no. I\'m sending it anyway.',
        'Are you sure you don\'t want to move back home? ...Okay, okay. Sending it.',
      ]), nm);
      p.money += amt; Audio2.sfx('coin');
      await say(`Mom sent ${U.money(amt)}!`);
    } else {
      await say(U.pick(Math.random, [
        'Oh honey, I\'m at book club. Can\'t talk. Love you!',
        'Did you know your cousin got engaged? To a DENTIST? ...What did you need again? Oh, I have to go.',
        'Sweetie, money doesn\'t grow on trees. Have you tried a budget? I\'ll email you a spreadsheet.',
      ]), nm);
      await say('(No money this time. Mom says hi, though.)');
    }
    UI.closeDialog();
    return 'no';
  },

  // ---------------------------------------------------------- cutscene helpers
  async walkNPC(n, dirs) {
    for (const d of dirs) {
      const [dx, dy] = DIRS[d];
      n.dir = d; n.tx = n.x + dx; n.ty = n.y + dy; n.moving = true; n.mt = 0;
      while (n.moving) await new Promise((r) => requestAnimationFrame(r));
    }
  },
  async walkPlayer(dirs) {
    const P = Game.pos;
    for (const d of dirs) {
      const [dx, dy] = DIRS[d];
      P.dir = d; P.tx = P.x + dx; P.ty = P.y + dy; P.moving = true; P.mt = 0;
      while (P.moving) await new Promise((r) => requestAnimationFrame(r));
    }
  },
  rep: (d, n) => Array(n).fill(d),

  // ---------------------------------------------------------- crew
  // Your significant other is the opposite gender of your character.
  meetsYou(id) {
    if (!id.startsWith('so_')) return true;
    return id === (Game.p.hero === 'girl' ? 'so_m' : 'so_f');
  },
  // Someone runs up to you outside a leader hall and joins.
  async meet(id) {
    const A = ALLIES[id], P = Game.pos, m = Game.map, p = Game.p;
    const n = makeNPC({ x: P.x, y: P.y + 3, dir: 'up' });
    n.palObj = A.pal; n.look = A.look || null;
    m.npcs.push(n);
    await say(A.shout);
    await Scripts.walkNPC(n, ['up', 'up']);
    P.dir = 'down';
    await say(A.pitch, { name: A.name });
    Crew.add(id);
    Audio2.sfx('badge');
    await say(`${A.name} (${A.title}) joined your crew!`);
    await say(`${A.name} is best with ${A.boost} skills: ${Crew.skills(p.crew[p.crew.length - 1]).slice(1).map((k) => SKILLS[k].name).join(', ')}.`);
    if (!p.flags.crewTip) {
      p.flags.crewTip = true;
      await say(['TIP: In battle, pick CREW to tag in whoever has the right skill. If someone runs out of Sanity, the next person steps up. You only lose if EVERYONE is out.',
        'Pick who fights first in MENU > CREW. Hospitals, Mom and Pep Talks get everyone back on their feet.']);
    }
    m.npcs.splice(m.npcs.indexOf(n), 1);
    Game.autosave();
  },

  // ---------------------------------------------------------- Dr. Street
  // First time in the lab: he comes over, explains the basics, and walks you
  // to the table to choose what's next.
  async labIntro() {
    const p = Game.p, m = Game.map, D = { name: 'DR. STREET' };
    p.flags.labIntro = true;
    const st = m.npcs.find((n) => n.pal === 'street');
    await say('"Ah! {NAME}! There you are!"', D);
    await Scripts.walkNPC(st, [...Scripts.rep('down', st.y < 11 ? 11 - st.y : 0), ...Scripts.rep('left', Math.max(0, st.x - 9))]);
    st.dir = 'down';
    await say(['Congratulations on graduating! Big day. Here\'s what\'s next: everything. All at once. Forever.',
      'Don\'t panic. I\'m DR. STREET, and I\'m going to give you the short version.'], D);
    await say(['Out there, life throws ISSUES at you. Parking tickets. Group chats. Mysterious back pain.',
      'They hide in the TALL GRASS between towns. Walk through it and something will jump out.'], D);
    await say(['You fight back with LIFE SKILLS. Every skill has a TYPE, and every issue is WEAK to certain types.',
      'Hit a weakness and it does DOUBLE damage. The issue\'s box tells you what it\'s weak to. Use that.'], D);
    await say(['Skills cost ENERGY. Your SANITY is your health. Run out of Sanity and you\'ll have a full meltdown and drop half your cash.',
      'HOSPITALS patch you up. STORES sell snacks and self-help books that teach new skills. CHAPELS save your progress.'], D);
    await say(['And eight LIFE LEADERS stand between you and the end of young adulthood. CAR TROUBLE. TAXES. CAREER. You know. Life.',
      'The rest you\'ll figure out the way everyone does: badly, and then better.'], D);
    await say('Now, the big question. Come over to the table.', D);
    await Scripts.walkNPC(st, [...Scripts.rep('up', 4), 'right', 'up']);
    st.dir = 'left';
    await Scripts.walkPlayer([...Scripts.rep('up', 5), 'left', 'up']);
    Game.pos.dir = 'up';
    await say(['College, Trade School, or a Job. Each has perks, and each has a cost.',
      'There\'s no wrong answer. (There are some expensive answers.)'], D);
    UI.closeDialog();
    await Scripts.pathTable('wrench');
    if (!p.path) await say('Take your time. The table isn\'t going anywhere. Neither is your future. Well. It is, slowly.', D);
  },

  async street(npc) {
    const p = Game.p, D = { name: 'DR. STREET' };
    if (!p.path) { await say('Go on, take a look at the table. College, Trade School, or a Job.', D); return; }
    const next = LEADER_ORDER.find((k) => !LEADERS[k].locked && !p.badges.includes(k));
    if (next) {
      const L = LEADERS[next];
      await say([`Your next challenge: ${L.title}, in ${TOWNS[L.town].name}. Leader ${L.name} is no joke.`,
        'If a leader is too tough, spend some time in the tall grass first. Every fight makes you stronger.',
        'And if money\'s tight, check your BAG. Your phone can call your mom. Every parent\'s favorite feature.'], D);
    } else {
      await say(['You survived young adult life! I\'ve never been prouder of a former lab visitor.',
        'The other leaders aren\'t ready for you yet. Rumor is they\'ll open their doors in a future update.'], D);
    }
  },

  async pathTable(kind) {
    const p = Game.p;
    const key = { diploma: 'college', wrench: 'trade', badge: 'job' }[kind];
    if (p.path) {
      await say(p.path === key ? 'That\'s the path you chose. It\'s working out great. Mostly.' : 'Another path. You think about it sometimes. Late at night. It\'s fine.');
      return;
    }
    const chosen = await PathPicker.open(key);
    if (!chosen) return;
    const P = PATHS[chosen];
    p.path = chosen;
    p.level = 5; p.xp = Stats.xpFor(5);
    p.known = [...P.start]; p.equipped = [...P.start];
    p.money = P.money; p.debt = P.debt;
    Game.give('coffee', 3); Game.give('comfort_food', 2);
    Game.fullHeal();
    // take the chosen item off the table
    const pk = { college: 'diploma', trade: 'wrench', job: 'badge' }[chosen];
    for (const [i, k] of Game.map.props) if (k === pk) { Game.map.props.delete(i); Game.map.acts.delete(i); }
    World.refreshGates();
    Audio2.sfx('badge');
    await say(`{NAME} chose ${P.name.toUpperCase()}!`);
    const lines = {
      college: ['College! Excellent. You\'ll learn fast... and owe $3,000. Ten percent of everything you earn goes to your loans until they\'re paid.',
        'You start with GOOGLING IT. BRAINS skills tear through PAPERWORK and MONEY issues.'],
      trade: ['Trade School! Smart. Real skills, real paychecks, and you can fix your own sink.',
        'You\'ve got a small tool loan to pay off. GRIT skills crush CHORE issues. You\'re tough, too!'],
      job: ['Getting a job! Bold. No debt, cash in your pocket, and a mouth that can talk your way out of anything.',
        'You\'ll level a bit slower without the degree, but SOCIAL skills hit PEOPLE issues hard. And you can HAGGLE.'],
    }[chosen];
    await say(lines, { name: 'DR. STREET' });
    await say(['Here, take these. Coffee restores Energy, comfort food restores Sanity. You\'ll need both.'], { name: 'DR. STREET' });
    await say('{NAME} received 3× Coffee and 2× Comfort Food!');
    await say(['Your first LIFE LEADER is CAR TROUBLE, in DUSTY GULCH, east along Route 1. You\'re on your own for this one.',
      'Don\'t worry. Nobody stays alone for long out there.',
      'Press MENU (Esc) any time for your skills, bag and map. Now go! Adulthood waits for no one!'], { name: 'DR. STREET' });
    Game.autosave();
  },

  // ---------------------------------------------------------- gates
  async gate(g) {
    const r = ROUTES[g.ri];
    if (Game.gateOpen(g.ri)) { await say('The road\'s open. Good luck out there!', { name: 'GUARD' }); return; }
    if (r.gateFlag === 'path') {
      await say(['Whoa there! Dr. Street says nobody leaves Maple Grove without a PATH.',
        'His LAB is the green-roofed building in the southeast of town.'], { name: 'LAB AIDE' });
      return;
    }
    const why = {
      1: 'Tow trucks everywhere. RUSTY\'s doing. Beat CAR TROUBLE in Dusty Gulch and we\'ll clear the road.',
      2: 'A crowd is doing burpees in the middle of the road. COACH MAX\'s orders. Beat FITNESS in Sunnyside Beach.',
      3: 'The pass is frozen solid with paperwork. Only those who\'ve beaten TAXES in Frostpeak may pass.',
      7: 'Major construction. This shortcut only opens for folks with 7 LIFE MILESTONES.',
    }[g.ri];
    await say([why, `(You need ${r.need} Life Milestone${r.need > 1 ? 's' : ''}. You have ${Game.p.badges.length}.)`], { name: 'GUARD' });
  },

  // ---------------------------------------------------------- services
  async shop(ti) {
    const p = Game.p;
    const stock = ti < SHOP_STOCK.length ? SHOP_STOCK[ti] : [...new Set(SHOP_STOCK.flat())];
    await say(`Welcome to QUIK STOP! We\'re on every corner. Literally every corner.${p.karma < 30 ? ' ...Oh. It\'s you. Prices are a little higher for you today.' : p.karma >= 80 ? ' Oh, it\'s you! Good-person discount, on the house!' : ''}`, { name: 'CLERK' });
    UI.closeDialog();
    await UI.list(() => stock.map((id) => ({
      label: ITEMS[id].name, right: U.money(Game.priceOf(id)),
      desc: ITEMS[id].desc + (p.items[id] ? ` <i>(You have ${p.items[id]}.)</i>` : '') + (ITEMS[id].skill && p.known.includes(ITEMS[id].skill) ? ' <i>(Already known.)</i>' : ''),
    })), {
      title: 'QUIK STOP', headRight: () => U.money(p.money),
      footer: () => 'A: buy one · B: leave',
      onAct: async (k) => {
        const id = stock[k], pr = Game.priceOf(id);
        if (p.money < pr) { Audio2.sfx('bump'); UI.toast('Not enough cash!'); return 'keep'; }
        p.money -= pr; Game.give(id); Audio2.sfx('coin');
        UI.toast(`Bought ${ITEMS[id].name}!`);
        return 'keep';
      },
    });
    await say('Thanks! Come again! (You will. We\'re everywhere.)', { name: 'CLERK' });
  },

  async hospital(ti) {
    const p = Game.p;
    await say(['Welcome to ST. COPAY\'S! We restore Sanity, Energy, and cure Burnout.'], { name: 'NURSE' });
    const yes = await UI.confirm('The copay is $10. Want me to patch you up?', { name: 'NURSE' });
    if (!yes) { await say('Okay! Hydrate! Sleep! Nobody ever does, but I have to say it.', { name: 'NURSE' }); return; }
    if (p.money >= 10) { p.money -= 10; await say('Insurance? ...Yeah, I didn\'t think so. Ten bucks it is.', { name: 'NURSE' }); }
    else await say('You\'re broke? ...Okay. This one\'s on the house. Don\'t tell billing.', { name: 'NURSE' });
    await Game.fadeTo(0.6, 250);
    Audio2.sfx('heal');
    Game.fullHeal();
    await U.wait(700);
    await Game.fadeTo(0, 250);
    p.respawn = { map: Game.map.id, x: 9, y: 5, dir: 'up' };
    await say('All better! We hope to never see you again. (Kindly.)', { name: 'NURSE' });
  },

  async chapel(ti) {
    const p = Game.p;
    await say('Welcome, weary traveler. How may I help you?', { name: 'PASTOR' });
    let start = 0;
    while (true) {
      const i = await UI.choose(['Save my progress', 'Donate $10', 'Ask for guidance', 'Leave'], { cls: 'side', start });
      start = Math.max(0, i);
      if (i === 0) {
        const ok = Game.save();
        if (ok) Audio2.sfx('save');
        await say(ok ? 'Your journey is recorded. Go in peace. (Progress saved!)' : 'Hm, the record book is stuck. (Your browser is blocking storage.)', { name: 'PASTOR' });
      } else if (i === 1) {
        if (p.money < 10) { await say('Keep it, friend. It looks like you need it more.', { name: 'PASTOR' }); continue; }
        p.money -= 10; Game.addKarma(6); Audio2.sfx('coin');
        await say(`Bless you. Generosity is its own reward. (Karma: ${p.karma}, ${Game.karmaLabel()})`, { name: 'PASTOR' });
        if (p.karma >= 80) {
          const s = Game.stats(); p.energy = s.maxEnergy; Audio2.sfx('heal');
          await say('You feel... light. Your Energy is fully restored!');
        }
      } else if (i === 2) {
        const next = LEADER_ORDER.find((k) => !LEADERS[k].locked && !p.badges.includes(k));
        const k = p.karma;
        const read = k < 30 ? 'I sense... a lot of passive aggression in you. Shady skills come at a price. Shop clerks talk, you know.'
          : k >= 80 ? 'Your heart is light. Shopkeepers can tell. They\'ll treat you well.'
            : 'You\'re doing alright. Be kind when you can. It comes back around.';
        await say([read, next ? `Your road leads to ${LEADERS[next].title} in ${TOWNS[LEADERS[next].town].name}. ${LEADERS[next].tip}` : 'The remaining leaders are not yet ready to receive you. Rest, and explore.'], { name: 'PASTOR' });
      } else {
        await say('Go in peace. And call your mother.', { name: 'PASTOR' });
        return;
      }
    }
  },

  async guide(key) {
    const L = LEADERS[key];
    if (Game.p.badges.includes(key)) { await say(['YO! You did it! Champion of ' + L.title + '!', 'Go show the next leader what you\'ve got!'], { name: 'HALL GUIDE' }); return; }
    await say(['YO! Future champ! Here\'s some free advice.', L.tip, 'Stock up on Coffee and Comfort Food before you go up there!'], { name: 'HALL GUIDE' });
  },

  // ---------------------------------------------------------- leaders
  async leader(key, npc) {
    const L = LEADERS[key], p = Game.p;
    const nm = { name: L.name };
    if (p.badges.includes(key)) { await say(L.after, nm); return; }
    await say(L.intro, nm);
    if (!(await UI.confirm(`Battle ${L.title}?`))) {
      await say('Take your time. Issues don\'t go anywhere. That\'s kind of the problem.', nm);
      return;
    }
    UI.closeDialog();
    const res = await Battle.start({ foes: L.team, leader: key, biome: TOWNS[L.town].biome });
    if (res !== 'win') return;
    await say(L.win, nm);
    p.badges.push(key);
    Audio2.music('victory');
    Audio2.sfx('badge');
    await say(`{NAME} earned the ${L.badge.toUpperCase()}! (Life Milestone ${p.badges.length}/8)`);
    const r = Game.earn(L.reward);
    Audio2.sfx('coin');
    await say(`${L.name} paid out ${U.money(L.reward)}!${r.garnished ? ` ($${r.garnished} went straight to your loans.)` : ''}`);
    const sk = SKILLS[L.skill];
    if (!p.known.includes(L.skill)) {
      Game.learn(L.skill);
      Audio2.sfx('levelup');
      await say(`${L.name} taught {NAME} ${sk.name.toUpperCase()}! ${sk.desc}`);
      if (!p.equipped.includes(L.skill)) await Battle.offerSkill(L.skill);
    }
    await say(`Somehow, a year and a half has passed. {NAME} is now ${Game.age()}.`);
    World.refreshGates();
    Game.autosave();
    Game.updateMusic();
    const nextGate = ROUTES.findIndex((rt) => rt.need === p.badges.length);
    if (nextGate >= 0) await say('Word travels fast: a road that was blocked just opened up!');
  },
};
