<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Adulting Quest</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* One dark game cabinet, matching House Keeper: the canvas is the whole show,
   controls sit under it. Inside the screen, 1 game pixel = var(--u). */
:root {
  --bg: #0e0b16; --frame: #2a2140; --ink: #efe6d2; --dim: #8f86a3;
  --btn: #352a4e; --btn-hi: #4f3f74; --accent: #e8b84a;
  --font: "Press Start 2P", ui-monospace, Menlo, monospace;
  /* in-game panels (House Keeper's dialog box) */
  --p-out: #283058; --p-line: #6878b8; --p-fill: #f8f8f0; --p-hi: #d8d8e8; --p-ink: #303040; --p-shade: #c8c8d4;
  --hud: #120e1cdd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; overflow: hidden;
  font-family: var(--font); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none;
}
#screen {
  position: relative; width: 608px; height: 448px; flex: none;
  container-type: inline-size; --u: calc(100cqw / 304);
  background: #000; border-radius: 3px; overflow: hidden;
  box-shadow: 0 0 0 4px var(--frame), 0 14px 40px rgba(0, 0, 0, 0.6);
}
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#ui {
  position: absolute; inset: 0; pointer-events: none; color: var(--p-ink);
  font-family: var(--font); font-size: calc(8 * var(--u)); line-height: calc(14 * var(--u));
}
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }
#hint { font-size: 8px; line-height: 1.8; color: var(--dim); text-align: center; letter-spacing: 0.04em; max-width: 100%; }
#hint b { color: var(--ink); font-weight: 400; }

/* ---------------------------------------------------------------- touch pad */
#pad { display: none; align-items: center; justify-content: space-between; width: 100%; max-width: 520px; gap: 8px; touch-action: none; }
@media (pointer: coarse) { #pad { display: flex; } #hint { display: none; } }
#pad button {
  font-family: var(--font); color: var(--ink); background: var(--btn); border: 0; border-radius: 10px;
  box-shadow: 0 4px 0 #1a1426; touch-action: none; -webkit-tap-highlight-color: transparent;
}
#pad button.on { background: var(--btn-hi); transform: translateY(2px); box-shadow: 0 2px 0 #1a1426; }
#pad .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 2px; }
#pad .dpad button { font-size: 14px; }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
#pad .ab { display: flex; gap: 14px; align-items: center; }
#pad .ab button { width: 62px; height: 62px; border-radius: 50%; font-size: 14px; }
#pad .ab .a { background: #8a2f3c; margin-bottom: 28px; }
#pad .menubtn { font-size: 8px; padding: 10px 8px; align-self: flex-end; }

/* ---------------------------------------------------------------- panels */
/* House Keeper's box: navy edge, periwinkle line, cream fill, highlight row */
.dlg, .menu, .panel, .bhud, .skillmenu {
  background: var(--p-fill);
  border: var(--u) solid var(--p-out);
  box-shadow: inset 0 0 0 var(--u) var(--p-line), inset 0 calc(2 * var(--u)) 0 calc(var(--u)) var(--p-hi);
  border-radius: 0;
}
.dlg, .menu, .panel, .bhud, .skillmenu, .titlemenu, .ps-desc { text-shadow: calc(var(--u)) calc(var(--u)) 0 var(--p-shade); }
.dlg { position: absolute; left: calc(3 * var(--u)); right: calc(3 * var(--u)); bottom: calc(3 * var(--u)); height: calc(54 * var(--u)); padding: calc(9 * var(--u)) calc(10 * var(--u)); }
.dlg-name {
  position: absolute; top: calc(-13 * var(--u)); left: calc(6 * var(--u)); background: var(--p-out); color: #fff;
  font-size: calc(6 * var(--u)); line-height: 1; padding: calc(3 * var(--u)) calc(5 * var(--u)); text-shadow: none;
}
.dlg-more {
  position: absolute; right: calc(12 * var(--u)); bottom: calc(6 * var(--u)); width: 0; height: 0; font-size: 0;
  border-left: calc(4 * var(--u)) solid transparent; border-right: calc(4 * var(--u)) solid transparent; border-top: calc(4 * var(--u)) solid #d83040;
  animation: blinkon 0.66s steps(1) infinite;
}
@keyframes blinkon { 50% { opacity: 0; } }
.dlg-text { white-space: pre; }

.menu { position: absolute; padding: calc(5 * var(--u)) 0; }
.menu .opt { position: relative; padding: 0 calc(10 * var(--u)) 0 calc(18 * var(--u)); line-height: calc(14 * var(--u)); cursor: pointer; white-space: nowrap; }
.menu .opt.sel::before {
  content: ''; position: absolute; left: calc(8 * var(--u)); top: calc(3 * var(--u));
  border-top: calc(3.5 * var(--u)) solid transparent; border-bottom: calc(3.5 * var(--u)) solid transparent; border-left: calc(5 * var(--u)) solid var(--p-ink);
}
.choice { right: calc(3 * var(--u)); bottom: calc(59 * var(--u)); }
.choice.side { top: calc(3 * var(--u)); bottom: auto; max-height: calc(218 * var(--u)); overflow: auto; }

/* title */
.titlecard { position: absolute; left: 0; right: 0; top: calc(22 * var(--u)); text-align: center; pointer-events: none !important; animation: hover 2s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(calc(2 * var(--u))); } }
.titlecard .logo { display: flex; flex-direction: column; align-items: center; gap: calc(6 * var(--u)); }
.titlecard .logo span { color: #f0c040; font-size: calc(16 * var(--u)); line-height: 1; text-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 #5a2a10; }
.titlecard .logo span + span { font-size: calc(24 * var(--u)); }
.titlecard .tag { margin-top: calc(14 * var(--u)); color: #d8d0e8; font-size: calc(6 * var(--u)); line-height: 1.8; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
.titlemenu {
  left: 50%; right: auto; transform: translateX(-50%); bottom: calc(40 * var(--u)); background: #0e0a18cc; border: 0; box-shadow: none;
  color: #8f86a3; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; padding: calc(6 * var(--u)) calc(8 * var(--u)); text-align: center;
}
.titlemenu .opt { line-height: calc(16 * var(--u)); padding: 0 calc(24 * var(--u)); }
.titlemenu .opt.sel { color: #fff; }
.titlemenu .opt.sel::before { border-left-color: #f0c040; left: calc(8 * var(--u)); top: calc(4.5 * var(--u)); animation: blinkon 0.66s steps(1) infinite; }

/* HUD bits */
.toast {
  position: absolute; top: calc(20 * var(--u)); left: 50%; transform: translateX(-50%); background: var(--hud); color: #fff;
  font-size: calc(7 * var(--u)); line-height: 1; padding: calc(3 * var(--u)) calc(6 * var(--u)); white-space: nowrap; pointer-events: none !important; z-index: 20;
}
/* the wooden location sign */
.banner {
  position: absolute; top: calc(4 * var(--u)); left: calc(3 * var(--u)); color: #4a3420; line-height: 1;
  background: #f0e0b8; padding: calc(5 * var(--u)) calc(9 * var(--u));
  box-shadow: 0 0 0 var(--u) #c89858, 0 0 0 calc(2 * var(--u)) #4a3420;
  animation: drop 0.25s ease-out; pointer-events: none !important;
}
.banner.out { transition: transform 0.3s, opacity 0.3s; transform: translateY(calc(-28 * var(--u))); opacity: 0; }
@keyframes drop { from { transform: translateY(calc(-24 * var(--u))); } }

/* ---------------------------------------------------------------- full panels */
.panel { position: absolute; inset: calc(10 * var(--u)) calc(14 * var(--u)); display: flex; flex-direction: column; padding: calc(10 * var(--u)) calc(12 * var(--u)); z-index: 5; }
.p-title { color: #4a3a70; display: flex; justify-content: space-between; margin-bottom: calc(6 * var(--u)); }
.p-title span { color: #2a7a3a; }
.p-sub { color: #4a3a70; margin: calc(6 * var(--u)) 0 calc(4 * var(--u)); font-size: calc(6 * var(--u)); }
.p-desc { min-height: calc(30 * var(--u)); border-top: var(--u) solid #d0cce0; margin-top: calc(4 * var(--u)); padding-top: calc(5 * var(--u)); font-size: calc(6 * var(--u)); line-height: calc(10 * var(--u)); color: #6a6080; }
.p-desc i { color: #9890a8; font-style: normal; }
.p-foot { font-size: calc(6 * var(--u)); color: #9890a8; margin-top: auto; padding-top: calc(4 * var(--u)); text-align: center; text-shadow: none; }
.list .rows { flex: 1; overflow-y: auto; min-height: 0; }
.list .row { display: flex; align-items: center; gap: calc(5 * var(--u)); padding: calc(2 * var(--u)) calc(4 * var(--u)) calc(2 * var(--u)) calc(14 * var(--u)); cursor: pointer; position: relative; font-size: calc(7 * var(--u)); }
.list .row.sel::before {
  content: ''; position: absolute; left: calc(4 * var(--u)); top: calc(4 * var(--u));
  border-top: calc(3.5 * var(--u)) solid transparent; border-bottom: calc(3.5 * var(--u)) solid transparent; border-left: calc(5 * var(--u)) solid var(--p-ink);
}
.list .row.dis { color: #b0a8c0; }
.list .row .l { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .row .r { color: #6a6080; }
.dot { display: inline-block; width: calc(5 * var(--u)); height: calc(5 * var(--u)); flex: none; box-shadow: 0 0 0 var(--u) #1e1626; }
.eq { font-size: calc(5 * var(--u)); background: var(--p-out); color: #fff; padding: calc(2 * var(--u)) calc(3 * var(--u)); text-shadow: none; }
.se { color: #1a8a3a; }
.nve { color: #b8402a; }

/* profile */
.card { flex: 1; overflow: auto; min-height: 0; font-size: calc(6 * var(--u)); line-height: calc(10 * var(--u)); }
.card-top { display: flex; gap: calc(8 * var(--u)); align-items: center; }
.card-face { width: calc(40 * var(--u)); height: calc(48 * var(--u)); image-rendering: pixelated; background: #e8e4f4; flex: none; box-shadow: 0 0 0 var(--u) var(--p-line); }
.card-info .big { font-size: calc(8 * var(--u)); line-height: calc(14 * var(--u)); }
.card-info b { color: #2a7a3a; font-weight: 400; }
.card-info b.neg { color: #b8402a; }
.xpbar { display: inline-block; width: calc(50 * var(--u)); height: calc(4 * var(--u)); background: #d8d8e4; vertical-align: middle; }
.xpbar i { display: block; height: 100%; background: #4a8ae8; }
.statgrid { display: grid; grid-template-columns: auto auto auto auto; gap: 0 calc(6 * var(--u)); margin-top: calc(5 * var(--u)); }
.statgrid b { text-align: right; font-weight: 400; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(3 * var(--u)); }
.bdg { display: flex; align-items: center; gap: calc(2 * var(--u)); font-size: calc(4 * var(--u)); line-height: 1.3; color: #b0a8c0; background: #ece8f4; padding: calc(2 * var(--u)); overflow: hidden; }
.bdg img { width: calc(12 * var(--u)); height: calc(12 * var(--u)); image-rendering: pixelated; filter: grayscale(1) opacity(0.35); flex: none; }
.bdg.got { color: var(--p-ink); background: #fff4d0; }
.bdg.got img { filter: none; }

/* map */
.mappanel .mapwrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; }
.mappanel img { width: 100%; image-rendering: pixelated; box-shadow: 0 0 0 var(--u) #1e1626; }
.mlabel { position: absolute; transform: translate(-50%, -50%); font-size: calc(3.6 * var(--u)); line-height: 1; color: #fff; text-shadow: calc(0.7 * var(--u)) calc(0.7 * var(--u)) 0 #000; white-space: nowrap; }
.mdot { position: absolute; width: calc(5 * var(--u)); height: calc(5 * var(--u)); margin: calc(-2.5 * var(--u)) 0 0 calc(-2.5 * var(--u)); background: #f03a3a; box-shadow: 0 0 0 var(--u) #fff; animation: blinkon 0.6s steps(1) infinite; }

/* type chart */
.chart { width: 100%; border-collapse: collapse; font-size: calc(5 * var(--u)); text-align: center; }
.chart th, .chart td { padding: calc(3 * var(--u)) calc(1 * var(--u)); border-bottom: var(--u) solid #e0dce8; font-weight: 400; }
.chart th:first-child { text-align: left; color: #9890a8; }
.chart td.se { background: #d8f4dc; }
.chart td.nve { background: #f8dcd4; }

/* path choice: the spotlight select screen is drawn on the canvas */
.pathpick { position: absolute; inset: 0; pointer-events: auto; }
.ps-title { position: absolute; top: calc(12 * var(--u)); width: 100%; text-align: center; color: #f0c040; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
.ps-cols { position: absolute; top: calc(30 * var(--u)); left: 0; right: 0; height: calc(108 * var(--u)); display: grid; grid-template-columns: repeat(3, 1fr); cursor: pointer; }
.ps-names { position: absolute; top: calc(132 * var(--u)); left: 0; right: 0; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font-size: calc(6 * var(--u)); color: #8f86a3; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
.ps-names .on { color: #fff; }
.ps-desc {
  position: absolute; left: calc(10 * var(--u)); right: calc(10 * var(--u)); bottom: calc(6 * var(--u)); height: calc(72 * var(--u));
  background: #0e0a18cc; color: #d8d0e8; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000;
  padding: calc(6 * var(--u)) calc(8 * var(--u)); font-size: calc(5.5 * var(--u)); line-height: calc(9 * var(--u));
}
.ps-desc .bl { color: #f0c040; margin-bottom: calc(2 * var(--u)); }
.ps-desc .pro::before { content: '+ '; color: #6ae08a; }
.ps-desc .con::before { content: '- '; color: #f07a6a; }
.ps-desc .foot { position: absolute; right: calc(8 * var(--u)); bottom: calc(5 * var(--u)); color: #6a6080; }

/* name entry */
.namebox { inset: calc(60 * var(--u)) calc(40 * var(--u)); justify-content: center; gap: calc(8 * var(--u)); }
.namebox input {
  font: inherit; font-size: calc(12 * var(--u)); text-transform: uppercase; text-align: center; padding: calc(4 * var(--u));
  border: var(--u) solid var(--p-out); border-radius: 0; width: 100%; background: #fff; color: var(--p-ink); outline: none;
}
.nb-btns { text-align: center; }
.nb-btns button { font: inherit; font-size: calc(8 * var(--u)); padding: calc(4 * var(--u)) calc(14 * var(--u)); background: var(--p-out); color: #fff; border: 0; cursor: pointer; }

/* ---------------------------------------------------------------- battle */
.bhud { position: absolute; padding: calc(5 * var(--u)) calc(7 * var(--u)); font-size: calc(7 * var(--u)); line-height: calc(10 * var(--u)); }
.bhud.foe { left: calc(6 * var(--u)); top: calc(8 * var(--u)); width: calc(140 * var(--u)); }
.bhud.me { right: calc(6 * var(--u)); top: calc(104 * var(--u)); width: calc(146 * var(--u)); }
.bh-row { display: flex; justify-content: space-between; align-items: center; }
.bh-row .lv { color: #6a6080; }
.tchip { color: #fff; font-size: calc(5 * var(--u)); line-height: 1; padding: calc(2 * var(--u)) calc(3 * var(--u)); text-shadow: none; }
.anx { color: #b8402a; font-size: calc(5 * var(--u)); }
.bar { display: flex; align-items: center; gap: calc(3 * var(--u)); margin-top: calc(2 * var(--u)); }
.bar span { font-size: calc(4.5 * var(--u)); line-height: 1; color: #f0c040; background: #303040; padding: calc(1.5 * var(--u)) calc(2 * var(--u)); text-shadow: none; }
.bar.en span { color: #7ac8f8; }
.bar i { flex: 1; height: calc(5 * var(--u)); background: #303040; display: block; padding: var(--u); }
.bar b { display: block; height: 100%; background: #3ec46d; }
.bar.en b { background: #4a9ae8 !important; }
.num { text-align: right; font-size: calc(6 * var(--u)); line-height: calc(8 * var(--u)); }
.bhud .xp { height: calc(2 * var(--u)); background: #d8d8e4; margin-top: calc(2 * var(--u)); }
.bhud .xp i { display: block; height: 100%; background: #4a8ae8; }
.bhud .st { position: absolute; left: calc(6 * var(--u)); top: calc(-9 * var(--u)); display: flex; gap: calc(3 * var(--u)); }
.bhud .st em { font-style: normal; font-size: calc(5 * var(--u)); line-height: 1; color: #fff; padding: calc(2 * var(--u)) calc(3 * var(--u)); text-shadow: none; }
.bhud .st .bo { background: #c8402a; }
.bhud .st .ax { background: #8a5cd6; }
.actmenu {
  right: calc(3 * var(--u)); bottom: calc(3 * var(--u)); width: calc(140 * var(--u)); height: calc(54 * var(--u));
  display: grid; grid-template-columns: 1fr 1fr; align-content: center;
}
.actmenu .opt { padding-left: calc(16 * var(--u)); line-height: calc(18 * var(--u)); }
.actmenu .opt.sel::before { top: calc(5.5 * var(--u)); }
.skillmenu {
  position: absolute; left: calc(3 * var(--u)); right: calc(3 * var(--u)); bottom: calc(3 * var(--u)); height: calc(54 * var(--u));
  display: grid; grid-template-columns: 1fr calc(86 * var(--u)); overflow: hidden;
}
.sk-grid { display: grid; grid-template-columns: 1fr 1fr; align-content: center; padding: 0 calc(3 * var(--u)); }
.sk { position: relative; padding: 0 calc(3 * var(--u)) 0 calc(14 * var(--u)); line-height: calc(18 * var(--u)); font-size: calc(6 * var(--u)); display: flex; align-items: center; gap: calc(3 * var(--u)); cursor: pointer; white-space: nowrap; overflow: hidden; }
.sk.sel::before {
  content: ''; position: absolute; left: calc(4 * var(--u)); top: calc(5.5 * var(--u));
  border-top: calc(3.5 * var(--u)) solid transparent; border-bottom: calc(3.5 * var(--u)) solid transparent; border-left: calc(5 * var(--u)) solid var(--p-ink);
}
.sk.poor { color: #b0a8c0; }
.sk.empty { color: #c8c4d4; }
.sk-info { border-left: var(--u) solid var(--p-line); padding: calc(4 * var(--u)) calc(6 * var(--u)); font-size: calc(5.5 * var(--u)); line-height: calc(9 * var(--u)); display: flex; flex-direction: column; justify-content: center; }
.sk-info b { font-weight: 400; }

/* overworld stats strip, top right */
.hud {
  position: absolute; top: calc(4 * var(--u)); right: calc(3 * var(--u)); display: flex; align-items: center; gap: calc(5 * var(--u));
  background: var(--hud); color: #efe6d2; font-size: calc(7 * var(--u)); line-height: 1; padding: calc(4 * var(--u)) calc(6 * var(--u));
  text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; pointer-events: none !important;
}
.h-cash { color: #f0c040; }
.h-star { color: #f0c040; }
.h-bo { color: #fff; background: #c8402a; font-size: calc(5 * var(--u)); padding: calc(1.5 * var(--u)) calc(2 * var(--u)); text-shadow: none; }
.h-bars { display: flex; flex-direction: column; gap: var(--u); }
.h-bars i { display: block; width: calc(30 * var(--u)); height: calc(3 * var(--u)); background: #303040; box-shadow: 0 0 0 calc(0.5 * var(--u)) #000; }
.h-bars b { display: block; height: 100%; }
.h-bars .he b { background: #4a9ae8; }

/* weakness line in a foe's box, 2x / half tags on skills */
.weak { font-size: calc(4.5 * var(--u)); line-height: 1; color: #6a6080; margin-top: calc(2 * var(--u)); display: flex; align-items: center; gap: calc(2 * var(--u)); }
.weak em, .chart2 em { font-style: normal; color: #fff; padding: calc(1.5 * var(--u)) calc(2 * var(--u)); text-shadow: none; line-height: 1; font-size: calc(4.5 * var(--u)); }
.tg { font-style: normal; margin-left: auto; font-size: calc(5 * var(--u)); text-shadow: none; }
.chart2 { width: 100%; border-collapse: collapse; font-size: calc(5 * var(--u)); }
.chart2 th { text-align: left; color: #9890a8; font-weight: 400; padding-bottom: calc(3 * var(--u)); }
.chart2 td { padding: calc(3 * var(--u)) calc(2 * var(--u)) calc(3 * var(--u)) 0; border-bottom: var(--u) solid #e0dce8; vertical-align: top; }
.chart2 td em { display: inline-block; margin: 0 calc(2 * var(--u)) calc(2 * var(--u)) 0; }
.chart2 .eg { color: #9890a8; font-size: calc(4 * var(--u)); margin-top: calc(2 * var(--u)); text-shadow: none; }

/* crew pips: who's still standing */
.h-crew, .bhud .pips { display: flex; gap: calc(1.5 * var(--u)); }
.h-crew i, .bhud .pips i { width: calc(4 * var(--u)); height: calc(4 * var(--u)); background: #3ec46d; box-shadow: 0 0 0 calc(0.6 * var(--u)) #000; display: block; }
.h-crew i.out, .bhud .pips i.out { background: #5a5468; }
.bhud .pips { position: absolute; right: calc(6 * var(--u)); top: calc(-8 * var(--u)); }
.bhud .pips i.cur { background: #f0c040; }
.p-desc em { font-style: normal; }

/* ending card */
.endcard { position: absolute; inset: 0; text-align: center; pointer-events: auto; text-shadow: calc(var(--u)) calc(var(--u)) 0 #7a3a14; color: #fff; }
.e-big { margin-top: calc(12 * var(--u)); font-size: calc(14 * var(--u)); line-height: 1; color: #fff; text-shadow: calc(1.5 * var(--u)) calc(1.5 * var(--u)) 0 #a04a20; }

// ---- src/util.js
'use strict';
// Small helpers shared by every other file. Everything in this game is plain
// browser globals loaded in order (see build.mjs), so this file comes first.

const U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,

  // xorshift32: deterministic, so the world is identical on every load.
  rng(seed) {
    let s = (seed >>> 0) || 0x9e3779b9;
    return () => {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  },
  ri: (r, a, b) => a + Math.floor(r() * (b - a + 1)),
  pick: (r, arr) => arr[Math.floor(r() * arr.length)],
  chance: (p) => Math.random() < p,
  rand: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),

  hash(x, y, s = 0) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  },

  wait: (ms) => new Promise((r) => setTimeout(r, ms)),

  canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    return [c, x];
  },

  rgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  },
  // amt > 0 mixes toward white, amt < 0 toward black.
  shade(hex, amt) {
    const [r, g, b] = U.rgb(hex);
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    const f = (c) => Math.round(c + (t - c) * p).toString(16).padStart(2, '0');
    return '#' + f(r) + f(g) + f(b);
  },

  esc: (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])),
  money: (n) => '$' + Math.floor(n).toLocaleString('en-US'),
};

const OUTLINE = '#1e1626';

const Art = {
  cache: new Map(),
  get(key, make) {
    let c = this.cache.get(key);
    if (!c) { c = make(); this.cache.set(key, c); }
    return c;
  },
};

// ---------------------------------------------------------------- primitives
function px(x, c, X, Y, w = 1, h = 1) { x.fillStyle = c; x.fillRect(Math.round(X), Math.round(Y), Math.round(w), Math.round(h)); }
function disc(x, cx, cy, rx, ry, c) {
  x.fillStyle = c;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    for (let X = Math.floor(cx - rx); X <= Math.ceil(cx + rx); X++) {
      const dx = (X + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) x.fillRect(X, y, 1, 1);
    }
  }
}
// Darken every transparent pixel that touches an opaque one.
function outline(c, x, col = OUTLINE) {
  const w = c.width, h = c.height;
  const img = x.getImageData(0, 0, w, h), d = img.data;
  const a = (X, Y) => (X < 0 || Y < 0 || X >= w || Y >= h ? 0 : d[(Y * w + X) * 4 + 3]);
  const mark = [];
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
    if (a(X, Y) > 0) continue;
    if (a(X - 1, Y) > 128 || a(X + 1, Y) > 128 || a(X, Y - 1) > 128 || a(X, Y + 1) > 128) mark.push(X, Y);
  }
  x.fillStyle = col;
  for (let i = 0; i < mark.length; i += 2) x.fillRect(mark[i], mark[i + 1], 1, 1);
}

// ---------------------------------------------------------------- tiles
Art.tile = function (id, theme, v = 0, frame = 0) {
  const key = id + '|' + theme + '|' + v + '|' + (id === T.WATER ? frame : 0);
  return this.get(key, () => {
    const [c, x] = U.canvas(16, 16);
    if (id >= 20) drawInterior(x, id, theme, v);
    else drawOutdoor(x, id, BIO[theme] || BIO.suburb, theme, v, frame);
    return c;
  });
};

function ground(x, b, theme, v) {
  const g = b.ground;
  px(x, g[0], 0, 0, 16, 16);
  if (theme === 'city') {
    px(x, g[1], 0, 15, 16, 1); px(x, g[1], 15, 0, 1, 16);
    px(x, g[2], 0, 0, 16, 1); px(x, g[2], 0, 0, 1, 16);
    if (v % 4 === 0) px(x, g[1], 6, 7, 2, 1);
    return;
  }
  const r = U.rng(v * 977 + 13);
  for (let i = 0; i < 5; i++) {
    const X = Math.floor(r() * 15), Y = Math.floor(r() * 14);
    if (theme === 'suburb' || theme === 'forest' || theme === 'farm' || theme === 'swamp') {
      px(x, g[1], X, Y + 1, 1, 1); px(x, g[1], X + 1, Y, 1, 1); px(x, g[1], X + 2, Y + 1, 1, 1);
    } else {
      px(x, i % 2 ? g[1] : g[2], X, Y, 1, 1);
    }
  }
}

function drawOutdoor(x, id, b, theme, v, frame) {
  if (id === T.WATER) return water(x, b, frame, v);
  if (id === T.PATH || id === T.BRIDGE) {
    if (id === T.BRIDGE) {
      px(x, '#a8784a', 0, 0, 16, 16);
      for (let i = 0; i < 16; i += 4) px(x, '#7a5434', 0, i + 3, 16, 1);
      px(x, '#5a3a24', 0, 0, 1, 16); px(x, '#5a3a24', 15, 0, 1, 16);
      return;
    }
    px(x, b.path[0], 0, 0, 16, 16);
    const r = U.rng(v * 31 + 7);
    for (let i = 0; i < 4; i++) px(x, b.path[1], Math.floor(r() * 15), Math.floor(r() * 15), 2, 1);
    if (theme === 'beach') for (let i = 0; i < 16; i += 4) px(x, b.path[1], 0, i, 16, 1);
    return;
  }
  if (id === T.SAND) {
    px(x, '#f6e6b4', 0, 0, 16, 16);
    const r = U.rng(v * 17 + 3);
    for (let i = 0; i < 4; i++) px(x, '#e4d098', Math.floor(r() * 15), Math.floor(r() * 15), 1, 1);
    return;
  }
  if (id === T.CROP) {
    px(x, '#8a6a44', 0, 0, 16, 16);
    for (let i = 0; i < 16; i += 4) px(x, '#7a5a38', 0, i + 2, 16, 1);
    for (let s = 1; s < 16; s += 5) {
      px(x, '#3a8a2a', s, 1, 2, 14); px(x, '#5ab040', s - 1, 4, 1, 3); px(x, '#5ab040', s + 2, 7, 1, 3);
      px(x, '#f0d050', s + 2, 4, 2, 3);
    }
    return;
  }
  ground(x, b, theme, v);
  switch (id) {
    case T.GRASS: return tallGrass(x, b, theme);
    case T.TREE: return tree(x, b, theme, v);
    case T.FLOWER: return deco(x, theme, v);
    case T.ROCK: {
      const col = theme === 'desert' ? '#b8846a' : theme === 'snow' ? '#9aa8b8' : '#8a8a8e';
      const [rc, rx] = U.canvas(16, 16);
      disc(rx, 8, 9, 6.5, 5.5, col); disc(rx, 6, 7, 3, 2.5, U.shade(col, 0.3));
      if (theme === 'snow') px(rx, '#ffffff', 4, 4, 7, 2);
      outline(rc, rx); x.drawImage(rc, 0, 0);
      return;
    }
    case T.FENCE: {
      const w = theme === 'farm' ? '#f0e8d8' : '#b88a5a', d = U.shade(w, -0.35);
      px(x, w, 0, 5, 16, 2); px(x, w, 0, 10, 16, 2); px(x, d, 0, 7, 16, 1); px(x, d, 0, 12, 16, 1);
      px(x, w, 2, 2, 3, 13); px(x, w, 11, 2, 3, 13); px(x, d, 4, 2, 1, 13); px(x, d, 13, 2, 1, 13);
      if (theme === 'snow') { px(x, '#fff', 2, 1, 3, 2); px(x, '#fff', 11, 1, 3, 2); px(x, '#fff', 0, 4, 16, 1); }
      return;
    }
    case T.SIGN: {
      px(x, '#6a4a2a', 7, 9, 2, 7);
      px(x, OUTLINE, 1, 2, 14, 8); px(x, '#c89a5a', 2, 3, 12, 6); px(x, '#a87a3a', 2, 8, 12, 1);
      px(x, '#6a4a2a', 4, 5, 8, 1); px(x, '#6a4a2a', 4, 7, 5, 1);
      return;
    }
    case T.LAMP: {
      px(x, '#3a3f4a', 7, 4, 2, 11); px(x, '#3a3f4a', 5, 14, 6, 2);
      px(x, '#3a3f4a', 5, 1, 6, 4); px(x, '#f8e080', 6, 2, 4, 2);
      return;
    }
    case T.DECO: return solidDeco(x, theme, v);
  }
}

function water(x, b, frame, v) {
  const [a, l] = b.water;
  px(x, a, 0, 0, 16, 16);
  const o = (frame + v) % 4;
  for (let i = 0; i < 3; i++) {
    const Y = 3 + i * 5, X = (i * 6 + o * 2) % 16;
    px(x, l, X, Y, 4, 1); px(x, l, (X + 9) % 16, Y + 2, 3, 1);
  }
}

function tallGrass(x, b, theme) {
  const [m, d, l] = b.grass;
  px(x, m, 0, 0, 16, 16);
  const tufts = [[0, 1], [8, 1], [4, 9], [12, 9]];
  for (const [ox, oy] of tufts) {
    const hs = [4, 6, 5, 3];
    for (let k = 0; k < 4; k++) {
      const bx = ox + k * 2 - 1;
      if (bx < 0 || bx > 15) continue;
      px(x, d, bx, oy + 6 - hs[k], 1, hs[k]);
      px(x, theme === 'farm' ? '#fff0a0' : theme === 'snow' ? '#ffffff' : l, bx, oy + 6 - hs[k], 1, 1);
    }
    px(x, d, ox - 1, oy + 6, 8, 1);
  }
}

function tree(x, b, theme, v) {
  const kind = b.tree, [c0, c1, c2] = b.canopy;
  const [cv, cx] = [x.canvas, x];
  if (kind === 'tower') {
    const shades = ['#6a7484', '#7a6a6a', '#5a6a7a', '#8a8070'];
    const w = shades[v % 4];
    px(x, w, 0, 0, 16, 16);
    px(x, U.shade(w, 0.15), 0, 0, 16, 1);
    const r = U.rng(v * 7 + 1);
    for (let Y = 2; Y < 16; Y += 4) for (let X = 1; X < 16; X += 4) px(x, r() < 0.35 ? '#f8e08a' : '#3a4a5a', X, Y, 2, 2);
    return;
  }
  const [tc, tx] = U.canvas(16, 16);
  if (kind === 'round') {
    px(tx, b.trunk, 6, 11, 4, 5);
    disc(tx, 8, 7, 7, 6.5, c0); disc(tx, 7, 6, 5, 4.5, c1); disc(tx, 6, 4.5, 2, 1.5, U.shade(c1, 0.25));
    px(tx, c2, 3, 10, 10, 1);
    if (b.fruit) { px(tx, b.fruit, 4, 7, 2, 2); px(tx, b.fruit, 10, 5, 2, 2); px(tx, b.fruit, 8, 9, 2, 2); }
  } else if (kind === 'pine') {
    px(tx, b.trunk, 7, 13, 2, 3);
    const tiers = [[1, 5, 3], [4, 6, 5], [8, 6, 7]];
    for (const [y0, h, w] of tiers) {
      for (let i = 0; i < h; i++) {
        const hw = Math.round(1 + (w - 1) * (i / (h - 1)));
        px(tx, c0, 8 - hw, y0 + i, hw * 2, 1);
        px(tx, c1, 8 - hw, y0 + i, Math.max(1, hw - 1), 1);
      }
      if (b.snowcap) px(tx, '#ffffff', 6, y0, 4, 2);
    }
  } else if (kind === 'cactus') {
    px(tx, c0, 6, 2, 4, 14); px(tx, c1, 7, 2, 1, 13);
    px(tx, c0, 2, 6, 4, 3); px(tx, c0, 2, 3, 3, 4); px(tx, c1, 3, 3, 1, 4);
    px(tx, c0, 10, 8, 4, 3); px(tx, c0, 11, 5, 3, 4); px(tx, c1, 12, 5, 1, 4);
    px(tx, '#f8f0c0', 8, 5, 1, 1); px(tx, '#f8f0c0', 6, 10, 1, 1);
  } else if (kind === 'palm') {
    for (let i = 0; i < 11; i++) px(tx, i % 2 ? b.trunk : U.shade(b.trunk, -0.2), 7 + Math.round(Math.sin(i / 4)), 5 + i, 3, 1);
    const fr = [[-6, 2], [-4, 4], [5, 2], [4, 4], [-1, -2]];
    for (const [dx, dy] of fr) {
      const steps = 6;
      for (let s = 0; s <= steps; s++) px(tx, s > 3 ? c0 : c1, Math.round(8 + dx * s / steps), Math.round(5 + dy * s / steps), 2, 1);
    }
    disc(tx, 8, 5, 2.5, 2, c0);
    px(tx, '#7a4a2a', 6, 6, 2, 2); px(tx, '#7a4a2a', 9, 6, 2, 2);
  } else if (kind === 'dead') {
    px(tx, b.trunk, 7, 4, 3, 12); px(tx, b.trunk, 3, 5, 4, 1); px(tx, b.trunk, 3, 2, 1, 3);
    px(tx, b.trunk, 10, 7, 4, 1); px(tx, b.trunk, 13, 3, 1, 4); px(tx, b.trunk, 8, 1, 1, 3);

function deco(x, theme, v) {
  const r = U.rng(v * 101 + 9);
  if (theme === 'desert') {
    px(x, '#b8946a', 3, 9, 3, 2); px(x, '#a88458', 10, 5, 2, 2); px(x, '#c8a47a', 8, 12, 2, 1);
    return;
  }
  if (theme === 'beach') {
    px(x, '#f08a6a', 4, 6, 1, 3); px(x, '#f08a6a', 3, 7, 3, 1);
    disc(x, 11, 11, 2, 1.5, '#f4d4c4'); px(x, '#d8a898', 10, 11, 3, 1);
    return;
  }
  if (theme === 'snow') {
    disc(x, 5, 10, 3, 2, '#ffffff'); disc(x, 11, 6, 2.5, 1.5, '#ffffff'); px(x, '#c8d8e8', 3, 11, 5, 1);
    return;
  }
  if (theme === 'swamp' || theme === 'forest') {
    for (let i = 0; i < 2; i++) {
      const X = 3 + i * 7, Y = 6 + (i * 4);
      px(x, '#f0e8d8', X + 1, Y + 2, 2, 3); disc(x, X + 2, Y + 1.5, 3, 2, i ? '#c8402a' : '#d8a040'); px(x, '#ffffff', X + 1, Y, 1, 1);
    }
    return;
  }
  if (theme === 'city') {
    disc(x, 8, 8, 5, 5, '#6a6e74'); disc(x, 8, 8, 4, 4, '#7a7e84'); px(x, '#5a5e64', 5, 7, 7, 1); px(x, '#5a5e64', 5, 9, 7, 1);
    return;
  }
  const cols = theme === 'farm' ? ['#f8f8f8', '#f0d040'] : ['#e84a4a', '#f8d040', '#f8f8f8', '#c868d8'];
  for (let i = 0; i < 3; i++) {
    const X = 2 + Math.floor(r() * 10), Y = 2 + Math.floor(r() * 10), c = cols[Math.floor(r() * cols.length)];
    px(x, c, X, Y - 1, 1, 1); px(x, c, X - 1, Y, 1, 1); px(x, c, X + 1, Y, 1, 1); px(x, c, X, Y + 1, 1, 1);
    px(x, '#f8e070', X, Y, 1, 1);
  }
}

function solidDeco(x, theme, v) {
  const [tc, tx] = U.canvas(16, 16);
  switch (theme) {
    case 'suburb': case 'forest':
      if (theme === 'forest') { px(tx, '#8a6a44', 3, 8, 10, 7); disc(tx, 8, 8, 5, 2, '#c8a074'); disc(tx, 8, 8, 3, 1, '#a8805a'); break; }
      disc(tx, 8, 9, 7, 6, '#2e8a3a'); disc(tx, 6, 7, 3, 2.5, '#4aaa4a'); px(tx, '#e84a6a', 10, 6, 2, 2); px(tx, '#e84a6a', 5, 11, 2, 2); break;
    case 'desert':

    case 'beach':

      break;

// ---------------------------------------------------------------- interiors
// Interior themes follow House Keeper's rooms: a dark wall top, a papered

const THEMES = {
  house:    { floor: 'wood',    top: '#3a2a26', lip: '#5a443c', c1: '#dccaa0', c2: '#cfbb8e', trim: '#b08c58', base: '#6a4428' },
  store:    { floor: 'checker', top: '#1e2a40', lip: '#34466a', c1: '#a8cce8', c2: '#98bcdc', trim: '#e8f0f8', base: '#3a5a8a', tile: ['#ece6d6', '#7ab0d8'] },
  hospital: { floor: 'checker', top: '#3a2430', lip: '#5a3a48', c1: '#f8e0e4', c2: '#ecccd4', trim: '#f8f4f4', base: '#a84a5a', tile: ['#f4f4f4', '#d8e4ec'] },
  chapel:   { floor: 'stone',   top: '#26222e', lip: '#403a4c', c1: '#8a8296', c2: '#706a7c', trim: '#a49cb0', base: '#3e3848', brick: true },
  lab:      { floor: 'checker', top: '#1e3430', lip: '#34524a', c1: '#d8e8e0', c2: '#c4d8d0', trim: '#f4fbf8', base: '#3a6a5e', tile: ['#eef4f2', '#b8d8cc'] },
};
function themeOf(theme) {
  if (theme.startsWith('hall:')) {
    const c = theme.slice(5);
    return { floor: 'marble', top: U.shade(c, -0.72), lip: U.shade(c, -0.55), c1: U.shade(c, -0.1), c2: U.shade(c, -0.22), trim: '#d6a84a', base: U.shade(c, -0.6), hall: c };
  }
  return THEMES[theme] || THEMES.house;
}

function drawInterior(x, id, theme, v) {
  const th = themeOf(theme);
  const r = U.rng(v * 31 + 5);
  const floor = () => {
    if (th.floor === 'wood') {
      px(x, '#b5773f', 0, 0, 16, 16);
      for (let k = 0; k < 4; k++) { px(x, '#c4884e', 0, k * 4, 16, 1); px(x, '#8f5a2c', 0, k * 4 + 3, 16, 1); px(x, '#8f5a2c', Math.floor(r() * 15), k * 4, 1, 4); }
    } else if (th.floor === 'marble') {
      px(x, v % 2 ? '#e4dccb' : '#d2c6ae', 0, 0, 16, 16); px(x, '#bfb196', 0, 0, 16, 1); px(x, '#bfb196', 0, 0, 1, 16);
      px(x, v % 2 ? '#d4cab6' : '#c4b89e', Math.floor(r() * 14), Math.floor(r() * 14), 2, 1);
    } else if (th.floor === 'stone') {
      px(x, '#6e6e7c', 0, 0, 16, 16);
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
        const sx = i * 8, sy = j * 8;
        px(x, '#8e8e9c', sx, sy, 7, 7); px(x, '#a2a2b0', sx, sy, 7, 1); px(x, '#a2a2b0', sx, sy, 1, 7); px(x, '#7a7a88', sx + 1, sy + 6, 6, 1);
      }
    } else {
      const [a, b] = th.tile;
      px(x, a, 0, 0, 8, 8); px(x, a, 8, 8, 8, 8); px(x, b, 8, 0, 8, 8); px(x, b, 0, 8, 8, 8); px(x, U.shade(a, -0.1), 0, 0, 16, 1);
    }
  };
  if (id === T.WALL || id === T.WWALL || id === T.BANNER) {
    if (v === 0) {           // seen from above: the top of the wall
      px(x, th.top, 0, 0, 16, 16); px(x, th.lip, 0, 6, 4, 1); px(x, th.lip, 8, 6, 4, 1); px(x, th.lip, 0, 14, 16, 2);
      return;
    }
    if (th.brick) {
      px(x, th.c2, 0, 0, 16, 16);
      for (let rw = 0; rw < 4; rw++) { const o = (rw % 2) * 4; for (let i = -4; i < 16; i += 8) { const bx = Math.max(0, i + o), bw = Math.min(16, i + o + 7) - bx; if (bw > 0) px(x, th.c1, bx, rw * 4, bw, 3); } }
      px(x, th.base, 0, 14, 16, 2);
    } else {
      px(x, th.c1, 0, 0, 16, 16); for (let i = 0; i < 16; i += 4) px(x, th.c2, i, 0, 2, 16);
      px(x, th.trim, 0, 0, 16, 2); px(x, th.base, 0, 12, 16, 4); px(x, th.trim, 0, 12, 16, 1);
    }
    if (id === T.WWALL) {
      px(x, '#5a3a22', 2, 2, 12, 11); px(x, '#8ac8f0', 3, 3, 10, 9); px(x, '#a8daf8', 3, 3, 10, 3);
      px(x, '#5a3a22', 7, 3, 2, 9); px(x, '#5a3a22', 3, 7, 10, 1); px(x, '#e8f8ff', 4, 4, 1, 2);
    }
    if (id === T.BANNER) {
      const c = th.hall || '#a82838';
      px(x, c, 4, 1, 8, 11); px(x, '#d8b048', 4, 1, 8, 1); px(x, c, 5, 12, 2, 2); px(x, c, 9, 12, 2, 2); px(x, '#d8b048', 7, 4, 2, 4);
    }
    return;
  }
  floor();
  const [tc, tx] = U.canvas(16, 16);
  let ol = true;
  switch (id) {
    case T.RUG: ol = false; px(tx, '#b84a4a', 0, 0, 16, 16); px(tx, '#d8a040', 1, 1, 14, 1); px(tx, '#d8a040', 1, 14, 14, 1); px(tx, '#c85a5a', 3, 3, 10, 10); break;
    case T.MAT: ol = false; if (th.hall) { px(tx, th.hall, 2, 0, 12, 16); px(tx, U.shade(th.hall, 0.3), 4, 0, 1, 16); px(tx, U.shade(th.hall, 0.3), 11, 0, 1, 16); } break;
    case T.EXIT: ol = false; px(tx, '#8a3a2a', 2, 1, 12, 7); px(tx, '#a8503a', 3, 2, 10, 5); px(tx, 'rgba(0,0,0,.55)', 0, 10, 16, 6); break;
    case T.COUNTER: px(tx, '#a8784a', 0, 2, 16, 14); px(tx, '#d8a874', 0, 2, 16, 4); px(tx, '#8a5a34', 0, 10, 16, 1); break;
    case T.SHELF:
      px(tx, '#8a6a4a', 1, 0, 14, 16);
      for (let s = 0; s < 3; s++) {
        px(tx, '#6a4a2a', 1, 4 + s * 5, 14, 1);
        for (let k = 0; k < 4; k++) px(tx, ['#e84a4a', '#4a8ae8', '#f0c040', '#4ab84a', '#e88ad8'][(v + s * 2 + k) % 5], 2 + k * 3, 1 + s * 5, 2, 3);
      }
      break;

      px(tx, '#6a4a2a', 1, 0, 14, 16);
      for (let s = 0; s < 3; s++) for (let k = 0; k < 6; k++) px(tx, ['#a83a3a', '#3a6aa8', '#3a8a4a', '#c8a03a'][(k + s) % 4], 2 + k * 2, 1 + s * 5, 2, 4);
      break;
    case T.BED: px(tx, '#8a5a3a', 1, 0, 14, 16); px(tx, '#f4f4f4', 2, 2, 12, 6); px(tx, '#4a7ac8', 2, 9, 12, 7); break;
    case T.BEDB: px(tx, '#8a5a3a', 1, 0, 14, 14); px(tx, '#4a7ac8', 2, 0, 12, 12); px(tx, '#3a6ab8', 2, 4, 12, 1); break;
    case T.HBED: px(tx, '#c8ccd4', 1, 1, 14, 15); px(tx, '#f8f8f8', 2, 2, 12, 5); px(tx, '#7ab8e8', 2, 8, 12, 7); break;
    case T.TABLE: px(tx, '#9a6a3a', 0, 3, 16, 10); px(tx, '#ba8a54', 0, 3, 16, 3); px(tx, '#7a4a2a', 1, 13, 2, 3); px(tx, '#7a4a2a', 13, 13, 2, 3); break;
    case T.PLANT: px(tx, '#c86a3a', 4, 10, 8, 6); disc(tx, 8, 6, 6, 5, '#3a9a3a'); disc(tx, 6, 4, 2, 2, '#5ac05a'); break;
    case T.TV: px(tx, '#5a3a24', 1, 9, 14, 7); px(tx, '#2a2a2e', 2, 1, 12, 9); px(tx, '#6ac8e8', 3, 2, 10, 7); px(tx, '#a8e8f8', 3, 2, 4, 2); break;
    case T.PEW: px(tx, '#8a5a34', 0, 2, 16, 4); px(tx, '#a8744a', 0, 7, 16, 5); px(tx, '#6a4024', 1, 12, 2, 4); px(tx, '#6a4024', 13, 12, 2, 4); break;
    case T.ALTAR: px(tx, '#8a5a34', 0, 4, 16, 12); px(tx, '#f8f4e8', 0, 4, 16, 6); px(tx, '#d8b850', 7, 4, 2, 10); px(tx, '#f8e080', 3, 0, 1, 4); px(tx, '#f8e080', 12, 0, 1, 4); break;
    case T.MACHINE: px(tx, '#a8b0bc', 1, 1, 14, 15); px(tx, '#3a4a5a', 3, 3, 10, 6); px(tx, '#6ae8a8', 4, 4, 3, 1); px(tx, '#6ae8a8', 4, 6, 6, 1); px(tx, '#e84a4a', 4, 11, 2, 2); px(tx, '#4ae84a', 8, 11, 2, 2); break;
    case T.STATUE: px(tx, '#8a8a94', 3, 9, 10, 7); px(tx, '#a8a8b4', 3, 9, 10, 2); disc(tx, 8, 5, 3.5, 3.5, '#e8c040'); px(tx, '#e8c040', 7, 7, 2, 3); px(tx, '#f8e8a0', 6, 3, 2, 2); break;
    case T.CHAIR: px(tx, '#5a8ac8', 2, 2, 12, 6); px(tx, '#4a7ab8', 2, 8, 12, 5); px(tx, '#3a3a3a', 3, 13, 2, 3); px(tx, '#3a3a3a', 11, 13, 2, 3); break;
    default: ol = false;
  }
  if (ol) outline(tc, tx);
  x.drawImage(tc, 0, 0);
}

// ---------------------------------------------------------------- characters
// 20x24 sprites built from outlined rectangles in layers (the House Keeper
// method): each layer gets a 1px outline, then detail pixels go on top.
const EYE = '#22182e';

function charStyle(pal, look) {
  const cf = {
    skin: pal.s, skinS: U.shade(pal.s, -0.18), hair: pal.h, hairS: U.shade(pal.h, -0.28), hairL: U.shade(pal.h, 0.35),
    shirt: pal.c, shirtS: U.shade(pal.c, -0.3), pants: pal.p, pantsS: U.shade(pal.p, -0.3), shoe: pal.b,
    style: pal.style || 'short',
  };
  if (pal.pack) { cf.pack = pal.pack; cf.packS = U.shade(pal.pack, -0.3); }
  if (look === 'cap') { cf.cap = '#c8402a'; cf.capS = '#8a2418'; }
  if (look === 'headband') { cf.band = '#e8302a'; cf.bandS = '#a01c18'; }
  if (look === 'glasses') cf.glasses = true;
  if (look === 'collar') cf.collar = true;
  if (pal.coat) cf.coat = pal.coat;
  if (pal.tie) cf.tie = pal.tie;
  return cf;
}

function buildChar(cf, dir, fr) {
  const [cv, C] = U.canvas(20, 24);
  const layers = [[]]; let cur = layers[0];
  const layer = () => { cur = []; layers.push(cur); };
  const R = (x, y, w, h, c) => cur.push([x + 2, y + 4, w, h, c]);
  const det = [];
  const D = (x, y, w, h, c) => det.push([x + 2, y + 4, w, h, c]);
  const lift = fr === 1 ? 1 : fr === 2 ? 2 : 0;

  if (dir === 'down' || dir === 'up') {
    const front = dir === 'down';
    if (cf.style === 'long' && front) { R(2, 4, 2, 10, cf.hair); R(12, 4, 2, 10, cf.hair); }
    layer();
    R(5, 16, 2, lift === 1 ? 2 : 3, cf.pants); R(9, 16, 2, lift === 2 ? 2 : 3, cf.pants);
    D(5, lift === 1 ? 17 : 18, 2, 1, cf.shoe); D(9, lift === 2 ? 17 : 18, 2, 1, cf.shoe);
    layer();
    const body = cf.coat || cf.shirt;
    R(4, 11, 8, 5, body);
    R(2, 11, 2, lift === 2 ? 3 : 4, body); R(12, 11, 2, lift === 1 ? 3 : 4, body);
    D(2, lift === 2 ? 13 : 14, 2, 1, cf.skin); D(12, lift === 1 ? 13 : 14, 2, 1, cf.skin);
    D(4, 15, 8, 1, cf.coat ? U.shade(cf.coat, -0.2) : cf.shirtS);
    if (front && cf.coat) { D(6, 11, 4, 4, cf.shirt); D(7, 11, 2, 4, cf.shirtS); }
    if (front && cf.tie) D(7, 11, 2, 4, cf.tie);
    if (front && cf.pack) { D(4, 11, 1, 4, cf.packS); D(11, 11, 1, 4, cf.packS); }
    if (front && cf.collar) D(7, 11, 2, 1, '#ffffff');
    layer();
    if (front) {
      R(3, 2, 10, 9, cf.skin);
      if (cf.style === 'short' || cf.style === 'bun') {
        R(3, 1, 10, 3, cf.hair); R(3, 4, 1, 3, cf.hair); R(12, 4, 1, 3, cf.hair); D(5, 1, 3, 1, cf.hairL);
        if (cf.style === 'bun') R(6, -1, 4, 3, cf.hair);
      } else if (cf.style === 'long') {
        R(3, 1, 10, 4, cf.hair); R(3, 4, 1, 5, cf.hair); R(12, 4, 1, 5, cf.hair);
        D(4, 5, 2, 1, cf.hair); D(7, 5, 1, 1, cf.hair); D(10, 5, 2, 1, cf.hair); D(5, 1, 4, 1, cf.hairL);
        D(4, 9, 1, 1, '#f0a0a0'); D(11, 9, 1, 1, '#f0a0a0');
      } else {
        R(2, 5, 2, 3, cf.hair); R(12, 5, 2, 3, cf.hair);
      }
      if (cf.cap) { R(3, 1, 10, 3, cf.cap); R(2, 3, 12, 2, cf.cap); D(2, 4, 12, 1, cf.capS); D(5, 1, 3, 1, U.shade(cf.cap, 0.3)); }
      if (cf.band) { R(3, 3, 10, 2, cf.band); R(13, 4, 2, 2, cf.band); D(3, 4, 10, 1, cf.bandS); }
      D(5, 7, 1, 2, EYE); D(10, 7, 1, 2, EYE);
      if (cf.glasses) { D(4, 6, 3, 3, '#30304a'); D(9, 6, 3, 3, '#30304a'); D(5, 7, 1, 1, '#cfe8ff'); D(10, 7, 1, 1, '#cfe8ff'); D(7, 7, 2, 1, '#30304a'); }
      D(7, 9, 2, 1, '#c0605a');
    } else {
      if (cf.style === 'long') {
        R(3, 1, 10, 4, cf.hair); R(2, 4, 12, 10, cf.hair); D(4, 2, 4, 1, cf.hairL); D(7, 4, 2, 9, cf.hairS);
      } else if (cf.style === 'bald') {
        R(3, 2, 10, 9, cf.skin); R(2, 5, 12, 3, cf.hair); D(6, 3, 3, 1, '#ffffff');
      } else {
        R(3, 2, 10, 9, cf.skin); R(3, 1, 10, 8, cf.hair); R(2, 6, 1, 2, cf.skin); R(13, 6, 1, 2, cf.skin);
        D(5, 2, 4, 1, cf.hairL);
        if (cf.style === 'bun') R(6, -1, 4, 3, cf.hair);
      }
      if (cf.cap) { R(3, 1, 10, 4, cf.cap); D(3, 4, 10, 1, cf.capS); }
      if (cf.band) { R(3, 3, 10, 2, cf.band); D(3, 4, 10, 1, cf.bandS); D(7, 5, 2, 2, cf.band); }
    }
    layer();
    if (!front && cf.pack) { R(4, 10, 8, 6, cf.pack); D(4, 10, 8, 2, cf.packS); D(7, 12, 2, 1, '#e0c060'); D(5, 14, 6, 1, cf.packS); }
  } else { // facing right
    if (cf.style === 'long') R(3, 4, 4, 10, cf.hair);
    if (cf.pack) { R(2, 11, 4, 5, cf.pack); D(2, 11, 4, 1, cf.packS); D(3, 13, 2, 1, '#e0c060'); }
    layer();
    if (lift) {
      R(4, 16, 2, 3, lift === 1 ? cf.pantsS : cf.pants); R(9, 16, 2, 3, lift === 1 ? cf.pants : cf.pantsS);
      D(4, 18, 2, 1, cf.shoe); D(9, 18, 3, 1, cf.shoe);
    } else { R(6, 16, 3, 3, cf.pants); D(6, 18, 4, 1, cf.shoe); }
    layer();
    const body = cf.coat || cf.shirt;
    R(5, 11, 6, 5, body); D(5, 15, 6, 1, cf.coat ? U.shade(cf.coat, -0.2) : cf.shirtS);
    if (cf.tie) D(10, 11, 1, 3, cf.tie);
    const ax = lift === 1 ? 9 : lift === 2 ? 5 : 7;
    layer();
    R(ax, 12, 2, 3, body); D(ax, 14, 2, 1, cf.skin);
    layer();
    R(4, 2, 9, 9, cf.skin);
    if (cf.style === 'short' || cf.style === 'bun') {
      R(4, 1, 8, 3, cf.hair); R(4, 4, 3, 5, cf.hair); D(7, 6, 1, 2, cf.skinS); D(5, 1, 3, 1, cf.hairL);
      if (cf.style === 'bun') R(3, 0, 3, 3, cf.hair);
    } else if (cf.style === 'long') {
      R(4, 1, 8, 4, cf.hair); R(3, 4, 4, 6, cf.hair); D(10, 4, 2, 1, cf.hair); D(5, 1, 4, 1, cf.hairL); D(11, 9, 1, 1, '#f0a0a0');
    } else {
      R(4, 5, 2, 4, cf.hair); D(6, 3, 3, 1, '#ffffff');
    }
    if (cf.cap) { R(4, 1, 8, 3, cf.cap); R(11, 3, 4, 1, cf.cap); D(4, 3, 8, 1, cf.capS); }
    if (cf.band) { R(4, 3, 9, 2, cf.band); R(1, 4, 3, 2, cf.band); D(4, 4, 9, 1, cf.bandS); }
    D(10, 7, 1, 2, EYE);
    if (cf.glasses) { D(9, 6, 3, 3, '#30304a'); D(10, 7, 1, 1, '#cfe8ff'); }
    D(11, 9, 1, 1, '#c0605a');
  }
  for (const L of layers) {
    C.fillStyle = OUTLINE; for (const [x, y, w, h] of L) C.fillRect(x - 1, y - 1, w + 2, h + 2);
    for (const [x, y, w, h, c] of L) { C.fillStyle = c; C.fillRect(x, y, w, h); }
  }
  for (const [x, y, w, h, c] of det) { C.fillStyle = c; C.fillRect(x, y, w, h); }
  return cv;
}

// Returns {down:[stand,stepA,stepB], up, left, right}; 20x24 canvases drawn

Art.character = function (pal, look) {

function drawIcon(x, kind) {

    case 'wrench':
      for (let i = 0; i < 8; i++) px(x, i < 2 ? '#7a8490' : '#9aa4b0', 2 + i, 12 - i, 3, 3);

    case 'bolt':
      px(x, '#f0c030', 8, 1, 4, 2); px(x, '#f0c030', 6, 3, 4, 3); px(x, '#f0c030', 4, 6, 8, 2); px(x, '#f0c030', 7, 8, 3, 3); px(x, '#f0c030', 5, 11, 3, 3); break;

      for (let i = 0; i < 6; i++) px(x, kind === 'heart' ? '#e84a3a' : '#f06aa8', 2 + i, 7 + i, 12 - i * 2, 1);
      break;
    case 'doc':
      px(x, '#f8f8f8', 3, 1, 10, 14); px(x, '#5a8ac8', 3, 1, 10, 3); for (let i = 6; i < 14; i += 2) px(x, '#a8b0bc', 5, i, 6, 1); px(x, '#4ab84a', 9, 10, 3, 3); break;
    case 'coin':
      disc(x, 8, 8, 6, 6, '#e8c040'); disc(x, 8, 8, 4, 4, '#f8d860'); px(x, '#b8902a', 7, 5, 2, 6); break;
    case 'cap':
      px(x, '#2a2a3a', 1, 5, 14, 3); px(x, '#2a2a3a', 4, 8, 8, 4); px(x, '#e8c040', 12, 7, 1, 5); px(x, '#e8c040', 11, 11, 3, 2); break;
    case 'case':
      px(x, '#7a4a2a', 2, 5, 12, 9); px(x, '#5a3a1a', 6, 3, 4, 2); px(x, '#e8c040', 7, 8, 2, 2); px(x, '#5a3a1a', 2, 8, 12, 1); break;

// ---------------------------------------------------------------- buildings
// kind: house | hospital | store | chapel | hall | lab | apartment
Art.building = function (bd, theme) {
  const key = 'bld|' + bd.kind + '|' + theme + '|' + bd.w + 'x' + bd.h + '|' + (bd.roof || '') + '|' + (bd.locked ? 1 : 0) + '|' + (bd.color || '') + '|' + bd.doorX;
  return this.get(key, () => {
    const W = bd.w * 16, H = bd.h * 16;
    const [c, x] = U.canvas(W, H);
    const b = BIO[theme];
    let wall = b.walls[0], roof = bd.roof || b.roofs[0];
    if (bd.kind === 'hospital') { wall = '#f8f4f0'; roof = '#d8403a'; }
    if (bd.kind === 'store') { wall = '#f0f4f8'; roof = '#3a78d0'; }
    if (bd.kind === 'chapel') { wall = theme === 'desert' ? '#e8c890' : '#f4f0e4'; roof = '#7a5a8a'; }
    if (bd.kind === 'lab') { wall = '#f4f8f4'; roof = '#5a8a7a'; }
    if (bd.kind === 'hall') { wall = U.shade(bd.color, 0.55); roof = bd.color; }
    if (bd.kind === 'house' && theme === 'farm') wall = b.walls[0];
    const flat = b.flat && bd.kind !== 'chapel';
    const wallD = U.shade(wall, -0.18), roofD = U.shade(roof, -0.3), roofL = U.shade(roof, 0.2);

    const roofH = bd.kind === 'chapel' ? Math.floor(H * 0.5) : Math.floor(H * (flat ? 0.3 : 0.5));
    const wallTop = roofH;
    // walls
    px(x, wall, 1, wallTop, W - 2, H - wallTop);
    if (b.logs && bd.kind === 'house') for (let y = wallTop + 3; y < H; y += 4) px(x, wallD, 1, y, W - 2, 1);
    if (theme === 'city' && bd.kind === 'house') for (let y = wallTop + 2; y < H; y += 3) for (let X = 1 + ((y / 3) % 2) * 3; X < W - 2; X += 6) px(x, wallD, X, y, 4, 1);
    px(x, wallD, 1, H - 3, W - 2, 3);
    // roof
    if (flat) {
      px(x, roof, 0, 2, W, roofH - 2); px(x, roofL, 0, 2, W, 2); px(x, roofD, 0, roofH - 2, W, 2);
    } else {
      px(x, roof, 0, 4, W, roofH - 4);
      for (let y = 6; y < roofH - 2; y += 4) px(x, roofD, 0, y, W, 1);
      for (let y = 4; y < roofH - 2; y += 4) for (let X = (y % 8 ? 0 : 4); X < W; X += 8) px(x, roofD, X, y, 1, 3);
      px(x, roofL, 0, 4, W, 2); px(x, roofD, 0, roofH - 2, W, 2);
      if (b.snowcap) { px(x, '#ffffff', 0, 2, W, 4); for (let X = 2; X < W; X += 5) px(x, '#ffffff', X, 6, 2, 2); }
    }
    // windows
    const doorPx = bd.doorX * 16;
    const winY = wallTop + Math.max(3, Math.floor((H - wallTop) * 0.25));
    for (let X = 6; X < W - 12; X += 16) {
      if (Math.abs(X + 5 - (doorPx + 8)) < 14) continue;
      px(x, OUTLINE, X, winY, 11, 9); px(x, '#a8d8f8', X + 1, winY + 1, 9, 7); px(x, '#e0f4ff', X + 1, winY + 1, 3, 3);
      px(x, OUTLINE, X + 5, winY + 1, 1, 7);
      if (theme === 'snow' || bd.kind === 'house') px(x, U.shade(roof, -0.1), X - 1, winY + 8, 13, 2);
    }
    // door
    const dTop = H - 15;
    px(x, OUTLINE, doorPx + 2, dTop - 1, 12, 16);
    if (bd.kind === 'hospital' || bd.kind === 'store' || bd.kind === 'lab') {
      px(x, '#9ad0f0', doorPx + 3, dTop, 10, 15); px(x, '#c8e8fa', doorPx + 3, dTop, 4, 15); px(x, OUTLINE, doorPx + 8, dTop, 1, 15);
    } else {
      px(x, '#8a5434', doorPx + 3, dTop, 10, 15); px(x, '#6a3a24', doorPx + 3, dTop + 7, 10, 1); px(x, '#e8c040', doorPx + 10, dTop + 8, 2, 2);
    }
    if (bd.locked) {
      px(x, '#c8a06a', doorPx + 1, dTop + 3, 14, 3); px(x, '#c8a06a', doorPx + 1, dTop + 9, 14, 3);
      px(x, '#8a6a3a', doorPx + 1, dTop + 5, 14, 1); px(x, '#8a6a3a', doorPx + 1, dTop + 11, 14, 1);
    }
    // signs & features
    const signY = wallTop - (flat ? 2 : 6);
    if (bd.kind === 'hospital') {
      const sx = doorPx + 1;
      px(x, OUTLINE, sx, signY - 1, 14, 12); px(x, '#ffffff', sx + 1, signY, 12, 10);
      px(x, '#e8302a', sx + 5, signY + 1, 4, 8); px(x, '#e8302a', sx + 3, signY + 3, 8, 4);
    } else if (bd.kind === 'store') {
      const sx = doorPx - 4;
      px(x, OUTLINE, sx, signY - 1, 24, 11); px(x, '#f8d040', sx + 1, signY, 22, 9);
      // "$" glyph
      const g = ['.ooo.', 'o.o..', '.ooo.', '..o.o', '.ooo.'];
      g.forEach((r, yy) => { for (let i = 0; i < 5; i++) if (r[i] === 'o') px(x, '#2a7a3a', sx + 9 + i, signY + 2 + yy, 1, 1); });
      px(x, '#2a7a3a', sx + 11, signY + 1, 1, 7);
    } else if (bd.kind === 'chapel') {
      const sx = Math.floor(W / 2) - 6;
      px(x, wall, sx, 0, 12, roofH); px(x, OUTLINE, sx - 1, 0, 1, roofH); px(x, OUTLINE, sx + 12, 0, 1, roofH);
      px(x, roofD, sx - 2, 0, 16, 3);
      px(x, '#3a2a2a', sx + 3, 6, 6, 8); disc(x, sx + 6, 11, 2.5, 2.5, '#e8c040'); px(x, '#a8802a', sx + 5, 13, 2, 1);
      // round window over door
      disc(x, doorPx + 8, wallTop + 4, 3, 3, '#e8a0c8'); disc(x, doorPx + 8, wallTop + 4, 1.5, 1.5, '#a8d8f8');
    } else if (bd.kind === 'hall') {
      const sx = doorPx - 4;
      px(x, OUTLINE, sx, signY - 4, 24, 14); px(x, '#f8f0d8', sx + 1, signY - 3, 22, 12);
      const star = ['...o...', '..ooo..', 'ooooooo', '.ooooo.', '.oo.oo.', 'o.....o'];
      star.forEach((r, yy) => { for (let i = 0; i < 7; i++) if (r[i] === 'o') px(x, bd.locked ? '#9a9a9a' : '#e8b030', sx + 8 + i, signY - 1 + yy, 1, 1); });
      // pillars
      px(x, '#f4f4f4', doorPx - 10, wallTop + 2, 4, H - wallTop - 4); px(x, '#f4f4f4', doorPx + 22, wallTop + 2, 4, H - wallTop - 4);
      px(x, '#c8c8c8', doorPx - 7, wallTop + 2, 1, H - wallTop - 4); px(x, '#c8c8c8', doorPx + 25, wallTop + 2, 1, H - wallTop - 4);
    } else if (bd.kind === 'lab') {
      const sx = doorPx + 18;
      px(x, OUTLINE, sx, signY - 1, 13, 12); px(x, '#ffffff', sx + 1, signY, 11, 10);
      px(x, '#4aa88a', sx + 5, signY + 1, 3, 3); px(x, '#4aa88a', sx + 3, signY + 4, 7, 5); px(x, '#8ae8c8', sx + 4, signY + 6, 5, 2);
    }
    // outline the silhouette
    outline(c, x);
    return c;
  });
};

    if (d.shades) { px(x, '#1a1a1a', face[0] - 10, face[1] - 6, 20, 4); px(x, '#3a3a4a', face[0] - 9, face[1] - 5, 3, 1); }
    if (d.magnifier) {
      disc(x, 38, 34, 7, 7, '#5a5a62'); disc(x, 38, 34, 5, 5, '#c8e8f8'); disc(x, 36, 32, 2, 2, '#ffffff');
      for (let i = 0; i < 6; i++) px(x, '#7a5a3a', 42 + i * 0.6, 39 + i, 3, 2);
    }
    return c;
  });
};

function drawFace(x, cx, cy, ink) {
  // furious little brows, eyes, grimace
  px(x, ink, cx - 9, cy - 6, 3, 1); px(x, ink, cx - 7, cy - 5, 3, 1); px(x, ink, cx - 5, cy - 4, 2, 1);
  px(x, ink, cx + 6, cy - 6, 3, 1); px(x, ink, cx + 4, cy - 5, 3, 1); px(x, ink, cx + 3, cy - 4, 2, 1);
  px(x, ink, cx - 7, cy - 3, 3, 4); px(x, ink, cx + 4, cy - 3, 3, 4);
  px(x, '#ffffff', cx - 7, cy - 3, 1, 1); px(x, '#ffffff', cx + 4, cy - 3, 1, 1);
  px(x, ink, cx - 4, cy + 4, 8, 3); px(x, '#ffffff', cx - 3, cy + 5, 6, 1);
  px(x, ink, cx - 1, cy + 4, 1, 3); px(x, ink, cx + 1, cy + 4, 1, 3);
}

// Big portrait used in battles and cutscenes: a character scaled 4x.
Art.portrait = function (pal, look, dir = 'down') {
  return this.get('portrait|' + JSON.stringify(pal) + '|' + look + '|' + dir, () => {
    const src = Art.character(pal, look)[dir][0];
    const [c, x] = U.canvas(60, 72);
    x.drawImage(src, 0, 0, 60, 72);
    return c;
  });
};

'use strict';
// Tiny chiptune engine: square/triangle oscillators, a handful of sound
// effects and four short looping tracks. Nothing to download.

const NOTE = (() => {
  const names = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  return (n) => {
    if (n === '-' || n === '.') return 0;
    const m = /^([A-G]#?)(\d)$/.exec(n);
    return 440 * Math.pow(2, (names[m[1]] + (+m[2] + 1) * 12 - 69) / 12);
  };
})();

// Each track: tempo (bpm), melody & bass as "note:beats" tokens.
const TRACKS = {
  town: { bpm: 116,
    mel: 'E4:1 G4:1 C5:1 G4:1 A4:1 G4:1 E4:1 D4:1 E4:1 G4:1 C5:1 D5:1 E5:2 D5:1 C5:1 A4:1 C5:1 F5:1 E5:1 D5:1 C5:1 A4:1 G4:1 E4:1 G4:1 D5:1 C5:1 C5:3 -:1',
    bass: 'C3:2 G2:2 A2:2 E2:2 C3:2 G2:2 C3:2 G2:2 F2:2 C3:2 F2:2 G2:2 C3:2 G2:2 C3:4' },
  route: { bpm: 132,
    mel: 'G4:1 B4:1 D5:1 B4:1 C5:1 E5:1 D5:2 B4:1 G4:1 A4:1 B4:1 A4:2 -:2 G4:1 B4:1 D5:1 G5:1 F#5:1 E5:1 D5:2 C5:1 B4:1 A4:1 F#4:1 G4:2 -:2',
    bass: 'G2:2 D3:2 C3:2 D3:2 G2:2 D3:2 D2:2 D3:2 G2:2 D3:2 C3:2 D3:2 C3:2 D3:2 G2:4' },
  inside: { bpm: 96,
    mel: 'C5:1 E5:1 G5:1 E5:1 F5:1 D5:1 B4:2 C5:1 E5:1 A5:1 G5:1 F5:2 E5:2 D5:1 F5:1 A5:1 F5:1 E5:1 C5:1 A4:2 B4:1 D5:1 G5:1 F5:1 E5:3 -:1',
    bass: 'C3:4 G2:4 A2:4 F2:4 D3:4 A2:4 G2:4 C3:4' },
  battle: { bpm: 168,
    mel: 'A4:1 A4:1 C5:1 A4:1 E5:1 A4:1 D5:1 C5:1 B4:1 B4:1 D5:1 B4:1 E5:2 G#4:2 A4:1 A4:1 C5:1 E5:1 A5:1 G5:1 F5:1 E5:1 D5:1 C5:1 B4:1 G#4:1 A4:2 -:2',
    bass: 'A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 E2:1 E3:1 E2:1 E3:1 E2:1 E3:1 E2:1 E3:1 F2:1 F3:1 F2:1 F3:1 D2:1 D3:1 D2:1 D3:1 E2:1 E3:1 E2:1 E3:1 A2:1 A3:1 A2:1 A3:1' },
  leader: { bpm: 176,
    mel: 'D5:1 D5:1 F5:1 D5:1 A5:1 G5:1 F5:1 E5:1 F5:1 F5:1 A5:1 F5:1 C6:2 A5:2 A#5:1 A5:1 G5:1 F5:1 G5:1 F5:1 E5:1 C#5:1 D5:2 A4:2 D5:2 -:2',
    bass: 'D2:1 D3:1 D2:1 D3:1 D2:1 D3:1 D2:1 D3:1 F2:1 F3:1 F2:1 F3:1 F2:1 F3:1 F2:1 F3:1 A#1:1 A#2:1 A#1:1 A#2:1 A2:1 A3:1 A2:1 A3:1 D2:1 D3:1 D2:1 D3:1 D2:1 D3:1 D2:1 D3:1' },
  victory: { bpm: 150, once: true,
    mel: 'C5:1 C5:1 C5:1 C5:3 G#4:3 A#4:3 C5:2 A#4:1 C5:6',
    bass: 'C3:3 C3:3 G#2:3 A#2:3 C3:6' },
};

const Audio2 = {
  ctx: null, master: null, muted: false, track: null, want: null, timer: null,

  unlock() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.want && !this.track) this.music(this.want);
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.5;
    try { localStorage.setItem('aq-muted', m ? '1' : '0'); } catch (e) { /* storage unavailable */ }
  },

  tone(freq, dur, type = 'square', vol = 0.08, when = 0, slide = 0) {
    if (!this.ctx || !freq) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.12, when = 0) {
    if (!this.ctx) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = buf; g.gain.value = vol;
    s.connect(g); g.connect(this.master);
    s.start(this.ctx.currentTime + when);
  },

  sfx(name) {
    if (!this.ctx) return;
    switch (name) {
      case 'blip': this.tone(880, 0.03, 'square', 0.02); break;
      case 'move': this.tone(660, 0.04, 'square', 0.04); break;
      case 'select': this.tone(990, 0.06, 'square', 0.05); break;
      case 'back': this.tone(440, 0.06, 'square', 0.05); break;
      case 'bump': this.tone(110, 0.08, 'square', 0.06); break;
      case 'door': this.tone(300, 0.08, 'triangle', 0.1); this.tone(200, 0.1, 'triangle', 0.1, 0.07); break;
      case 'coin': this.tone(988, 0.07, 'square', 0.06); this.tone(1319, 0.18, 'square', 0.06, 0.07); break;
      case 'hit': this.noise(0.12, 0.18); this.tone(180, 0.12, 'square', 0.08, 0, -100); break;
      case 'super': this.noise(0.2, 0.22); this.tone(260, 0.2, 'sawtooth', 0.08, 0, -200); break;
      case 'weak': this.tone(220, 0.1, 'triangle', 0.08, 0, -60); break;
      case 'heal': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.08, i * 0.08)); break;
      case 'buff': [440, 554, 659].forEach((f, i) => this.tone(f, 0.08, 'square', 0.05, i * 0.05)); break;
      case 'debuff': [659, 554, 440].forEach((f, i) => this.tone(f, 0.08, 'square', 0.05, i * 0.05)); break;
      case 'faint': this.tone(400, 0.5, 'square', 0.07, 0, -340); break;
      case 'encounter': for (let i = 0; i < 6; i++) this.tone(i % 2 ? 784 : 988, 0.07, 'square', 0.06, i * 0.07); break;
      case 'levelup': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.1, 'square', 0.06, i * 0.08)); break;
      case 'badge': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.18, 'square', 0.07, i * 0.12)); break;
      case 'save': [784, 988, 1175].forEach((f, i) => this.tone(f, 0.1, 'triangle', 0.08, i * 0.09)); break;
      case 'miss': this.tone(300, 0.15, 'triangle', 0.06, 0, 200); break;
    }
  },

  music(name) {
    this.want = name;
    if (!this.ctx) return;
    if (this.track && this.track.name === name) return;
    this.stopMusic();
    const tr = TRACKS[name];
    if (!tr) return;
    const parse = (s) => s.split(/\s+/).filter(Boolean).map((tok) => { const [n, b] = tok.split(':'); return [NOTE(n), +b]; });
    const beat = 60 / tr.bpm / 2;
    const voices = [
      { notes: parse(tr.mel), i: 0, t: this.ctx.currentTime + 0.1, type: 'square', vol: 0.045 },
      { notes: parse(tr.bass), i: 0, t: this.ctx.currentTime + 0.1, type: 'triangle', vol: 0.09 },
    ];
    this.track = { name, voices };
    const tick = () => {
      if (!this.ctx || this.track === null || this.track.name !== name) return;
      const horizon = this.ctx.currentTime + 0.4;
      for (const v of voices) {
        while (v.t < horizon) {
          if (v.i >= v.notes.length) {
            if (tr.once) { v.t = Infinity; break; }
            v.i = 0;
          }
          const [f, b] = v.notes[v.i++];
          const dur = b * beat;
          if (f) this.tone(f, dur * 0.9, v.type, v.vol, v.t - this.ctx.currentTime);
          v.t += dur;
        }
      }
    };
    tick();
    this.timer = setInterval(tick, 120);
  },
  stopMusic() {
    clearInterval(this.timer);
    this.timer = null;
    this.track = null;
  },
};
try { Audio2.muted = localStorage.getItem('aq-muted') === '1'; } catch (e) { /* storage unavailable */ }

// ---- src/ui.js
'use strict';
// Input (keyboard + on-screen pad) and the DOM overlay widgets: dialog box,
// choice menus, scrolling lists and full panels. Widgets stack; only the top
// one receives input, and every widget is driven by a Promise so game
// scripts read top to bottom with await.

const Input = {
  held: { up: false, down: false, left: false, right: false, A: false, B: false, START: false },
  queue: [],
  pressed: new Set(),
  dirStack: [],
  rep: { dir: null, t: 0 },
  touchRun: false,

  KEYS: {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
    z: 'A', Z: 'A', j: 'A', J: 'A', ' ': 'A', Enter: 'A',
    x: 'B', X: 'B', k: 'B', K: 'B', Backspace: 'B', Shift: 'B',
    Escape: 'ESC', m: 'MUSIC', M: 'MUSIC', Tab: 'START',
  },

  init() {
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const b = this.KEYS[e.key];
      if (!b) return;
      e.preventDefault();
      Audio2.unlock();
      if (e.repeat) return;
      this.down(b);
    });
    window.addEventListener('keyup', (e) => {
      const b = this.KEYS[e.key];
      if (b) this.up(b);
    });
    window.addEventListener('blur', () => { for (const k in this.held) this.held[k] = false; this.dirStack = []; });

    // on-screen pad
    const pad = document.getElementById('dpad');
    if (pad) {
      let cur = null;
      const setDir = (d) => {
        if (d === cur) return;
        if (cur) this.up(cur);
        cur = d;
        if (d) this.down(d);
      };
      const fromEvent = (e) => {
        const r = pad.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        if (Math.hypot(dx, dy) < r.width * 0.12) return null;
        return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      };
      pad.addEventListener('pointerdown', (e) => { e.preventDefault(); Audio2.unlock(); pad.setPointerCapture(e.pointerId); setDir(fromEvent(e)); });
      pad.addEventListener('pointermove', (e) => { if (cur !== null || e.buttons) setDir(fromEvent(e)); });
      const end = () => setDir(null);
      pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end); pad.addEventListener('lostpointercapture', end);
    }
    document.querySelectorAll('[data-btn]').forEach((el) => {
      const b = el.dataset.btn;
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); Audio2.unlock(); el.setPointerCapture(e.pointerId); el.classList.add('on'); this.down(b); });
      const end = () => { el.classList.remove('on'); this.up(b); };
      el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
    });
  },

  down(b) {
    if (b === 'ESC') { this.queue.push('ESC'); return; }
    if (b === 'MUSIC') { Audio2.setMuted(!Audio2.muted); UI.toast(Audio2.muted ? 'MUSIC OFF' : 'MUSIC ON'); return; }
    if (this.held[b]) return;
    this.held[b] = true;
    this.queue.push(b);
    if (['up', 'down', 'left', 'right'].includes(b)) {
      this.dirStack = this.dirStack.filter((d) => d !== b);
      this.dirStack.push(b);
      this.rep = { dir: b, t: 0 };
    }
  },
  up(b) {
    if (!(b in this.held)) return;
    this.held[b] = false;
    this.dirStack = this.dirStack.filter((d) => d !== b);
  },
  dir() { return this.dirStack.length ? this.dirStack[this.dirStack.length - 1] : null; },

  // Called once per frame: turns queued presses into this frame's edges, and
  // auto-repeats a held direction for menus.
  frame(dt) {
    this.pressed = new Set(this.queue);
    this.queue = [];
    const d = this.dir();
    if (d && this.rep.dir === d) {
      this.rep.t += dt;
      if (this.rep.t > 0.32) { this.pressed.add('rep:' + d); this.rep.t -= 0.09; }
    }
  },
  hit(b) { return this.pressed.has(b); },
  // Menu navigation: first press or auto-repeat.
  nav(d) { return this.pressed.has(d) || this.pressed.has('rep:' + d); },
};

const UI = {
  root: null,
  stack: [],
  dlg: null,

  init() {
    this.root = document.getElementById('ui');
    this.dlg = this.el('div', 'dlg hidden', '<div class="dlg-name"></div><div class="dlg-text"></div><div class="dlg-more">▼</div>');
    this.root.appendChild(this.dlg);
    this.toastEl = this.el('div', 'toast hidden');
    this.root.appendChild(this.toastEl);
    this.hud = this.el('div', 'hud hidden');
    this.root.appendChild(this.hud);
  },
  el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  },
  get busy() { return this.stack.length > 0; },
  push(w) { this.stack.push(w); },
  pop(w) { const i = this.stack.lastIndexOf(w); if (i >= 0) this.stack.splice(i, 1); },
  top() { return this.stack[this.stack.length - 1]; },

  update(dt) {
    for (const w of this.stack) if (w.update) w.update(dt);
    const t = this.top();
    if (!t) return;
    for (const b of ['A', 'B', 'START', 'ESC', 'up', 'down', 'left', 'right']) {
      const hit = ['up', 'down', 'left', 'right'].includes(b) ? Input.nav(b) : Input.hit(b);
      if (hit) {
        const bb = b === 'ESC' ? 'B' : b;
        if (t.onInput(bb) === 'stop') break;
        if (this.top() !== t) break;
      }
    }
  },

  // -------------------------------------------------------------- dialog
  // say(text | [texts], { name, auto: ms, fast })
  async say(text, o = {}) {
    if (Array.isArray(text)) { for (const t of text) await this.say(t, o); return; }
    text = Game.fmt(text);
    // House Keeper boxes: 34 characters a line, 3 lines a box
    const pages = this.paginate(text);
    if (pages.length > 1) {
      for (let i = 0; i < pages.length; i++) await this.say(pages[i], { ...o, raw: true, noWait: i === pages.length - 1 ? o.noWait : false, auto: i === pages.length - 1 ? o.auto : 0 });
      return;
    }
    text = pages[0];
    const box = this.dlg;
    box.classList.remove('hidden');
    box.classList.toggle('battle', !!Battle.active);
    box.querySelector('.dlg-name').textContent = o.name || '';
    box.querySelector('.dlg-name').style.display = o.name ? '' : 'none';
    const tx = box.querySelector('.dlg-text'), more = box.querySelector('.dlg-more');
    tx.textContent = '';
    more.style.visibility = 'hidden';
    return new Promise((resolve) => {
      const speed = o.fast ? 140 : 70;
      let shown = 0, done = false, wait = 0, blip = 0;
      const w = {
        update: (dt) => {
          if (!done) {
            shown = Math.min(text.length, shown + speed * dt);
            tx.textContent = text.slice(0, Math.floor(shown));
            blip += dt;
            if (blip > 0.07) { blip = 0; Audio2.sfx('blip'); }
            if (shown >= text.length) { done = true; more.style.visibility = o.auto || o.noWait ? 'hidden' : 'visible'; }
          } else if (o.noWait) {
            finish();
          } else if (o.auto) {
            wait += dt * 1000;
            if (wait >= o.auto) finish();
          }
        },
        onInput: (b) => {
          if (b !== 'A' && b !== 'B') return;
          if (!done) { shown = text.length; tx.textContent = text; done = true; more.style.visibility = o.auto ? 'hidden' : 'visible'; return 'stop'; }
          Audio2.sfx('select');
          finish();
          return 'stop';
        },
      };
      const finish = () => { UI.pop(w); more.style.visibility = 'hidden'; resolve(); };
      this.push(w);
    });
  },
  closeDialog() { this.dlg.classList.add('hidden'); },
  paginate(text, width = 34, rows = 3) {
    const lines = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const w of para.split(' ')) {
        if (!line) line = w;
        else if ((line + ' ' + w).length <= width) line += ' ' + w;
        else { lines.push(line); line = w; }
        while (line.length > width) { lines.push(line.slice(0, width)); line = line.slice(width); }
      }
      lines.push(line);
    }
    const pages = [];
    for (let i = 0; i < lines.length; i += rows) pages.push(lines.slice(i, i + rows).join('\n'));
    return pages.length ? pages : [''];
  },

  // -------------------------------------------------------------- choice
  choose(options, o = {}) {
    const box = this.el('div', 'menu choice' + (o.cls ? ' ' + o.cls : ''));
    if (o.style) Object.assign(box.style, o.style);
    let i = o.start || 0;
    const render = () => {
      box.innerHTML = options.map((op, k) => `<div class="opt${k === i ? ' sel' : ''}">${U.esc(op)}</div>`).join('');
    };
    render();
    this.root.appendChild(box);
    return new Promise((resolve) => {
      const w = {
        onInput: (b) => {
          if (b === 'up') { i = (i + options.length - 1) % options.length; Audio2.sfx('move'); render(); }
          else if (b === 'down') { i = (i + 1) % options.length; Audio2.sfx('move'); render(); }
          else if (b === 'A') { Audio2.sfx('select'); done(i); }
          else if (b === 'B' && o.cancel !== false) { Audio2.sfx('back'); done(-1); }
          return 'stop';
        },
      };
      const done = (v) => { UI.pop(w); box.remove(); resolve(v); };
      box.addEventListener('pointerdown', (e) => {
        const opts = [...box.children];
        const k = opts.indexOf(e.target.closest('.opt'));
        if (k >= 0 && UI.top() === w) { e.preventDefault(); i = k; render(); Audio2.sfx('select'); done(k); }
      });
      this.push(w);
    });
  },
  async confirm(q, o = {}) {
    await this.say(q, { ...o, noWait: true });
    const r = await this.choose(['Yes', 'No'], { cls: 'yesno' });
    return r === 0;
  },

  // -------------------------------------------------------------- lists
  // items: [{ label, right, desc, disabled, icon }]; returns index or -1.
  // o.title, o.footer(), o.onAct(i) => keep open when it returns 'keep'
  list(items, o = {}) {
    const box = this.el('div', 'panel list' + (o.cls ? ' ' + o.cls : ''));
    let i = Math.min(o.start || 0, Math.max(0, items.length - 1));
    const render = () => {
      const its = typeof items === 'function' ? items() : items;
      i = Math.min(i, Math.max(0, its.length - 1));
      const head = o.title ? `<div class="p-title">${o.title}${o.headRight ? `<span>${o.headRight()}</span>` : ''}</div>` : '';
      const rows = its.length
        ? its.map((it, k) => `<div class="row${k === i ? ' sel' : ''}${it.disabled ? ' dis' : ''}">${it.icon || ''}<span class="l">${U.esc(it.label)}</span><span class="r">${it.right ?? ''}</span></div>`).join('')
        : `<div class="row dis"><span class="l">${o.empty || 'Nothing here.'}</span></div>`;
      const desc = its[i] && its[i].desc ? its[i].desc : (o.hint || '');
      box.innerHTML = `${head}<div class="rows">${rows}</div><div class="p-desc">${desc}</div><div class="p-foot">${o.footer ? o.footer() : 'A: select · B: back'}</div>`;
      const sel = box.querySelector('.row.sel');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
      return its;
    };
    let its = render();
    this.root.appendChild(box);
    return new Promise((resolve) => {
      let busy = false;
      const act = async (k) => {
        if (busy) return;
        if (!its[k] || its[k].disabled) { Audio2.sfx('bump'); return; }
        Audio2.sfx('select');
        if (o.onAct) {
          busy = true;
          const r = await o.onAct(k, its[k]);
          busy = false;
          if (r === 'keep') { its = render(); return; }
        }
        done(k);
      };
      const w = {
        onInput: (b) => {
          if (busy) return 'stop';
          if (b === 'up' && its.length) { i = (i + its.length - 1) % its.length; Audio2.sfx('move'); its = render(); }
          else if (b === 'down' && its.length) { i = (i + 1) % its.length; Audio2.sfx('move'); its = render(); }
          else if (b === 'A') act(i);
          else if (b === 'B' && !o.noCancel) { Audio2.sfx('back'); done(-1); }
          return 'stop';
        },
      };
      const done = (v) => { UI.pop(w); box.remove(); resolve(v); };
      box.addEventListener('pointerdown', (e) => {
        const row = e.target.closest('.row');
        if (!row || UI.top() !== w) return;
        const k = [...box.querySelectorAll('.row')].indexOf(row);
        if (k < 0) return;
        e.preventDefault();
        if (k === i) act(k); else { i = k; its = render(); Audio2.sfx('move'); }
      });
      this.push(w);
    });
  },

  // A full-screen info panel closed with A or B.
  panel(html, o = {}) {
    const box = this.el('div', 'panel info' + (o.cls ? ' ' + o.cls : ''), html + '<div class="p-foot">A / B: close</div>');
    this.root.appendChild(box);
    return new Promise((resolve) => {
      const w = { onInput: (b) => { if (b === 'A' || b === 'B' || b === 'START') { Audio2.sfx('back'); UI.pop(w); box.remove(); resolve(); } return 'stop'; } };
      box.addEventListener('pointerdown', (e) => { if (UI.top() === w) { e.preventDefault(); w.onInput('A'); } });
      this.push(w);
    });
  },

  // Always-on stats strip in the overworld (House Keeper's top-right HUD).
  updateHUD() {
    const p = Game.p, h = this.hud;
    const show = Game.mode === 'world' && p && p.path && !this.root.querySelector('.panel');
    h.classList.toggle('hidden', !show);
    if (!show) return;
    const st = Game.stats();
    const key = [p.money, p.level, p.sanity, p.energy, p.badges.length, p.status, st.maxSanity, p.crew.map((r) => r.sanity > 0).join()].join('|');
    if (key === this._hudKey) return;
    this._hudKey = key;
    const pct = (a, b) => Math.round(U.clamp(a / b, 0, 1) * 100);
    const sr = p.sanity / st.maxSanity;
    h.innerHTML = `<span class="h-cash">${U.money(p.money)}</span><span>LV${p.level}</span>
      <span class="h-bars"><i class="hs"><b style="width:${pct(p.sanity, st.maxSanity)}%;background:${sr > 0.5 ? '#3ec46d' : sr > 0.2 ? '#f0c030' : '#e8483a'}"></b></i><i class="he"><b style="width:${pct(p.energy, st.maxEnergy)}%"></b></i></span>
      <span class="h-star">★${p.badges.length}</span>${p.crew.length ? `<span class="h-crew">${Crew.members().map((r) => `<i class="${r.sanity <= 0 ? 'out' : ''}"></i>`).join('')}</span>` : ''}${p.status === 'burnout' ? '<span class="h-bo">BURNT OUT</span>' : ''}`;
  },

  toast(text, ms = 1600) {
    const t = this.toastEl;
    t.textContent = text;
    t.classList.remove('hidden');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.add('hidden'), ms);
  },

  banner(text) {
    const b = this.el('div', 'banner', U.esc(text));
    this.root.appendChild(b);
    setTimeout(() => b.classList.add('out'), 1800);
    setTimeout(() => b.remove(), 2400);
  },

  // Name entry uses a real text field so phone keyboards work.
  askName(def) {
    const box = this.el('div', 'panel namebox', `<div class="p-title">What's your name?</div>
      <input id="nameIn" maxlength="10" autocomplete="off" spellcheck="false" value="${U.esc(def)}">
      <div class="nb-btns"><button id="nameOk">OK</button></div>`);
    this.root.appendChild(box);
    const inp = box.querySelector('input');
    setTimeout(() => { inp.focus(); inp.select(); }, 50);
    return new Promise((resolve) => {
      const w = { onInput: () => 'stop' };
      const done = () => {
        const v = inp.value.trim().replace(/[^\w .'-]/g, '').slice(0, 10) || def;
        UI.pop(w); box.remove(); resolve(v.toUpperCase());
      };
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done(); } e.stopPropagation(); });
      box.querySelector('#nameOk').addEventListener('click', done);
      this.push(w);
    });
  },
};

// ---- src/world.js
'use strict';
// World generation. The overworld is built deterministically from data.js:
// eight towns on a 4x2 grid joined by routes in a loop, plus small interior
// maps for every enterable building.

const TW = 30, TH = 24, RH = 26, RV = 18, MARGIN = 4;
const WORLD_W = MARGIN * 2 + 4 * TW + 3 * RH;
const WORLD_H = MARGIN * 2 + 2 * TH + RV;

class GMap {
  constructor(id, w, h, theme = null) {
    this.id = id; this.w = w; this.h = h; this.theme = theme;
    this.t = new Uint8Array(w * h);
    this.bio = new Uint8Array(w * h);
    this.region = new Int8Array(w * h).fill(-1);
    this.npcs = [];
    this.buildings = [];
    this.doors = new Map();   // idx -> { to, x, y } or { locked: msg }
    this.signs = new Map();   // idx -> text
    this.acts = new Map();    // idx -> async fn (interactable tiles)
    this.props = new Map();   // idx -> prop kind drawn on top of a tile
    this.items = new Map();   // idx -> { amt } dollar bills
    this.exit = null;         // interiors: { map, x, y }
  }
  idx(x, y) { return y * this.w + x; }
  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  get(x, y) { return this.in(x, y) ? this.t[y * this.w + x] : T.VOID; }
  set(x, y, v) { if (this.in(x, y)) this.t[y * this.w + x] = v; }
  themeAt(x, y) { return this.theme || BIOME_IDS[this.bio[this.idx(x, y)]]; }
  regionAt(x, y) { return this.in(x, y) ? this.region[this.idx(x, y)] : -1; }
  solid(x, y) { return SOLID.has(this.get(x, y)); }
  npcAt(x, y) {
    return this.npcs.find((n) => !n.hidden && ((n.x === x && n.y === y) || (n.moving && n.tx === x && n.ty === y)));
  }
}

const World = {
  maps: {},
  regions: [],   // [{ name, kind:'town'|'route', town?, route?, biome }]
  townRect: [],
  routeInfo: [],
  gates: [],

  townOrigin(t) {
    const town = TOWNS[t];
    return [MARGIN + town.col * (TW + RH), MARGIN + town.row * (TH + RV)];
  },

  build() {
    const m = new GMap('world', WORLD_W, WORLD_H);
    this.maps.world = m;
    m.t.fill(T.TREE);

    // regions: towns 0-7, routes 8-15
    TOWNS.forEach((t, i) => this.regions.push({ name: t.name, kind: 'town', town: i, biome: t.biome }));
    ROUTES.forEach((r, i) => this.regions.push({ name: 'Route ' + (i + 1), kind: 'route', route: i }));

    // biome by nearest town, with a little jitter so borders are ragged
    const centres = TOWNS.map((t, i) => { const [x, y] = this.townOrigin(i); return [x + TW / 2, y + TH / 2]; });
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      let best = 0, bd = 1e9;
      centres.forEach(([cx, cy], i) => {
        const d = Math.hypot(x - cx, (y - cy) * 1.4) + (U.hash(x >> 1, y >> 1, i) % 4);
        if (d < bd) { bd = d; best = i; }
      });
      m.bio[m.idx(x, y)] = BIOME_IDS.indexOf(TOWNS[best].biome);
      m.region[m.idx(x, y)] = best;
    }

    // which sides of each town open onto a route
    this.exits = TOWNS.map(() => ({}));
    ROUTES.forEach((r, i) => {
      const A = TOWNS[r.a], B = TOWNS[r.b];
      if (A.row === B.row) {
        const [l, rr] = A.col < B.col ? [r.a, r.b] : [r.b, r.a];
        this.exits[l].E = i; this.exits[rr].W = i;
      } else {
        const [top, bot] = A.row < B.row ? [r.a, r.b] : [r.b, r.a];
        this.exits[top].S = i; this.exits[bot].N = i;
      }
    });

    ROUTES.forEach((r, i) => this.carveRoute(m, i));
    TOWNS.forEach((t, i) => this.carveTown(m, i));
    this.placeGates(m);
    this.seedBills(m);
  },

  // ------------------------------------------------------------ routes
  carveRoute(m, ri) {
    const r = ROUTES[ri], A = TOWNS[r.a], B = TOWNS[r.b];
    const horiz = A.row === B.row;
    let x0, y0, len, span, entry, startTown;
    if (horiz) {
      const left = A.col < B.col ? r.a : r.b;
      const [tx, ty] = this.townOrigin(left);
      x0 = tx + TW; y0 = ty; len = RH; span = TH; entry = 10;
      startTown = r.a === left ? 'lo' : 'hi';
    } else {
      const top = A.row < B.row ? r.a : r.b;
      const [tx, ty] = this.townOrigin(top);
      x0 = tx; y0 = ty + TH; len = RV; span = TW; entry = 14;
