<!-- Sent when someone taps "Forgot password?". {{ .Token }} is the 6-digit code. -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #111111; background: #ffffff;">
  <h1 style="font-size: 24px; margin: 0 0 16px;">Reset your password</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 16px;">Enter this code in the LooBook app, then choose a new password:</p>
  <p style="font-family: 'Courier New', monospace; font-size: 34px; font-weight: bold; letter-spacing: 8px; margin: 0 0 16px; padding: 14px 18px; border: 2px solid #111111; border-radius: 10px; display: inline-block;">{{ .Token }}</p>
  <p style="font-size: 14px; line-height: 1.5; color: #4a4a48; margin: 0 0 16px;">The code works for 1 hour.</p>
  <p style="font-size: 13px; line-height: 1.5; color: #8c8c88; margin: 0;">If you didn't ask to reset your password, ignore this email. Your password won't change.</p>
</div>
