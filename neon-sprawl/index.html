  };
  if (view === 'map') {
    const count = S.sectors.length + (showGhost() ? 1 : 0);
    for (let sec = 0; sec < count; sec++) {
      const [I0, J0] = lotIJ(sec, 0);
      let h = 0;
      if (S.sectors[sec]) for (const t of S.sectors[sec].lots) h = Math.max(h, topZ(t));
      include(I0, J0, h); include(I0 + N - 1, J0, h); include(I0, J0 + N - 1, h); include(I0 + N - 1, J0 + N - 1, h);
    }
  } else {
    const s = cur();
    for (let k = 0; k < N * N; k++) {
      if (!s.lots[k]) continue;
      const i = k % N, j = Math.floor(k / N);
      const [I, J] = lotIJ(S.cur, k);
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
        if (i + di >= 0 && j + dj >= 0 && i + di < N && j + dj < N) include(I + di, J + dj, 0);
      }
      include(I, J, topZ(s.lots[k]) + 0.1);
    }
  }
  const avH = Math.max(80, H - HUD_TOP - hudBottom());
  let s = Math.min(W * 0.88 / (maxX - minX), avH * 0.9 / (maxY - minY));
  s = Math.min(s, W * 0.36, 360);
  return { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s };
}

function poly(g, pts) {
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let n = 1; n < pts.length; n++) g.lineTo(pts[n][0], pts[n][1]);
  g.closePath();
  g.fill();
}

// A box standing on a diamond footprint centred at (x, y), from height z0 to z1 (pixels).
function box(g, x, y, hw, hh, z0, z1, skin) {
  g.fillStyle = skin.l;
  poly(g, [[x - hw, y - z0], [x, y + hh - z0], [x, y + hh - z1], [x - hw, y - z1]]);
  g.fillStyle = skin.r;
  poly(g, [[x, y + hh - z0], [x + hw, y - z0], [x + hw, y - z1], [x, y + hh - z1]]);
  g.fillStyle = skin.t;
  poly(g, [[x - hw, y - z1], [x, y + hh - z1], [x + hw, y - z1], [x, y - hh - z1]]);
  g.strokeStyle = skin.e;
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(x - hw, y - z1); g.lineTo(x, y - hh - z1); g.lineTo(x + hw, y - z1); g.lineTo(x, y + hh - z1); g.closePath();
  g.moveTo(x, y + hh - z1); g.lineTo(x, y + hh - z0);
  g.stroke();
}

// Map a point on a box face (u across 0..1, v up 0..1) to sprite coordinates.
function faceTransform(g, side, x, y, hw, hh, z0, z1) {
  const h = z1 - z0;
  if (side === 'L') g.transform(hw, hh, 0, -h, x - hw, y - z0);
  else g.transform(hw, -hh, 0, -h, x, y + hh - z0);
}
function facePoint(side, x, y, hw, hh, z0, z1, u, v) {
  const h = z1 - z0;
  return side === 'L'
    ? [x - hw + hw * u, y - z0 + hh * u - h * v]
    : [x + hw * u, y + hh - z0 - hh * u - h * v];
}

function windows(g, s, tier, x, y, hw, hh, z0, z1, R, dom, alt) {
  const floors = Math.max(1, Math.round((z1 - z0) / (s * 0.075)));
  const cols = clamp(Math.round((hw * 2 / s) * 8), 2, 7);
  const glass = tier >= 5;
  const litP = 0.28 + tier * 0.05;
  const ww = glass ? 0.78 : 0.56, wh = glass ? 0.42 : 0.5;
  for (const side of ['L', 'R']) {
    g.save();
    faceTransform(g, side, x, y, hw, hh, z0, z1);
    g.globalAlpha = side === 'L' ? 0.72 : 1;
    for (let r = 0; r < floors; r++) {
      for (let c = 0; c < cols; c++) {
        if (R() < litP) {
          const pick = R();
          g.fillStyle = pick < 0.6 ? dom : pick < 0.82 ? alt : pick < 0.92 ? WARM : '#e9e4ff';
        } else {
          g.fillStyle = glass ? '#1b2346' : '#241c44';
        }
        g.fillRect((c + (1 - ww) / 2) / cols, (r + 0.18) / floors, ww / cols, wh / floors);
      }
    }
    g.restore();
  }
}

function glowRect(g, x, y, w, h, color, blur) {
  g.save();
  g.shadowColor = color;
  g.shadowBlur = blur;
  g.fillStyle = color;
  g.fillRect(x, y, w, h);
  g.restore();
}

// The rooftop sign that tells each crew building type apart at a glance.
function emblem(g, line, x, y, s) {
  const c = LINES[line].color, u = Math.max(0.8, s * 0.022);
  g.save();
  g.shadowColor = c; g.shadowBlur = 8; g.fillStyle = c; g.strokeStyle = c;
  g.lineWidth = Math.max(1, u * 0.8);
  if (line === 'kiddie') {
    // pixel invader on a board
    g.fillStyle = '#0a0814';
    g.fillRect(x - 3.6 * u, y - 6.4 * u, 7.2 * u, 5.4 * u);
    g.fillStyle = c;
    const P = ['0100010', '0011100', '0111110', '1101011', '1111111', '0100010'];
    P.forEach((row, r) => [...row].forEach((b, q) => { if (b === '1') g.fillRect(x - 3.5 * u + q * u, y - 6.2 * u + r * 0.85 * u, u * 0.9, u * 0.75); }));
    g.fillRect(x - 3 * u, y - u, 0.6 * u, u); g.fillRect(x + 2.4 * u, y - u, 0.6 * u, u);
  } else if (line === 'fixer') {
    // cocktail glass
    g.beginPath(); g.moveTo(x - 3 * u, y - 7 * u); g.lineTo(x + 3 * u, y - 7 * u); g.lineTo(x, y - 3.5 * u); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(x, y - 3.5 * u); g.lineTo(x, y - 0.8 * u); g.moveTo(x - 1.8 * u, y - 0.6 * u); g.lineTo(x + 1.8 * u, y - 0.6 * u); g.stroke();
    g.beginPath(); g.arc(x + 2.2 * u, y - 7.6 * u, 0.9 * u, 0, Math.PI * 2); g.stroke();
  } else if (line === 'runner') {
    // uplink dish
    g.beginPath(); g.ellipse(x, y - 5 * u, 3.2 * u, 1.6 * u, -0.55, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(x, y - 5 * u); g.lineTo(x + 1.6 * u, y - 7.5 * u); g.moveTo(x, y - 4 * u); g.lineTo(x, y); g.stroke();
    g.fillRect(x + 1.2 * u, y - 8 * u, u, u);
  } else if (line === 'broker') {
    // glowing data cube
    const r = 2.6 * u;
    g.beginPath();
    g.moveTo(x, y - r * 2.6); g.lineTo(x + r, y - r * 2.1); g.lineTo(x + r, y - r * 0.9); g.lineTo(x, y - r * 0.4);
    g.lineTo(x - r, y - r * 0.9); g.lineTo(x - r, y - r * 2.1); g.closePath();
    g.moveTo(x, y - r * 1.6); g.lineTo(x, y - r * 0.4); g.moveTo(x, y - r * 1.6); g.lineTo(x - r, y - r * 2.1); g.moveTo(x, y - r * 1.6); g.lineTo(x + r, y - r * 2.1);
    g.stroke();
  } else if (line === 'ai') {
    // cooling stacks with green status strips
    for (const dx of [-2.6, 0, 2.6]) {
      g.fillStyle = '#1a2b2a'; g.fillRect(x + dx * u - u, y - 5.5 * u, 2 * u, 5.5 * u);
      g.fillStyle = c; g.fillRect(x + dx * u - u, y - 5.5 * u, 2 * u, 0.6 * u); g.fillRect(x + dx * u - 0.3 * u, y - 4 * u, 0.6 * u, 2.6 * u);
    }
  } else if (line === 'exec') {
    // corporate logo disc
    g.beginPath(); g.ellipse(x, y - 5 * u, 3 * u, 3 * u, 0, 0, Math.PI * 2); g.globalAlpha = 0.9; g.fill();
    g.globalAlpha = 1; g.fillStyle = '#0a0814'; g.shadowBlur = 0;
    g.beginPath(); g.moveTo(x - 1.6 * u, y - 4 * u); g.lineTo(x, y - 6.8 * u); g.lineTo(x + 1.6 * u, y - 4 * u); g.closePath(); g.fill();
    g.fillStyle = c; g.fillRect(x - 0.3 * u, y - 2 * u, 0.6 * u, 2 * u);
  } else if (line === 'ghost') {
    // torii gate
    g.fillRect(x - 2.6 * u, y - 5.5 * u, 0.8 * u, 5.5 * u);
    g.fillRect(x + 1.8 * u, y - 5.5 * u, 0.8 * u, 5.5 * u);
    g.fillRect(x - 3.8 * u, y - 6.6 * u, 7.6 * u, 0.9 * u);
    g.fillRect(x - 3 * u, y - 4.8 * u, 6 * u, 0.6 * u);
  }
  g.restore();
}

function makeSprite(tier, line, seed, s) {
  const T = SHAPES[tier];
  const R = rng(seed * 7919 + tier * 104729);
  const crewLine = line && line !== 'hab' && tier >= 2;
  const maxW = T.sections[0][0];
  const hwMax = s * 0.5 * maxW, hhMax = s * 0.25 * maxW;
  const pad = Math.ceil(s * 0.2) + 6;
  const w = Math.ceil(2 * hwMax + pad * 2);
  const h = Math.ceil((topZ(tier) + 0.25) * s + 2 * hhMax + pad * 2);
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * DPR);
  c.height = Math.ceil(h * DPR);
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  const x = w / 2, y = h - hhMax - pad;
  const dom = lineColor(crewLine ? line : null, seed);
  const alt = crewLine ? PAL[seed % 3] === dom ? PAL[(seed + 1) % 3] : PAL[seed % 3]
                       : PAL[(seed % 3 + 1 + ((seed >> 3) & 1)) % 3];
  const glass = tier >= 5;
  const skin = glass
    ? { l: '#0d1228', r: '#141d3c', t: '#222e58', e: 'rgba(62, 242, 255, 0.35)' }
    : { l: '#17122b', r: '#221a3d', t: '#2f2654', e: 'rgba(255, 43, 214, 0.3)' };
  if (crewLine) skin.e = dom + '66';

  let zPrev = 0;
  T.sections.forEach(([sw, zt], si) => {
    const hw = s * 0.5 * sw, hh = s * 0.25 * sw, z0 = zPrev * s, z1 = zt * s;
    box(g, x, y, hw, hh, z0, z1, skin);
    if (tier >= 3) windows(g, s, tier, x, y, hw, hh, z0, z1, R, dom, alt);
    // terraces of greenery on an arcology's setbacks
    if (tier === 8 && si < T.sections.length - 1) {
      const inner = T.sections[si + 1][0] / sw;
      for (let n = 0; n < 40; n++) {
        const a = R() * 2 - 1, b = (R() * 2 - 1) * (1 - Math.abs(a));
        if (Math.abs(a) + Math.abs(b) < inner + 0.06 || Math.abs(a) + Math.abs(b) > 0.92) continue;
        const px = x + a * hw, py = y - z1 + b * hh;
        g.fillStyle = R() < 0.5 ? '#2fe39a' : '#169a6a';
        g.beginPath(); g.arc(px, py, Math.max(1, s * 0.012), 0, Math.PI * 2); g.fill();
      }
    }
    // neon band along each setback edge
    if (si < T.sections.length - 1 && tier >= 6) {
      g.save();
      g.strokeStyle = dom; g.shadowColor = dom; g.shadowBlur = 8; g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(x - hw, y - z1); g.lineTo(x, y + hh - z1); g.lineTo(x + hw, y - z1);
      g.stroke();
      g.restore();
    }
    // glowing front edge on bigger buildings
    if (tier >= 4) {
      g.save();
      g.strokeStyle = dom; g.globalAlpha = 0.85; g.shadowColor = dom; g.shadowBlur = 6; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(x, y + hh - z0); g.lineTo(x, y + hh - z1); g.stroke();
      g.restore();
    }
    zPrev = zt;
  });

  const [sw0, zt0] = T.sections[0];
  const hw0 = s * 0.5 * sw0, hh0 = s * 0.25 * sw0, z1 = zt0 * s;

  if (tier === 1) {
    // door, one window, a rooftop sign
    g.save(); faceTransform(g, 'R', x, y, hw0, hh0, 0, z1);
    g.fillStyle = '#07060d'; g.fillRect(0.55, 0, 0.24, 0.62);
    g.restore();
    g.save(); faceTransform(g, 'L', x, y, hw0, hh0, 0, z1);
    g.fillStyle = WARM; g.fillRect(0.3, 0.35, 0.32, 0.32);
    g.restore();
    g.strokeStyle = '#5a5180'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x - s * 0.05, y - z1); g.lineTo(x - s * 0.05, y - z1 - s * 0.08);
    g.moveTo(x + s * 0.05, y - z1); g.lineTo(x + s * 0.05, y - z1 - s * 0.08); g.stroke();
    glowRect(g, x - s * 0.08, y - z1 - s * 0.13, s * 0.16, s * 0.06, '#ff2bd6', 10);
  }
  if (tier === 2 && !crewLine) {
    // ramen stall: shopfront, striped awning, lanterns and a vertical sign
    g.save(); faceTransform(g, 'R', x, y, hw0, hh0, 0, z1);
    g.fillStyle = WARM; g.fillRect(0.08, 0.06, 0.84, 0.44);
    for (let n = 0; n < 8; n++) {
      g.fillStyle = n % 2 ? '#ffd9f5' : '#ff2bd6';
      g.fillRect(n / 8, 0.52, 1 / 8, 0.16);
    }
    g.restore();
    g.save(); faceTransform(g, 'L', x, y, hw0, hh0, 0, z1);
    g.fillStyle = '#ffb35c'; g.globalAlpha = 0.7; g.fillRect(0.2, 0.3, 0.3, 0.35);
    g.restore();
    for (const u of [0.2, 0.5, 0.8]) {
      const [px, py] = facePoint('R', x, y, hw0, hh0, 0, z1, u, 0.46);
      g.save(); g.fillStyle = '#ff3b4f'; g.shadowColor = '#ff3b4f'; g.shadowBlur = 8;
      g.beginPath(); g.arc(px, py, Math.max(1.5, s * 0.016), 0, Math.PI * 2); g.fill(); g.restore();
    }
    g.save(); faceTransform(g, 'L', x, y, hw0, hh0, 0, z1);
    g.shadowColor = '#3ef2ff'; g.shadowBlur = 10; g.fillStyle = '#3ef2ff';
    g.fillRect(0.78, 0.35, 0.14, 1.1);
    g.restore();
  }
  if (tier === 2 && crewLine) {
    // crew shopfront: a lit window and a neon strip in the building type's colour
    g.save(); faceTransform(g, 'R', x, y, hw0, hh0, 0, z1);
    g.fillStyle = dom; g.globalAlpha = 0.75; g.fillRect(0.1, 0.08, 0.8, 0.42);
    g.globalAlpha = 1; g.fillStyle = '#07060d'; g.fillRect(0.42, 0.08, 0.16, 0.42);
    g.shadowColor = dom; g.shadowBlur = 8; g.fillStyle = dom; g.fillRect(0.05, 0.6, 0.9, 0.08);
    g.restore();
    g.save(); faceTransform(g, 'L', x, y, hw0, hh0, 0, z1);
    g.fillStyle = dom; g.globalAlpha = 0.45; g.fillRect(0.2, 0.3, 0.5, 0.3);
    g.restore();
  }
  if (tier === 3 && !crewLine) {
    // water tank on the roof and a hotel sign
    const tx = x - hw0 * 0.35, ty = y - z1 - hh0 * 0.1;
    box(g, tx, ty + z1, s * 0.06, s * 0.03, z1, z1 + s * 0.1, skin);
    g.save(); faceTransform(g, 'R', x, y, hw0, hh0, 0, z1);
    g.shadowColor = '#ff2bd6'; g.shadowBlur = 8; g.fillStyle = '#ff2bd6';
    g.fillRect(0.2, 0.9, 0.6, 0.06);
    g.restore();
  }
  if (tier === 4) {
    // a hanging vertical sign on the front corner
    const [px, py] = facePoint('R', x, y, hw0, hh0, 0, z1, 0.05, 0.85);
    const signC = crewLine ? dom : dom === '#3ef2ff' ? '#ff2bd6' : '#3ef2ff';
    glowRect(g, px + 2, py, Math.max(2, s * 0.035), z1 * 0.55, signC, 10);
    if (!crewLine) {
      const topH = T.sections[1][1] * s;
      g.strokeStyle = '#8f88b8'; g.lineWidth = 1.2;
      g.beginPath(); g.ellipse(x + hw0 * 0.45, y - z1 - s * 0.05, s * 0.06, s * 0.03, -0.5, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.moveTo(x, y - topH); g.lineTo(x, y - topH - s * 0.1); g.stroke();
    }
  }
  if (tier >= 6) {
    // holographic billboard
    g.save(); faceTransform(g, 'R', x, y, hw0, hh0, 0, z1);
    const grad = g.createLinearGradient(0, 0, 1, 0);
    grad.addColorStop(0, crewLine ? dom : 'rgba(255, 43, 214, 0.85)');
    grad.addColorStop(1, crewLine ? alt : 'rgba(62, 242, 255, 0.85)');
    g.globalAlpha = crewLine ? 0.85 : 1;
    g.fillStyle = grad;
    g.fillRect(0.14, 0.42, 0.72, 0.2);
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(8, 7, 15, 0.55)';
    for (let n = 0; n < 6; n++) g.fillRect(0.14, 0.44 + n * 0.03, 0.72, 0.008);
    g.restore();
  }
  if (tier === 8) {
    // halo around the crown
    const [lsw, lzt] = T.sections[T.sections.length - 1];
    const ring = crewLine ? dom : '#5dffb0';
    g.save();
    g.strokeStyle = ring; g.shadowColor = ring; g.shadowBlur = 12; g.lineWidth = 1.6;
    g.beginPath(); g.ellipse(x, y - lzt * s + s * 0.04, s * 0.5 * lsw * 1.25, s * 0.25 * lsw * 1.25, 0, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
  if (T.spire) {
    const zt = T.sections[T.sections.length - 1][1] * s;
    g.strokeStyle = '#a49ccc'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, y - zt); g.lineTo(x, y - zt - T.spire * s); g.stroke();
  }
  if (crewLine) {
    const [lsw, lzt] = T.sections[T.sections.length - 1];
    const off = T.spire ? -s * 0.5 * lsw * 0.42 : 0;
    emblem(g, line, x + off, y - lzt * s + s * 0.25 * lsw * (T.spire ? 0.12 : 0.05), s * (0.75 + tier * 0.06));
  }
  return { c, ox: x, oy: y, w, h };
}

function sprite(tier, line, seed, s) {
  const q = Math.pow(2, Math.round(Math.log2(s) * 8) / 8);
  const base = `${tier}:${line || ''}:${seed}`;
  const key = `${base}:${q.toFixed(2)}:${DPR}`;
  let sp = spriteCache.get(key);
  if (sp) return sp;
  // Drawing a sprite costs a few hundred rectangles, so only a handful are made per frame.
  // While zooming, the nearest existing size stands in until its turn comes.
  if (spriteBudget <= 0 && spriteLatest.has(base)) return spriteLatest.get(base);
  spriteBudget--;
  if (spriteCache.size > 600) spriteCache.clear();
  sp = makeSprite(tier, line, seed, q);
  sp.q = q;
  spriteCache.set(key, sp);
  spriteLatest.set(base, sp);
  return sp;
}

/* ================================================================
   Canvas: living details
   ================================================================ */
const fabs = new Map();          // "sector:lot" -> fabrication start time
const particles = [];
const floaters = [];
let rain = [];
const cars = [];
const courier = { active: false, x: 0, y: 0, cy: 0, dir: 1, next: 0 };

function startFabrication(sec, k) { fabs.set(sec + ':' + k, performance.now()); }

function initRain() {
  rain = [];
  if (reduceMotion) return;
  const n = Math.round(W * H / 6000);
  for (let i = 0; i < n; i++) rain.push({ x: Math.random() * W, y: Math.random() * H, v: 500 + Math.random() * 300 });
}
for (let i = 0; i < 9; i++) {
  cars.push({ lane: i % 3, x: Math.random(), v: (0.03 + Math.random() * 0.05) * (i % 2 ? 1 : -1), c: PAL[i % 3] });
}

function spawnSparks(x, y, color) {
  if (reduceMotion) return;
  for (let n = 0; n < 22; n++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.8 + Math.random() * 0.5, c: color });
  }
}
function floater(x, y, text, color) {
  floaters.push({ x, y, text, c: color, life: 1.3 });
  if (floaters.length > 30) floaters.shift();
}

/* ================================================================
   Drawing
   ================================================================ */
function draw(now, dt) {
  const t = now / 1000;
  spriteBudget = 8;
  if (backdropTheme !== cur().type) buildBackdrop(cur().type);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(backdrop, 0, 0, W, H);

  // sky traffic behind the city
  for (const car of cars) {
    if (!reduceMotion) { car.x += car.v * dt; if (car.x > 1.1) car.x = -0.1; if (car.x < -0.1) car.x = 1.1; }
    const y = H * (0.2 + car.lane * 0.07), x = car.x * W, dir = Math.sign(car.v);
    const tr = ctx.createLinearGradient(x, y, x - dir * 34, y);
    tr.addColorStop(0, car.c); tr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.strokeStyle = tr; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - dir * 34, y); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2);
  }

  for (let sec = 0; sec < S.sectors.length; sec++) drawGround(sec, t);
  if (showGhost()) drawGhostSector(S.sectors.length, t);
  drawRoads(t);
  drawBuildings(now, t);
  if (view === 'map') drawMapLabels();

  for (let n = particles.length - 1; n >= 0; n--) {
    const p = particles[n];
    p.life -= dt; if (p.life <= 0) { particles.splice(n, 1); continue; }
    p.vy += 180 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.fillStyle = p.c; ctx.fillRect(p.x - 1, p.y - 1, 2.2, 2.2);
  }
  ctx.globalAlpha = 1;

  drawCourier(now, dt);

  ctx.textAlign = 'center';
  for (let n = floaters.length - 1; n >= 0; n--) {
    const f = floaters[n];
    f.life -= dt; if (f.life <= 0) { floaters.splice(n, 1); continue; }
    if (!reduceMotion) f.y -= 34 * dt;
    ctx.globalAlpha = Math.min(1, f.life * 1.4);
    ctx.font = '600 16px "Share Tech Mono", ui-monospace, monospace';
    ctx.fillStyle = f.c; ctx.shadowColor = f.c; ctx.shadowBlur = 8;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  if (rain.length) {
    ctx.strokeStyle = 'rgba(170, 185, 255, 0.16)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of rain) {
      d.y += d.v * dt; d.x -= d.v * 0.12 * dt;
      if (d.y > H) { d.y = -14; d.x = Math.random() * (W + 60); }
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 1.6, d.y - 13);
    }
    ctx.stroke();
  }
}

function sectorCorners(sec) {
  const [I0, J0] = lotIJ(sec, 0);
  const P = (I, J) => [sx(worldX(I, J)), sy(worldY(I, J))];
  return {
    top: P(I0 - 0.5, J0 - 0.5), right: P(I0 + N - 0.5, J0 - 0.5),
    bottom: P(I0 + N - 0.5, J0 + N - 0.5), left: P(I0 - 0.5, J0 + N - 0.5), P, I0, J0,
  };
}
const offscreen = c => c.right[0] < -20 || c.left[0] > W + 20 || c.bottom[1] < -20 || c.top[1] > H + 5 * cam.s;

function drawGround(sec, t) {
  const c = sectorCorners(sec);
  if (offscreen(c)) return;
  ctx.save();
  if (view === 'city' && sec !== S.cur) ctx.globalAlpha = 0.45;
  drawGroundInner(sec, t, c);
  ctx.restore();
}
function drawGroundInner(sec, t, c) {
  const { top, right, bottom, left, P, I0, J0 } = c;
  const haze = theme(sec).haze;
  const d = 0.22 * cam.s;
  ctx.fillStyle = '#0a0816';
  poly(ctx, [left, bottom, [bottom[0], bottom[1] + d], [left[0], left[1] + d]]);
  ctx.fillStyle = '#110e22';
  poly(ctx, [bottom, right, [right[0], right[1] + d], [bottom[0], bottom[1] + d]]);
  ctx.fillStyle = '#0f0c1e';
  poly(ctx, [top, right, bottom, left]);
  ctx.strokeStyle = `rgba(${haze}, 0.4)`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(left[0], left[1]); ctx.lineTo(bottom[0], bottom[1]); ctx.lineTo(right[0], right[1]); ctx.stroke();

  // streets between lots
  ctx.strokeStyle = `rgba(${haze}, 0.09)`;
  ctx.beginPath();
  for (let k = 0; k <= N; k++) {
    let p1 = P(I0 + k - 0.5, J0 - 0.5), p2 = P(I0 + k - 0.5, J0 + N - 0.5);
    ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
    p1 = P(I0 - 0.5, J0 + k - 0.5); p2 = P(I0 + N - 0.5, J0 + k - 0.5);
    ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
  }
  ctx.stroke();
  if (cam.s > 30) {
    ctx.fillStyle = 'rgba(255, 194, 62, 0.55)';
    for (let a = 0; a <= N; a++) for (let b = 0; b <= N; b++) {
      const [x, y] = P(I0 + a - 0.5, J0 + b - 0.5);
      ctx.fillRect(x - 1, y - 1, 2, 2);
    }
  }

  const s = S.sectors[sec];
  const active = view === 'city' && sec === S.cur;
  const nk = active ? nextLot(sec) : -1;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  for (let k = 0; k < N * N; k++) {
    if (!s.lots[k] && k !== nk) continue;
    const [x, y] = lotScreen(sec, k);
    const f = 0.84, hw = cam.s * 0.5 * f, hh = cam.s * 0.25 * f;
    ctx.beginPath(); ctx.moveTo(x, y - hh); ctx.lineTo(x + hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y); ctx.closePath();
    if (s.lots[k]) {
      ctx.fillStyle = '#171331'; ctx.fill();
      ctx.strokeStyle = '#2e2756'; ctx.lineWidth = 1; ctx.stroke();
      if (active && k === s.sel) {
        ctx.save();
        ctx.strokeStyle = '#ff2bd6'; ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 12;
        ctx.globalAlpha = 0.6 + 0.4 * pulse; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    } else {
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.lineDashOffset = reduceMotion ? 0 : -t * 12;
      ctx.strokeStyle = S.credits >= lotCost(sec) ? '#3ef2ff' : 'rgba(62, 242, 255, 0.45)';
      ctx.globalAlpha = 0.5 + 0.5 * pulse; ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
      const r = Math.max(4, cam.s * 0.06);
      ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r / 2); ctx.lineTo(x, y + r / 2); ctx.stroke();
      ctx.restore();
    }
  }
}

// The next sector, before its road is built: a dashed outline of land waiting.
function drawGhostSector(sec, t) {
  const c = sectorCorners(sec);
  if (offscreen(c)) return;
  const { top, right, bottom, left } = c;
  ctx.save();
  ctx.setLineDash([7, 6]);
  ctx.lineDashOffset = reduceMotion ? 0 : -t * 14;
  ctx.strokeStyle = S.credits >= roadCost(sec) && roadReady() ? '#3ef2ff' : 'rgba(148, 140, 192, 0.55)';
  ctx.fillStyle = 'rgba(62, 242, 255, 0.03)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(right[0], right[1]); ctx.lineTo(bottom[0], bottom[1]); ctx.lineTo(left[0], left[1]); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
  const cx = (top[0] + bottom[0]) / 2, cy = (top[1] + bottom[1]) / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(236, 232, 255, 0.75)';
  ctx.font = `600 ${clamp(cam.s * 0.32, 11, 15)}px "Share Tech Mono", ui-monospace, monospace`;
  ctx.fillText('NEW DISTRICT', cx, cy - 4);
  ctx.fillStyle = 'rgba(148, 140, 192, 0.9)';
  ctx.fillText(roadReady() ? `ROAD ${fmt(roadCost(sec))} \u00b7 INFRA TAB` : `NEEDS ${ROAD_REQ} LOTS`, cx, cy + 14);
}

// Cyber roads cross the gap between each sector and the one before it.
function roadEnds(k) {
  const [a1, b1] = SECTOR_POS[k - 1], [a2, b2] = SECTOR_POS[k];
  const c1 = [a1 * SPAN + CENTER, b1 * SPAN + CENTER], c2 = [a2 * SPAN + CENTER, b2 * SPAN + CENTER];
  if (a1 !== a2) {
    const dir = Math.sign(a2 - a1);
    return [[c1[0] + dir * (CENTER + 0.5), c1[1]], [c2[0] - dir * (CENTER + 0.5), c2[1]]];
  }
  const dir = Math.sign(b2 - b1);
  return [[c1[0], c1[1] + dir * (CENTER + 0.5)], [c2[0], c2[1] - dir * (CENTER + 0.5)]];
}
function drawRoads(t) {
  const count = S.sectors.length + (showGhost() ? 1 : 0);
  for (let k = 1; k < count; k++) {
    const built = k < S.sectors.length;
    const [[I1, J1], [I2, J2]] = roadEnds(k);
    // run the road a little into each sector so it meets the streets
    const dI = Math.sign(I2 - I1), dJ = Math.sign(J2 - J1);
    const p1 = [sx(worldX(I1 - dI * 0.5, J1 - dJ * 0.5)), sy(worldY(I1 - dI * 0.5, J1 - dJ * 0.5))];
    const p2 = [sx(worldX(I2 + dI * 0.5, J2 + dJ * 0.5)), sy(worldY(I2 + dI * 0.5, J2 + dJ * 0.5))];
    if (Math.max(p1[0], p2[0]) < -40 || Math.min(p1[0], p2[0]) > W + 40 || Math.max(p1[1], p2[1]) < -40 || Math.min(p1[1], p2[1]) > H + 40) continue;
    const lv = built ? S.roads[k] : 0;
    const color = built ? ROAD_LEVELS[lv].color : 'rgba(148, 140, 192, 0.5)';
    const width = Math.max(2, cam.s * (0.12 + lv * 0.05));
    ctx.save();
    ctx.lineCap = 'round';
    if (!built) {
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
      ctx.restore();
      continue;
    }
    ctx.strokeStyle = '#120f22'; ctx.lineWidth = width + 4;
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.lineWidth = 1.5;
    const nx = -(p2[1] - p1[1]), ny = p2[0] - p1[0], nl = Math.hypot(nx, ny) || 1;
    const ox = nx / nl * width / 2, oy = ny / nl * width / 2;
    ctx.beginPath();
    ctx.moveTo(p1[0] + ox, p1[1] + oy); ctx.lineTo(p2[0] + ox, p2[1] + oy);
    ctx.moveTo(p1[0] - ox, p1[1] - oy); ctx.lineTo(p2[0] - ox, p2[1] - oy);
    ctx.stroke();
    // traffic pulses: more lanes and faster on better roads
    ctx.shadowBlur = 8;
    const lanes = lv, speed = 0.25 + lv * 0.15;
    for (let ln = 0; ln < lanes; ln++) {
      const off = (ln - (lanes - 1) / 2) / Math.max(1, lanes) * 0.8;
      for (let n = 0; n < 4; n++) {
        let f = ((reduceMotion ? 0 : t * speed) + n / 4 + ln * 0.13) % 1;
        if (ln % 2) f = 1 - f;
        const px = p1[0] + (p2[0] - p1[0]) * f + ox * 2 * off, py = p1[1] + (p2[1] - p1[1]) * f + oy * 2 * off;
        ctx.fillStyle = ln % 2 ? '#ff3b4f' : '#ffffff';
        ctx.fillRect(px - 1.2, py - 1.2, 2.4, 2.4);
      }
    }
    ctx.restore();
  }
}

function drawBuildings(now, t) {
  const order = [];
  for (let sec = 0; sec < S.sectors.length; sec++) {
    const s = S.sectors[sec];
    for (let k = 0; k < N * N; k++) if (s.lots[k]) {
      const [I, J] = lotIJ(sec, k);
      order.push([I + J, sec, k]);
    }
  }
  order.sort((a, b) => a[0] - b[0]);
  const glow = cam.s > 26;
  for (const [, sec, k] of order) {
    const s = S.sectors[sec], tier = s.lots[k], line = tier >= 2 ? s.lines[k] : null, seed = seedOf(sec, k);
    const [x, y] = lotScreen(sec, k);
    const top = topZ(tier) * cam.s;
    if (x < -cam.s || x > W + cam.s || y - top > H + 10 || y < -cam.s) continue;
    const dom = lineColor(line && line !== 'hab' ? line : null, seed);
    const faded = view === 'city' && sec !== S.cur;
    ctx.globalAlpha = faded ? 0.22 : 1;
    if (glow && !faded) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const pool = ctx.createRadialGradient(x, y, 2, x, y, cam.s * 0.55);
      pool.addColorStop(0, dom + '38'); pool.addColorStop(1, dom + '00');
      ctx.fillStyle = pool;
      ctx.fillRect(x - cam.s * 0.6, y - cam.s * 0.35, cam.s * 1.2, cam.s * 0.7);
      ctx.restore();
    }

    const sp = sprite(tier, line, seed, cam.s);
    const sc = cam.s / sp.q;
    const dx = x - sp.ox * sc, dy = y - sp.oy * sc, dw = sp.w * sc, dh = sp.h * sc;
    const fkey = sec + ':' + k;
    const fab = fabs.get(fkey);
    if (fab !== undefined) {
      const p = clamp((now - fab) / 900, 0, 1);
      if (p >= 1) {
        fabs.delete(fkey);
        spawnSparks(x, y - top, dom);
      }
      const ease = 1 - Math.pow(1 - p, 2);
      const cut = dy + dh * (1 - ease);
      ctx.save();
      ctx.beginPath(); ctx.rect(dx - 2, cut, dw + 4, dh); ctx.clip();
      ctx.drawImage(sp.c, dx, dy, dw, dh);
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = '#3ef2ff'; ctx.shadowColor = '#3ef2ff'; ctx.shadowBlur = 12; ctx.lineWidth = 2;
      ctx.globalAlpha = 1 - p * 0.6;
      ctx.beginPath(); ctx.moveTo(dx + dw * 0.1, cut); ctx.lineTo(dx + dw * 0.9, cut); ctx.stroke();
      ctx.restore();
    } else {
      ctx.drawImage(sp.c, dx, dy, dw, dh);
    }

    // blinking aircraft beacon
    ctx.globalAlpha = 1;
    if (!faded && SHAPES[tier].spire && fab === undefined && Math.sin(t * 2.4 + seed) > 0.2) {
      ctx.save();
      ctx.fillStyle = '#ff3b4f'; ctx.shadowColor = '#ff3b4f'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(x, y - top, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  // selection chevron above the chosen building
  const s = cur();
  if (view === 'city' && s.lots[s.sel]) {
    const [rx, ry] = roofPoint(S.cur, s.sel);
    const bob = reduceMotion ? 0 : Math.sin(t * 3) * 3;
    const y = ry - 14 + bob;
    ctx.save();
    ctx.strokeStyle = '#ff2bd6'; ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 8; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(rx - 7, y - 6); ctx.lineTo(rx, y); ctx.lineTo(rx + 7, y - 6); ctx.stroke();
    ctx.restore();
  }
}

function drawMapLabels() {
  ctx.textAlign = 'center';
  for (let sec = 0; sec < S.sectors.length; sec++) {
    const { bottom } = sectorCorners(sec);
    const x = bottom[0], y = bottom[1] + 0.22 * cam.s + 18;
    if (x < -100 || x > W + 100 || y < 0 || y > H + 40) continue;
    const here = sec === S.cur;
    ctx.font = '700 13px "Tektur", "Chakra Petch", system-ui, sans-serif';
    ctx.fillStyle = here ? '#ff2bd6' : '#ece8ff';
    ctx.fillText(sectorName(sec).toUpperCase(), x, y);
    ctx.font = '12px "Share Tech Mono", ui-monospace, monospace';
    ctx.fillStyle = '#3ef2ff';
    ctx.fillText(`+${fmt(SECTOR_CPS[sec] || 0, true)}/s · ${ownedIn(sec)}/${N * N} lots`, x, y + 15);
    ctx.fillStyle = `rgb(${theme(sec).haze})`;
    ctx.fillText(perkText(perkOf(sec)), x, y + 30);
  }
}

function drawCourier(now, dt) {
  if (!courier.active) {
    if (now > courier.next && !document.hidden) {
      courier.active = true;
      courier.dir = Math.random() < 0.5 ? 1 : -1;
      courier.x = courier.dir > 0 ? -30 : W + 30;
      courier.y = HUD_TOP + 10 + Math.random() * Math.max(20, (H - HUD_TOP) * 0.3);
      courier.phase = Math.random() * 6;
    }
    return;
  }
  courier.x += courier.dir * (W / 11) * dt;
  courier.phase += dt;
  const y = courier.y + (reduceMotion ? 0 : Math.sin(courier.phase * 2) * 6);
  courier.cy = y;
  if (courier.x < -40 || courier.x > W + 40) { courier.active = false; scheduleCourier(now); return; }
  const x = courier.x;
  ctx.save();
  ctx.strokeStyle = '#ffc23e'; ctx.fillStyle = '#ffc23e'; ctx.shadowColor = '#ffc23e'; ctx.shadowBlur = 14; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 13, y - 5); ctx.lineTo(x + 13, y - 5); ctx.stroke();
  ctx.fillRect(x - 6, y - 4, 12, 7);
  ctx.beginPath(); ctx.moveTo(x - 4, y + 3); ctx.lineTo(x - 2, y + 11); ctx.lineTo(x + 2, y + 11); ctx.lineTo(x + 4, y + 3); ctx.fill();
  if (Math.sin(courier.phase * 10) > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 2, 2, 2); }
  ctx.font = '12px "Share Tech Mono", ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255, 194, 62, 0.85)';
  ctx.fillText('DATA COURIER', x, y - 12);
  ctx.restore();
}
function scheduleCourier(now) {
  courier.next = now + (45000 + Math.random() * 60000) / M.courierRate;
}

/* ================================================================
   Input on the city
   ================================================================ */
function pickLot(px, py) {
  const wx = (px - W / 2) / cam.s + cam.x;
  const wy = (py - midY()) / cam.s + cam.y;
  const I = Math.round(wx + 2 * wy), J = Math.round(2 * wy - wx);
  const count = S.sectors.length + 1;
  for (let sec = 0; sec < count; sec++) {
    const [a, b] = SECTOR_POS[sec];
    const i = I - a * SPAN, j = J - b * SPAN;
    if (i >= 0 && j >= 0 && i < N && j < N) return { sec, k: j * N + i };
  }
  return null;
}

cvs.addEventListener('pointerdown', e => {
  const r = cvs.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (courier.active && Math.hypot(px - courier.x, py - courier.cy) < 30) {
    const gain = Math.max(25, CPS * 45) * M.courierPay;
    earn(gain);
    S.couriers++;
    courier.active = false;
    scheduleCourier(performance.now());
    floater(px, py, '+' + fmt(gain), '#ffc23e');
    spawnSparks(px, py, '#ffc23e');
    toast(`Courier intercepted. Its payload sold for ${fmt(gain)} credits.`, 'gold');
    Sound.courier();
    dirty = true;
    return;
  }
  if (view === 'map') {
    const hit = pickLot(px, py);
    if (!hit) return;
    if (hit.sec < S.sectors.length) { goSector(hit.sec); setView('city'); }
    else setTab('infra');
    return;
  }
  // buildings first, front to back, since tall ones cover the lots behind them
  const order = [];
  for (let sec = 0; sec < S.sectors.length; sec++) {
    const s = S.sectors[sec];
    for (let k = 0; k < N * N; k++) if (s.lots[k]) { const [I, J] = lotIJ(sec, k); order.push([I + J, sec, k]); }
  }
  order.sort((a, b) => b[0] - a[0]);
  for (const [, sec, k] of order) {
    const t = S.sectors[sec].lots[k];
    const [x, y] = lotScreen(sec, k);
    const sw = SHAPES[t].sections[0][0], hw = cam.s * 0.5 * sw, hh = cam.s * 0.25 * sw;
    if (px > x - hw && px < x + hw && py < y + hh && py > y - hh - topZ(t) * cam.s) {
      select(sec, k);
      return;
    }
  }
  const hit = pickLot(px, py);
  if (!hit) return;
  if (hit.sec >= S.sectors.length) { setTab('infra'); return; }
  const s = S.sectors[hit.sec];
  if (s.lots[hit.k]) { select(hit.sec, hit.k); return; }
  if (hit.sec === S.cur && hit.k === nextLot(hit.sec)) {
    if (acquireLot(hit.sec)) {
      const [x, y] = lotScreen(hit.sec, hit.k);
      floater(x, y - 10, 'Lot ' + lotName(hit.k), '#3ef2ff');
    } else {
      toast(`Lot ${lotName(hit.k)} costs ${fmt(lotCost(hit.sec))} credits. You have ${fmt(S.credits)}.`);
    }
  }
});

function select(sec, k) {
  if (sec !== S.cur) goSector(sec);
  S.sectors[sec].sel = k;
  setTab('build');
  dirty = true;
}
function goSector(sec) {
  if (sec === S.cur) return;
  S.cur = sec;
  updateSectorBar();
  dirty = true;
}
function setView(v) {
  view = v;
  updateSectorBar();
  dirty = true;
}

$('#hack').addEventListener('click', () => {
  const gain = hackValue();
  earn(gain);
  S.hacks++;
  const s = cur();
  const [rx, ry] = view === 'city' ? roofPoint(S.cur, s.sel) : [W / 2, H / 2];
  floater(rx + (Math.random() - 0.5) * 30, ry - 18, '+' + fmt(gain, true), '#ff2bd6');
  Sound.hack();
  const b = $('#hack');
  b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
});

const sectorBar = $('#sectorbar');
function updateSectorBar() {
  const multi = S.sectors.length > 1;
  sectorBar.hidden = !multi;
  $('#city-pane').classList.toggle('has-sectors', multi);
  $('#sector-num').textContent = `${perkText(perkOf(S.cur))} here`;
  $('#sector-name').textContent = sectorName(S.cur);
  const mb = $('#mapbtn');
  mb.setAttribute('aria-pressed', String(view === 'map'));
  mb.textContent = view === 'map' ? 'Close map' : 'Map';
}
sectorBar.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'mapbtn') { setView(view === 'map' ? 'city' : 'map'); return; }
  const d = +b.dataset.step;
  goSector((S.cur + d + S.sectors.length) % S.sectors.length);
  if (view === 'map') setView('city');
});

/* ================================================================
   Console panel
   ================================================================ */
const panel = $('#panel');
let tab = 'build';
let crewMode = 1;
let dirty = true;
let wipeArmed = 0, rebootArmed = 0;
let newAch = 0;                  // achievements earned since the Goals tab was last opened

function setTab(name) {
  if (tab === name) return;
  tab = name;
  if (name === 'goals') newAch = 0;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  panel.setAttribute('aria-labelledby', 'tab-' + name);
  panel.scrollTop = 0;
  dirty = true;
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) setTab(b.dataset.tab);
});

const buyBtn = (act, attrs, what, sub, cost, cls = '') =>
  `<button class="buy ${cls}" type="button" data-act="${act}" ${attrs} data-cost="${cost}">
     <span class="what">${what}</span>${sub ? `<span class="sub">${sub}</span>` : ''}<span class="cost">${fmt(cost)}<small class="eta"></small></span>
   </button>`;
const dot = color => `<span class="line-dot" style="background:${color}"></span>`;
const typeColor = line => LINES[line].color || '#ffc23e';
const staffText = line => line === 'hab'
  ? `tenants ×${staffMult('hab').toFixed(2)}`
  : `staffed ×${staffMult(line).toFixed(2)} by ${fmt(S.crew[line] || 0)} ${CREW_BY_ID[line].name}s`;
const toggleBtn = (act, on, label) =>
  `<button class="toggle" type="button" data-act="${act}" aria-pressed="${on}"><span class="knob" aria-hidden="true"></span>${label}: <b>${on ? 'On' : 'Off'}</b></button>`;

function lineChoice(k, line) {
  const sec = S.cur, L = LINES[line];
  const gain = upgradeGain(sec, 1, null, 2, line);
  const color = typeColor(line);
  const notes = [];
  notes.push(staffText(line));
  if (perkOf(sec) === line) notes.push(`×${PERK_MULT} in this district`);
  if (!cur().lines.includes(line) && sectorTypes(sec) >= 1) notes.push('new type here +10%');
  return buyBtn('upgrade', `data-id="${k}" data-line="${line}"`,
    `${dot(color)}${L.names[0]}<span class="tag" style="color:${color}">${esc(L.name)}</span>`,
    `+${fmt(gain, true)} / sec${notes.length ? ' · ' + notes.join(' · ') : ''}`, upgradeCost(sec, k));
}

function buildHTML() {
  const sec = S.cur, s = cur(), k = s.sel, tier = s.lots[k], line = tier >= 2 ? s.lines[k] : null;
  const isCrew = line && line !== 'hab';
  const pips = Array.from({ length: MAX_TIER }, (_, n) => `<span class="pip ${n < tier ? 'on' : n === tier ? 'next' : ''}"></span>`).join('');
  const typeLabel = tier === 1 ? 'Unzoned' : LINES[line].name;
  let upgrade;
  if (tier === 1) {
    // the district's own type first, then the rest
    const open = Object.keys(LINES).filter(lineUnlocked).sort((a, b) => (b === perkOf(sec)) - (a === perkOf(sec)));
    const locked = CREW.filter(c => !lineUnlocked(c.id));
    upgrade = `<div class="choices"><h3>Choose what this Shack becomes</h3>
      ${open.map(l => lineChoice(k, l)).join('')}
      ${locked.length ? `<p class="blurb">Hire crew to unlock more types: ${locked.map(c => `${LINES[c.id].name} (${c.name})`).join(', ')}.</p>` : ''}
    </div>`;
  } else if (tier < MAX_TIER) {
    const gain = upgradeGain(sec, tier, line, tier + 1, line);
    upgrade = buyBtn('upgrade', `data-id="${k}"`, `Upgrade to ${buildingName(tier + 1, line)}`, `+${fmt(gain, true)} / sec`, upgradeCost(sec, k), 'big');
  } else {
    upgrade = `<div class="maxed">Top tier. This building cannot grow taller.</div>`;
  }
  const why = [];
  if (isCrew) why.push(`<div class="kv"><span>Staffed by ${fmt(S.crew[line] || 0)} ${CREW_BY_ID[line].name}s</span><b>×${staffMult(line).toFixed(2)}</b></div>`);
  if (line === 'hab') why.push(`<div class="kv"><span>Tenants from your crew</span><b>×${staffMult('hab').toFixed(2)}</b></div>`);
  if (tier >= 2 && line === perkOf(sec)) why.push(`<div class="kv"><span>Matches this district</span><b>×${PERK_MULT}</b></div>`);

  const cheap = cheapestUpgrade(sec);
  const nk = nextLot(sec);
  const autoLine = defaultLine();
  const bulk = `
    ${cheap ? buyBtn('upgrade-all', '', 'Upgrade everything I can afford', `Cheapest first, in ${esc(sectorName(sec))} only · new Shacks become ${esc(LINES[autoLine].names[0])}s`, cheap.cost) : ''}
    ${nk !== undefined ? buyBtn('lots-all', '', 'Buy every lot I can afford', `In ${esc(sectorName(sec))} only · ${N * N - ownedIn(sec)} lots left`, lotCost(sec), 'alt') : ''}
    ${M.autoBuild ? `<div class="auto-row">${toggleBtn('auto-build', S.auto.build, 'Auto-builder')}
       <label class="auto-line">Shacks become
         <select id="auto-line" data-act="auto-line">${Object.keys(LINES).filter(lineUnlocked).map(l => `<option value="${l}" ${l === autoLine ? 'selected' : ''}>${esc(LINES[l].name)}</option>`).join('')}</select>
       </label></div>
       <p class="blurb">The auto-builder works across every district, buying the cheapest upgrade or lot each moment.</p>` : ''}`;

  const expand = nk === undefined
    ? `<div class="maxed">You own all ${N * N} lots in ${esc(sectorName(sec))}. Build a new district under Infra.</div>`
    : buyBtn('acquire', '', `Buy lot ${lotName(nk)} with a Shack`, `+${fmt(lotOutput(sec, 1, null), true)} / sec · lot ${ownedIn(sec) + 1} of ${N * N}`, lotCost(sec), 'alt big');

  const counts = Object.keys(LINES).map(l => {
    const c = s.lines.filter(x => x === l).length;
    return c ? `<div><span>${dot(typeColor(l))}${LINES[l].name}</span><b>${c}</b></div>` : '';
  }).join('');
  const shacks = s.lots.filter(t => t === 1).length;

  return `
  <div class="lot-card">
    <div class="lot-head">
      <button class="nav" type="button" data-act="prev" aria-label="Previous building">‹</button>
      <div><div class="eyebrow">${S.sectors.length > 1 ? `${esc(sectorName(sec))} · ` : ''}Lot ${lotName(k)} · ${typeLabel} · tier ${tier}</div><h2>${buildingName(tier, line)}</h2></div>
      <button class="nav" type="button" data-act="next" aria-label="Next building">›</button>
    </div>
    <div class="pips" aria-hidden="true">${pips}</div>
    <p class="blurb">${blurbOf(tier, line)}</p>
    <div class="kv"><span>This building earns</span><b>${fmt(lotOutput(sec, tier, line), true)} / sec</b></div>
    ${why.join('')}
    ${upgrade}
  </div>
  <div class="group"><h3>Expand the district</h3>${expand}</div>
  <div class="group"><h3>Buy in bulk</h3>${bulk}</div>
  <div class="group">
    <h3>${esc(sectorName(sec))}</h3>
    <p class="blurb">${esc(theme(sec).blurb)} ${perkText(perkOf(sec))} here.</p>
    <div class="stats">
      <div><span>Lots owned</span><b>${ownedIn(sec)} / ${N * N}</b></div>
      <div><span>District income</span><b>${fmt(SECTOR_CPS[sec], true)}/s</b></div>
      <div><span>Mixed-use bonus</span><b>+${Math.round((SECTOR_MIX[sec] - 1) * 100)}%</b></div>
      <div><span>Crew, citywide</span><b>${fmt(CREW_CPS, true)}/s</b></div>
      ${shacks ? `<div><span>${dot('#948cc0')}Shacks</span><b>${shacks}</b></div>` : ''}
      ${counts}
    </div>
  </div>`;
}

function crewVisible(n) {
  return n === 0 || (S.crew[CREW[n - 1].id] || 0) > 0 || S.total >= CREW[n].base * 0.5;
}
function crewHTML() {
  const modes = [1, 10, 'max'].map(m =>
    `<button class="mode" type="button" data-act="mode" data-id="${m}" aria-pressed="${crewMode === m}">${m === 'max' ? 'Max' : '×' + m}</button>`).join('');
  const rows = [];
  for (let n = 0; n < CREW.length; n++) {
    const c = CREW[n];
    if (!crewVisible(n)) {
      rows.push(`<div class="locked">Unknown contact. Hire a ${CREW[n - 1].name} to make the introduction.</div>`);
      break;
    }
    const qty = crewMode === 'max' ? Math.max(1, crewMax(c)) : crewMode;
    const L = LINES[c.id];
    const nb = S.sectors.reduce((a, s) => a + s.lines.filter(x => x === c.id).length, 0);
    const staffLine = nb
      ? `Staff ${nb} ${esc(L.name)}${nb === 1 ? '' : 's'}, each earning ×${staffMult(c.id).toFixed(2)}`
      : (S.crew[c.id] ? `Upgrade a Shack into a ${esc(L.name)} to put them to work` : `Hiring one unlocks ${esc(L.name)} buildings`);
    rows.push(`<div class="row" data-crew="${c.id}">
      <span class="name">${dot(L.color)}${c.name}</span>
      <span class="owned">${fmt(S.crew[c.id] || 0)}</span>
      <span class="desc">${c.desc}</span>
      <span class="boost">${staffLine}</span>
      ${buyBtn('crew', `data-id="${c.id}"`, `Hire <span data-q>${qty}</span>`, `+<span data-g>${fmt(hireGain(c.id, qty), true)}</span> / sec`, crewCost(c, qty))}
    </div>`);
  }
  const ch = cheapestHire();
  return `
  <div class="group">
    <h3>Buy in bulk</h3>
    ${ch ? buyBtn('hire-all', '', 'Hire everyone I can afford', 'Crew only · cheapest hire first, across every role', ch.cost) : ''}
    ${M.autoHire ? toggleBtn('auto-hire', S.auto.hire, 'Auto-hire') : ''}
  </div>
  <div class="head-row"><h3>Hire crew</h3><div class="modes">${modes}</div></div>
  <div class="group">${rows.join('')}</div>
  <p class="blurb">There is no cap on crew. Each hire costs 15% more than the last. Crew earn pay, and they also staff their own building type: the more you hire, the more those buildings earn. Housing fills with tenants from every role.</p>`;
}

function techHTML() {
  const avail = TECH.filter(t => !S.tech.includes(t.id) && t.req());
  const locked = TECH.filter(t => !S.tech.includes(t.id) && !t.req());
  const done = TECH.filter(t => S.tech.includes(t.id));
  return `
  <div class="group">
    <h3>Available</h3>
    ${avail.length ? avail.map(t => buyBtn('tech', `data-id="${t.id}"`, t.name, t.desc, t.cost, 'alt')).join('')
                   : `<div class="locked">Nothing to install yet.</div>`}
  </div>
  ${locked.length ? `<div class="group"><h3>Coming up</h3>
     ${locked.slice(0, 3).map(t => `<div class="locked"><b>${t.name}</b>. ${t.hint} to unlock it.</div>`).join('')}
     ${locked.length > 3 ? `<p class="blurb">${locked.length - 3} more upgrades are still encrypted.</p>` : ''}</div>` : ''}
  ${done.length ? `<div class="group"><h3>Installed</h3><div class="installed">${done.map(t => `<span class="chip">${t.name}</span>`).join('')}</div></div>` : ''}`;
}

function infraHTML() {
  const k = S.sectors.length, last = k - 1;
  const have = ownedIn(last);
  let next;
  if (roadReady()) {
    const open = DISTRICT_IDS.filter(d => d !== 'capital' && districtUnlocked(d));
    const locked = DISTRICT_IDS.filter(d => d !== 'capital' && !districtUnlocked(d));
    next = `<p class="blurb">Pick what the next district is for. Every option costs the same. Its matching building type earns ×${PERK_MULT} there, everything there earns ×${fmt(secOut(k))}, and all crew pay rises ×${CREW_SECTOR}.</p>
      ${open.map(d => {
        const D = DISTRICTS[d], built = S.sectors.filter(x => x.type === d).length;
        return buyBtn('road', `data-id="${d}"`, `${dot(`rgb(${D.haze})`)}${D.name}${built ? `<span class="tag" style="color:var(--dim)">own ${built}</span>` : ''}`,
          `${perkText(D.perk)} · ${esc(D.blurb)}`, roadCost(k));
      }).join('')}
      ${locked.length ? `<p class="blurb">Hire crew to plan more: ${locked.map(d => `${DISTRICTS[d].name} (${CREW_BY_ID[DISTRICTS[d].perk].name})`).join(', ')}.</p>` : ''}`;
  } else {
    next = `<div class="locked">Own <b>${ROAD_REQ}</b> lots in ${esc(sectorName(last))} to plan your next district. You have <b>${have}</b>.</div>`;
  }
  const roads = [];
  for (let r = 1; r < k; r++) {
    const lv = S.roads[r];
    const head = `<span class="name">${dot(ROAD_LEVELS[lv].color)}${esc(sectorName(r - 1))} → ${esc(sectorName(r))}</span>
      <span class="owned" title="Road grade">${lv}/4</span>
      <span class="desc">${ROAD_LEVELS[lv].name}</span>`;
    roads.push(`<div class="row">${head}${lv < 4
      ? buyBtn('roadup', `data-id="${r}"`, `Upgrade to ${ROAD_LEVELS[lv + 1].name}`, `+${Math.round(ROAD_BONUS * 100)}% to all output`, roadUpgradeCost(r), 'alt')
      : `<div class="maxed" style="grid-column:1/-1;margin-top:6px">Top grade.</div>`}</div>`);
  }
  const sectors = S.sectors.map((_, i) => `<div class="sector-row ${i === S.cur ? 'here' : ''}">
      <span><b>${dot(`rgb(${theme(i).haze})`)}${esc(sectorName(i))}</b><small>${perkText(perkOf(i))} · ${ownedIn(i)}/${N * N} lots · +${fmt(SECTOR_CPS[i], true)}/s</small></span>
      <button class="mode" type="button" data-act="goto" data-id="${i}" ${i === S.cur && view === 'city' ? 'aria-pressed="true"' : ''}>${i === S.cur && view === 'city' ? 'Viewing' : 'View'}</button>
    </div>`).join('');
  return `
  <div class="group"><h3>Your districts</h3>${sectors}</div>
  <div class="group"><h3>Build a cyber road to a new district</h3>${next}</div>
  ${roads.length ? `<div class="group"><h3>Road network</h3>${roads.join('')}
     <p class="blurb">Road grades add up. You have +${Math.round((roadMult() - 1) * 100)}% to all output from roads.</p></div>` : ''}`;
}

function goalsHTML() {
  const pend = pendingChips();
  const got = new Set(S.ach);
  const nextChipAt = Math.pow(chipsFor(S.lifetime) + 1, 1 / CHIP_EXP) * CHIP_DIV;
  let rebootBody;
  if (canReboot()) {
    rebootBody = `<button class="buy big ${rebootArmed ? 'armed' : ''}" type="button" data-act="reboot">
        <span class="what">${rebootArmed ? 'Click again to reboot. Your city resets.' : `Reboot for ${fmt(pend)} Neural Chips`}</span>
        <span class="sub">+${Math.round(pend * CHIP_BONUS * 100)}% to all income, for every run after this</span>
        <span class="cost">${fmt(pend)}</span>
      </button>`;
  } else if (S.sectors.length < 2) {
    rebootBody = `<div class="locked">Build your first district to unlock rebooting. You will have <b>${fmt(Math.max(pend, 0))}</b> chips waiting.</div>`;
  } else {
    rebootBody = `<div class="locked">Your first chip arrives at <b>${fmt(nextChipAt)}</b> credits earned across all runs. You have <b>${fmt(S.lifetime)}</b>.</div>`;
  }
  const achRows = ACHIEVEMENTS.map(a => `<li class="ach ${got.has(a.id) ? 'got' : ''}"><b>${esc(a.name)}</b><span>${esc(a.desc)}</span></li>`).join('');
  return `
  <div class="group">
    <h3>Reboot the Grid</h3>
    <p class="blurb">Wipe the city and start again with Neural Chips. Each chip adds +${Math.round(CHIP_BONUS * 100)}% to all income for good. Chips come from everything you have ever earned, so every run makes the next one faster. Achievements and chips survive a reboot.</p>
    <div class="stats">
      <div><span>Neural Chips</span><b>${fmt(S.chips)}</b></div>
      <div><span>Chip bonus</span><b>+${Math.round((M.chip - 1) * 100)}%</b></div>
      <div><span>Ready to claim</span><b>${fmt(pend)}</b></div>
      <div><span>Reboots</span><b>${S.reboots}</b></div>
    </div>
    ${rebootBody}
  </div>
  <div class="group">
    <div class="head-row"><h3>Achievements</h3><span class="eyebrow">${S.ach.length} / ${ACHIEVEMENTS.length} · +${Math.round((M.achieve - 1) * 100)}% income</span></div>
    <ul class="achs">${achRows}</ul>
  </div>
  <div class="foot">
    <span>Progress saves in this browser.</span>
    <button class="wipe ${wipeArmed ? 'armed' : ''}" type="button" data-act="wipe">${wipeArmed ? 'Click again to erase everything' : 'Erase save'}</button>
  </div>`;
}

function render() {
  dirty = false;
  const scroll = panel.scrollTop;
  // keep keyboard focus on the same control across a re-render
  const f = panel.contains(document.activeElement) ? document.activeElement : null;
  const fAct = f && f.dataset.act, fId = f && f.dataset.id, fLine = f && f.dataset.line;
  panel.innerHTML = tab === 'build' ? buildHTML() : tab === 'crew' ? crewHTML() : tab === 'tech' ? techHTML()
    : tab === 'infra' ? infraHTML() : goalsHTML();
  panel.scrollTop = scroll;
  if (fAct) {
    const all = [...panel.querySelectorAll(`[data-act="${fAct}"]`)];
    const same = all.find(el => el.dataset.id === fId && el.dataset.line === fLine) || all.find(el => el.dataset.id === fId) || all[0];
    if (same) same.focus({ preventScroll: true });
  }
  refresh();
}

function refresh() {
  $('#credits').textContent = fmt(S.credits);
  $('#rate').textContent = `+${fmt(CPS, true)} / sec`;
  $('#hack-value').textContent = `+${fmt(hackValue(), true)} per hack`;
  if (tab === 'crew' && crewMode === 'max') {
    panel.querySelectorAll('[data-crew]').forEach(row => {
      const c = CREW_BY_ID[row.dataset.crew];
      const q = Math.max(1, crewMax(c));
      const b = row.querySelector('.buy');
      b.dataset.cost = crewCost(c, q);
      b.querySelector('[data-q]').textContent = q;
      b.querySelector('[data-g]').textContent = fmt(hireGain(c.id, q), true);
      b.querySelector('.cost').firstChild.textContent = fmt(+b.dataset.cost);
    });
  }
  panel.querySelectorAll('[data-cost]').forEach(b => {
    const cost = +b.dataset.cost;
    const short = S.credits < cost;
    b.disabled = short;
    b.style.setProperty('--p', Math.min(1, S.credits / cost).toFixed(3));
    const eta = b.querySelector('.eta');
    if (eta) {
      const sec = short && CPS > 0 ? (cost - S.credits) / CPS : 0;
      eta.textContent = !short ? '' : sec > 86400 ? 'over a day' : CPS > 0 ? 'in ' + duration(Math.max(1, sec)) : '';
    }
  });
  const crewAff = CREW.filter((c, n) => crewVisible(n) && S.credits >= crewCost(c, 1)).length;
  const techAff = TECH.filter(t => !S.tech.includes(t.id) && t.req() && S.credits >= t.cost).length;
  const cheap = cheapestUpgrade(S.cur);
  const buildAff = (cheap && S.credits >= cheap.cost ? 1 : 0) + (nextLot(S.cur) !== undefined && S.credits >= lotCost(S.cur) ? 1 : 0);
  let infraAff = roadReady() && S.credits >= roadCost(S.sectors.length) ? 1 : 0;
  for (let r = 1; r < S.sectors.length; r++) if (S.roads[r] < 4 && S.credits >= roadUpgradeCost(r)) infraAff++;
  setBadge('build', tab === 'build' ? 0 : buildAff);
  setBadge('crew', tab === 'crew' ? 0 : crewAff);
  setBadge('tech', tab === 'tech' ? 0 : techAff);
  setBadge('infra', tab === 'infra' ? 0 : infraAff);
  setBadge('goals', tab === 'goals' ? 0 : newAch + (canReboot() ? 1 : 0));
}
function setBadge(name, n) {
  const el = $('#badge-' + name);
  el.hidden = !n;
  el.textContent = n;
}

// Two-step confirm for anything that erases progress.
function armed(which) {
  const t = performance.now();
  if (which === 'wipe' ? wipeArmed && t - wipeArmed < 4000 : rebootArmed && t - rebootArmed < 4000) return true;
  if (which === 'wipe') wipeArmed = t; else rebootArmed = t;
  setTimeout(() => { wipeArmed = rebootArmed = 0; dirty = true; }, 4000);
  dirty = true;
  return false;
}

panel.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.tagName === 'SELECT') return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'upgrade') {
    const k = +id, s = cur();
    if (upgradeLot(S.cur, k, b.dataset.line)) {
      s.sel = k;
      const [x, y] = roofPoint(S.cur, k);
      floater(x, y - 12, buildingName(s.lots[k], s.lines[k]), '#3ef2ff');
      Sound.build();
    }
  } else if (act === 'acquire') {
    if (acquireLot(S.cur)) Sound.buy();
  } else if (act === 'upgrade-all') {
    const n = upgradeAllIn(S.cur);
    if (n) { toast(`${n} upgrade${n === 1 ? '' : 's'} built in ${sectorName(S.cur)}.`); Sound.build(); }
  } else if (act === 'lots-all') {
    const n = buyAllLotsIn(S.cur);
    if (n) { toast(`${n} lot${n === 1 ? '' : 's'} bought in ${sectorName(S.cur)}.`); Sound.buy(); }
  } else if (act === 'hire-all') {
    const n = hireAll();
    if (n) { toast(`${n} crew hired.`); Sound.buy(); }
  } else if (act === 'auto-build') {
    S.auto.build = !S.auto.build; save(); dirty = true;
  } else if (act === 'auto-hire') {
    S.auto.hire = !S.auto.hire; save(); dirty = true;
  } else if (act === 'prev' || act === 'next') {
    const s = cur();
    const list = ORDER.filter(k => s.lots[k]);
    const at = list.indexOf(s.sel);
    s.sel = list[(at + (act === 'next' ? 1 : -1) + list.length) % list.length];
    dirty = true;
  } else if (act === 'crew') {
    if (hireCrew(id)) Sound.buy();
  } else if (act === 'mode') {
    crewMode = id === 'max' ? 'max' : +id;
    dirty = true;
  } else if (act === 'tech') {
    if (buyTech(id)) Sound.big();
  } else if (act === 'road') {
    if (buildRoad(id)) Sound.big();
    updateSectorBar();
  } else if (act === 'roadup') {
    if (upgradeRoad(+id)) Sound.build();
  } else if (act === 'goto') {
    goSector(+id);
    setView('city');
    dirty = true;
  } else if (act === 'reboot') {
    if (armed('reboot')) { rebootArmed = 0; reboot(); Sound.big(); setTab('build'); }
  } else if (act === 'wipe') {
    if (armed('wipe')) {
      S = fresh(); wipeArmed = 0; fabs.clear(); view = 'city'; afterChange();
      updateSectorBar();
      startFabrication(0, cur().sel);
      toast('Save erased. One shack, one sign, back to work.');
      setTab('build');
    }
  }
});
panel.addEventListener('change', e => {
  if (e.target.id === 'auto-line' && LINES[e.target.value]) { S.lastLine = e.target.value; save(); dirty = true; }
});

/* ================================================================
   Toasts and the news ticker
   ================================================================ */
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > (W < 560 ? 1 : 3)) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 450); }, 4200);
}

function headlines() {
  const lines = [
    'Weather: acid rain. Tomorrow: acid rain. Long-range outlook: acid rain',
    'Ramen prices hold steady for the 40th consecutive week',
    'Grid Security Bureau reminds citizens to patch their cyberdecks',
    'Drone courier lost over the city, payload still unrecovered',
    'Maglev Line 4 delayed after a billboard fell onto the track',
    `Local developer now holds ${ownedTotal()} lots across ${S.sectors.length} district${S.sectors.length === 1 ? '' : 's'}`,
    `Credit flow out of the sprawl hits ${fmt(CPS, true)} per second, analysts nervous`,
  ];
  if (S.best >= 5) lines.push('New corporate beacon confuses migrating pigeons');
  if (S.best >= 6) lines.push('Skyline now visible from the orbital ring');
  if (S.best >= 8) lines.push('Arcology residents vote to stop using the word "outside"');
  if ((S.crew.ai || 0) > 0) lines.push('Rogue AI denies being rogue, files for a business licence');
  if (crewBuildings() > 0) lines.push('Zoning board gives up trying to tell an arcade from a netcafé');
  if (S.sectors.length > 1) lines.push(`Cyber road to ${sectorName(S.sectors.length - 1)} sees record traffic on opening night`);
  if (S.sectors.some(x => x.type === 'docks')) lines.push('Loading Docks report a container of "miscellaneous" goods, again');
  if (S.chips > 0) lines.push('Citizens report a strong feeling they have lived this week before');
  if (S.roads.some(l => l >= 4)) lines.push('Hyperloop commuters report arriving before they left');
  for (let i = lines.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lines[i], lines[j]] = [lines[j], lines[i]]; }
  return lines;
}
const tickerEl = $('#ticker');
function fillTicker() {
  if (reduceMotion) { tickerEl.textContent = headlines()[0]; return; }
  tickerEl.textContent = headlines().join('   ◆   ');
  const width = tickerEl.scrollWidth;
  tickerEl.style.animationDuration = Math.max(20, width / 70) + 's';
}
tickerEl.addEventListener('animationiteration', fillTicker);
if (reduceMotion) setInterval(fillTicker, 9000);

/* ================================================================
   Sound: a synthesised techno track and effects, off until the player turns it on
   ================================================================ */
const SOUND_KEY = 'neon-sprawl/sound';
const Sound = (() => {
  let ac = null, master = null, sfx = null, music = null, delaySend = null, noise = null;
  let on = false, lastBlip = 0, timer = null, step = 0, nextTime = 0;

  // A Tron-style track: four-on-the-floor kick, offbeat hats, a pulsing 16th-note saw bass and
  // slow analog pads over D minor, Bb, G minor, A. Sixteen bars that build, then loop.
  const BPM = 122, SIX = 60 / BPM / 4, BAR = SIX * 16, LOOP = 16;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const PROG = [
    { bass: 38, pad: [50, 53, 57], arp: [62, 65, 69, 74] },   // D minor
    { bass: 34, pad: [46, 50, 53], arp: [58, 62, 65, 70] },   // B flat
    { bass: 31, pad: [55, 58, 62], arp: [67, 70, 74, 79] },   // G minor
    { bass: 33, pad: [57, 61, 64], arp: [64, 69, 73, 76] },   // A major, the turnaround
  ];
  const BASS_STEPS = [0, 12, 0, 0, 0, 12, 0, 7, 0, 12, 0, 0, 0, 12, 7, 12];
  const ARP_ORDER = [0, 1, 2, 3, 2, 1, 0, 1, 2, 3, 2, 3, 1, 2, 0, 3];

  function init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 1.1;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp).connect(ac.destination);
    music = ac.createGain(); music.gain.value = 0.42; music.connect(master);
    sfx = ac.createGain(); sfx.gain.value = 0.7; sfx.connect(master);
    // dotted-eighth echo for the pads and arpeggio
    const delay = ac.createDelay(1); delay.delayTime.value = SIX * 3;
    const fb = ac.createGain(); fb.gain.value = 0.38;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2400;
    delaySend = ac.createGain(); delaySend.gain.value = 0.3;
    delaySend.connect(delay); delay.connect(tone).connect(fb).connect(delay); tone.connect(music);
    const len = ac.sampleRate;
    noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }

  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.95, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.connect(g).connect(music); o.start(t); o.stop(t + 0.4);
  }
  function hiss(t, type, freq, vol, dur) {
    const src = ac.createBufferSource(); src.buffer = noise;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(music); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }
  function bass(t, note, cutoff) {
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midi(note);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(cutoff, t); f.frequency.exponentialRampToValueAtTime(140, t + SIX * 0.9);
    const g = ac.createGain(); g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t + SIX * 0.95);
    o.connect(f).connect(g).connect(music); o.start(t); o.stop(t + SIX);
  }
  function pad(t, notes) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100; f.Q.value = 1;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.5);
    g.gain.setValueAtTime(0.07, t + BAR - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + BAR + 0.4);
    f.connect(g); g.connect(music); g.connect(delaySend);
    for (const n of notes) for (const det of [-9, 9]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midi(n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + BAR + 0.5);
    }
  }
  function arp(t, note) {
    const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = midi(note);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
    const g = ac.createGain(); g.gain.setValueAtTime(0.045, t); g.gain.exponentialRampToValueAtTime(0.001, t + SIX * 0.8);
    o.connect(f).connect(g); g.connect(music); g.connect(delaySend); o.start(t); o.stop(t + SIX);
  }

  function playStep(s, t) {
    const bar = Math.floor(s / 16), pos = s % 16, section = bar % LOOP, chord = PROG[bar % PROG.length];
    if (pos % 4 === 0) kick(t);
    if (pos % 4 === 2) hiss(t, 'highpass', 7000, 0.16, 0.06);
    else if (section >= 2 && pos % 2 === 1) hiss(t, 'highpass', 9000, 0.05, 0.03);
    if (section >= 4 && (pos === 4 || pos === 12)) hiss(t, 'bandpass', 1500, 0.22, 0.16);
    // the bass filter opens a little more each bar of the loop
    bass(t, chord.bass + BASS_STEPS[pos], 500 + 1300 * (section / LOOP) + (pos % 4 === 0 ? 400 : 0));
    if (section >= 4 && pos === 0) pad(t, chord.pad);
    if (section >= 8) arp(t, chord.arp[ARP_ORDER[pos]]);
  }
  function schedule() {
    if (!ac || !on) return;
    const ahead = document.hidden ? 1.5 : 0.2;
    if (nextTime < ac.currentTime) nextTime = ac.currentTime + 0.05;
    while (nextTime < ac.currentTime + ahead) {
      playStep(step, nextTime);
      nextTime += SIX;
      step = (step + 1) % (16 * LOOP);
    }
  }

  function blip(freq, dur, type, vol, slide, delay = 0) {
    if (!on || !ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(sfx); o.start(t); o.stop(t + dur + 0.02);
  }
  const throttled = fn => () => { const t = performance.now(); if (t - lastBlip < 70) return; lastBlip = t; fn(); };
  return {
    get on() { return on; },
    set(v) {
      if (v && !ac && !init()) return false;
      on = v;
      if (ac) (on ? ac.resume() : ac.suspend()).catch(() => {});
      clearInterval(timer);
      if (on) { step = 0; nextTime = 0; schedule(); timer = setInterval(schedule, 25); }
      try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch (e) { /* storage unavailable */ }
      return on;
    },
    buy: throttled(() => blip(660, 0.07, 'square', 0.04, 1.5)),
    build: throttled(() => { blip(330, 0.25, 'sawtooth', 0.05, 2); blip(660, 0.2, 'triangle', 0.04, 0, 0.09); }),
    hack: () => blip(180 + Math.random() * 420, 0.05, 'square', 0.035, 0.5),
    courier: () => [523, 659, 784, 1046].forEach((f, i) => blip(f, 0.14, 'triangle', 0.05, 0, i * 0.07)),
    big: () => [262, 330, 392, 523].forEach((f, i) => blip(f, 0.45, 'sawtooth', 0.04, 0, i * 0.12)),
  };
})();
const soundBtn = $('#sound');
function paintSound() {
  soundBtn.setAttribute('aria-pressed', String(Sound.on));
  soundBtn.title = Sound.on ? 'Sound on' : 'Sound off';
}
soundBtn.addEventListener('click', () => { Sound.set(!Sound.on); paintSound(); Sound.buy(); });

/* ================================================================
   Main loop
   ================================================================ */
let last = performance.now();
let uiClock = 0, slowClock = 0, saveClock = 0, autoClock = 0;
let techSig = '';

function checkAchievements() {
  const earned = ACHIEVEMENTS.filter(a => !S.ach.includes(a.id) && a.test());
  if (!earned.length) return;
  for (const a of earned) {
    S.ach.push(a.id);
    newAch++;
    toast(`Achievement: ${a.name}. All income +${Math.round(ACH_BONUS * 100)}%.`, 'gold');
  }
  Sound.courier();
  afterChange();
}

function frame(now) {
  const real = Math.min((now - last) / 1000, OFFLINE_CAP);
  last = now;
  const dt = Math.min(real, 0.1);
  if (real > 0) earn(CPS * real);

  const target = cameraTarget();
  const k = cam.ready && !reduceMotion ? 1 - Math.exp(-dt * 3) : 1;
  cam.x += (target.x - cam.x) * k;
  cam.y += (target.y - cam.y) * k;
  cam.s = Math.exp(Math.log(cam.s) + (Math.log(target.s) - Math.log(cam.s)) * k);
  cam.ready = true;

  draw(now, dt);

  // automation runs a few purchases at a time so the city visibly builds itself
  autoClock += real;
  if (autoClock > 0.5) {
    autoClock = 0;
    let n = 0;
    if (M.autoBuild && S.auto.build) n += autoBuildTick(25);
    if (M.autoHire && S.auto.hire) n += hireAll(50);
    if (n) Sound.buy();
  }

  uiClock += dt; slowClock += dt; saveClock += real;
  if (dirty) render();
  else if (uiClock > 0.1) { uiClock = 0; refresh(); }
  if (slowClock > 1) {
    slowClock = 0;
    checkAchievements();
    const avail = TECH.filter(t => !S.tech.includes(t.id) && t.req()).map(t => t.id);
    const sig = avail.join(',') + '|' + roadReady() + '|' + canReboot();
    if (sig !== techSig) {
      for (const id of avail) if (!S.seen.includes(id)) {
        S.seen.push(id);
        toast(`New tech decrypted: ${TECH_BY_ID[id].name}. Find it under Tech.`, 'pink');
      }
      techSig = sig;
      if (tab !== 'build' && tab !== 'crew') dirty = true;
    }
  }
  if (saveClock > 10) { saveClock = 0; save(); }
  requestAnimationFrame(frame);
}

function boot(hot) {
  let data = hot && (Array.isArray(hot.sectors) || Array.isArray(hot.lots)) ? hot : null;
  let fromDisk = false;
  if (!data) {
    try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); fromDisk = !!data; } catch (e) { data = null; }
  }
  S = restore(data);
  recalc();
  scheduleCourier(performance.now());
  if (fromDisk && data.savedAt) {
    const away = clamp((Date.now() - data.savedAt) / 1000, 0, OFFLINE_CAP);
    if (away > 30 && CPS > 0) {
      const gain = CPS * away;
      earn(gain);
      setTimeout(() => toast(`Welcome back. The city earned ${fmt(gain)} credits in the ${duration(away)} you were away.`, 'gold'), 400);
    }
  } else if (!data) {
    startFabrication(0, cur().sel);
    setTimeout(() => toast('One shack, one lot. It earns a credit a second. Grow it.'), 600);
  }
  // Browsers only allow audio after a click, so a saved "sound on" waits for the first one.
  let wantSound = false;
  try { wantSound = localStorage.getItem(SOUND_KEY) === '1'; } catch (e) { /* storage unavailable */ }
  if (wantSound) document.addEventListener('pointerdown', () => { if (!Sound.on) { Sound.set(true); paintSound(); } }, { once: true });
  paintSound();
  resize();
  new ResizeObserver(resize).observe(cvs);
  updateSectorBar();
  fillTicker();
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  last = performance.now();
  requestAnimationFrame(frame);
}

// A small handle for testing and balancing from the console.
window.neonSprawl = {
  get state() { return S; },
  get cps() { return CPS; },
  advance(sec) { earn(CPS * sec); },
  upgradeLot, acquireLot, hireCrew: (id, n) => hireN(id, n || 1), hireAll, upgradeAllIn, buyAllLotsIn, autoBuildTick,
  buyTech, buildRoad, upgradeRoad, upgradeCost, lotCost, crewCost, roadCost, roadUpgradeCost, roadReady, nextLot,
  lotOutput, upgradeGain, crewEach, recalc, lineUnlocked, districtUnlocked, setView, goSector, reboot, pendingChips, canReboot,
  checkAchievements, TECH, CREW, LINES, DISTRICTS,
};

window.claude?.hot?.snapshot?.(() => serialize());
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
