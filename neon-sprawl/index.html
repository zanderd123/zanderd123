<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Sprawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&family=Tektur:wght@500;700;800&display=swap">
<style>
/* Layout: a two-pane municipal console. The live isometric city fills the left pane, the upgrade terminal sits on the right; they stack on phones. */
:root {
  --bg: #08070f;
  --panel: #110f1e;
  --panel-2: #181530;
  --line: #2b2648;
  --ink: #ece8ff;
  --dim: #948cc0;
  --cyan: #3ef2ff;
  --magenta: #ff2bd6;
  --amber: #ffc23e;
  --ok: #5dffb0;
  --f-display: 'Tektur', 'Chakra Petch', system-ui, sans-serif;
  --f-body: 'Chakra Petch', system-ui, sans-serif;
  --f-mono: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --cut: 10px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  gap: 16px;
  padding-block: 16px;
  padding-inline: 16px;
}

/* ---------- City pane ---------- */
.city {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #0b0918;
}
.city canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: manipulation;
}
.hud {
  position: absolute;
  inset: 0 0 auto 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 16px;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(8, 7, 15, 0.85), rgba(8, 7, 15, 0));
}
.hud > * { pointer-events: auto; }
.eyebrow {
  font: 12px/1.2 var(--f-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.credits-value {
  font: 800 clamp(30px, 4.4vw, 48px)/1 var(--f-display);
  color: var(--amber);
  text-shadow: 0 0 18px rgba(255, 194, 62, 0.45);
  font-variant-numeric: tabular-nums;
  margin-block: 4px 2px;
}
.credits-rate {
  font: 15px/1.2 var(--f-mono);
  color: var(--cyan);
  font-variant-numeric: tabular-nums;
}
.hack {
  display: grid;
  gap: 2px;
  justify-items: start;
  padding: 10px 18px 10px 16px;
  border: 1px solid var(--magenta);
  background: rgba(255, 43, 214, 0.12);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
  cursor: pointer;
  transition: background 0.15s, transform 0.08s;
  user-select: none;
  -webkit-user-select: none;
}
.hack:hover { background: rgba(255, 43, 214, 0.24); }
.hack:active { transform: scale(0.97); }
.hack:focus-visible { outline: 2px solid var(--cyan); outline-offset: -4px; }
.hack b {
  font: 700 18px/1.1 var(--f-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--magenta);
  text-shadow: 0 0 12px rgba(255, 43, 214, 0.6);
}
.hack span { font: 12.5px/1.2 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.hack.pulse { animation: hackpulse 0.25s ease-out; }
@keyframes hackpulse { from { background: rgba(255, 43, 214, 0.5); } }

.ticker {
  position: absolute;
  inset: auto 0 0 0;
  display: flex;
  align-items: stretch;
  height: 32px;
  border-top: 1px solid var(--line);
  background: rgba(8, 7, 15, 0.86);
  font: 13px/32px var(--f-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.ticker-label {
  flex: none;
  padding-inline: 12px;
  background: var(--magenta);
  color: var(--bg);
  font-weight: 700;
}
.ticker-track { position: relative; flex: 1; min-width: 0; overflow: hidden; color: var(--ink); }
.ticker-text {
  display: inline-block;
  white-space: nowrap;
  padding-left: 100%;
  animation: marquee 40s linear infinite;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }

.toasts {
  position: absolute;
  left: 16px;
  bottom: 46px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(420px, calc(100% - 32px));
  pointer-events: none;
}
.toast {
  padding: 9px 14px;
  background: rgba(17, 15, 30, 0.94);
  border: 1px solid var(--cyan);
  color: var(--ink);
  font-size: 14px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
  animation: toastin 0.25s ease-out;
}
.toast.gold { border-color: var(--amber); }
.toast.pink { border-color: var(--magenta); }
.toast.out { opacity: 0; transition: opacity 0.4s; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Console pane ---------- */
.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border: 1px solid var(--line);
  background: var(--panel);
}
.brand {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line);
}
.brand h1 {
  margin: 0;
  font: 800 26px/1 var(--f-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
}
.brand h1 em { font-style: normal; color: var(--cyan); text-shadow: 0 0 14px rgba(62, 242, 255, 0.5); }
.brand p { margin: 6px 0 0; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1;
  padding: 12px 2px 10px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  font: 600 13px/1 var(--f-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
  cursor: pointer;
}
.tab { position: relative; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--cyan); border-bottom-color: var(--cyan); }
.tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: -4px; }
.tab .badge {
  position: absolute;
  top: 3px;
  right: 3px;
  min-width: 15px;
  padding: 1px 3px;
  font-size: 10px;
}
.badge {
  display: inline-block;
  min-width: 18px;
  margin-left: 4px;
  padding: 2px 5px;
  background: var(--magenta);
  color: var(--bg);
  font: 700 11px/1 var(--f-mono);
  vertical-align: 1px;
}

.panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.panel-body h3 {
  margin: 0;
  font: 600 13px/1.2 var(--f-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.group { display: flex; flex-direction: column; gap: 10px; }

.lot-card {
  border: 1px solid var(--line);
  background: var(--panel-2);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.lot-head { display: flex; align-items: center; gap: 10px; }
.lot-head > div { flex: 1; min-width: 0; }
.lot-head h2 {
  margin: 2px 0 0;
  font: 700 24px/1.1 var(--f-display);
  text-wrap: balance;
}
.nav {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--dim);
  font: 18px/1 var(--f-mono);
  cursor: pointer;
}
.nav:hover { color: var(--cyan); border-color: var(--cyan); }
.nav:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.pips { display: flex; gap: 4px; }
.pip { flex: 1; height: 8px; transform: skewX(-24deg); background: #221d3d; }
.pip.on { background: var(--cyan); box-shadow: 0 0 8px rgba(62, 242, 255, 0.5); }
.pip.next { background: transparent; outline: 1px solid var(--magenta); outline-offset: -1px; }
.blurb { margin: 0; color: var(--dim); font-size: 14px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.kv b { font: 15px/1.3 var(--f-mono); color: var(--cyan); font-variant-numeric: tabular-nums; font-weight: 400; }

.buy {
  --p: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 12px;
  width: 100%;
  padding: 10px 14px;
  border: 1px solid rgba(62, 242, 255, 0.7);
  background:
    linear-gradient(90deg, rgba(62, 242, 255, 0.16) calc(var(--p) * 100%), transparent 0),
    rgba(62, 242, 255, 0.04);
  text-align: left;
  cursor: pointer;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  transition: border-color 0.15s, filter 0.15s;
}
.buy:hover:not(:disabled) { filter: brightness(1.25); }
.buy:focus-visible { outline: 2px solid var(--magenta); outline-offset: -4px; }
.buy:disabled {
  cursor: not-allowed;
  border-color: var(--line);
  background:
    linear-gradient(90deg, rgba(148, 140, 192, 0.12) calc(var(--p) * 100%), transparent 0),
    transparent;
}
.buy .what { font-weight: 600; min-width: 0; }
.buy .sub { grid-column: 1; font: 12.5px/1.3 var(--f-mono); color: var(--ok); font-variant-numeric: tabular-nums; }
.buy:disabled .sub { color: var(--dim); }
.buy .cost {
  grid-row: 1 / span 2;
  grid-column: 2;
  font: 16px/1 var(--f-mono);
  color: var(--amber);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.buy:disabled .cost { color: var(--dim); }
.buy.big .what { font: 700 16px/1.25 var(--f-display); letter-spacing: 0.02em; }
.buy.alt { border-color: rgba(255, 43, 214, 0.7); background: linear-gradient(90deg, rgba(255, 43, 214, 0.16) calc(var(--p) * 100%), transparent 0), rgba(255, 43, 214, 0.04); }
.buy.alt:disabled { border-color: var(--line); background: linear-gradient(90deg, rgba(148, 140, 192, 0.12) calc(var(--p) * 100%), transparent 0), transparent; }
.maxed {
  padding: 10px 14px;
  border: 1px dashed var(--line);
  color: var(--ok);
  font: 14px/1.3 var(--f-mono);
  text-align: center;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 12px;
  padding-block: 10px;
  border-top: 1px solid var(--line);
}
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .name { font-weight: 600; font-size: 16px; }
.row .name small { font: 13px var(--f-mono); color: var(--magenta); margin-left: 6px; }
.row .desc { grid-column: 1; color: var(--dim); font-size: 13.5px; }
.row .owned { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 22px/1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.row .buy { grid-column: 1 / -1; margin-top: 6px; }

.modes { display: flex; gap: 6px; }
.mode {
  padding: 5px 12px;
  border: 1px solid var(--line);
  background: none;
  font: 13px/1 var(--f-mono);
  color: var(--dim);
  cursor: pointer;
}
.mode[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.mode:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.locked {
  padding: 10px 14px;
  border: 1px dashed var(--line);
  color: var(--dim);
  font-size: 14px;
}
.locked b { font-family: var(--f-mono); color: var(--ink); font-weight: 400; }
.installed { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 9px;
  border: 1px solid rgba(93, 255, 176, 0.45);
  color: var(--ok);
  font: 12.5px/1.2 var(--f-mono);
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 16px;
  font-size: 14px;
}
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-block: 4px; }
.stats b { font: 14px var(--f-mono); font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
.stats span { color: var(--dim); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
.wipe {
  padding: 6px 12px;
  border: 1px solid var(--line);
  background: none;
  color: var(--dim);
  font: 12.5px var(--f-mono);
  cursor: pointer;
}
.wipe.armed { border-color: var(--magenta); color: var(--magenta); }
.wipe:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }

/* sector switcher over the city */
.sectorbar {
  position: absolute;
  right: 12px;
  bottom: 42px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px;
  border: 1px solid var(--line);
  background: rgba(8, 7, 15, 0.88);
}
.sectorbar .nav { width: 30px; height: 30px; }
.sector-label { display: grid; min-width: 0; padding-inline: 4px; }
.sector-label b { font: 700 15px/1.15 var(--f-display); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mapbtn {
  padding: 8px 12px;
  border: 1px solid var(--cyan);
  background: rgba(62, 242, 255, 0.1);
  color: var(--cyan);
  font: 600 13px/1 var(--f-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}
.mapbtn[aria-pressed="true"] { background: var(--cyan); color: var(--bg); }
.mapbtn:focus-visible { outline: 2px solid var(--magenta); outline-offset: 1px; }
.city.has-sectors .toasts { bottom: 96px; }
.hud-actions { display: flex; gap: 8px; align-items: stretch; }
.sound {
  width: 44px;
  border: 1px solid var(--line);
  background: rgba(8, 7, 15, 0.7);
  color: var(--dim);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.sound:hover { color: var(--ink); }
.sound:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.sound .waves { display: none; }
.sound[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); }
.sound[aria-pressed="true"] .waves { display: inline; }
.sound[aria-pressed="true"] .mute { display: none; }

/* bulk buying and automation */
.cost .eta { display: block; margin-top: 3px; font-size: 11.5px; color: var(--dim); text-align: right; }
.cost .eta:empty { display: none; }
.auto-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  font: 14px var(--f-body);
  cursor: pointer;
}
.toggle b { font: 14px var(--f-mono); font-weight: 400; color: var(--dim); }
.toggle .knob { width: 30px; height: 14px; border: 1px solid var(--dim); position: relative; flex: none; }
.toggle .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 8px; background: var(--dim); transition: transform 0.15s; }
.toggle[aria-pressed="true"] { border-color: var(--ok); }
.toggle[aria-pressed="true"] b { color: var(--ok); }
.toggle[aria-pressed="true"] .knob { border-color: var(--ok); }
.toggle[aria-pressed="true"] .knob::after { background: var(--ok); transform: translateX(14px); }
.toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.auto-line { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; }
.auto-line select {
  padding: 6px 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font: 14px var(--f-body);
}
.buy.armed { border-color: var(--magenta); }

/* achievements */
.achs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ach { display: grid; gap: 1px; padding: 7px 9px; border: 1px dashed var(--line); color: var(--dim); min-width: 0; }
.ach b { font: 600 13.5px/1.25 var(--f-body); color: var(--dim); }
.ach span { font: 12px/1.3 var(--f-mono); }
.ach.got { border: 1px solid rgba(255, 194, 62, 0.55); background: rgba(255, 194, 62, 0.06); }
.ach.got b { color: var(--amber); }
.ach.got span { color: var(--ink); }

/* building types */
.choices { display: flex; flex-direction: column; gap: 8px; }
.line-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; transform: rotate(45deg); vertical-align: 1px; flex: none; }
.tag {
  margin-left: 8px;
  padding: 1px 6px;
  border: 1px solid currentColor;
  font: 11px/1.3 var(--f-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  vertical-align: 2px;
  white-space: nowrap;
}
.row .boost { grid-column: 1; font: 13px/1.3 var(--f-mono); color: var(--ok); }
.sector-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border: 1px solid var(--line);
}
.sector-row.here { border-color: var(--magenta); }
.sector-row span { display: grid; min-width: 0; }
.sector-row small { font: 12.5px var(--f-mono); color: var(--dim); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .city { height: 62svh; min-height: 380px; }
  .panel-body { overflow: visible; }
}
@media (max-width: 480px) {
  .sectorbar { left: 12px; }
  .sector-label { flex: 1; }
  .hud { padding: 10px 12px; }
  .hack { padding: 8px 14px 8px 12px; }
  .hack b { font-size: 15px; }
  .ticker { font-size: 12px; }
  .ticker-label { padding-inline: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .ticker-text { animation: none; padding-left: 12px; }
  .toast, .hack.pulse { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <main class="city" id="city-pane">
    <canvas id="city" aria-label="Your city. Click a building to select it, or click the glowing empty lot to buy it."></canvas>
    <header class="hud">
      <div>
        <div class="eyebrow">Cyber credits</div>
        <div class="credits-value" id="credits">0</div>
        <div class="credits-rate" id="rate">+1.0 / sec</div>
      </div>
      <div class="hud-actions">
      <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Sound">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="hack" id="hack" type="button">
        <b>Jack in</b>
        <span id="hack-value">+1.1 per hack</span>
      </button>
      </div>
    </header>
    <div class="ticker" aria-hidden="true">
      <div class="ticker-label">City news</div>
      <div class="ticker-track"><span class="ticker-text" id="ticker"></span></div>
    </div>
    <div class="sectorbar" id="sectorbar" hidden>
      <button class="nav" type="button" data-step="-1" aria-label="Previous sector">‹</button>
      <div class="sector-label"><span class="eyebrow" id="sector-num">Sector 0</span><b id="sector-name">The Sprawl</b></div>
      <button class="nav" type="button" data-step="1" aria-label="Next sector">›</button>
      <button class="mapbtn" type="button" id="mapbtn" aria-pressed="false">Map</button>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </main>

  <aside class="panel">
    <div class="brand">
      <h1>Neon <em>Sprawl</em></h1>
      <p class="eyebrow">City zoning console</p>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-build" data-tab="build" aria-selected="true">Build<span class="badge" id="badge-build" hidden></span></button>
      <button class="tab" role="tab" id="tab-crew" data-tab="crew" aria-selected="false">Crew<span class="badge" id="badge-crew" hidden></span></button>

function fmt(n, decimals) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) {
    if (decimals && n < 100) return (Math.floor(n * 10) / 10).toFixed(1);
    return Math.floor(n).toLocaleString('en-US');
  }
  const e = Math.floor(Math.log10(n) / 3);
  if (e >= SUFFIX.length) return n.toExponential(2);
  const v = n / Math.pow(1000, e);
  const s = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString();
  return s + SUFFIX[e];
}

}

}

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  const db = (b % N - CENTER) ** 2 + (Math.floor(b / N) - CENTER) ** 2;
  if (da !== db) return da - db;
  const aa = Math.atan2(Math.floor(a / N) - CENTER, a % N - CENTER);
  const ab = Math.atan2(Math.floor(b / N) - CENTER, b % N - CENTER);
  return aa - ab;
});

  const dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  let d = 0;
  while (out.length < 200) {
    for (let rep = 0; rep < 2; rep++) {
      for (let n = 0; n < step; n++) { a += dirs[d][0]; b += dirs[d][1]; out.push([a, b]); }
      d = (d + 1) % 4;
    }
    step++;
  }
  return out;
})();

const cur = () => S.sectors[S.cur];
const ownedIn = sec => S.sectors[sec].lots.reduce((n, t) => n + (t > 0), 0);
const ownedTotal = () => S.sectors.reduce((n, _, i) => n + ownedIn(i), 0);
const crewTotal = () => CREW.reduce((n, c) => n + (S.crew[c.id] || 0), 0);
const crewBuildings = () => S.sectors.reduce((n, sec) => n + sec.lines.filter(l => l && l !== 'hab').length, 0);
const lineUnlocked = line => line === 'hab' || (S.crew[line] || 0) > 0;
const districtUnlocked = id => id !== 'capital' && (DISTRICTS[id].perk === 'hab' || lineUnlocked(DISTRICTS[id].perk));
const secCost = sec => Math.pow(SECTOR_COST, sec);
const secOut = sec => Math.pow(SECTOR_OUT, sec);

const perkOf = sec => DISTRICTS[S.sectors[sec].type].perk;

function computeMods() {
  const m = { tier: new Array(MAX_TIER + 1).fill(1), build: 1, crew: 1, all: 1, hack: 1, synergy: 0,

}
// A crew building earns more the more of its crew you employ. Housing is filled by tenants from

      const base = horizon + li * 6;
      g.fillStyle = L.col;
      g.fillRect(x, base - bh, bw, bh + H);
      if (R() < 0.25) {
        g.fillRect(x + bw / 2 - 1, base - bh - 10 - R() * 20, 2, 30);
        g.fillStyle = 'rgba(255, 60, 90, 0.8)';
        g.fillRect(x + bw / 2 - 1, base - bh - 30, 2, 2);

      if (L.win) {
        for (let wy = base - bh + 4; wy < base - 2; wy += 5) {
