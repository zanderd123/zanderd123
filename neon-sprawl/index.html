<style>
/* Layout: a two-pane municipal console. The live isometric city fills the left pane, the upgrade terminal sits on the right; they stack on phones. */
:root {
  --bg: #08070f;
  --panel: #110f1e;
  --panel-2: #181530;
  --line: #2b2648;
  --ink: #ece8ff;
  --dim: #948cc0;
  --cyan: #3ef2ff;
  --magenta: #ff2bd6;
  --amber: #ffc23e;
  --ok: #5dffb0;
  --f-display: 'Tektur', 'Chakra Petch', system-ui, sans-serif;
  --f-body: 'Chakra Petch', system-ui, sans-serif;
  --f-mono: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --cut: 10px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  gap: 16px;
  padding-block: 16px;
  padding-inline: 16px;
}

/* ---------- City pane ---------- */
.city {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #0b0918;
}
.city canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: manipulation;
}
.hud {
  position: absolute;
  inset: 0 0 auto 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 16px;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(8, 7, 15, 0.85), rgba(8, 7, 15, 0));
}
.hud > * { pointer-events: auto; }
.eyebrow {
  font: 12px/1.2 var(--f-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.credits-value {
  font: 800 clamp(30px, 4.4vw, 48px)/1 var(--f-display);
  color: var(--amber);
  text-shadow: 0 0 18px rgba(255, 194, 62, 0.45);
  font-variant-numeric: tabular-nums;
  margin-block: 4px 2px;
}
.credits-rate {
  font: 15px/1.2 var(--f-mono);
  color: var(--cyan);
  font-variant-numeric: tabular-nums;
}
.hack {
  display: grid;
  gap: 2px;
  justify-items: start;
  padding: 10px 18px 10px 16px;
  border: 1px solid var(--magenta);
  background: rgba(255, 43, 214, 0.12);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
  cursor: pointer;
  transition: background 0.15s, transform 0.08s;
  user-select: none;
  -webkit-user-select: none;
}
.hack:hover { background: rgba(255, 43, 214, 0.24); }
.hack:active { transform: scale(0.97); }
.hack:focus-visible { outline: 2px solid var(--cyan); outline-offset: -4px; }
.hack b {
  font: 700 18px/1.1 var(--f-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--magenta);
  text-shadow: 0 0 12px rgba(255, 43, 214, 0.6);
}
.hack span { font: 12.5px/1.2 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.hack.pulse { animation: hackpulse 0.25s ease-out; }
@keyframes hackpulse { from { background: rgba(255, 43, 214, 0.5); } }

.ticker {
  position: absolute;
  inset: auto 0 0 0;
  display: flex;
  align-items: stretch;
  height: 32px;
  border-top: 1px solid var(--line);
  background: rgba(8, 7, 15, 0.86);
  font: 13px/32px var(--f-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.ticker-label {
  flex: none;
  padding-inline: 12px;
  background: var(--magenta);
  color: var(--bg);
  font-weight: 700;
}
.ticker-track { position: relative; flex: 1; min-width: 0; overflow: hidden; color: var(--ink); }
.ticker-text {
  display: inline-block;
  white-space: nowrap;
  padding-left: 100%;
  animation: marquee 40s linear infinite;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }

.toasts {
  position: absolute;
  left: 16px;
  bottom: 46px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(420px, calc(100% - 32px));
  pointer-events: none;
}
.toast {
  padding: 9px 14px;
  background: rgba(17, 15, 30, 0.94);
  border: 1px solid var(--cyan);
  color: var(--ink);
  font-size: 14px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
  animation: toastin 0.25s ease-out;
}
.toast.gold { border-color: var(--amber); }
.toast.pink { border-color: var(--magenta); }
.toast.out { opacity: 0; transition: opacity 0.4s; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Console pane ---------- */
.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border: 1px solid var(--line);
  background: var(--panel);
}
.brand {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line);
}
.brand h1 {
  margin: 0;
  font: 800 26px/1 var(--f-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
}
.brand h1 em { font-style: normal; color: var(--cyan); text-shadow: 0 0 14px rgba(62, 242, 255, 0.5); }
.brand p { margin: 6px 0 0; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1;
  padding: 12px 2px 10px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  font: 600 13px/1 var(--f-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
  cursor: pointer;
}
.tab { position: relative; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--cyan); border-bottom-color: var(--cyan); }
.tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: -4px; }
.tab .badge {
  position: absolute;
  top: 3px;
  right: 3px;
  min-width: 15px;
  padding: 1px 3px;
  font-size: 10px;
}
.badge {
  display: inline-block;
  min-width: 18px;
  margin-left: 4px;
  padding: 2px 5px;
  background: var(--magenta);
  color: var(--bg);
  font: 700 11px/1 var(--f-mono);
  vertical-align: 1px;
}

.panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.panel-body h3 {
  margin: 0;
  font: 600 13px/1.2 var(--f-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.group { display: flex; flex-direction: column; gap: 10px; }

.lot-card {
  border: 1px solid var(--line);
  background: var(--panel-2);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.lot-head { display: flex; align-items: center; gap: 10px; }
.lot-head > div { flex: 1; min-width: 0; }
.lot-head h2 {
  margin: 2px 0 0;
  font: 700 24px/1.1 var(--f-display);
  text-wrap: balance;
}
.nav {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--dim);
  font: 18px/1 var(--f-mono);
  cursor: pointer;
}
.nav:hover { color: var(--cyan); border-color: var(--cyan); }
.nav:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.pips { display: flex; gap: 4px; }
.pip { flex: 1; height: 8px; transform: skewX(-24deg); background: #221d3d; }
.pip.on { background: var(--cyan); box-shadow: 0 0 8px rgba(62, 242, 255, 0.5); }
.pip.next { background: transparent; outline: 1px solid var(--magenta); outline-offset: -1px; }
.blurb { margin: 0; color: var(--dim); font-size: 14px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.kv b { font: 15px/1.3 var(--f-mono); color: var(--cyan); font-variant-numeric: tabular-nums; font-weight: 400; }

.buy {
  --p: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 12px;
  width: 100%;
  padding: 10px 14px;
  border: 1px solid rgba(62, 242, 255, 0.7);
  background:
    linear-gradient(90deg, rgba(62, 242, 255, 0.16) calc(var(--p) * 100%), transparent 0),
    rgba(62, 242, 255, 0.04);
  text-align: left;
  cursor: pointer;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  transition: border-color 0.15s, filter 0.15s;
}
.buy:hover:not(:disabled) { filter: brightness(1.25); }
.buy:focus-visible { outline: 2px solid var(--magenta); outline-offset: -4px; }
.buy:disabled {
  cursor: not-allowed;
  border-color: var(--line);
  background:
    linear-gradient(90deg, rgba(148, 140, 192, 0.12) calc(var(--p) * 100%), transparent 0),
    transparent;
}
.buy .what { font-weight: 600; min-width: 0; }
.buy .sub { grid-column: 1; font: 12.5px/1.3 var(--f-mono); color: var(--ok); font-variant-numeric: tabular-nums; }
.buy:disabled .sub { color: var(--dim); }
.buy .cost {
  grid-row: 1 / span 2;
  grid-column: 2;
  font: 16px/1 var(--f-mono);
  color: var(--amber);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.buy:disabled .cost { color: var(--dim); }
.buy.big .what { font: 700 16px/1.25 var(--f-display); letter-spacing: 0.02em; }
.buy.alt { border-color: rgba(255, 43, 214, 0.7); background: linear-gradient(90deg, rgba(255, 43, 214, 0.16) calc(var(--p) * 100%), transparent 0), rgba(255, 43, 214, 0.04); }
.buy.alt:disabled { border-color: var(--line); background: linear-gradient(90deg, rgba(148, 140, 192, 0.12) calc(var(--p) * 100%), transparent 0), transparent; }
.maxed {
  padding: 10px 14px;
  border: 1px dashed var(--line);
  color: var(--ok);
  font: 14px/1.3 var(--f-mono);
  text-align: center;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 12px;
  padding-block: 10px;
  border-top: 1px solid var(--line);
}
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .name { font-weight: 600; font-size: 16px; }
.row .name small { font: 13px var(--f-mono); color: var(--magenta); margin-left: 6px; }
.row .desc { grid-column: 1; color: var(--dim); font-size: 13.5px; }
.row .owned { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 22px/1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.row .buy { grid-column: 1 / -1; margin-top: 6px; }

.modes { display: flex; gap: 6px; }
.mode {
  padding: 5px 12px;
  border: 1px solid var(--line);
  background: none;
  font: 13px/1 var(--f-mono);
  color: var(--dim);
  cursor: pointer;
}
.mode[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.mode:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.locked {
  padding: 10px 14px;
  border: 1px dashed var(--line);
  color: var(--dim);
  font-size: 14px;
}
.locked b { font-family: var(--f-mono); color: var(--ink); font-weight: 400; }
.installed { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 9px;
  border: 1px solid rgba(93, 255, 176, 0.45);
  color: var(--ok);
  font: 12.5px/1.2 var(--f-mono);
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 16px;
  font-size: 14px;
}
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-block: 4px; }
.stats b { font: 14px var(--f-mono); font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
.stats span { color: var(--dim); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
.wipe {
  padding: 6px 12px;
  border: 1px solid var(--line);
  background: none;
  color: var(--dim);
  font: 12.5px var(--f-mono);
  cursor: pointer;
}
.wipe.armed { border-color: var(--magenta); color: var(--magenta); }
.wipe:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }

/* sector switcher over the city */
.sectorbar {
  position: absolute;
  right: 12px;
  bottom: 42px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px;
  border: 1px solid var(--line);
  background: rgba(8, 7, 15, 0.88);
}
.sectorbar .nav { width: 30px; height: 30px; }
.sector-label { display: grid; min-width: 0; padding-inline: 4px; }
.sector-label b { font: 700 15px/1.15 var(--f-display); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mapbtn {
  padding: 8px 12px;
  border: 1px solid var(--cyan);
  background: rgba(62, 242, 255, 0.1);
  color: var(--cyan);
  font: 600 13px/1 var(--f-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}
.mapbtn[aria-pressed="true"] { background: var(--cyan); color: var(--bg); }
.mapbtn:focus-visible { outline: 2px solid var(--magenta); outline-offset: 1px; }
.city.has-sectors .toasts { bottom: 96px; }
.hud-actions { display: flex; gap: 8px; align-items: stretch; }
.sound {
  width: 44px;
  border: 1px solid var(--line);
  background: rgba(8, 7, 15, 0.7);
  color: var(--dim);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.sound:hover { color: var(--ink); }
.sound:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.sound .waves { display: none; }
.sound[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); }
.sound[aria-pressed="true"] .waves { display: inline; }
.sound[aria-pressed="true"] .mute { display: none; }

/* bulk buying and automation */
.cost .eta { display: block; margin-top: 3px; font-size: 11.5px; color: var(--dim); text-align: right; }
.cost .eta:empty { display: none; }
.auto-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  font: 14px var(--f-body);
  cursor: pointer;
}
.toggle b { font: 14px var(--f-mono); font-weight: 400; color: var(--dim); }
.toggle .knob { width: 30px; height: 14px; border: 1px solid var(--dim); position: relative; flex: none; }
.toggle .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 8px; background: var(--dim); transition: transform 0.15s; }
.toggle[aria-pressed="true"] { border-color: var(--ok); }
.toggle[aria-pressed="true"] b { color: var(--ok); }
.toggle[aria-pressed="true"] .knob { border-color: var(--ok); }
.toggle[aria-pressed="true"] .knob::after { background: var(--ok); transform: translateX(14px); }
.toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.auto-line { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; }
.auto-line select {
  padding: 6px 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font: 14px var(--f-body);
}
.buy.armed { border-color: var(--magenta); }

/* save */
.edicts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.edict {
  display: grid;
  gap: 2px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  text-align: left;
  cursor: pointer;
  min-width: 0;
}
.edict b { font: 600 14px/1.2 var(--f-body); color: var(--ink); }
.edict span { font-size: 12.5px; color: var(--dim); }
.edict small { font: 11.5px var(--f-mono); color: var(--cyan); }
.edict:hover:not(:disabled) { border-color: var(--amber); }
.edict:disabled { cursor: default; }
.edict:disabled small { color: var(--dim); }
.edict.on { border-color: var(--amber); background: rgba(255, 194, 62, 0.08); }
.edict.on small { color: var(--amber); }
.edict:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.cloud { padding: 9px 12px; border: 1px dashed var(--line); color: var(--dim); font-size: 14px; }
.cloud.ok { border: 1px solid rgba(93, 255, 176, 0.5); color: var(--ok); }
.code-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.code {
  width: 100%;
  min-width: 0;
  resize: vertical;
  padding: 8px 10px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font: 12px/1.4 var(--f-mono);
  word-break: break-all;
}
.code:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }

/* achievements */
.achs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ach { display: grid; gap: 1px; padding: 7px 9px; border: 1px dashed var(--line); color: var(--dim); min-width: 0; }
.ach b { font: 600 13.5px/1.25 var(--f-body); color: var(--dim); }
.ach span { font: 12px/1.3 var(--f-mono); }
.ach.got { border: 1px solid rgba(255, 194, 62, 0.55); background: rgba(255, 194, 62, 0.06); }
.ach.got b { color: var(--amber); }
.ach.got span { color: var(--ink); }

/* building types */
.choices { display: flex; flex-direction: column; gap: 8px; }
.line-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; transform: rotate(45deg); vertical-align: 1px; flex: none; }
.tag {
  margin-left: 8px;
  padding: 1px 6px;
  border: 1px solid currentColor;
  font: 11px/1.3 var(--f-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  vertical-align: 2px;
  white-space: nowrap;
}
.row .boost { grid-column: 1; font: 13px/1.3 var(--f-mono); color: var(--ok); }
.sector-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border: 1px solid var(--line);
}
.sector-row.here { border-color: var(--magenta); }
.sector-row span { display: grid; min-width: 0; }
.sector-row small { font: 12.5px var(--f-mono); color: var(--dim); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .city { height: 62svh; min-height: 380px; }
  .panel-body { overflow: visible; }
}
@media (max-width: 480px) {
  .sectorbar { left: 12px; }
  .sector-label { flex: 1; }
  .hud { padding: 10px 12px; }
  .hack { padding: 8px 14px 8px 12px; }
  .hack b { font-size: 15px; }

  S.sectors[sec].sel = k;
  startFabrication(sec, k);
  if (ownedIn(sec) === N * N) toast(`Every lot in ${sectorName(sec)} is yours.`, 'gold');
  afterChange();
  return true;
}
function hireN(id, n) {

  const first = !S.crew[id];
  S.crew[id] = (S.crew[id] || 0) + n;
  if (first) toast(`${LINES[id].name} buildings unlocked. Upgrade a Shack to build one for your ${c.name}s.`, 'pink');
  afterChange();
  return true;
}
const hireCrew = id => hireN(id, crewMode === 'max' ? crewMax(CREW_BY_ID[id]) : crewMode);
function buyTech(id) {
  const t = TECH_BY_ID[id];
  if (!t || S.tech.includes(id) || !t.req() || !spend(t.cost)) return false;
  S.tech.push(id);
  toast(`${t.name} installed. ${t.desc}`, 'pink');
  afterChange();
  return true;
}
function buildRoad(type) {
  const k = S.sectors.length;
  if (!DISTRICTS[type] || type === 'capital' || !districtUnlocked(type)) return false;
  if (!roadReady() || !spend(roadCost(k))) return false;
  S.sectors.push(newSector(type));
  S.roads[k] = 1;
  S.cur = k;
  view = 'city';
  startFabrication(k, CENTER * N + CENTER);
  const D = DISTRICTS[type];
  toast(`Cyber road open to ${sectorName(k)}. ${perkText(D.perk)} here, everything earns ×${fmt(secOut(k))}, and all crew pay rose ×${CREW_SECTOR}.`, 'gold');
  afterChange();
  return true;
}
function upgradeRoad(k) {
  if (!S.roads[k] || S.roads[k] >= 4 || !spend(roadUpgradeCost(k))) return false;
  S.roads[k]++;
  toast(`Road to ${sectorName(k)} upgraded to ${ROAD_LEVELS[S.roads[k]].name}. All output +${Math.round(ROAD_BONUS * 100)}%.`, 'pink');
  afterChange();
  return true;
}

// Bulk buying. Build-tab buttons stay inside one district; the crew button only hires crew.
let batching = 0;
function batch(fn) {
  batching++;
  let n = 0;
  try { n = fn(); } finally { batching--; }
  if (n) { recalc(); dirty = true; save(); }
  return n;
}
function upgradeAllIn(sec, limit = 5000) {
  return batch(() => {
    let n = 0;
    for (; n < limit; n++) {
      const c = cheapestUpgrade(sec);
      if (!c || c.cost > S.credits || !upgradeLot(sec, c.k)) break;
    }
    return n;
  });
}
function buyAllLotsIn(sec, limit = 49) {
  return batch(() => {
    let n = 0;
    while (n < limit && acquireLot(sec)) n++;
    return n;
  });
}
// Cheapest single hire first, across every role you can see.
function cheapestHire() {
  let best = null;
  CREW.forEach((c, i) => {
    if (!crewVisible(i)) return;
    const cost = crewCost(c, 1);
    if (!best || cost < best.cost) best = { id: c.id, cost };
  });
  return best;
}
function hireAll(limit = 5000) {
  return batch(() => {
    let n = 0;
    for (; n < limit; n++) {
      const h = cheapestHire();
      if (!h || h.cost > S.credits || !hireN(h.id, 1)) break;
    }
    return n;
  });
}
// The auto-builder works on every district, cheapest purchase first.
function autoBuildTick(limit) {
  return batch(() => {
    let n = 0;
    while (n < limit) {
      let best = null;
      S.sectors.forEach((_, i) => {
        const u = cheapestUpgrade(i);
        if (u && (!best || u.cost < best.cost)) best = { cost: u.cost, run: () => upgradeLot(i, u.k) };
        if (nextLot(i) !== undefined) {
          const c = lotCost(i);
          if (!best || c < best.cost) best = { cost: c, run: () => acquireLot(i) };
        }
      });
      if (!best || best.cost > S.credits || !best.run()) break;
      n++;
    }
    return n;
  });
}

// Reboot the Grid: start over with Neural Chips. Achievements, chips and lifetime earnings stay.
function reboot() {
  if (!canReboot()) return false;
  const gained = pendingChips();
  const keep = { chips: S.chips + gained, reboots: S.reboots + 1, lifetime: S.lifetime, ach: S.ach.slice(), auto: { ...S.auto } };
  S = Object.assign(fresh(), keep);
  view = 'city';
  fabs.clear();
  startFabrication(0, cur().sel);
  afterChange();
  updateSectorBar();
  toast(`Grid rebooted. ${gained} Neural Chips installed: all income +${Math.round(gained * CHIP_BONUS * 100)}% more than before.`, 'gold');
  return gained;
}

function edictReadyIn() { return Math.max(0, EDICT_COOLDOWN - (Date.now() - S.edictAt) / 1000); }
function enactEdict(id) {
  if (!EDICTS[id] || S.edict === id || ownedIn(0) < EDICT_LOTS || (S.edict && edictReadyIn() > 0)) return false;
  S.edict = id;
  S.edictAt = Date.now();
  toast(`Edict enacted: ${EDICTS[id].name}. ${EDICTS[id].what}`, 'gold');
  afterChange();
  return true;
}

function afterChange() {
  if (batching) return;
  recalc();
  dirty = true;
  save();
}

// World coordinates: lot (I, J) on one big grid shared by every sector.
function lotIJ(sec, k) {
  const [a, b] = SECTOR_POS[sec];
  return [a * SPAN + (k % N), b * SPAN + Math.floor(k / N)];
}
const worldX = (I, J) => (I - J) * 0.5;
const worldY = (I, J) => (I + J) * 0.25;

}
const showGhost = () => roadReady() || view === 'map';

function cameraTarget() {

    const x = worldX(I, J), y = worldY(I, J);
    minX = Math.min(minX, x - 0.5); maxX = Math.max(maxX, x + 0.5);
    minY = Math.min(minY, y - 0.25 - h); maxY = Math.max(maxY, y + 0.25);
  };
  if (view === 'map') {
    const count = S.sectors.length + (showGhost() ? 1 : 0);
    for (let sec = 0; sec < count; sec++) {
      const [I0, J0] = lotIJ(sec, 0);
      let h = 0;
      if (S.sectors[sec]) S.sectors[sec].lots.forEach((t, k) => { if (t) h = Math.max(h, topOf(sec, k)); });
      include(I0, J0, h); include(I0 + N - 1, J0, h); include(I0, J0 + N - 1, h); include(I0 + N - 1, J0 + N - 1, h);
    }
  } else {
    const s = cur();
    for (let k = 0; k < N * N; k++) {
      if (!s.lots[k]) continue;
      const i = k % N, j = Math.floor(k / N);
      const [I, J] = lotIJ(S.cur, k);
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
        if (i + di >= 0 && j + dj >= 0 && i + di < N && j + dj < N) include(I + di, J + dj, 0);
      }
      include(I, J, topOf(S.cur, k) + 0.1);
    }
  }
  const avH = Math.max(80, H - HUD_TOP - hudBottom());
  let s = Math.min(W * 0.88 / (maxX - minX), avH * 0.9 / (maxY - minY));
  s = Math.min(s, W * 0.36, 360);
  return { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s };
}

function poly(g, pts) {
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let n = 1; n < pts.length; n++) g.lineTo(pts[n][0], pts[n][1]);
  g.closePath();
  g.fill();
}

// A box standing on a diamond footprint centred at (x, y), from height z0 to z1 (pixels).
function box(g, x, y, hw, hh, z0, z1, skin) {
  g.fillStyle = skin.l;
  poly(g, [[x - hw, y - z0], [x, y + hh - z0], [x, y + hh - z1], [x - hw, y - z1]]);
  g.fillStyle = skin.r;
  poly(g, [[x, y + hh - z0], [x + hw, y - z0], [x + hw, y - z1], [x, y + hh - z1]]);
  g.fillStyle = skin.t;
  poly(g, [[x - hw, y - z1], [x, y + hh - z1], [x + hw, y - z1], [x, y - hh - z1]]);
  g.strokeStyle = skin.e;
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(x - hw, y - z1); g.lineTo(x, y - hh - z1); g.lineTo(x + hw, y - z1); g.lineTo(x, y + hh - z1); g.closePath();
  g.moveTo(x, y + hh - z1); g.lineTo(x, y + hh - z0);
  g.stroke();

// Map a point on a box face (u across 0..1, v up 0..1) to sprite coordinates.
function faceTransform(g, side, x, y, hw, hh, z0, z1) {
  const h = z1 - z0;

  else g.transform(hw, -hh, 0, -h, x, y + hh - z0);
}
function facePoint(side, x, y, hw, hh, z0, z1, u, v) {

    ? [x - hw + hw * u, y - z0 + hh * u - h * v]
    : [x + hw * u, y + hh - z0 - hh * u - h * v];
}

function windows(g, s, tier, x, y, hw, hh, z0, z1, R, dom, alt, wins, needle) {
  const floors = Math.max(1, Math.round((z1 - z0) / (s * 0.075)));
  const cols = clamp(Math.round((hw * 2 / s) * 8), needle ? 1 : 2, 7);
  const glass = tier >= 5;
  const litP = 0.28 + tier * 0.05;
  const ww = glass ? 0.78 : 0.56, wh = glass ? 0.42 : 0.5;
  const dark = glass ? '#1b2346' : '#241c44';
  for (const side of ['L', 'R']) {
    g.save();
    faceTransform(g, side, x, y, hw, hh, z0, z1);
    const a = side === 'L' ? 0.72 : 1;
    g.globalAlpha = a;
    for (let r = 0; r < floors; r++) {
      for (let c = 0; c < cols; c++) {
        const lit = R() < litP;
        let col = dark;
        if (lit) {
          const pick = R();
          col = pick < 0.6 ? dom : pick < 0.82 ? alt : pick < 0.92 ? WARM : '#e9e4ff';
        }
        g.fillStyle = col;
        const u0 = (c + (1 - ww) / 2) / cols, v0 = (r + 0.18) / floors, u1 = u0 + ww / cols, v1 = v0 + wh / floors;
        g.fillRect(u0, v0, u1 - u0, v1 - v0);
        // keep a sample of windows whose lights will switch on and off at night
        if (wins && wins.length < 14 && R() < 0.1) {
          const pts = [[u0, v0], [u1, v0], [u1, v1], [u0, v1]].flatMap(([u, v]) => facePoint(side, x, y, hw, hh, z0, z1, u, v));
          wins.push({ pts, a, on: lit ? col : (R() < 0.6 ? dom : WARM), off: dark, lit, per: 3 + R() * 14, ph: R() * 20 });
        }
      }
    }
    g.restore();
  }
}

function glowRect(g, x, y, w, h, color, blur) {
  g.save();
  g.shadowColor = color;
  g.shadowBlur = blur;
  g.fillStyle = color;
  g.fillRect(x, y, w, h);
  g.restore();
}

    g.fillRect(x - 3.8 * u, y - 6.6 * u, 7.6 * u, 0.9 * u);
    g.fillRect(x - 3 * u, y - 4.8 * u, 6 * u, 0.6 * u);

  g.restore();

// A building's massing: the boxes it is made of, any crown on top, and its height.
// Parts are boxes on a diamond footprint: w is the footprint as a share of a lot, z0/z1 their
// bottom and top in lot-widths, dI/dJ an offset inside the lot along the grid axes.
// The first specialization (tier 3) sets the massing; the second (tier 6) adds a crown.
const TIER_TOP = [0, 0.2, 0.3, 0.72, 1.1, 1.75, 2.45, 3.15, 3.8];
const shapeCache = new Map();
function shapeOf(tier, spec) {
  const key = tier + ':' + (spec || '');

  if (sh) return sh;
  const b1 = tier >= 3 ? (spec && spec[0]) || '-' : '';
  const b2 = tier >= 6 ? (spec && spec[1]) || '' : '';
  const H = TIER_TOP[tier];
  let parts = [], spire = 0, main = 0;
  if (!b1 || b1 === '-') {
    let z = 0;
    for (const [w, top] of SHAPES[tier].sections) { parts.push({ w, z0: z, z1: top, dI: 0, dJ: 0 }); z = top; }
    spire = SHAPES[tier].spire || 0;
  } else if (b1 === 't') {
    // Highrise: slender and tall, stepping in twice
    const h = H * 1.3;
    parts = [{ w: 0.5, z0: 0, z1: h * 0.52 }, { w: 0.41, z0: h * 0.52, z1: h * 0.84 }, { w: 0.31, z0: h * 0.84, z1: h }];
    spire = 0.22 + tier * 0.05;

function sprite(tier, line, spec, seed, s) {
  const q = Math.pow(2, Math.round(Math.log2(s) * 8) / 8);
  const base = `${tier}:${line || ''}:${spec || ''}:${seed}`;
  const key = `${base}:${q.toFixed(2)}:${DPR}`;
  let sp = spriteCache.get(key);
  if (sp) return sp;
  // Drawing a sprite costs a few hundred rectangles, so only a handful are made per frame.
  // While zooming, the nearest existing size stands in until its turn comes.
  if (spriteBudget <= 0 && spriteLatest.has(base)) return spriteLatest.get(base);
  spriteBudget--;
  if (spriteCache.size > 600) spriteCache.clear();
  sp = makeSprite(tier, line, spec, seed, q);
  sp.q = q;
  spriteCache.set(key, sp);
  spriteLatest.set(base, sp);
  return sp;
}

/* ================================================================

   ================================================================ */
const fabs = new Map();          // "sector:lot" -> fabrication start time
const particles = [];
const floaters = [];
let rain = [];
const cars = [];
const courier = { active: false, x: 0, y: 0, cy: 0, dir: 1, next: 0 };

// Small gradient textures made once per colour and stamped with drawImage,
// which is far cheaper than building a fresh gradient for every car and tower each frame.
const fxCache = new Map();
function poolSprite(color) {
  const key = 'p' + color;
  let c = fxCache.get(key);
  if (!c) {
    c = document.createElement('canvas'); c.width = 96; c.height = 56;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(48, 28, 2, 48, 28, 44);
    gr.addColorStop(0, color + '38'); gr.addColorStop(1, color + '00');
    g.fillStyle = gr; g.fillRect(0, 0, 96, 56);
    fxCache.set(key, c);
  }
  return c;
}
function trailSprite(color, dir) {
  const key = 't' + color + dir;
  let c = fxCache.get(key);
  if (!c) {
    c = document.createElement('canvas'); c.width = 68; c.height = 3;
    const g = c.getContext('2d');
    const gr = dir > 0 ? g.createLinearGradient(68, 0, 0, 0) : g.createLinearGradient(0, 0, 68, 0);
    gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 68, 3);
    fxCache.set(key, c);
  }
  return c;
}

function startFabrication(sec, k) { fabs.set(sec + ':' + k, performance.now()); }

function initRain() {
  rain = [];
  if (reduceMotion) return;
  const n = Math.round(W * H / 6000);
  for (let i = 0; i < n; i++) rain.push({ x: Math.random() * W, y: Math.random() * H, v: 500 + Math.random() * 300 });
}
for (let i = 0; i < 9; i++) {
  cars.push({ lane: i % 3, x: Math.random(), v: (0.03 + Math.random() * 0.05) * (i % 2 ? 1 : -1), c: PAL[i % 3] });
}

function spawnSparks(x, y, color) {
  if (reduceMotion) return;
  for (let n = 0; n < 22; n++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.8 + Math.random() * 0.5, c: color });
  }
}
function floater(x, y, text, color) {
  floaters.push({ x, y, text, c: color, life: 1.3 });
  if (floaters.length > 30) floaters.shift();
}

/* ================================================================
   Drawing
   ================================================================ */
function draw(now, dt) {
  const t = now / 1000;
  spriteBudget = 8;
  if (backdropTheme !== cur().type) buildBackdrop(cur().type);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(backdrop, 0, 0, W, H);

  // sky traffic behind the city
  for (const car of cars) {
    if (!reduceMotion) { car.x += car.v * dt; if (car.x > 1.1) car.x = -0.1; if (car.x < -0.1) car.x = 1.1; }
    const y = H * (0.2 + car.lane * 0.07), x = car.x * W, dir = Math.sign(car.v);
    ctx.globalAlpha = 0.55;
    ctx.drawImage(trailSprite(car.c, dir), dir > 0 ? x - 34 : x, y - 0.75, 34, 1.5);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2);
  }

  for (let sec = 0; sec < S.sectors.length; sec++) drawGround(sec, t);
  if (showGhost()) drawGhostSector(S.sectors.length, t);
  drawRoads(t);
  drawSearchlights(t);
  updateLife(dt);
  drawBuildings(now, t);
  if (view === 'map') drawMapLabels();

  for (let n = particles.length - 1; n >= 0; n--) {
    const p = particles[n];
    p.life -= dt; if (p.life <= 0) { particles.splice(n, 1); continue; }
    p.vy += 180 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.fillStyle = p.c; ctx.fillRect(p.x - 1, p.y - 1, 2.2, 2.2);
  }
  ctx.globalAlpha = 1;

  drawCourier(now, dt);

  ctx.textAlign = 'center';
  for (let n = floaters.length - 1; n >= 0; n--) {
    const f = floaters[n];

function sectorCorners(sec) {

function drawGround(sec, t) {

  const s = S.sectors[sec];

// The next sector, before its road is built: a dashed outline of land waiting.

// Cyber roads cross the gap between each sector and the one before it.
function roadEnds(k) {

function drawRoads(t) {
  const count = S.sectors.length + (showGhost() ? 1 : 0);
  for (let k = 1; k < count; k++) {
    const built = k < S.sectors.length;
    const [[I1, J1], [I2, J2]] = roadEnds(k);
    // run the road a little into each sector so it meets the streets
    const dI = Math.sign(I2 - I1), dJ = Math.sign(J2 - J1);
    const p1 = [sx(worldX(I1 - dI * 0.5, J1 - dJ * 0.5)), sy(worldY(I1 - dI * 0.5, J1 - dJ * 0.5))];
    const p2 = [sx(worldX(I2 + dI * 0.5, J2 + dJ * 0.5)), sy(worldY(I2 + dI * 0.5, J2 + dJ * 0.5))];
    if (Math.max(p1[0], p2[0]) < -40 || Math.min(p1[0], p2[0]) > W + 40 || Math.max(p1[1], p2[1]) < -40 || Math.min(p1[1], p2[1]) > H + 40) continue;
    const lv = built ? S.roads[k] : 0;
    const color = built ? ROAD_LEVELS[lv].color : 'rgba(148, 140, 192, 0.5)';
    const width = Math.max(2, cam.s * (0.12 + lv * 0.05));
    ctx.save();
    ctx.lineCap = 'round';
    if (!built) {
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
      ctx.restore();

    }
    ctx.strokeStyle = '#120f22'; ctx.lineWidth = width + 4;
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.lineWidth = 1.5;
    const nx = -(p2[1] - p1[1]), ny = p2[0] - p1[0], nl = Math.hypot(nx, ny) || 1;

    ctx.moveTo(p1[0] - ox, p1[1] - oy); ctx.lineTo(p2[0] - ox, p2[1] - oy);
    ctx.stroke();

    const lanes = lv, speed = 0.25 + lv * 0.15;

      for (let n = 0; n < 4; n++) {
        let f = ((reduceMotion ? 0 : t * speed) + n / 4 + ln * 0.13) % 1;
        if (ln % 2) f = 1 - f;

      }
    }
    ctx.restore();
  }
}

function buildingList() {
  const out = [];
  for (let sec = 0; sec < S.sectors.length; sec++) {
    const s = S.sectors[sec];
    for (let k = 0; k < N * N; k++) if (s.lots[k]) {
      const [I, J] = lotIJ(sec, k);
      out.push({ kind: 'b', d: I + J, sec, k, tier: s.lots[k], line: s.lots[k] >= 2 ? s.lines[k] : null, spec: specOf(sec, k) });

}
function roofPoint(sec, k) {

/* ---------- street life: pedestrians, hover cars, police drones ---------- */
// Everything here lives on the world grid of the district being viewed. Pedestrians walk the
// streets between lots; cars and drones fly above them. All of it is drawn in depth order

  const s = S.sectors[sec];
  const owned = [];

  const k = owned[Math.floor(Math.random() * owned.length)] ?? CENTER * N + CENTER;
  const [I, J] = lotIJ(sec, k);
  return [I + (Math.random() < 0.5 ? -0.5 : 0.5), J + (Math.random() < 0.5 ? -0.5 : 0.5)];
}
function newPed(sec) {
  const [I, J] = streetPoint(sec);

  return { I, J, axis, dir: Math.random() < 0.5 ? 1 : -1, v: 0.22 + Math.random() * 0.25, off: (Math.random() < 0.5 ? -1 : 1) * (0.05 + Math.random() * 0.04),

function newCar(sec, police) {
  const [a, b] = SECTOR_POS[sec];

  const lane = Math.floor(Math.random() * (N + 1)) - 0.5;
  const span = [-1.5, N + 0.5];
  const dir = Math.random() < 0.5 ? 1 : -1;
  const p = span[0] + Math.random() * (span[1] - span[0]);
  return { along, dir, I: a * SPAN + (along === 'I' ? p : lane), J: b * SPAN + (along === 'J' ? p : lane), z: police ? 0.5 + Math.random() * 0.5 : 0.9 + Math.random() * 2.2,
           v: police ? 0.9 + Math.random() * 0.4 : 1.4 + Math.random() * 1.6, c: PAL[Math.floor(Math.random() * 3)], police };
}
function updateLife(dt) {
  const sec = S.cur;

  const own = ownedIn(sec);
  const wantPeds = Math.min(130, Math.round((6 + own * 1.2) * (busy(sec) ? 1.8 : 1)));
  const wantCars = busy(sec) ? Math.min(16, 4 + Math.floor(own / 4)) : Math.min(7, 1 + Math.floor(own / 8));
  const wantDrones = busy(sec) && own >= 6 ? 3 : 0;
  while (life.peds.length < wantPeds) life.peds.push(newPed(sec));
  if (life.peds.length > wantPeds) life.peds.length = wantPeds;
  while (life.cars.length < wantCars) life.cars.push(newCar(sec, false));
  if (life.cars.length > wantCars) life.cars.length = wantCars;
  while (life.drones.length < wantDrones) life.drones.push(newCar(sec, true));
  if (life.drones.length > wantDrones) life.drones.length = wantDrones;

    const base = key === 'I' ? I0 : J0;
    const before = p[key] - base;

    const after = p[key] - base;
    // reaching a crossing: carry on, turn, or stop for a moment
    const cross = Math.floor(Math.max(before, after) + 0.5) - 0.5;
    if ((before - cross) * (after - cross) < 0 && cross >= lo && cross <= hi) {
      p[key] = base + cross;
      const r = Math.random();
      if (r < 0.35) { p.axis = key === 'I' ? 'J' : 'I'; p.dir = Math.random() < 0.5 ? 1 : -1; }
      else if (r < 0.42) p.pause = 0.5 + Math.random() * 2;
      const k2 = p.axis, b2 = k2 === 'I' ? I0 : J0, here = p[k2] - b2;
      if ((here <= lo + 0.01 && p.dir < 0) || (here >= hi - 0.01 && p.dir > 0)) p.dir *= -1;

}
function lifeEntries() {

function drawPed(e, t) {

  const m = sp.main;
  ctx.save();
  faceTransform(ctx, side, dx + (sp.ox + m.x) * sc, dy + (sp.oy + m.y) * sc, m.hw * sc, m.hh * sc, m.z0 * sc, m.z1 * sc);
  ctx.translate(u0, v1);
  ctx.scale((u1 - u0) / PW, -(v1 - v0) / PH);
  ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
  fn();
  ctx.restore();
}
function drawJumbotron(sp, sc, dx, dy, seed, t) {
  facePanel(sp, sc, dx, dy, 'R', 0.08, 0.92, 0.62, 0.8, 240, 44, () => {
    ctx.fillStyle = '#05040a'; ctx.fillRect(0, 0, 240, 44);
    ctx.font = '700 26px "Share Tech Mono", ui-monospace, monospace';
    ctx.textBaseline = 'middle';
    const tick = Math.floor(t / 2.5);
    let x = 240 - ((reduceMotion ? 0 : t * 38) + seed % 200) % 900;
    for (let n = 0; n < 12; n++) {
      const sym = TICKERS[(seed + n) % TICKERS.length];
      const up = hash(seed * 13 + n * 7 + tick) % 100 < 55;
      const pct = ((hash(seed + n * 3 + tick) % 900) / 100).toFixed(2);
      const txt = `${sym} ${up ? '▲' : '▼'}${pct}  `;
      ctx.fillStyle = up ? '#5dffb0' : '#ff3b5c';
      ctx.fillText(txt, x, 23);
      x += ctx.measureText(txt).width;
      if (x > 260) break;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; for (let r = 0; r < 44; r += 4) ctx.fillRect(0, r, 240, 1);
  });
}
const BILL_WORDS = ['PLAY', 'WIN', 'JACK IN', 'LEVEL UP', 'NEON', 'VR NOW', 'GAME ON'];
function drawElectricBillboard(sp, sc, dx, dy, seed, t) {
  facePanel(sp, sc, dx, dy, 'L', 0.1, 0.9, 0.5, 0.78, 200, 70, () => {
    const mode = Math.floor((t + seed % 7) / 4) % 3;
    const hue = ((reduceMotion ? 0 : t * 60) + seed * 37) % 360;
    ctx.fillStyle = '#07030c'; ctx.fillRect(0, 0, 200, 70);
    if (mode === 0) {
      for (let i = 0; i < 10; i++) { ctx.fillStyle = `hsl(${(hue + i * 36) % 360} 100% 60%)`; ctx.fillRect(i * 20, 0, 20, 70); }
    } else if (mode === 1) {
      ctx.fillStyle = `hsl(${hue} 100% 62%)`;
      ctx.font = '800 38px "Tektur", "Chakra Petch", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (reduceMotion || Math.sin(t * 9) > -0.3) ctx.fillText(BILL_WORDS[(seed + Math.floor(t / 4)) % BILL_WORDS.length], 100, 37);
    } else {
      for (let i = 0; i < 6; i++) {
        const r = ((reduceMotion ? 0 : t * 40) + i * 14) % 84;
        ctx.strokeStyle = `hsl(${(hue + i * 50) % 360} 100% 60%)`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(100, 35, r, r * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
  });
}

function drawBuildings(now, t) {
  const order = buildingList().concat(lifeEntries()).sort((a, b) => a.d - b.d);
  const glow = cam.s > 26 && !Perf.lite(), detail = cam.s > 30;
  for (const e of order) {
    if (e.kind === 'p') { drawPed(e, t); continue; }
    if (e.kind === 'c') { drawCar(e.o, t); continue; }
    if (e.kind === 'm') { drawMonument(e, t); continue; }
    const { sec, k, tier, line, spec } = e;
    const seed = seedOf(sec, k);
    const [x, y] = lotScreen(sec, k);
    const top = shapeOf(tier, spec).top * cam.s;
    if (x < -cam.s || x > W + cam.s || y - top > H + 10 || y < -cam.s) continue;
    const dom = lineColor(line && line !== 'hab' ? line : null, seed);
    const faded = view === 'city' && sec !== S.cur;
    ctx.globalAlpha = faded ? 0.22 : 1;
    if (glow && !faded) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(poolSprite(dom), x - cam.s * 0.6, y - cam.s * 0.35, cam.s * 1.2, cam.s * 0.7);
      ctx.globalCompositeOperation = 'source-over';
    }

    const sp = sprite(tier, line, spec, seed, cam.s);
    const sc = cam.s / sp.q;
    const dx = x - sp.ox * sc, dy = y - sp.oy * sc, dw = sp.w * sc, dh = sp.h * sc;
    const fkey = sec + ':' + k;
    const fab = fabs.get(fkey);
    if (fab !== undefined) {
      const p = clamp((now - fab) / 900, 0, 1);
      if (p >= 1) {
        fabs.delete(fkey);
        spawnSparks(x, y - top, dom);
      }
      const ease = 1 - Math.pow(1 - p, 2);
      const cut = dy + dh * (1 - ease);
      ctx.save();
      ctx.beginPath(); ctx.rect(dx - 2, cut, dw + 4, dh); ctx.clip();
      ctx.drawImage(sp.c, dx, dy, dw, dh);
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = '#3ef2ff'; ctx.shadowColor = '#3ef2ff'; ctx.shadowBlur = 12; ctx.lineWidth = 2;
      ctx.globalAlpha = 1 - p * 0.6;
      ctx.beginPath(); ctx.moveTo(dx + dw * 0.1, cut); ctx.lineTo(dx + dw * 0.9, cut); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.drawImage(sp.c, dx, dy, dw, dh);
    ctx.globalAlpha = 1;
    if (faded) continue;

    // rooms switching their lights on and off
    if (cam.s > 36 && sp.wins.length) {
      for (let i = 0; i < sp.wins.length; i++) {
        const w = sp.wins[i];
        // the sprite already shows the window's usual state; only a switched light needs painting
        if (hash(seed * 31 + i * 7 + Math.floor((t + w.ph) / w.per)) % 100 >= 45) continue;
        ctx.globalAlpha = w.a;
        ctx.fillStyle = w.lit ? w.off : w.on;
        const p = w.pts;
        ctx.beginPath();
        ctx.moveTo(dx + p[0] * sc, dy + p[1] * sc); ctx.lineTo(dx + p[2] * sc, dy + p[3] * sc);
        ctx.lineTo(dx + p[4] * sc, dy + p[5] * sc); ctx.lineTo(dx + p[6] * sc, dy + p[7] * sc);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // district signage
    const dtype = S.sectors[sec].type;
    if (detail && dtype === 'financial' && tier >= 4) drawJumbotron(sp, sc, dx, dy, seed, t);
    if (detail && dtype === 'entertainment' && tier >= 3) drawElectricBillboard(sp, sc, dx, dy, seed, t);

    // blinking aircraft beacon
    if (sp.beacon && Math.sin(t * 2.4 + seed) > 0.2) {
      ctx.save();
      ctx.fillStyle = '#ff3b4f'; ctx.shadowColor = '#ff3b4f'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(dx + sp.beacon[0] * sc, dy + sp.beacon[1] * sc, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  // selection chevron above the chosen building
  const s = cur();
  if (view === 'city' && s.lots[s.sel]) {
    const [rx, ry] = roofPoint(S.cur, s.sel);
    const bob = reduceMotion ? 0 : Math.sin(t * 3) * 3;
    const y = ry - 14 + bob;
    ctx.save();
    ctx.strokeStyle = '#ff2bd6'; ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 8; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(rx - 7, y - 6); ctx.lineTo(rx, y); ctx.lineTo(rx + 7, y - 6); ctx.stroke();
    ctx.restore();
  }
}

function drawMapLabels() {
  ctx.textAlign = 'center';
  for (let sec = 0; sec < S.sectors.length; sec++) {
    const { bottom } = sectorCorners(sec);
    const x = bottom[0], y = bottom[1] + 0.22 * cam.s + 18;
    if (x < -100 || x > W + 100 || y < 0 || y > H + 40) continue;
    const here = sec === S.cur;
    ctx.font = '700 13px "Tektur", "Chakra Petch", system-ui, sans-serif';
    ctx.fillStyle = here ? '#ff2bd6' : '#ece8ff';
    ctx.fillText(sectorName(sec).toUpperCase(), x, y);
    ctx.font = '12px "Share Tech Mono", ui-monospace, monospace';
    ctx.fillStyle = '#3ef2ff';
    ctx.fillText(`+${fmt(SECTOR_CPS[sec] || 0, true)}/s · ${ownedIn(sec)}/${N * N} lots`, x, y + 15);
    ctx.fillStyle = `rgb(${theme(sec).haze})`;
    ctx.fillText(perkText(perkOf(sec)), x, y + 30);
  }
}

function drawCourier(now, dt) {
  if (!courier.active) {
    if (now > courier.next && !document.hidden) {
      courier.active = true;
      courier.dir = Math.random() < 0.5 ? 1 : -1;
      courier.x = courier.dir > 0 ? -30 : W + 30;
      courier.y = HUD_TOP + 10 + Math.random() * Math.max(20, (H - HUD_TOP) * 0.3);
      courier.phase = Math.random() * 6;
    }
    return;
  }
  courier.x += courier.dir * (W / 11) * dt;
  courier.phase += dt;
  const y = courier.y + (reduceMotion ? 0 : Math.sin(courier.phase * 2) * 6);
  courier.cy = y;
  if (courier.x < -40 || courier.x > W + 40) { courier.active = false; scheduleCourier(now); return; }
  const x = courier.x;
  ctx.save();
  ctx.strokeStyle = '#ffc23e'; ctx.fillStyle = '#ffc23e'; ctx.shadowColor = '#ffc23e'; ctx.shadowBlur = 14; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 13, y - 5); ctx.lineTo(x + 13, y - 5); ctx.stroke();
  ctx.fillRect(x - 6, y - 4, 12, 7);
  ctx.beginPath(); ctx.moveTo(x - 4, y + 3); ctx.lineTo(x - 2, y + 11); ctx.lineTo(x + 2, y + 11); ctx.lineTo(x + 4, y + 3); ctx.fill();
  if (Math.sin(courier.phase * 10) > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 2, 2, 2); }
  ctx.font = '12px "Share Tech Mono", ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255, 194, 62, 0.85)';
  ctx.fillText('DATA COURIER', x, y - 12);
  ctx.restore();
}
function scheduleCourier(now) {
  courier.next = now + (45000 + Math.random() * 60000) / M.courierRate;
}

/* ================================================================
   Input on the city
   ================================================================ */
function pickLot(px, py) {
  const wx = (px - W / 2) / cam.s + cam.x;
  const wy = (py - midY()) / cam.s + cam.y;
  const I = Math.round(wx + 2 * wy), J = Math.round(2 * wy - wx);
  const count = S.sectors.length + 1;
  for (let sec = 0; sec < count; sec++) {
    const [a, b] = SECTOR_POS[sec];
    const i = I - a * SPAN, j = J - b * SPAN;
    if (i >= 0 && j >= 0 && i < N && j < N) return { sec, k: j * N + i };
  }
  return null;
}

cvs.addEventListener('pointerdown', e => {
  const r = cvs.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (courier.active && Math.hypot(px - courier.x, py - courier.cy) < 30) {
    const gain = Math.max(25, CPS * 45) * M.courierPay;
    earn(gain);
    S.couriers++;
    courier.active = false;
    scheduleCourier(performance.now());
    floater(px, py, '+' + fmt(gain), '#ffc23e');
    spawnSparks(px, py, '#ffc23e');
    toast(`Courier intercepted. Its payload sold for ${fmt(gain)} credits.`, 'gold');
    Sound.courier();
    dirty = true;
    return;
  }
  if (view === 'map') {
    const hit = pickLot(px, py);
    if (!hit) return;
    if (hit.sec < S.sectors.length) { goSector(hit.sec); setView('city'); }
    else setTab('infra');
    return;
  }
  // buildings first, front to back, since tall ones cover the lots behind them
  const order = buildingList().sort((a, b) => b.d - a.d);
  for (const { sec, k, tier: t, spec } of order) {
    const [x, y] = lotScreen(sec, k);
    const sh = shapeOf(t, spec), hw = cam.s * sh.reach, hh = cam.s * 0.5 * sh.reach;
    if (px > x - hw && px < x + hw && py < y + hh && py > y - hh - sh.top * cam.s) {
      select(sec, k);
      return;
    }
  }
  const hit = pickLot(px, py);
  if (!hit) return;
  if (hit.sec >= S.sectors.length) { setTab('infra'); return; }
  const s = S.sectors[hit.sec];
  if (s.lots[hit.k]) { select(hit.sec, hit.k); return; }
  if (hit.sec === S.cur && hit.k === nextLot(hit.sec)) {
    if (acquireLot(hit.sec)) {
      const [x, y] = lotScreen(hit.sec, hit.k);
      floater(x, y - 10, 'Lot ' + lotName(hit.k), '#3ef2ff');
    } else {
      toast(`Lot ${lotName(hit.k)} costs ${fmt(lotCost(hit.sec))} credits. You have ${fmt(S.credits)}.`);
    }
  }
});

function select(sec, k) {
  if (sec !== S.cur) goSector(sec);
  S.sectors[sec].sel = k;
  setTab('build');
  dirty = true;
}
function goSector(sec) {
  if (sec === S.cur) return;
  S.cur = sec;
  updateSectorBar();
  dirty = true;
}
function setView(v) {
  view = v;
  updateSectorBar();
  dirty = true;
}

$('#hack').addEventListener('click', () => {
  const gain = hackValue();
  earn(gain);
  S.hacks++;
  const s = cur();
  const [rx, ry] = view === 'city' ? roofPoint(S.cur, s.sel) : [W / 2, H / 2];
  floater(rx + (Math.random() - 0.5) * 30, ry - 18, '+' + fmt(gain, true), '#ff2bd6');
  Sound.hack();
  const b = $('#hack');
  b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
});

const sectorBar = $('#sectorbar');
function updateSectorBar() {
  const multi = S.sectors.length > 1;
  sectorBar.hidden = !multi;
  $('#city-pane').classList.toggle('has-sectors', multi);
  $('#sector-num').textContent = `${perkText(perkOf(S.cur))} here`;
  $('#sector-name').textContent = sectorName(S.cur);
  const mb = $('#mapbtn');
  mb.setAttribute('aria-pressed', String(view === 'map'));
  mb.textContent = view === 'map' ? 'Close map' : 'Map';
}
sectorBar.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'mapbtn') { setView(view === 'map' ? 'city' : 'map'); return; }
  const d = +b.dataset.step;
  goSector((S.cur + d + S.sectors.length) % S.sectors.length);
  if (view === 'map') setView('city');
});

function lineChoice(k, line) {
  const sec = S.cur, L = LINES[line];

    <p class="blurb">${blurbOf(tier, line)}</p>

    ${why.join('')}
    ${upgrade}
  </div>
  <div class="group"><h3>Expand the district</h3>${expand}</div>
  <div class="group"><h3>Buy in bulk</h3>${bulk}</div>
  <div class="group">
    <h3>${esc(sectorName(sec))}</h3>
    <p class="blurb">${esc(theme(sec).blurb)} ${perkText(perkOf(sec))} here.</p>
    <div class="stats">
      <div><span>Lots owned</span><b>${ownedIn(sec)} / ${N * N}</b></div>
      <div><span>District income</span><b>${fmt(SECTOR_CPS[sec], true)}/s</b></div>
      <div><span>Mixed-use bonus</span><b>+${Math.round((SECTOR_MIX[sec] - 1) * 100)}%</b></div>
      <div><span>Crew, citywide</span><b>${fmt(CREW_CPS, true)}/s</b></div>
      ${shacks ? `<div><span>${dot('#948cc0')}Shacks</span><b>${shacks}</b></div>` : ''}
      ${counts}
    </div>
  </div>`;
}

function crewVisible(n) {
  return n === 0 || (S.crew[CREW[n - 1].id] || 0) > 0 || S.total >= CREW[n].base * 0.5;
}
function crewHTML() {
  const modes = [1, 10, 'max'].map(m =>
    `<button class="mode" type="button" data-act="mode" data-id="${m}" aria-pressed="${crewMode === m}">${m === 'max' ? 'Max' : '×' + m}</button>`).join('');
  const rows = [];
  for (let n = 0; n < CREW.length; n++) {
    const c = CREW[n];
    if (!crewVisible(n)) {
      rows.push(`<div class="locked">Unknown contact. Hire a ${CREW[n - 1].name} to make the introduction.</div>`);
      break;
    }
    const qty = crewMode === 'max' ? Math.max(1, crewMax(c)) : crewMode;
    const L = LINES[c.id];
    const nb = S.sectors.reduce((a, s) => a + s.lines.filter(x => x === c.id).length, 0);
    const staffLine = nb
      ? `Staff ${nb} ${esc(L.name)}${nb === 1 ? '' : 's'}, each earning ×${staffMult(c.id).toFixed(2)}`
      : (S.crew[c.id] ? `Upgrade a Shack into a ${esc(L.name)} to put them to work` : `Hiring one unlocks ${esc(L.name)} buildings`);
    rows.push(`<div class="row" data-crew="${c.id}">
      <span class="name">${dot(L.color)}${c.name}</span>
      <span class="owned">${fmt(S.crew[c.id] || 0)}</span>
      <span class="desc">${c.desc}</span>
      <span class="boost">${staffLine}</span>
      ${buyBtn('crew', `data-id="${c.id}"`, `Hire <span data-q>${qty}</span>`, `+<span data-g>${fmt(hireGain(c.id, qty), true)}</span> / sec`, crewCost(c, qty))}
    </div>`);
  }
  const ch = cheapestHire();
  return `
  <div class="group">
    <h3>Buy in bulk</h3>
    ${ch ? buyBtn('hire-all', '', 'Hire everyone I can afford', 'Crew only · cheapest hire first, across every role', ch.cost) : ''}
    ${M.autoHire ? toggleBtn('auto-hire', S.auto.hire, 'Auto-hire') : ''}
  </div>
  <div class="head-row"><h3>Hire crew</h3><div class="modes">${modes}</div></div>
  <div class="group">${rows.join('')}</div>
  <p class="blurb">There is no cap on crew. Each hire costs 15% more than the last. Crew earn pay, and they also staff their own building type: the more you hire, the more those buildings earn. Housing fills with tenants from every role.</p>`;
}

function techHTML() {
  const avail = TECH.filter(t => !S.tech.includes(t.id) && t.req());
  const locked = TECH.filter(t => !S.tech.includes(t.id) && !t.req());
  const done = TECH.filter(t => S.tech.includes(t.id));
  return `
  <div class="group">
    <h3>Available</h3>
    ${avail.length ? avail.map(t => buyBtn('tech', `data-id="${t.id}"`, t.name, t.desc, t.cost, 'alt')).join('')
                   : `<div class="locked">Nothing to install yet.</div>`}
  </div>
  ${locked.length ? `<div class="group"><h3>Coming up</h3>
     ${locked.slice(0, 3).map(t => `<div class="locked"><b>${t.name}</b>. ${t.hint} to unlock it.</div>`).join('')}
     ${locked.length > 3 ? `<p class="blurb">${locked.length - 3} more upgrades are still encrypted.</p>` : ''}</div>` : ''}
  ${done.length ? `<div class="group"><h3>Installed</h3><div class="installed">${done.map(t => `<span class="chip">${t.name}</span>`).join('')}</div></div>` : ''}`;
}

function infraHTML() {
  const k = S.sectors.length, last = k - 1;
  const have = ownedIn(last);
  let next;
  if (roadReady()) {
    const open = DISTRICT_IDS.filter(d => d !== 'capital' && districtUnlocked(d));
    const locked = DISTRICT_IDS.filter(d => d !== 'capital' && !districtUnlocked(d));
    next = `<p class="blurb">Pick what the next district is for. Every option costs the same. Its matching building type earns ×${PERK_MULT} there, everything there earns ×${fmt(secOut(k))}, and all crew pay rises ×${CREW_SECTOR}.</p>
      ${open.map(d => {
        const D = DISTRICTS[d], built = S.sectors.filter(x => x.type === d).length;
        return buyBtn('road', `data-id="${d}"`, `${dot(`rgb(${D.haze})`)}${D.name}${built ? `<span class="tag" style="color:var(--dim)">own ${built}</span>` : ''}`,
          `${perkText(D.perk)} · ${esc(D.blurb)}`, roadCost(k));
      }).join('')}
      ${locked.length ? `<p class="blurb">Hire crew to plan more: ${locked.map(d => `${DISTRICTS[d].name} (${CREW_BY_ID[DISTRICTS[d].perk].name})`).join(', ')}.</p>` : ''}`;
  } else {
    next = `<div class="locked">Own <b>${ROAD_REQ}</b> lots in ${esc(sectorName(last))} to plan your next district. You have <b>${have}</b>.</div>`;
  }
  const roads = [];
  for (let r = 1; r < k; r++) {
    const lv = S.roads[r];
    const head = `<span class="name">${dot(ROAD_LEVELS[lv].color)}${esc(sectorName(r - 1))} → ${esc(sectorName(r))}</span>
      <span class="owned" title="Road grade">${lv}/4</span>
      <span class="desc">${ROAD_LEVELS[lv].name}</span>`;
    roads.push(`<div class="row">${head}${lv < 4
      ? buyBtn('roadup', `data-id="${r}"`, `Upgrade to ${ROAD_LEVELS[lv + 1].name}`, `+${Math.round(ROAD_BONUS * 100)}% to all output`, roadUpgradeCost(r), 'alt')
      : `<div class="maxed" style="grid-column:1/-1;margin-top:6px">Top grade.</div>`}</div>`);
  }
  const sectors = S.sectors.map((_, i) => `<div class="sector-row ${i === S.cur ? 'here' : ''}">
      <span><b>${dot(`rgb(${theme(i).haze})`)}${esc(sectorName(i))}</b><small>${perkText(perkOf(i))} · ${ownedIn(i)}/${N * N} lots · +${fmt(SECTOR_CPS[i], true)}/s</small></span>
      <button class="mode" type="button" data-act="goto" data-id="${i}" ${i === S.cur && view === 'city' ? 'aria-pressed="true"' : ''}>${i === S.cur && view === 'city' ? 'Viewing' : 'View'}</button>
    </div>`).join('');
  const capLots = ownedIn(0), wait = S.edict ? edictReadyIn() : 0;
  const edicts = capLots < EDICT_LOTS
    ? `<div class="locked">The Capital council convenes at <b>${EDICT_LOTS}</b> Capital lots. You have <b>${capLots}</b>.</div>`
    : Object.keys(EDICTS).map(id => {
        const E = EDICTS[id], on = S.edict === id;
        return `<button class="edict ${on ? 'on' : ''}" type="button" data-act="edict" data-id="${id}" ${on || wait > 0 ? 'disabled' : ''}>
          <b>${E.name}</b><span>${E.what}</span><small>${on ? 'In force' : wait > 0 ? `Council meets again in ${duration(wait)}` : 'Enact'}</small></button>`;
      }).join('');
  return `
  <div class="group"><h3>Capital edicts</h3>
    <p class="blurb">One city policy is in force at a time. Changing it needs the council, which meets every ${Math.round(EDICT_COOLDOWN / 60)} minutes.</p>
    <div class="edicts">${edicts}</div></div>
  <div class="group"><h3>Your districts</h3>${sectors}</div>
  <div class="group"><h3>Build a cyber road to a new district</h3>${next}</div>
  ${roads.length ? `<div class="group"><h3>Road network</h3>${roads.join('')}
     <p class="blurb">Road grades add up. You have +${Math.round((roadMult() - 1) * 100)}% to all output from roads.</p></div>` : ''}`;
}

        <span class="what">${rebootArmed ? 'Click again to reboot. Your city resets.' : `Reboot for ${fmt(pend)} Neural Chips`}</span>

        <span class="cost">${fmt(pend)}</span>
      </button>`;

    rebootBody = `<div class="locked">Build your first district to unlock rebooting. You will have <b>${fmt(Math.max(pend, 0))}</b> chips waiting.</div>`;

    rebootBody = `<div class="locked">Your first chip arrives at <b>${fmt(nextChipAt)}</b> credits earned across all runs. You have <b>${fmt(S.lifetime)}</b>.</div>`;

    readonly: 'Cloud save is not available to you on this shared link. Your game still saves in this browser; copy a save code to keep a backup.',
    full: 'Cloud save is full right now. Your game still saves in this browser; copy a save code to keep a backup.',
    off: 'Cloud save needs you signed in to claude.ai. Your game still saves in this browser; copy a save code to keep a backup.',
  }[Cloud.status];
  const saveBox = `
  <div class="group">
    <h3>Your save</h3>
    <p class="blurb">The game saves in this browser every 10 seconds and when you close it. Private windows and clearing your browsing data erase that copy.</p>
    <div class="cloud ${Cloud.status === 'on' ? 'ok' : ''}">${cloudLine}</div>
    ${Cloud.status === 'on' ? `<button class="mode" type="button" data-act="cloud-save">Save to cloud now</button>` : ''}
    <div class="code-row">
      <button class="mode" type="button" data-act="export">Copy save code</button>
      <span class="eyebrow">Paste it somewhere safe, like a note or an email to yourself</span>
    </div>
    ${exportedCode ? `<label class="eyebrow" for="export-code">Your save code</label>
      <textarea id="export-code" class="code" readonly rows="3">${esc(exportedCode)}</textarea>` : ''}
    <label class="eyebrow" for="import-code">Load a save code</label>
    <textarea id="import-code" class="code" rows="3" placeholder="Paste a code that starts with ${CODE_PREFIX}">${esc(importDraft)}</textarea>
    <button class="buy ${importArmed ? 'armed' : ''}" type="button" data-act="import">
      <span class="what">${importArmed ? 'Click again to replace your current city' : 'Load this save'}</span>
      <span class="sub">Replaces the city you have now</span>
    </button>
