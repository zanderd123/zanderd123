<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Seven Keys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* One dark game cabinet: the canvas is the whole show, controls sit under it. */
:root{
  --bg:#0e0b16; --frame:#2a2140; --ink:#efe6d2; --dim:#8f86a3;
  --btn:#352a4e; --btn-hi:#4f3f74; --accent:#e8b84a;
  --font:"Press Start 2P", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;overflow:hidden;
  font-family:var(--font);-webkit-user-select:none;user-select:none;
}
#screen{display:block;image-rendering:pixelated;background:#000;
  box-shadow:0 0 0 4px var(--frame),0 14px 40px rgba(0,0,0,.6);border-radius:3px;outline:none}
#hint{font-size:8px;line-height:1.8;color:var(--dim);text-align:center;letter-spacing:.04em;max-width:100%}
#hint b{color:var(--ink);font-weight:400}
#pad{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;gap:8px;touch-action:none}
#pad button{font-family:var(--font);color:var(--ink);background:var(--btn);border:0;border-radius:10px;
  box-shadow:0 4px 0 #1a1426;touch-action:none;-webkit-tap-highlight-color:transparent}
#pad button.on{background:var(--btn-hi);transform:translateY(2px);box-shadow:0 2px 0 #1a1426}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button{font-size:14px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.ab{display:flex;gap:14px;align-items:center}
.ab button{width:62px;height:62px;border-radius:50%;font-size:14px}
.ab .a{background:#8a2f3c;margin-bottom:28px}
#pad .menu{font-size:8px;padding:10px 8px;align-self:flex-end}
</style>
</head>
<body>
<canvas id="screen" tabindex="0" aria-label="The Seven Keys game screen"></canvas>
<div id="hint"><b>Arrows/WASD</b> move · <b>Space</b> talk / use · <b>Shift</b> run · <b>Esc</b> keys · <b>M</b> music</div>
<div id="pad" hidden>
  <div class="dpad">
    <button data-k="up" class="u" aria-label="Up">&#9650;</button>
    <button data-k="left" class="l" aria-label="Left">&#9664;</button>
    <button data-k="right" class="r" aria-label="Right">&#9654;</button>
    <button data-k="down" class="d" aria-label="Down">&#9660;</button>
  </div>
  <button data-k="menu" class="menu">MENU</button>
  <div class="ab"><button data-k="b" class="b" aria-label="B: run or back">B</button><button data-k="a" class="a" aria-label="A: talk or use">A</button></div>
</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Screen, canvas helpers
// ---------------------------------------------------------------------------
const TS = 16, MW = 19, MH = 14, VW = MW * TS, VH = MH * TS;   // 304 x 224
const FONT = '"Press Start 2P", ui-monospace, Menlo, monospace';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(VW, VH), g = buf.getContext('2d');
const screen = document.getElementById('screen'), sc = screen.getContext('2d');
const TOUCH = matchMedia('(pointer: coarse)').matches;
let K = 1;                       // virtual pixel -> device pixel
let C = g;                       // current pixel-art context
const rr = (x, y, w, h, c) => { C.fillStyle = c; C.fillRect(x, y, w, h); };
const OUT = '#1e1626';
function blob(rects, fill, out = OUT) {
  C.fillStyle = out; for (const r of rects) C.fillRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
  C.fillStyle = fill; for (const r of rects) C.fillRect(r[0], r[1], r[2], r[3]);
}
function hash(a, b, s = 0) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function resize() {
  const padH = TOUCH ? 190 : 34;
  const aw = window.innerWidth - 40, ah = window.innerHeight - padH - 24;
  let s = Math.min(aw / VW, ah / VH);
  s = s >= 1 ? Math.floor(s) : Math.max(0.5, s);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  screen.style.width = Math.round(VW * s) + 'px';
  screen.style.height = Math.round(VH * s) + 'px';
  screen.width = Math.round(VW * s * dpr);
  screen.height = Math.round(VH * s * dpr);
  K = screen.width / VW;
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Characters (built from outlined rectangles, then cached as sprite frames)
// ---------------------------------------------------------------------------
const CHARS = {
  boy:  { skin:'#f6c79c', skinS:'#d9976a', hair:'#6b3a1c', hairS:'#4a240f', style:'short',
          band:'#d8323a', bandS:'#9e1c26', shirt:'#3a6fd0', shirtS:'#2a4f9e', pants:'#3c3a58', pantsS:'#2a2840',
          shoe:'#4a2a16', pack:'#a0682e', packS:'#6e4418', tool:'staff' },
  girl: { skin:'#f6c79c', skinS:'#d9976a', hair:'#f4d65a', hairS:'#cfa632', style:'long',
          shirt:'#3aa078', shirtS:'#287258', pants:'#7a4a2a', pantsS:'#5a3418',
          shoe:'#4a2a16', pack:'#a0682e', packS:'#6e4418', tool:'whip' },
  prof: { skin:'#f0c098', skinS:'#c98e64', hair:'#eeeef4', hairS:'#b8b8c8', style:'bald',
          shirt:'#6a3a9a', shirtS:'#4a2470', pants:'#4a2470', pantsS:'#3a1a5a', shoe:'#2a1a1a', robe:true },
};
const WOOD = '#8a5a2a', GEM = '#5ad0f0', WHIP = '#7a4a22', EYE = '#22182e';

function buildChar(cf, dir, fr) {
  const cv = mk(20, 24), save = C; C = cv.getContext('2d');
  const layers = [[]]; let cur = layers[0];
  const layer = () => { cur = []; layers.push(cur); };
  const R = (x, y, w, h, c) => cur.push([x + 2, y + 4, w, h, c]);
  const det = []; const D = (x, y, w, h, c) => det.push([x + 2, y + 4, w, h, c]);
  const lift = fr === 1 ? 1 : fr === 2 ? 2 : 0;           // which leg is lifted

  if (dir === 'down' || dir === 'up') {
    const front = dir === 'down';
    // back layer
    if (cf.style === 'long' && front) { R(2, 4, 2, 10, cf.hair); R(12, 4, 2, 10, cf.hair); }
    if (cf.tool === 'staff' && !front) { R(1, 3, 1, 16, WOOD); R(0, 1, 3, 3, GEM); }
    layer();
    // legs
    if (cf.robe) { R(4, 15, 8, 4, cf.shirt); }
    else {
      R(5, 16, 2, lift === 1 ? 2 : 3, cf.pants); R(9, 16, 2, lift === 2 ? 2 : 3, cf.pants);
      D(5, lift === 1 ? 17 : 18, 2, 1, cf.shoe); D(9, lift === 2 ? 17 : 18, 2, 1, cf.shoe);
    }
    layer();
    // torso + arms (arms swing a pixel when walking)
    R(4, 11, 8, 5, cf.shirt);
    R(2, 11, 2, lift === 2 ? 3 : 4, cf.shirt); R(12, 11, 2, lift === 1 ? 3 : 4, cf.shirt);
    D(2, lift === 2 ? 13 : 14, 2, 1, cf.skin); D(12, lift === 1 ? 13 : 14, 2, 1, cf.skin);
    D(4, 15, 8, 1, cf.shirtS);
    if (front && !cf.robe) { D(4, 11, 1, 4, cf.packS); D(11, 11, 1, 4, cf.packS); }
    if (cf.robe) { D(7, 11, 2, 8, cf.shirtS); D(4, 13, 8, 1, '#d8b048'); }
    layer();
    // head
    if (front) {
      R(3, 2, 10, 9, cf.skin);
      if (cf.style === 'short') {
        R(3, 1, 10, 3, cf.hair); R(3, 4, 1, 3, cf.hair); R(12, 4, 1, 3, cf.hair);
        R(3, 3, 10, 2, cf.band); R(13, 4, 2, 2, cf.band);
        D(3, 4, 10, 1, cf.bandS); D(5, 1, 3, 1, cf.hairS);
      } else if (cf.style === 'long') {
        R(3, 1, 10, 4, cf.hair); R(3, 4, 1, 5, cf.hair); R(12, 4, 1, 5, cf.hair);
        D(4, 5, 2, 1, cf.hair); D(7, 5, 1, 1, cf.hair); D(10, 5, 2, 1, cf.hair);
        D(5, 1, 4, 1, '#fff2a8'); D(11, 2, 2, 1, '#e0508a');
        D(4, 9, 1, 1, '#f0a0a0'); D(11, 9, 1, 1, '#f0a0a0');
      } else {
        R(2, 5, 2, 3, cf.hair); R(12, 5, 2, 3, cf.hair);
      }
      D(5, 7, 1, 2, EYE); D(10, 7, 1, 2, EYE);
      if (cf.style === 'bald') {
        D(4, 6, 3, 2, '#30304a'); D(9, 6, 3, 2, '#30304a'); D(5, 6, 1, 1, '#cfe8ff'); D(10, 6, 1, 1, '#cfe8ff'); D(7, 6, 2, 1, '#30304a');
        D(4, 9, 8, 4, cf.hair); D(5, 13, 6, 1, cf.hair); D(7, 9, 2, 1, cf.hairS);
      } else D(7, 9, 2, 1, '#c0605a');
    } else {
      if (cf.style === 'short') {
        R(3, 2, 10, 9, cf.skin); R(3, 1, 10, 8, cf.hair); R(2, 6, 1, 2, cf.skin); R(13, 6, 1, 2, cf.skin);
        R(3, 3, 10, 2, cf.band); D(3, 4, 10, 1, cf.bandS);
        D(7, 5, 2, 2, cf.band); D(6, 7, 1, 2, cf.band); D(9, 7, 1, 2, cf.band);
      } else if (cf.style === 'long') {
        R(3, 1, 10, 4, cf.hair); R(2, 4, 12, 10, cf.hair); D(4, 2, 4, 1, '#fff2a8'); D(7, 4, 2, 9, cf.hairS);
        D(7, 2, 2, 1, '#e0508a');
      } else {
        R(3, 2, 10, 9, cf.skin); R(2, 5, 12, 3, cf.hair); D(6, 3, 3, 1, '#ffffff');
      }
    }
    layer();
    if (!front && !cf.robe) {                // backpack on the back
      R(4, 10, 8, 6, cf.pack); D(4, 10, 8, 2, cf.packS); D(7, 12, 2, 1, '#e0c060'); D(5, 14, 6, 1, cf.packS);
    }
    if (cf.tool === 'staff' && front) { R(14, 3, 1, 16, WOOD); R(13, 1, 3, 3, GEM); D(14, 1, 1, 1, '#c8f4ff'); }
    if (cf.tool === 'whip') { const wx = front ? 12 : 1; R(wx, 13, 3, 3, WHIP); D(wx + 1, 14, 1, 1, front ? cf.shirt : cf.pack); }
  } else { // side, facing right
    if (cf.style === 'long') R(3, 4, 4, 10, cf.hair);
    if (!cf.robe) { R(2, 11, 4, 5, cf.pack); D(2, 11, 4, 1, cf.packS); D(3, 13, 2, 1, '#e0c060'); }
    if (cf.tool === 'whip') { R(3, 14, 3, 3, WHIP); D(4, 15, 1, 1, cf.pack); }
    layer();
    if (cf.robe) { R(5, 15, 6, 4, cf.shirt); D(lift ? 9 : 10, 18, 2, 1, cf.shoe); }
    else if (lift) {
      R(4, 16, 2, 3, lift === 1 ? cf.pantsS : cf.pants); R(9, 16, 2, 3, lift === 1 ? cf.pants : cf.pantsS);
      D(4, 18, 2, 1, cf.shoe); D(9, 18, 3, 1, cf.shoe);
    } else { R(6, 16, 3, 3, cf.pants); D(6, 18, 4, 1, cf.shoe); }
    layer();
    R(5, 11, 6, 5, cf.shirt); D(5, 15, 6, 1, cf.shirtS);
    const ax = lift === 1 ? 9 : lift === 2 ? 5 : 7;
    layer();
    R(ax, 12, 2, 3, cf.shirt); D(ax, 14, 2, 1, cf.skin);
    layer();
    R(4, 2, 9, 9, cf.skin);
    if (cf.style === 'short') {
      R(4, 1, 8, 3, cf.hair); R(4, 4, 3, 5, cf.hair); R(4, 3, 9, 2, cf.band); R(1, 4, 3, 2, cf.band);
      D(4, 4, 9, 1, cf.bandS); D(7, 6, 1, 2, cf.skinS);
    } else if (cf.style === 'long') {
      R(4, 1, 8, 4, cf.hair); R(3, 4, 4, 6, cf.hair); D(10, 4, 2, 1, cf.hair); D(5, 1, 4, 1, '#fff2a8'); D(5, 2, 2, 1, '#e0508a');
      D(11, 9, 1, 1, '#f0a0a0');
    } else {
      R(4, 5, 2, 4, cf.hair); R(9, 8, 4, 5, cf.hair); D(9, 6, 3, 2, '#30304a'); D(10, 6, 1, 1, '#cfe8ff');
    }
    D(10, 7, 1, 2, EYE);
    if (cf.style !== 'bald') D(11, 9, 1, 1, '#c0605a');
    if (cf.tool === 'staff') { layer(); R(12, 3, 1, 16, WOOD); R(11, 1, 3, 3, GEM); D(12, 1, 1, 1, '#c8f4ff'); }
  }
  for (const L of layers) {
    C.fillStyle = OUT; for (const [x, y, w, h] of L) C.fillRect(x - 1, y - 1, w + 2, h + 2);
    for (const [x, y, w, h, c] of L) { C.fillStyle = c; C.fillRect(x, y, w, h); }
  }
  for (const [x, y, w, h, c] of det) { C.fillStyle = c; C.fillRect(x, y, w, h); }
  C = save;
  return cv;
}
function flip(cv) { const o = mk(cv.width, cv.height), x = o.getContext('2d'); x.translate(cv.width, 0); x.scale(-1, 1); x.drawImage(cv, 0, 0); return o; }
const SPR = {};
for (const k in CHARS) {
  SPR[k] = { down: [], up: [], right: [], left: [] };
  for (let f = 0; f < 3; f++) {
    SPR[k].down[f] = buildChar(CHARS[k], 'down', f);
    SPR[k].up[f] = buildChar(CHARS[k], 'up', f);
    SPR[k].right[f] = buildChar(CHARS[k], 'right', f);
    SPR[k].left[f] = flip(SPR[k].right[f]);
  }
}
const WALKCYCLE = [1, 0, 2, 0];

// ---------------------------------------------------------------------------
// Themes, floors, walls
// ---------------------------------------------------------------------------
const THEMES = {
  hall:    { floor:'marble',   top:'#3a2236', lip:'#5a3652', wall:'paper', c1:'#8e2f3c', c2:'#7c2632', trim:'#d6a84a', base:'#3e2018' },
  wood:    { floor:'wood',     top:'#3a2a26', lip:'#5a443c', wall:'paper', c1:'#dccaa0', c2:'#cfbb8e', trim:'#b08c58', base:'#6a4428' },
  library: { floor:'wood',     top:'#1f2c26', lip:'#34483e', wall:'paper', c1:'#3f6a50', c2:'#355c44', trim:'#c8a24a', base:'#3a2818' },
  dusty:   { floor:'darkwood', top:'#2a201c', lip:'#44362e', wall:'plank', c1:'#7a5434', c2:'#6a4628', trim:'#4a3020', base:'#3a2416' },
  stone:   { floor:'stone',    top:'#24242c', lip:'#3c3c48', wall:'brick', c1:'#76768a', c2:'#5e5e70', trim:'#8a8aa0', base:'#3a3a46' },
  chapel:  { floor:'stone',    top:'#26222e', lip:'#403a4c', wall:'brick', c1:'#8a8296', c2:'#706a7c', trim:'#a49cb0', base:'#3e3848' },
  night:   { floor:'nightstone', top:'#141830', lip:'#262c50', wall:'stars', c1:'#1e2650', c2:'#182044', trim:'#c8b060', base:'#10142a' },
  tile:    { floor:'checker',  top:'#2e2a28', lip:'#4a4440', wall:'tiles', c1:'#eae4d4', c2:'#d4ccb8', trim:'#6aa0aa', base:'#5a4a3a' },
  garden:  { floor:'grass', alt:'path', top:'#24401e', lip:'#3a6030', wall:'hedge', c1:'#3e8a3a', c2:'#2e7030', trim:'#5aa848', base:'#24481e' },
  glass:   { floor:'flag',  alt:'grass', top:'#2a3a3a', lip:'#4a6060', wall:'glass', c1:'#a8dcea', c2:'#8cc8dc', trim:'#e8f4f8', base:'#4a6a5a' },
  ice:     { floor:'snow',     top:'#1c2a44', lip:'#34486a', wall:'brick', c1:'#9cbcdc', c2:'#84a6cc', trim:'#d8ecfa', base:'#4a6488' },
  dark:    { floor:'darkstone', top:'#121018', lip:'#221e2c', wall:'brick', c1:'#3a3646', c2:'#2e2a38', trim:'#4a4658', base:'#1a1822' },
};

function speck(x, y, tx, ty, n, col, s = 0) {
  for (let i = 0; i < n; i++) rr(x + Math.floor(hash(tx, ty, i * 7 + s) * 16), y + Math.floor(hash(ty, tx, i * 13 + s) * 16), 1, 1, col);
}
const FLOORS = {
  marble(x, y, tx, ty) {
    rr(x, y, 16, 16, (tx + ty) % 2 ? '#e4dccb' : '#d2c6ae');
    rr(x, y, 16, 1, '#bfb196'); rr(x, y, 1, 16, '#bfb196');
    speck(x, y, tx, ty, 3, (tx + ty) % 2 ? '#d4cab6' : '#c4b89e');
  },
  wood(x, y, tx, ty, dark) {
    const b = dark ? '#7e5534' : '#b5773f', hi = dark ? '#8e6440' : '#c4884e', lo = dark ? '#5e3c22' : '#8f5a2c';
    rr(x, y, 16, 16, b);
    for (let r = 0; r < 4; r++) {
      const yy = y + r * 4; rr(x, yy, 16, 1, hi); rr(x, yy + 3, 16, 1, lo);
      rr(x + Math.floor(hash(tx, ty * 4 + r) * 15), yy, 1, 4, lo);
    }
  },
  darkwood(x, y, tx, ty) { FLOORS.wood(x, y, tx, ty, true); },
  stone(x, y, tx, ty, pal) {
    const [base, st, hi, sh] = pal || ['#6e6e7c', '#8e8e9c', '#a2a2b0', '#7a7a88'];
    rr(x, y, 16, 16, base);
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
      const sx = x + i * 8, sy = y + j * 8, v = hash(tx * 2 + i, ty * 2 + j);
      rr(sx, sy, 7, 7, st); rr(sx, sy, 7, 1, hi); rr(sx, sy, 1, 7, hi); rr(sx + 1, sy + 6, 6, 1, sh);
      if (v > 0.7) rr(sx + 3, sy + 3, 2, 1, sh);
    }
  },
  nightstone(x, y, tx, ty) { FLOORS.stone(x, y, tx, ty, ['#1c2040', '#2c3260', '#3a4274', '#242a50']); },
  darkstone(x, y, tx, ty) { FLOORS.stone(x, y, tx, ty, ['#1e1c26', '#2e2b38', '#3a3646', '#26232e']); },
  checker(x, y) {
    rr(x, y, 8, 8, '#ece6d6'); rr(x + 8, y + 8, 8, 8, '#ece6d6'); rr(x + 8, y, 8, 8, '#6f9aa5'); rr(x, y + 8, 8, 8, '#6f9aa5');
    rr(x, y, 16, 1, '#d8d0bc');
  },
  grass(x, y, tx, ty) {
    rr(x, y, 16, 16, '#68b04c'); speck(x, y, tx, ty, 6, '#56983e'); speck(x, y, tx, ty, 4, '#86cc68', 5);
    if (hash(tx, ty, 9) > 0.5) { const a = x + 3 + Math.floor(hash(ty, tx, 3) * 9), b = y + 4 + Math.floor(hash(tx, ty, 4) * 8); rr(a, b, 1, 2, '#4a8a36'); rr(a + 2, b, 1, 2, '#4a8a36'); rr(a + 1, b - 1, 1, 3, '#4a8a36'); }
  },
  path(x, y, tx, ty) { rr(x, y, 16, 16, '#cbb48a'); speck(x, y, tx, ty, 8, '#b49c72'); speck(x, y, tx, ty, 4, '#dcc8a0', 3); },
  flag(x, y, tx, ty) {
    rr(x, y, 16, 16, '#9a9078'); rr(x + 1, y + 1, 6, 6, '#c8bc9c'); rr(x + 9, y + 1, 6, 6, '#c0b494');
    rr(x + 1, y + 9, 6, 6, '#c0b494'); rr(x + 9, y + 9, 6, 6, '#c8bc9c'); speck(x, y, tx, ty, 2, '#6a9a4a');
  },
  snow(x, y, tx, ty) { rr(x, y, 16, 16, '#dde8f2'); speck(x, y, tx, ty, 5, '#c6d6e6'); speck(x, y, tx, ty, 3, '#f8fbff', 2); },
};

function drawWallFace(T, x, y, tx) {
  const s = T.wall;
  if (s === 'paper') {
    rr(x, y, 16, 16, T.c1); for (let i = 0; i < 16; i += 4) rr(x + i, y, 2, 16, T.c2);
    rr(x, y, 16, 2, T.trim); rr(x, y + 12, 16, 4, T.base); rr(x, y + 12, 16, 1, T.trim);
  } else if (s === 'brick') {
    rr(x, y, 16, 16, T.c2);
    for (let r = 0; r < 4; r++) { const o = (r % 2) * 4; for (let i = -4; i < 16; i += 8) { const bx = Math.max(x, x + i + o), bw = Math.min(x + 16, x + i + o + 7) - bx; if (bw > 0) rr(bx, y + r * 4, bw, 3, T.c1); } }
    rr(x, y + 14, 16, 2, T.base);
  } else if (s === 'plank') {
    rr(x, y, 16, 16, T.c1); for (let i = 0; i < 16; i += 5) rr(x + i, y, 1, 16, T.trim);
    rr(x, y + 4, 16, 1, T.c2); rr(x, y + 14, 16, 2, T.base);
  } else if (s === 'stars') {

const ROOM = {}, ROOMAT = {};
function buildRoom(def) {
  const grid = [];
  for (let y = 0; y < MH; y++) {
    const row = [];
    for (let x = 0; x < MW; x++) {
      if (x === 0 || x === MW - 1 || y < 2 || y === MH - 1) row.push('@');
      else row.push((def.map[y - 2] || '')[x - 1] || '.');
    }
    grid.push(row);
  }
  for (const d of def.doors) { const [x, y] = DOORPOS[d]; grid[y][x] = '>'; }
  const r = Object.assign({}, def, { base:grid.map(r => r.slice()), grid, theme:THEMES[def.theme], cv:mk(VW, VH), dirty:true, text:{} });
  for (const k in def.text || {}) { const [ix, iy] = k.split(',').map(Number); r.text[(ix + 1) + ',' + (iy + 2)] = def.text[k]; }
  r.keySpot = null; r.items = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const ch = grid[y][x];
    if (ch === 'K') r.keySpot = { x, y };
    if (ch === 'L') r.lanternSpot = { x, y };
    if (ch === 'Q') r.profSpot = { x, y };
    if (ch === 'x') r.catSpot = { x, y };
  }
  return r;
}

const dlg = { active:false, boxes:[], i:0, shown:0, cursor:0, res:null, blipT:0 };
const mctx = mk(8, 8).getContext('2d');
function wrapText(text) {
  mctx.font = '8px ' + FONT;
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const w of para.split(/\s+/)) {
      const t = line ? line + ' ' + w : w;
      if (mctx.measureText(t).width > 280 && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function openDialog(pages, res) {
  const boxes = [];
  for (const p of pages) {
    const pg = typeof p === 'string' ? { text:p } : p;
    const lines = wrapText(pg.text);
    for (let i = 0; i < lines.length; i += 3) boxes.push({ lines:lines.slice(i, i + 3), choices:null });
    if (pg.choices) boxes[boxes.length - 1].choices = pg.choices;
  }
  Object.assign(dlg, { active:true, boxes, i:0, shown:0, cursor:0, res });
}
const say = (...pages) => new Promise(r => openDialog(pages.flat(), r));
const ask = (text, choices) => new Promise(r => openDialog([{ text, choices }], r));
function updateDialog(dt) {
  const b = dlg.boxes[dlg.i], len = b.lines.join('').length;
  if (dlg.shown < len) {
    dlg.shown = Math.min(len, dlg.shown + dt * 55);
    dlg.blipT -= dt; if (dlg.blipT <= 0) { sfx('blip'); dlg.blipT = 0.07; }
    if (take('a') || take('b')) dlg.shown = len;
    return;
  }
  if (b.choices) {
    if (take('up')) { dlg.cursor = (dlg.cursor + b.choices.length - 1) % b.choices.length; sfx('blip'); }
    if (take('down')) { dlg.cursor = (dlg.cursor + 1) % b.choices.length; sfx('blip'); }
    if (take('a')) { sfx('select'); dlg.active = false; dlg.res(dlg.cursor); }
    return;
  }
  if (take('a') || take('b')) {
    dlg.i++; dlg.shown = 0;
    if (dlg.i >= dlg.boxes.length) { dlg.active = false; dlg.res(-1); }
  }
}

function resetRoomState(r) {
  r.grid = r.base.map(row => row.slice());
  if (r.id === 'chasm' && S.keys.has('chasm')) for (const row of r.grid) for (let x = 0; x < MW; x++) if (row[x] === '%') row[x] = '.';
  r.dirty = true; crumble = {}; padLit = {}; music = { phase:'idle', seq:[], idx:0 };
  boulders = [];
  const plates = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (r.grid[y][x] === 'o') { r.grid[y][x] = '.'; boulders.push({ x, y, fx:x, fy:y, t:1, d:0.2 }); }
    if (r.grid[y][x] === 'p') plates.push({ x, y });
  }
  if (r.id === 'boulder' && S.flags.gate) boulders.forEach((b, i) => { if (plates[i]) { b.x = b.fx = plates[i].x; b.y = b.fy = plates[i].y; } });
  r.pitHint = false;
}
function enterRoom(id, x, y, dir) {

}
const npcAtProf = (x, y) => !prof.gone && prof.room === S.room.id && prof.x === x && prof.y === y;

}

}
function startMove(nx, ny, dur) { P.fx = P.x; P.fy = P.y; P.x = nx; P.y = ny; P.t = 0; P.dur = dur; P.moving = true; }

function tryStep(d) {
  const [dx, dy] = DIRV[d], nx = P.x + dx, ny = P.y + dy, r = S.room, ch = tileAt(r, nx, ny);
  const fast = held.run || held.b;

    const next = ROOMAT[(r.gx + STEP[door][0]) + ',' + (r.gy + STEP[door][1])];
    if (next.needsLantern && !S.lantern) {

  }
  const bo = boulderAt(nx, ny);

const toolHint = () => S.kind === 'boy'

  : 'A deep chasm! Face a gap and press ' + (TOUCH ? 'A' : 'SPACE') + ' to swing across with your WHIP.';

function pushBoulder(bo, dx, dy) {

  const bx = bo.x + dx, by = bo.y + dy, ch = tileAt(S.room, bx, by);
  if ((ch === '.' || ch === 'p') && !boulderAt(bx, by)) {

function checkPlates() {

function onArrive() {

function nextQuestion() {
  if (S.qUsed.length >= QUESTIONS.length) S.qUsed = [];
  let i; do i = rnd(QUESTIONS.length); while (S.qUsed.includes(i));
  S.qUsed.push(i); return QUESTIONS[i];
}
function faceToward(npc) { const dx = P.x - npc.x, dy = P.y - npc.y; npc.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
function talkProf() {
  faceToward(prof);
  run(async () => {
    if (S.keys.has('quiz')) { await say('PROFESSOR QUILL: Splendid work today, young explorer. Off you go, keys await!'); return; }
    if (!prof.met) {
      prof.met = true;
      await say('PROFESSOR QUILL: Well, well! A visitor!', 'I am Professor Quill, keeper of the RIDDLE KEY.', 'Answer my three riddles correctly and the key is yours.', 'But get even ONE wrong... and I\'ll run off and hide somewhere in this house!');
    } else if (prof.room !== 'library') {

    }

    for (let i = 0; i < 3; i++) {

      const pick = await ask(`RIDDLE ${i + 1}: ${q[0]}`, opts);

      else {

        await profFlee();

function bfs(r, sx, sy, isGoal, passable) {
  const prev = new Map(), q = [[sx, sy]], key = (x, y) => x + ',' + y;
  prev.set(key(sx, sy), null);
  while (q.length) {
    const [x, y] = q.shift();
    if (isGoal(x, y) && !(x === sx && y === sy)) {
      const path = []; let k = key(x, y);
      while (k && k !== key(sx, sy)) { const [a, b] = k.split(',').map(Number); path.unshift([a, b]); k = prev.get(k); }
      return path;
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (prev.has(key(nx, ny)) || !passable(nx, ny)) continue;
      prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]);
    }
  }
  return null;
}
const FLEE = ['attic', 'gallery', 'observatory', 'study', 'westhall', 'easthall', 'kitchen', 'greenhouse', 'courtyard', 'foyer', 'chapel', 'storage'];
function profFlee() {
  return new Promise(res => {
    const r = S.room;
    const path = bfs(r, prof.x, prof.y, (x, y) => r.grid[y][x] === '>', (x, y) => { const c = tileAt(r, x, y); return c === '>' || (WALK.has(c) && c !== '^'); }) || [];
    prof.path = path; prof.t = 0; prof.onDone = () => {
      const choices = FLEE.filter(id => id !== r.id);
      const id = choices[rnd(choices.length)];
      placeProf(id);
      save();
      say('Professor Quill ran off with the RIDDLE KEY!', 'He could be hiding anywhere in the building now...').then(res);
    };
    sfx('jump');
  });
}
function placeProf(id) {
  const r = ROOM[id], g2 = r.base, spots = [];
  for (let y = 2; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    const c = g2[y][x];
    if (!'.Rg'.includes(c)) continue;
    let nearDoor = false;
    for (const d of r.doors) { const a = ARRIVE[d]; if (Math.abs(a.x - x) + Math.abs(a.y - y) < 3) nearDoor = true; }
    if (nearDoor || (r.catSpot && r.catSpot.x === x && r.catSpot.y === y)) continue;
    const a = ARRIVE[r.doors[0]];
    if (bfs(r, a.x, a.y, (px, py) => px === x && py === y, (px, py) => { const c2 = tileAt(r, px, py); return WALK.has(c2) && 'Q'.indexOf(c2) < 0 || (px === x && py === y); })) spots.push([x, y]);
  }
  const [x, y] = spots[rnd(spots.length)] || [9, 7];
  Object.assign(prof, { room:id, x, y, fx:x, fy:y, dir:'down', path:null, gone:false });
}

const LOOK = {
  B:['Rows and rows of dusty old books.', 'A book called "Secrets of the Seven Locks". All the pages are blank!', 'A book called "How to Talk to Cats". Interesting...'],
  T:['A sturdy wooden table with a vase of flowers.'], c:['A wooden chair.'], P:['A potted plant. Someone has been watering it...'],
  C:['A crate full of old junk.'], O:['A barrel. It smells like pickles.'], S:['A stone statue. Its eyes seem to follow you...'],
  H:['A tall marble pillar.'], n:['A long wooden pew.'], A:['An old stone altar.'], k:['An iron stove. It\'s still warm!'],
  u:['A counter dusted with flour.'], t:['A leafy tree. Birds are chirping somewhere.'], F:['The fountain water sparkles.'],
  r:['A big, heavy rock.'], w:['The water is cold and clear.'], E:['A brass telescope.'], D:['A desk covered in papers.'],
  G:['Iron bars. Something shiny glints on the other side...'], s:['The sign is too faded to read.'], M:['An organ.'],
};
function interact() {
  const r = S.room, [dx, dy] = DIRV[P.dir], tx = P.x + dx, ty = P.y + dy, ch = tileAt(r, tx, ty);
  if (npcAtProf(tx, ty)) { talkProf(); return; }
  if (catAt(tx, ty)) { talkCat(); return; }
  if (ch === 'X') { openChest(); return; }
  if (ch === 'M') { playOrgan(); return; }
  if (ch === '~') { useTool(); return; }
  const t = r.text[tx + ',' + ty];
  if (t) { run(async () => { await say(t); }); return; }
  if (ch === 'G' && S.flags.gate) return;
  const l = LOOK[ch];
  if (l) run(async () => { await say(l[Math.floor(hash(tx, ty) * l.length)]); });
}
function openChest() {
  run(async () => {
    const n = S.keys.size;
    if (S.flags.opened) { await say('The chest is open and empty.'); return; }
    if (n < 7) {
      await say('A giant treasure chest with SEVEN keyholes.', n ? `You have ${n} of the 7 keys. Find ${7 - n} more!` : 'It\'s locked tight. You need to find all seven keys!');
      return;
    }
    S.clock = false; S.finalTime = S.playTime;
    S.recordP = recordRun();
    await say('You have all seven keys!', 'You slide them into the keyholes, one by one...');
    S.inserted = 0;
    for (let i = 0; i < 7; i++) { S.inserted = i + 1; sfx('click'); await wait(0.32); }
    await wait(0.3); S.flags.opened = true; sfx('open'); await wait(1.0);
    await say('*CREEEAK* The great chest swings open!', 'Inside is a shining golden key and a note:', '"Well done, brave explorer! This key opens the front gate. You are free to go home!"');
    await fadeTo(1, 1.2);
    S.mode = 'ending'; S.endT = 0; clearSave(); sfx('fanfare');
    await fadeTo(0, 0.8);
  });
}

// Save / load ---------------------------------------------------------------------
const SAVEKEY = 'seven-keys-save-v1';
function save() {
  if (S.mode !== 'play' || !S.room) return;
  try {
    localStorage.setItem(SAVEKEY, JSON.stringify({ kind:S.kind, keys:[...S.keys], lantern:S.lantern, flags:S.flags, stats:S.stats, playTime:S.playTime,
      qUsed:S.qUsed, prof:{ room:prof.room, x:prof.x, y:prof.y, met:prof.met }, room:S.room.id, x:P.x, y:P.y, dir:P.dir }));
  } catch (e) { /* storage unavailable */ }
}
function loadSave() { try { const s = localStorage.getItem(SAVEKEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVEKEY); } catch (e) { /* ignore */ } }

function resetGame(kind) {
  Object.assign(S, { kind, keys:new Set(), inserted:0, lantern:false, flags:{}, playTime:0, stats:{ spikes:0, wrong:0, falls:0 }, hintIx:0, qUsed:[] });
  Object.assign(prof, { room:'library', x:9, y:7, fx:9, fy:7, dir:'down', path:null, met:false, gone:false });
}
function newGame(kind) {
  resetGame(kind);
  S.mode = 'play'; S.fade = 1; S.clock = false;
  enterRoom('hall', 9, 9, 'up');
  popup = null;
  const ctl = TOUCH ? 'Use the D-PAD to move and A to talk or look at things. Hold B to run. Tap MENU to see your keys.'
                    : 'Use the ARROW KEYS (or WASD) to move and SPACE to talk or look at things. Hold SHIFT to run. Press ESC to see your keys.';
  run(async () => {
    await wait(0.6);
    await say('. . .', 'Ugh... my head... Where am I?');
    await fadeTo(0, 1.4);
    await say('You wake up on the cold floor of a huge, strange old building.', 'You have no idea how you got here.',
      'In front of you sits an enormous chest with SEVEN keyholes.', 'A note is pinned to it. It says:',
      '"Seven keys are hidden in seven rooms of this house. Find them all and the chest will open... and so will your way out."', ctl);
    popup = { text:'Great Hall', t:0 };

  });
}
function continueGame(sv) {
  resetGame(sv.kind);
  Object.assign(S, { keys:new Set(sv.keys), lantern:sv.lantern, flags:sv.flags || {}, stats:sv.stats || S.stats, playTime:sv.playTime || 0, qUsed:sv.qUsed || [] });
  Object.assign(prof, sv.prof, { fx:sv.prof.x, fy:sv.prof.y, path:null, gone:false });
  S.mode = 'play'; S.fade = 1; S.clock = true;
  enterRoom(sv.room, sv.x, sv.y, sv.dir || 'down');
  run(async () => { await fadeTo(0, 0.5); });
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
let titleSel = 0, selKind = 0, saved = null;
function update(dt) {
  S.time += dt;
  bumpT -= dt;
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const t = timers[i]; timers.splice(i, 1); t.r(); } }
  if (fadeTween) {
    const f = fadeTween; f.t += dt; S.fade = f.from + (f.to - f.from) * Math.min(1, f.t / f.d);
    if (f.t >= f.d) { fadeTween = null; f.r(); }
  }
  if (take('music')) setMusic(!musicOn);

  if (S.mode === 'title') {
    saved = saved || loadSave();
    const opts = titleOptions();
    if (take('up')) { titleSel = (titleSel + opts.length - 1) % opts.length; sfx('blip'); }
    if (take('down')) { titleSel = (titleSel + 1) % opts.length; sfx('blip'); }
    if (take('a')) {
      sfx('select'); const o = opts[titleSel];
      if (o === 'CONTINUE') continueGame(saved);
      else if (o === 'BEST TIMES') { S.mode = 'board'; loadBoard(); }
      else S.mode = 'select';
    }
    return;
  }
  if (S.mode === 'select') {
    if (take('left') || take('right')) { selKind = 1 - selKind; sfx('blip'); }
    if (take('b')) { S.mode = 'title'; return; }
    if (take('a')) { sfx('select'); newGame(selKind ? 'girl' : 'boy'); }
    return;
  }
  if (S.mode === 'ending') {
    S.endT += dt;
    if (S.endT > 2 && take('a')) { S.mode = 'board'; sfx('select'); loadBoard(); }
    return;
  }
  if (S.mode === 'board') {
    if (take('a') || take('b') || take('menu')) { S.mode = 'title'; S.lastRun = null; saved = null; titleSel = 0; sfx('blip'); }
    return;
  }

  // play
  if (S.menu) { if (take('menu') || take('b') || take('a')) S.menu = false; return; }
  if (!dlg.active && !locks && take('menu')) { S.menu = true; sfx('select'); return; }
  if (S.clock) S.playTime += dt;
  if (popup) { popup.t += dt; if (popup.t > 2.6) popup = null; }
  if (P.flash > 0) P.flash -= dt;
  if (P.cheer > 0) P.cheer -= dt;
  for (const k in padLit) { padLit[k] -= dt; if (padLit[k] <= 0) delete padLit[k]; }
  if (toolFx) { toolFx.t += dt; if (toolFx.t > 0.6) toolFx = null; }

  // boulders
  for (const b of boulders) if (b.t < 1) { b.t = Math.min(1, b.t + dt / b.d); if (b.t >= 1) checkPlates(); }

  // professor running away
  if (prof.path) {
    prof.t += dt;
    if (prof.t >= 0.09) {
      prof.t = 0;
      if (prof.path.length) { const [nx, ny] = prof.path.shift(); prof.dir = nx > prof.x ? 'right' : nx < prof.x ? 'left' : ny > prof.y ? 'down' : 'up'; prof.fx = prof.x; prof.fy = prof.y; prof.x = nx; prof.y = ny; }
      else { prof.path = null; prof.gone = true; const d = prof.onDone; prof.onDone = null; d(); }
    }
  }

  // crumbling floor
  for (const k in crumble) {
    const c = crumble[k]; c.t += dt;
    if (c.t > 0.75 && !c.gone) {
      c.gone = true; const [x, y] = k.split(',').map(Number); S.room.grid[y][x] = '~'; S.room.dirty = true; sfx('crack');
      if (P.x === x && P.y === y && !P.jump && !locks) { if (!P.moving) fallIn(); }
    }
  }

  if (dlg.active) { updateDialog(dt); return; }

  // timed spikes rising under a standing player
  if (!locks && !P.moving && S.room.id === 'spikes' && spikeUp(tileAt(S.room, P.x, P.y)) === 2) { hurt(); return; }
  if (!locks && !P.moving && tileAt(S.room, P.x, P.y) === '~' && !P.fall) { fallIn(); return; }

  updatePlayer(dt);
}
function updatePlayer(dt) {
  if (P.fall) { P.fall += dt; return; }
  if (P.moving) {
    P.t += dt; if (!P.sliding && !P.jump) P.walkT += dt;
    if (P.t >= P.dur) { P.moving = false; P.t = P.dur; onArrive(); }
    if (P.moving) return;
    if (locks || dlg.active) return;
  }
  if (locks || dlg.active || fadeTween) { P.walkT = 0; return; }
  if (take('a')) { interact(); return; }
  const d = heldDir();
  if (!d) { P.wasMoving = false; P.walkT = 0; P.turnT = 0; return; }
  if (d !== P.dir && !P.wasMoving) { P.dir = d; P.turnT = 0.1; return; }
  P.dir = d;
  if (P.turnT > 0) { P.turnT -= dt; if (P.turnT > 0) return; }
  P.wasMoving = true;
  tryStep(d);
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function lerp(a, b, t) { return a + (b - a) * t; }
function shadow(x, y) { C.fillStyle = 'rgba(20,10,30,.28)'; C.fillRect(x + 4, y + 13, 8, 3); C.fillRect(x + 3, y + 14, 10, 1); }
function drawKeyItem(x, y, col, t) {
  const b = Math.round(Math.sin(t * 3) * 1.5);
  shadow(x, y);
  blob([[x + 3, y + 4 + b, 5, 5], [x + 8, y + 6 + b, 6, 2], [x + 11, y + 8 + b, 1, 2], [x + 13, y + 8 + b, 1, 2]], col);
  rr(x + 5, y + 6 + b, 1, 1, OUT); rr(x + 4, y + 5 + b, 1, 1, '#ffffff');
  if ((t * 2) % 2 < 0.4) { rr(x + 13, y + 2 + b, 1, 3, '#ffffff'); rr(x + 12, y + 3 + b, 3, 1, '#ffffff'); }
}
function drawLanternItem(x, y, t) {
  shadow(x, y);
  blob([[x + 5, y + 4, 6, 9]], '#3a3a44'); rr(x + 6, y + 6, 4, 5, Math.sin(t * 8) > 0 ? '#ffe070' : '#ffd040'); rr(x + 7, y + 1, 2, 3, '#3a3a44');
}
function drawCat(x, y, t) {
  shadow(x, y);
  const tail = Math.floor(t * 2) % 2;
  blob([[x + 3, y + 7, 9, 8], [x + 4, y + 2, 8, 6], [x + 4, y, 2, 2], [x + 10, y, 2, 2], [x + 11 + tail, y + 9, 2, 5]], '#9a9aa8');
  rr(x + 6, y + 4, 1, 2, '#3ac860'); rr(x + 9, y + 4, 1, 2, '#3ac860'); rr(x + 7, y + 6, 2, 1, '#f0a0b0');
  rr(x + 5, y + 9, 5, 4, '#c8c8d4'); rr(x + 4, y + 2, 8, 1, '#7a7a88');
}
function drawChar(kind, dir, frame, px, py, lift = 0) {
  C.drawImage(SPR[kind][dir][frame], Math.round(px) - 2, Math.round(py) - 8 - lift);
}
function render() {
  if (S.mode === 'title') return renderTitle();
  if (S.mode === 'select') return renderSelect();
  if (S.mode === 'ending') return renderEnding();
  if (S.mode === 'board') return renderBoard();
  const r = S.room; C = g;
  if (r.dirty) drawStatic(r);
  g.drawImage(r.cv, 0, 0);
  const t = S.time;

  // animated tiles
  for (const [x, y] of r.animCells) {
    const ch = r.grid[y][x], px = x * TS, py = y * TS;
    if (ch === 'a' || ch === 'b') { const u = spikeUp(ch); if (u) drawSpikes(px, py, u); }
    else if (PAD[ch] && padLit[ch]) { rr(px + 2, py + 2, 12, 12, PAD[ch][1]); rr(px + 4, py + 4, 8, 8, '#ffffff88'); }
    else if (ch === 'w' && ((x + y + Math.floor(t * 2)) % 3 === 0)) rr(px + 4, py + 8, 5, 1, '#9ac8f8');
    else if (ch === '%' && crumble[x + ',' + y]) {
      const c = crumble[x + ',' + y], j = Math.floor(t * 30) % 2;
      rr(px + 2 + j, py + 2, 12, 1, '#26222e'); rr(px + 5, py + 4, 1, 8, '#26222e'); rr(px + 9 - j, py + 7, 5, 1, '#26222e'); rr(px + 10, py + 9, 1, 5, '#26222e');
      if (c.t > 0.4) rr(px + 1, py + 1, 14, 14, 'rgba(10,8,16,' + ((c.t - 0.4) * 1.6).toFixed(2) + ')');
    }
  }
  // gate glow torch flicker in face row
  if (r.decor) for (const k in r.decor) if (r.decor[k] === 'torch' && Math.sin(t * 9 + +k) > 0.2) rr(+k * TS + 7, TS + 2, 2, 1, '#fff4b0');

  // y-sorted drawables
  const list = [];
  for (const [x, y] of r.propCells) {
    const ch = r.grid[y][x];
    if (PROPS.has(ch) || (ch === 'G' && !S.flags.gate)) list.push({ y:y * TS + 15, f:() => {
      if (ch === 'G') { rr(x * TS, y * TS - 4, 16, 20, '#1a1418'); for (let i = 0; i < 5; i++) { rr(x * TS + 1 + i * 3, y * TS - 4, 2, 20, '#5a5a66'); rr(x * TS + 1 + i * 3, y * TS - 4, 1, 20, '#8a8a96'); } rr(x * TS, y * TS + 2, 16, 2, '#4a4a56'); return; }
      PROPDRAW[ch](x * TS, y * TS, x, y, r, t);
    } });
  }
  const k = KEYBYROOM[r.id];
  if (k && r.keySpot && keyVisible(k)) list.push({ y:r.keySpot.y * TS + 14, f:() => drawKeyItem(r.keySpot.x * TS, r.keySpot.y * TS, k.color, t) });
  if (r.lanternSpot && !S.lantern) list.push({ y:r.lanternSpot.y * TS + 14, f:() => drawLanternItem(r.lanternSpot.x * TS, r.lanternSpot.y * TS, t) });
  if (r.catSpot) list.push({ y:r.catSpot.y * TS + 15, f:() => drawCat(r.catSpot.x * TS, r.catSpot.y * TS, t) });
  for (const b of boulders) {
    const e = b.t, bx = lerp(b.fx, b.x, e) * TS, by = lerp(b.fy, b.y, e) * TS;
    list.push({ y:by + 15, f:() => { blob([[bx + 1, by + 2, 14, 13], [bx + 3, by, 10, 2]], '#a08a6a'); rr(bx + 3, by + 2, 5, 3, '#c0aa88'); rr(bx + 9, by + 6, 1, 4, '#6a5a44'); rr(bx + 6, by + 9, 4, 1, '#6a5a44'); rr(bx + 1, by + 12, 14, 3, '#7a6a50'); } });
  }
  if (!prof.gone && prof.room === r.id) {
    const e = prof.path ? Math.min(1, prof.t / 0.09) : 1, px = lerp(prof.fx, prof.x, e) * TS, py = lerp(prof.fy, prof.y, e) * TS;
    const fr = prof.path ? WALKCYCLE[Math.floor(t * 12) % 4] : 0;
    list.push({ y:py + 15.5, f:() => { shadow(px, py); drawChar('prof', prof.dir, fr, px, py); } });
  }
  // player
  {
    const e = P.moving ? Math.min(1, P.t / P.dur) : 1;
    const px = lerp(P.fx, P.x, e) * TS, py = lerp(P.fy, P.y, e) * TS;
    const lift = P.jump ? Math.round(Math.sin(e * Math.PI) * 14) : 0;
    let fr = 0;
    if (P.moving && !P.sliding && !P.jump) fr = WALKCYCLE[Math.floor(P.walkT / (P.dur / 2)) % 4];
    list.push({ y:Math.max(py, P.fall ? 0 : py) + 15.6, f:() => {
      if (P.fall) {
        const s = Math.max(0, 1 - P.fall * 1.6); if (s <= 0) return;
        const sp = SPR[S.kind][P.dir][0]; C.drawImage(sp, px + 8 - 10 * s, py + 4 - 16 * s + P.fall * 10, 20 * s, 24 * s); return;
      }
      if (P.flash > 0 && Math.floor(P.flash * 12) % 2) return;
      shadow(px, py);
      if (toolFx) drawTool(px, py, e);
      drawChar(S.kind, P.dir, fr, px, py, lift);
      if (P.cheer > 0) { const s = Math.floor(t * 10) % 2; rr(px + 1 - s, py - 12, 1, 3, '#fff4a0'); rr(px + 14 + s, py - 10, 1, 3, '#fff4a0'); }
    } });
  }
  list.sort((a, b) => a.y - b.y);
  for (const d of list) d.f();

  if (r.dark) drawDarkness(t);
  if (P.flash > 0) { g.fillStyle = 'rgba(220,40,40,' + (P.flash * 0.35).toFixed(2) + ')'; g.fillRect(0, 0, VW, VH); }

  present();
  drawHUD();
  drawPopup();
  drawFade();
  drawDialog();
  if (S.menu) drawMenu();
}
function drawTool(px, py, e) {
  const f = toolFx, mx = f.mx * TS + 8, my = f.my * TS + 8;
  if (S.kind === 'boy') {            // staff planted in the middle of the gap
    if (e < 0.85) { C.strokeStyle = WOOD; C.lineWidth = 2; C.beginPath(); C.moveTo(mx, my + 4); C.lineTo(px + 8, py - 2); C.stroke(); rr(mx - 1, my + 3, 3, 2, '#3a2a1a'); }
  } else {                            // whip lashed to a ring above the gap
    rr(mx - 2, my - 22, 5, 5, '#c8c8d0'); rr(mx - 1, my - 21, 3, 3, '#0c0a14');
    if (e < 0.9) { C.strokeStyle = WHIP; C.lineWidth = 1; C.beginPath(); C.moveTo(mx, my - 18); C.lineTo(px + 10, py + 2); C.stroke(); }
  }
}
const dk = mk(VW, VH), dkc = dk.getContext('2d');
function drawDarkness(t) {
  const e = P.moving ? Math.min(1, P.t / P.dur) : 1;
  const cx = lerp(P.fx, P.x, e) * TS + 8, cy = lerp(P.fy, P.y, e) * TS + 6;
  const rad = 46 + Math.sin(t * 7) * 1.5 + Math.sin(t * 13) * 0.8;
  dkc.globalCompositeOperation = 'source-over'; dkc.fillStyle = 'rgba(4,2,10,0.97)'; dkc.fillRect(0, 0, VW, VH);
  dkc.globalCompositeOperation = 'destination-out';
  const gr = dkc.createRadialGradient(cx, cy, rad * 0.45, cx, cy, rad);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  dkc.fillStyle = gr; dkc.beginPath(); dkc.arc(cx, cy, rad, 0, Math.PI * 2); dkc.fill();
  dkc.globalCompositeOperation = 'source-over';
  g.drawImage(dk, 0, 0);
  g.fillStyle = 'rgba(255,190,90,0.07)'; g.beginPath(); g.arc(cx, cy, rad * 0.7, 0, Math.PI * 2); g.fill();
  const k = KEYBYROOM[S.room.id], s = S.room.keySpot;
  if (k && s && keyVisible(k) && (t % 1.6) < 0.25) { C = g; rr(s.x * TS + 8, s.y * TS + 4, 1, 5, '#fff8d0'); rr(s.x * TS + 6, s.y * TS + 6, 5, 1, '#fff8d0'); }
}

// screen-space (UI) helpers, in virtual pixels
function present() {
  sc.setTransform(1, 0, 0, 1, 0, 0); sc.imageSmoothingEnabled = false;
  sc.drawImage(buf, 0, 0, screen.width, screen.height);
  sc.setTransform(K, 0, 0, K, 0, 0);
}
const srr = (x, y, w, h, c) => { sc.fillStyle = c; sc.fillRect(x, y, w, h); };
function txt(s, x, y, col = '#303040', size = 8, align = 'left', shade = '#00000033') {

  if (shade) { sc.fillStyle = shade; sc.fillText(s, x + size / 8, y + size / 8); }
  sc.fillStyle = col; sc.fillText(s, x, y);
}
function panel(x, y, w, h) {
  srr(x, y, w, h, '#283058'); srr(x + 1, y + 1, w - 2, h - 2, '#6878b8'); srr(x + 2, y + 2, w - 4, h - 4, '#f8f8f0'); srr(x + 3, y + 3, w - 6, 1, '#d8d8e8');
}
function keyIcon(x, y, col, on) {

  sc.fillStyle = c; sc.fillRect(x, y, 3, 3); sc.fillRect(x + 3, y + 1, 4, 1); sc.fillRect(x + 5, y + 2, 1, 2); sc.fillRect(x + 6, y + 2, 1, 1);
  sc.fillStyle = o; sc.fillRect(x + 1, y + 1, 1, 1);
}
function drawHUD() {
  const w = 82, x = VW - w - 3, y = 3;
  srr(x, y, w, 13, '#120e1cdd'); srr(x, y + 12, w, 1, '#00000055');

  let cx = x;
  if (S.lantern) { cx = x - 13; srr(cx, y, 12, 13, '#120e1cdd'); srr(cx + 4, y + 3, 4, 7, '#3a3a44'); srr(cx + 5, y + 5, 2, 3, '#ffd860'); }
  // the run clock
  const tw = 50, tx = cx - tw - 1;
  srr(tx, y, tw, 13, '#120e1cdd');
  sc.strokeStyle = '#d8d0e8'; sc.lineWidth = 1; sc.beginPath(); sc.arc(tx + 7.5, y + 6.5, 3.5, 0, Math.PI * 2); sc.stroke();
  srr(tx + 7, y + 4, 1, 3, '#d8d0e8'); srr(tx + 7, y + 6, 2, 1, '#d8d0e8');
  txt(fmtTime(S.playTime), tx + tw - 4, y + 3, S.clock ? '#ffffff' : '#a89cc0', 8, 'right', null);

}
function drawPopup() {
  if (!popup) return;
  const t = popup.t, y = t < 0.25 ? -20 + 24 * (t / 0.25) : t > 2.3 ? 4 - 24 * ((t - 2.3) / 0.3) : 4;
  sc.font = '8px ' + FONT; const w = Math.ceil(sc.measureText(popup.text).width) + 18;
  srr(3, y, w, 18, '#4a3420'); srr(4, y + 1, w - 2, 16, '#c89858'); srr(5, y + 2, w - 4, 14, '#f0e0b8');
  txt(popup.text, 12, y + 5, '#4a3420', 8, 'left', null);
}
function drawFade() { if (S.fade > 0) srr(0, 0, VW, VH, 'rgba(0,0,0,' + S.fade.toFixed(3) + ')'); }
function drawDialog() {
  if (!dlg.active) return;
  const b = dlg.boxes[dlg.i], y0 = VH - 57;

  let left = Math.floor(dlg.shown);

  const done = dlg.shown >= b.lines.join('').length;
  if (done && !b.choices && Math.floor(S.time * 3) % 2) { sc.fillStyle = '#d83040'; sc.beginPath(); sc.moveTo(VW - 20, y0 + 42); sc.lineTo(VW - 12, y0 + 42); sc.lineTo(VW - 16, y0 + 46); sc.fill(); }
  if (done && b.choices) {
    sc.font = '8px ' + FONT;
    const w = Math.max(...b.choices.map(c => sc.measureText(c).width)) + 30, h = b.choices.length * 14 + 12;
    const x = VW - 3 - w, y = y0 - h - 2;
    panel(x, y, w, h);
    b.choices.forEach((c, i) => {

      if (i === dlg.cursor) { sc.fillStyle = '#303040'; sc.beginPath(); sc.moveTo(x + 8, y + 8 + i * 14); sc.lineTo(x + 13, y + 11.5 + i * 14); sc.lineTo(x + 8, y + 15 + i * 14); sc.fill(); }

function fmtTime(s, tenths) {
  const t = Math.floor(s * 10), m = Math.floor(t / 600), sec = Math.floor(t / 10) % 60;
  return m + ':' + String(sec).padStart(2, '0') + (tenths ? '.' + (t % 10) : '');
}
function drawMenu() {
  srr(0, 0, VW, VH, 'rgba(10,6,20,.55)');
  const x = 24, y = 18, w = VW - 48, h = VH - 36;
  panel(x, y, w, h);
  txt('YOUR KEYS', x + 14, y + 12, '#4a3a70', 8);
  txt(S.keys.size + ' / 7', x + w - 14, y + 12, '#4a3a70', 8, 'right');

    const ly = y + 32 + i * 17, on = S.keys.has(k.id);

  txt('TIME ' + fmtTime(S.playTime), x + w - 14, fy, '#6a6080', 8, 'right', null);
  txt(TOUCH ? 'TAP A TO CLOSE' : 'PRESS ESC TO CLOSE', x + w / 2, fy + 14, '#9890a8', 8, 'center', null);
}

// Title, character select, ending ------------------------------------------------
function sky(top, bottom) { const gr = g.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, VW, VH); }
function mansion(dark, lit, t) {
  C = g;
  rr(52, 104, 200, 100, dark); rr(40, 96, 224, 10, dark); rr(126, 64, 52, 40, dark); rr(140, 40, 24, 26, dark); rr(150, 30, 4, 12, dark);
  rr(70, 84, 22, 22, dark); rr(212, 84, 22, 22, dark); rr(66, 80, 30, 6, dark); rr(208, 80, 30, 6, dark);
  for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) { const on = hash(i, j, Math.floor(t / 3)) > 0.4; rr(64 + i * 32, 116 + j * 26, 8, 12, on ? lit : '#1a1426'); }
  rr(144, 160, 16, 44, '#2a1a10'); rr(148, 164, 8, 40, '#3a2414');
}
function renderTitle() {
  const t = S.time; C = g;
  sky('#0a0820', '#3a2050');
  for (let i = 0; i < 60; i++) { const x = Math.floor(hash(i, 1) * VW), y = Math.floor(hash(i, 2) * 120); if (Math.sin(t * 2 + i) > -0.6) rr(x, y, 1, 1, i % 7 ? '#c8c0e8' : '#fff8c0'); }
  blob([[242, 20, 14, 18], [240, 22, 18, 14]], '#f4ecc8', '#c8bc98'); rr(245, 25, 3, 3, '#ddd2ac'); rr(251, 31, 2, 2, '#ddd2ac');

  rr(0, 196, VW, 28, '#1a1428');

  const bob = Math.round(Math.sin(t * 2) * 2);
  txt('THE SEVEN', VW / 2, 26 + bob, '#f0c040', 16, 'center', '#5a2a10');
  txt('KEYS', VW / 2, 48 + bob, '#f0c040', 24, 'center', '#5a2a10');
  for (let i = 0; i < 7; i++) keyIcon(VW / 2 - 38 + i * 11, 80, KEYS[i].color, true);
  const opts = titleOptions();
  const by = 150;
  srr(VW / 2 - 60, by - 8, 120, opts.length * 16 + 10, '#0e0a18cc');
  opts.forEach((o, i) => {

    if (i === titleSel && Math.floor(t * 3) % 2) txt('>', VW / 2 - 44, by + i * 16, '#f0c040', 8, 'left', '#000');
  });
  txt(TOUCH ? 'PRESS A' : 'PRESS SPACE', VW / 2, VH - 12, '#6a6080', 8, 'center', null);
  drawFade();
}
function renderSelect() {
  const t = S.time; C = g;
  sky('#1a1230', '#2e2048');
  for (let y = 120; y < VH; y += 8) for (let x = 0; x < VW; x += 8) rr(x, y, 8, 8, ((x + y) / 8) % 2 ? '#3a2a5a' : '#32244e');
  for (let i = 0; i < 2; i++) {
    const cx = 76 + i * 152, on = i === selKind;
    g.fillStyle = on ? 'rgba(255,230,160,.18)' : 'rgba(255,255,255,.04)';
    g.beginPath(); g.moveTo(cx - 10, 0); g.lineTo(cx + 10, 0); g.lineTo(cx + 46, 150); g.lineTo(cx - 46, 150); g.fill();
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(cx, 146, 30, 6, 0, 0, Math.PI * 2); g.fill();
  }
  present();
  txt('CHOOSE YOUR EXPLORER', VW / 2, 14, '#f0c040', 8, 'center', '#000');
  ['boy', 'girl'].forEach((k, i) => {
    const cx = 76 + i * 152, on = i === selKind;
    const fr = on ? WALKCYCLE[Math.floor(t * 6) % 4] : 0;
    sc.imageSmoothingEnabled = false;
    sc.globalAlpha = on ? 1 : 0.55;
    sc.drawImage(SPR[k].down[fr], cx - 30, 74, 60, 72);
    sc.globalAlpha = 1;
    txt(k === 'boy' ? 'BOY' : 'GIRL', cx, 156, on ? '#ffffff' : '#8f86a3', 8, 'center', '#000');
    if (on && Math.floor(t * 3) % 2) { sc.fillStyle = '#f0c040'; sc.beginPath(); sc.moveTo(cx - 5, 50); sc.lineTo(cx + 5, 50); sc.lineTo(cx, 56); sc.fill(); }
  });
  const desc = selKind ? ['Long blond hair', 'Trusty backpack', 'A leather WHIP to swing across gaps']
                       : ['Red bandana', 'Trusty backpack', 'A wooden STAFF to vault over gaps'];
  srr(16, 172, VW - 32, 44, '#0e0a18cc');
  desc.forEach((d, i) => txt(d, VW / 2, 178 + i * 12, i === 2 ? '#f0c040' : '#d8d0e8', 8, 'center', '#000'));

}
function renderEnding() {
  const t = S.endT; C = g;
  sky('#f49a5a', '#ffe6a8');
  const sunY = 104 - Math.min(26, t * 5);
  g.fillStyle = '#fff4c8'; g.beginPath(); g.arc(214, sunY, 20, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ffe9a0'; g.beginPath(); g.arc(214, sunY, 26, 0, Math.PI * 2); g.globalAlpha = 0.35; g.fill(); g.globalAlpha = 1;
  g.fillStyle = '#8ab86a'; g.beginPath(); g.ellipse(70, 124, 110, 24, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#76a85a'; g.beginPath(); g.ellipse(240, 128, 120, 22, 0, Math.PI, 0); g.fill();
  rr(0, 124, VW, VH - 124, '#68b04c');

  g.fillStyle = '#cbb48a'; g.beginPath(); g.moveTo(140, 124); g.lineTo(164, 124); g.lineTo(196, VH); g.lineTo(108, VH); g.fill();
  // the front gate, swung open
  rr(84, 124, VW - 168, 6, '#8a8494');
  for (const x of [112, 180]) { blob([[x, 84, 12, 46]], '#b0a8b8'); rr(x, 84, 12, 4, '#d0c8d8'); rr(x + 2, 80, 8, 4, '#d0c8d8'); }
  for (let i = 0; i < 4; i++) { rr(102 - i * 3, 92 + i, 1, 34 - i, '#3a3a46'); rr(203 + i * 3, 92 + i, 1, 34 - i, '#3a3a46'); }
  rr(94, 92, 10, 2, '#3a3a46'); rr(200, 92, 10, 2, '#3a3a46');
  const walking = t < 3.2, py = 122 + Math.min(1, t / 3.2) * 46;
  shadow(144, py);
  C.drawImage(SPR[S.kind].down[walking ? WALKCYCLE[Math.floor(t * 6) % 4] : 0], 142, Math.round(py) - 8);
  if (!walking && Math.floor(t * 3) % 2) { rr(141, py - 14, 1, 3, '#ffffff'); rr(160, py - 12, 1, 3, '#ffffff'); }
  present();

    srr(6, 190, VW - 12, 30, '#2a1a10aa');
    txt('TIME ' + fmtTime(S.finalTime, true) + '   SPIKE ZAPS ' + S.stats.spikes + '   WRONG ' + S.stats.wrong, VW / 2, 195, '#ffffff', 8, 'center', '#000');
    if (t > 2 && Math.floor(t * 2) % 2) txt((TOUCH ? 'PRESS A' : 'PRESS SPACE') + ' FOR BEST TIMES', VW / 2, 208, '#fff4b0', 8, 'center', '#000');
  }
  drawFade();
}

// ---------------------------------------------------------------------------
// Best times. On claude.ai the page keeps one shared board (each player's
// personal best, under runs/<their id>); anywhere else it keeps this device's.
// ---------------------------------------------------------------------------
let DB = null, USER = null, myId = null;
const board = { status:'idle', scope:'device', rows:[], note:'' };
const LOCALBEST = 'seven-keys-best-v1';
function titleOptions() { return saved ? ['NEW GAME', 'CONTINUE', 'BEST TIMES'] : ['NEW GAME', 'BEST TIMES']; }
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('db').then(d => { DB = d; }, () => {});
  window.claude.use('user').then(async u => { USER = u; if (u) myId = await u.id(); }, () => {});
}
function localRuns() { try { return JSON.parse(localStorage.getItem(LOCALBEST)) || []; } catch (e) { return []; } }
async function recordRun() {
  const run = { time:Math.round(S.finalTime * 10) / 10, kind:S.kind, spikes:S.stats.spikes, wrong:S.stats.wrong, at:Date.now() };
  const mine = localRuns(); mine.push(run); mine.sort((a, b) => a.time - b.time);
  try { localStorage.setItem(LOCALBEST, JSON.stringify(mine.slice(0, 10))); } catch (e) { /* storage unavailable */ }
  S.lastRun = run; board.note = '';
  if (!DB || !myId) return;
  try {
    const ref = DB.doc('runs/' + myId), snap = await ref.get();
    const prev = snap.exists ? snap.data().time : Infinity;
    if (run.time < prev) { await ref.set(run); board.note = prev === Infinity ? 'Your first time is on the board!' : 'New personal best!'; }
    else board.note = 'Your best is still ' + fmtTime(prev, true) + '.';
  } catch (e) { board.note = 'Your time was saved on this device only.'; }
}
async function loadBoard() {
  board.status = 'loading';
  if (S.recordP) { try { await S.recordP; } catch (e) { /* shown as a note */ } S.recordP = null; }
  if (DB) {
    try {
      const snap = await DB.collection('runs').orderBy('time').limit(8).get();
      const ids = snap.docs.map(d => d.id);
      const names = USER && ids.length ? await USER.profiles(ids) : {};
      board.rows = snap.docs.map(d => {
        const v = d.data();
        return { name:((names[d.id] && names[d.id].name) || 'Explorer'), time:+v.time || 0, kind:v.kind === 'girl' ? 'girl' : 'boy', me:d.id === myId };
      }).filter(r => r.time > 0);
      board.scope = 'everyone'; board.status = 'ready'; return;
    } catch (e) { /* fall back to this device */ }
  }
  board.rows = localRuns().slice(0, 8).map(r => ({ name:r.kind === 'girl' ? 'Girl' : 'Boy', time:r.time, kind:r.kind, me:S.lastRun && r.at === S.lastRun.at }));
  board.scope = 'device'; board.status = 'ready';
}
function renderBoard() {
  const t = S.time; C = g;
  sky('#0a0820', '#3a2050');
  for (let i = 0; i < 60; i++) { const x = Math.floor(hash(i, 1) * VW), y = Math.floor(hash(i, 2) * VH); if (Math.sin(t * 2 + i) > -0.6) rr(x, y, 1, 1, '#c8c0e8'); }
  present();
  const x = 20, y = 10, w = VW - 40, h = VH - 20;
  panel(x, y, w, h);
  txt('BEST TIMES', VW / 2, y + 12, '#4a3a70', 16, 'center', '#c8c8d4');
  txt(board.scope === 'everyone' ? 'EVERYONE WHO PLAYS THIS PAGE' : 'ON THIS DEVICE', VW / 2, y + 34, '#8a80a0', 8, 'center', null);
  if (board.status !== 'ready') txt('Loading...', VW / 2, y + 90, '#6a6080', 8, 'center', null);
  else if (!board.rows.length) { txt('No finished runs yet.', VW / 2, y + 84, '#6a6080', 8, 'center', null); txt('Be the first!', VW / 2, y + 100, '#6a6080', 8, 'center', null); }
  board.rows.forEach((r, i) => {
    const ly = y + 54 + i * 15;
    if (r.me) srr(x + 8, ly - 3, w - 16, 14, '#fff0b8');
    txt(String(i + 1), x + 22, ly, i === 0 ? '#c8902a' : '#4a3a70', 8, 'right', null);
    sc.imageSmoothingEnabled = false; sc.drawImage(SPR[r.kind].down[0], 2, 4, 16, 12, x + 30, ly - 2, 12, 9);
    txt(r.name.length > 16 ? r.name.slice(0, 15) + '.' : r.name, x + 48, ly, '#303040', 8, 'left', null);
    txt(fmtTime(r.time, true), x + w - 14, ly, '#303040', 8, 'right', null);
  });
  if (board.note && S.lastRun) txt(board.note, VW / 2, y + h - 30, '#a0402a', 8, 'center', null);
  if (Math.floor(t * 2) % 2) txt(TOUCH ? 'PRESS A' : 'PRESS SPACE', VW / 2, y + h - 16, '#8a80a0', 8, 'center', null);
  drawFade();
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  render();
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
resize();
const go = () => requestAnimationFrame(t => { last = t; frame(t); });
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(go, go);

// Hooks for the automated checks in tools/.
window.__SK = { S, P, ROOM, DEFS, KEYS, QUESTIONS, prof, dlg, enterRoom, newGame, giveKey, get boulders() { return boulders; }, get music() { return music; }, get locks() { return locks; }, board, WALK, MW, MH };
})();
