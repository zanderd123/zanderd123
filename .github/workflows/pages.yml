# Publishes the repo's browser games to GitHub Pages whenever one changes on
# the default branch:
#   Adulting Quest  https://zanderd123.github.io/zanderd123/adulting-quest/
#   Neon Sprawl     https://zanderd123.github.io/zanderd123/  (once merged)
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Publish games

on:
  push:
    paths:
      - "adulting-quest/dist/adulting-quest.html"
      - "neon-sprawl/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages only accepts deployments from the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site/adulting-quest
          cp adulting-quest/dist/adulting-quest.html _site/adulting-quest/index.html
          if [ -f neon-sprawl/index.html ]; then
            cp neon-sprawl/index.html _site/index.html
            cp neon-sprawl/preview.png _site/preview.png
          else
            cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Games</title><meta http-equiv="refresh" content="0; url=adulting-quest/">
          <p><a href="adulting-quest/">Play Adulting Quest</a></p>
          HTML
          fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
