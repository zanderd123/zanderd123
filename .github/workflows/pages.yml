# Publishes Neon Sprawl to GitHub Pages whenever the game changes on the
# default branch. The site is just the game's single HTML file plus its
# link-preview image: https://zanderd123.github.io/zanderd123/
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Publish Neon Sprawl

on:
  push:
    paths:
      - "neon-sprawl/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages only accepts deployments from the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp neon-sprawl/index.html _site/index.html
          cp neon-sprawl/preview.png _site/preview.png
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
