# ─────────────────────────────────────────────────────────────
#  COMPANY LIST
#
#  This is the only file you need to edit.
#
#  To add a company:
#    1. Copy one of the blocks below.
#    2. Change the name and the token.
#    3. Save. The next daily run picks it up automatically.
#
#  To find a company's token:
#    Open their careers page and look at the job links.
#    A link like  job-boards.greenhouse.io/vardaspace/jobs/123
#    means the token is  vardaspace
#
#  To check a token works, open this in a browser
#  (replace TOKEN) — you should see a wall of text, not an error:
#    https://boards-api.greenhouse.io/v1/boards/TOKEN/jobs
#
#  To temporarily switch a company off, set  enabled = false
# ─────────────────────────────────────────────────────────────

# ── Greenhouse boards ────────────────────────────────────────

